---
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (1.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish type'
        required: true
        type: choice
        options:
          - none
          - release

jobs:
  # Calls the reusable build workflow to build, test, and generate documentation
  # for the release version.
  build:
    name: Build
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ inputs.version }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Cuts and publishes the release, creating a GitHub release with artifacts.
  # This GUI app is never published to NuGet.org.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download documents artifact
        uses: actions/download-artifact@v8
        with:
          name: documents
          path: artifacts

      - name: Download MSI artifact
        uses: actions/download-artifact@v8
        with:
          name: msi-installer
          path: msi

      - name: Create GitHub Release
        if: inputs.publish == 'release'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          artifacts: artifacts/*,msi/*.msi
          bodyFile: artifacts/build_notes.md
          generateReleaseNotes: false
