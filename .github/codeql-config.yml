---
# CodeQL configuration for Agent Control
# Suppresses intentional generic catch clauses

name: "Agent Control CodeQL Config"

# Globally ignore build output and generated files
paths-ignore:
  - '**/obj/**'
  - '**/bin/**'

# Query filters to disable specific queries for certain paths
query-filters:
  # Suppress warnings in all generated build output under obj/ (belt-and-suspenders
  # alongside the global paths-ignore above)
  - exclude:
      id: cs/missed-ternary-operator
    paths: ['**/obj/**/*.cs']
  - exclude:
      id: cs/catch-of-all-exceptions
    paths:
      - src/DemaConsulting.AgentControl/Context.cs
      - src/DemaConsulting.AgentControl/Validation.cs
  # Exclude path-combine warnings in PathHelpers (validated safe usage)
  - exclude:
      id: cs/path-combine
    paths:
      - src/DemaConsulting.AgentControl/PathHelpers.cs
