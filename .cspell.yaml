---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Project-specific technical terms and tool names
words:
  - agentcontrol
  - abbrevref
  - ARGLOGGER
  - arglogger
  - ARGLOGGERSTUB
  - Avalonia
  - axaml
  - Blockquotes
  - contoso
  - esac
  - favorited
  - gitdir
  - headlessly
  - lsfiles
  - Mvvm
  - MVVM
  - Postconditions
  - buildmark
  - buildtransitive
  - contentfiles
  - dcterms
  - DEMA
  - Dema
  - demaconsulting
  - doctitle
  - docversion
  - errorlevel
  - fileassert
  - finalizer
  - flaui
  - xunit
  - nameof
  - pagetitle
  - Pandoc
  - parameterless
  - Qube
  - reqstream
  - Rescanning
  - rescanned
  - rethrowing
  - revparsehead
  - reviewmark
  - SARIF
  - sarifmark
  - Serilog
  - setlocal
  - slnx
  - snupkg
  - sonarmark
  - sysml
  - sysml2tools
  - venv
  - unconfigured
  - unreordered
  - versionmark
  - Weasyprint
  - wixproj
  - wixpublish
  - wixtoolset
  - wixext
  - worktree
  - worktrees
  - Worktree
  - Worktrees
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
