  # --- INSTALLER ---
  # This test provides real, TRX-backed OTS evidence for the WiX Toolset's
  # MSI packaging capability (AgentControl-OTS-WixToolset-BuildInstaller), replacing
  # the previously-cited vendor-capability placeholder test names that had no
  # backing TRX result. Runs in the package-msi job, immediately after the MSI is built.

  - name: WixToolset_BuildMsiPackage
    description: "Windows MSI installer package was built by the WiX Toolset"
    tags: [installer]
    files:
      - pattern: "src/DemaConsulting.AgentControl.Msi/bin/x64/Release/*.msi"
        count: 1
        min-size: 1000000
