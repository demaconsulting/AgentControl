---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# The files to spell-check
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"
# Include hidden paths such as .github/ and .*.yaml
enableGlobDot: true

# Project-specific technical terms and tool names
words:
  - abbrevref
  - agentcontrol
  - AGENTCONTROL
  - apikey
  - argb
  - Argb
  - ARGB
  - arglogger
  - ARGLOGGER
  - ARGLOGGERSTUB
  - ASKPASS
  - askpass
  - axaml
  - cacheinfo
  - Cancellable
  - conhost
  - contoso
  - Contoso
  - CONTOSO
  - Dema
  - DEMA
  - demaconsulting
  - dwmapi
  - esac
  - fabrikam
  - favorited
  - favoriting
  - Favoriting
  - fileserver
  - flaui
  - flyouts
  - fsmonitor
  - gitdir
  - gpgsign
  - headlessly
  - IHDR
  - inlines
  - Inlines
  - instnace
  - libsecret
  - lsfiles
  - LTRB
  - mklink
  - Mvvm
  - MVVM
  - Mvvm's
  - ncipollo
  - nestings
  - netstandard
  - Newtonsoft
  - NOSYSTEM
  - ntlm
  - NTLM
  - osxkeychain
  - pathspec
  - pathspecs
  - PATHSPECS
  - refspec
  - renderable
  - Reprompt
  - rescanned
  - Rescanning
  - revparsehead
  - ROOTOWNER
  - sarif
  - Sarif
  - SARIF
  - serilog
  - Serilog
  - Serilog's
  - Setext
  - shopt
  - slnx
  - sonarscanner
  - thirdparty
  - timestamper
  - Unchosen
  - unconfigured
  - Unconfigured
  - unfavorited
  - unfavorites
  - Unfavorites
  - unfavoriting
  - unidirectionality
  - Unredacted
  - unreordered
  - unticked
  - unticking
  - urlmatch
  - venv
  - wixext
  - wixproj
  - wixproj's
  - wixpublish
  - worktrees
  - Worktrees
  - yamlfix

ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
