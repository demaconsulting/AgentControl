  - CONTOSO
  - Dema
  - DEMA
  - demaconsulting
  - dwmapi
  - esac
  - fabrikam
  - favorited
  - favoriting
  - Favoriting
  - fileserver
  - flaui
  - flyouts
  - fsmonitor
  - gitdir
  - gpgsign
  - headlessly
  - IHDR
  - inlines
  - Inlines
  - instnace
  - libsecret
  - lintmark
  - lsfiles
  - LTRB
  - mklink
  - Mvvm
  - MVVM
  - Mvvm's
  - ncipollo
  - nestings
  - netstandard
  - Newtonsoft
  - NOSYSTEM
  - ntlm
  - NTLM
  - osxkeychain
  - pathspec
  - pathspecs
  - PATHSPECS
  - refspec
  - renderable
  - Reprompt
  - rescanned
  - Rescanning
  - revparsehead
  - ROOTOWNER
  - sarif
  - Sarif
  - SARIF
  - serilog
  - Serilog
  - Serilog's
  - Setext
  - shopt
