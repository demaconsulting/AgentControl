---
resource-path:
  - docs/user_guide
  - docs/template
  - docs/images
input-files:
  - docs/user_guide/title.txt
  - docs/user_guide/introduction.md
template: template.html
# Screenshots in docs/user_guide/images are inlined so the HTML (and the PDF WeasyPrint makes from it in the
# generated folder) does not depend on where the images are relative to the output file
embed-resources: true
table-of-contents: true
number-sections: true
filters:
  - docs/filters/canvasnet.lua
