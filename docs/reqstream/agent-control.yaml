---
# AgentControl System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the tool to provide
# - These requirements capture the externally visible behavior of the complete system: a
#   desktop launcher for syncing/launching proprietary agent-tool configuration alongside
#   public repos (see architecture.md's Purpose/Scope)
# - System requirements are validated through FlaUI end-to-end integration tests that drive
#   the real published application via Windows UI Automation (test project:
#   test/DemaConsulting.AgentControl.UiTests), hence the `windows@` source filters below

sections:
  - title: System-Level Requirements
    requirements:
      - id: AgentControl-System-RecentRepos
        title: >-
          The tool shall display a recent-repos list showing each repo's display name, full
          path, labeled chips for its pinned package with version and source, an available
          upgrade, and its current git branch, and status warnings.
        tags: [system]
        justification: |
          A developer managing several repos needs an at-a-glance view of each repo's sync
          state without opening a terminal, so they can decide which repos need attention
          before starting an AI-assisted development session.
        children:
          - AgentControl-LauncherUI-RecentReposDisplay
          - AgentControl-LauncherUI-StatusBadges
          - AgentControl-LauncherUI-RepoCardChips
          - AgentControl-GitIntegration-DetectCommittedFiles
          - AgentControl-GitIntegration-CurrentBranch
        tests:
          - windows@MainWindow_Launch_WindowVisibleWithExpectedAutomationId
          - windows@RepoCard_PinnedRepoWithNewerVersion_ShowsPackageAndUpgradeChips

      - id: AgentControl-System-AddRemoveRepo
        title: >-
          The tool shall let the user add a repo to, and remove a repo (after confirmation)
          from, the recent-repos list.
        tags: [system]
        justification: |
          Developers work across a changing set of repos over time; the recent-repos list
          must be user-maintained rather than fixed, and removal must be confirmed since it
          is a destructive action against AgentControl's own state.
        children:
          - AgentControl-LauncherUI-AddRepo
          - AgentControl-LauncherUI-RemoveRepo
        tests:
          - windows@RemoveMenuItem_ClickThenConfirm_RemovesCard_DecliningLeavesItInPlace

      - id: AgentControl-System-SearchAndSort
        title: >-
          The tool shall let the user search/filter the recent-repos list, and shall order
          it with favorited repos first, then by most-recently-launched.
        tags: [system]
        justification: |
          As the recent-repos list grows, developers need to quickly locate a specific repo
          (search) and see their most relevant repos without scrolling (favorites/recency
          ordering), per architecture.md's recent-repos information-design decisions.
        children:
          - AgentControl-LauncherUI-SearchFilter
          - AgentControl-LauncherUI-SortOrder
        tests:
          - windows@FilterTextBox_TypingNonMatchingText_HidesRepoCard_ClearingRestoresIt

      - id: AgentControl-System-Launch
        title: >-
          The tool shall ensure a repo's agent files are synced before launching the
          configured agentic CLI tool in that repo's working directory.
        tags: [system]
        justification: |
          Launching the agent tool with missing or stale agent files (e.g. a fresh clone
          whose gitignored agent folders were never unpacked) would silently defeat the
          tool's core purpose; Launch must first guarantee the pinned agent files are
          actually present on disk.
        children:
          - AgentControl-LauncherUI-Launch
          - AgentControl-AgentToolLauncherSubsystem-Launch
        tests:
          - windows@LaunchButton_Click_InvokesConfiguredAgentToolInRepoWorkingDirectory

      - id: AgentControl-System-Pull
        title: The tool shall let the user pull the latest commits for a repo whose working tree is clean.
        tags: [system]
        justification: |
          Developers commonly want the newest commits before starting an AI-assisted
          session; pulling into a dirty working tree risks merge conflicts the tool cannot
          safely resolve, so the action must be gated on a clean working tree.
        children:
          - AgentControl-LauncherUI-Pull
          - AgentControl-GitIntegration-PullGating
          - AgentControl-GitIntegration-Pull
        tests:
          - windows@PullButton_Click_InvokesConfiguredGitExecutableWithPullArgument

      - id: AgentControl-System-SelectPackage
        title: >-
          The tool shall let the user select an initial agent package, from a chosen configured
          source, and its version for a repo that has no existing pin, asking the user to sign in
          when the source is a server that needs credentials.
        tags: [system]
        justification: |
          A newly added repo has no prior pin to upgrade from; without an explicit
          "Select Package..." action there would be no UI path to ever acquire agent files
          for it, contrary to the tool's Purpose; a protected package server is only usable if
          the user can sign in at the point they choose from it.
        children:
          - AgentControl-LauncherUI-SelectPackage
          - AgentControl-LauncherUI-SignIn
          - AgentControl-AgentPackageManagement-DiscoverPackages
        tests:
          - windows@SelectPackageMenuItem_Click_AppliesChosenPackageAndSyncsManagedFolders
          - windows@SelectPackage_FromNuGetFolderSource_PinsThatSourceAndCardShowsPackageChip
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword

      - id: AgentControl-System-Upgrade
        title: >-
          The tool shall let the user sync a repo to the newest available agent package
          version, and shall display the new package's release notes after a successful
          upgrade.
        tags: [system]
        justification: |
          Agent package updates may include instructions/standards changes the developer
          needs to be aware of; surfacing release notes immediately after an upgrade avoids
          the developer missing that information.
        children:
          - AgentControl-LauncherUI-Upgrade
          - AgentControl-RepoSync-Sync
          - AgentControl-RepoSync-ReleaseNotes
          - AgentControl-RepoSync-GitIgnorePrevention
          - AgentControl-AgentPackageManagement-UpgradeDetection
        tests:
          - windows@UpgradeMenuItem_Click_SyncsManagedFoldersAndShowsReleaseNotes

      - id: AgentControl-System-PinFile
        title: >-
          The tool shall persist each repo's pinned agent package name, exact version, and
          package source, so that upgrades are an explicit user action rather than an
          automatic version float.
        tags: [system]
        justification: |
          Per architecture.md's "Mandatory version pinning" decision, package upgrades can
          require manual migration steps documented in release notes, so silently floating
          to the newest version would risk applying breaking changes unnoticed.
        children:
          - AgentControl-RepoConfig-PinPersistence
        tests:
          - windows@UpgradeMenuItem_Click_SyncsManagedFoldersAndShowsReleaseNotes

      - id: AgentControl-System-AgentsMdTemplate
        title: >-
          The tool shall offer to place a package's optional root-level AGENTS.md template at
          a repo's root when the repo has no AGENTS.md of its own and the package has a
          template to offer, shall never overwrite a pre-existing AGENTS.md, and shall
          remember a user's decline so they are not re-prompted for that repo again.
        tags: [system]
        justification: |
          A package author may want to seed a repo with a starting AGENTS.md (the same
          root-level-entry convention as release-notes.md), but AgentControl must never
          clobber a developer's own AGENTS.md, and must not nag a user who has already said no,
          so the offer is a one-time, reversible-by-the-user-only prompt tied to a sync the
          user already initiated (Select Package, Upgrade, or Launch's best-effort sync).
        children:
          - AgentControl-LauncherUI-AgentsMdTemplateOffer
          - AgentControl-RepoSync-AgentsMdTemplate
          - AgentControl-RepoConfig-AgentsMdDeclinedPersistence
        tests:
          - windows@AgentsMdTemplateOffer_Accept_WritesTemplateToRepoRoot
          - windows@AgentsMdTemplateOffer_Decline_DoesNotWriteFileAndDoesNotReprompt
          - RepoCardViewModel_ApplySelectedPackage_NoAgentsMdAndPackageHasTemplate_RaisesAgentsMdTemplateOfferRequestedWithContent
          - RepoCardViewModel_AcceptAgentsMdTemplate_WritesFileToRepoRootWithGivenContent
          - RepoCardViewModel_DeclineAgentsMdTemplate_PersistsDeclinedFlagInPinFile

      - id: AgentControl-System-MultipleSources
        title: >-
          The tool shall support several configured agent package sources at once, each
          identified by a unique alias and being either a folder of zip packages, a NuGet
          package folder or a NuGet package server, shall persist them in the user's settings,
          and shall carry forward a previously configured single package-source folder as a
          source named Default.
        tags: [system]
        justification: |
          Organizations distribute agent packages in more than one place (a share of zip files,
          a NuGet feed folder, a package server), so a developer needs more than one source
          configured side by side without losing the single-folder setup they already have.
        children:
          - AgentControl-Settings-PackageSources
          - AgentControl-AgentPackageManagement-SourceDefinitions
          - AgentControl-AgentPackageManagement-ZipFolderSource
          - AgentControl-AgentPackageManagement-NuGetFolderSource
          - AgentControl-AgentPackageManagement-NuGetServerSource
        tests:
          # End to end: the published application runs with a zip source and a NuGet folder
          # source configured side by side, sources are added through the Settings dialogs
          # (including a NuGet server) and a package is selected from the NuGet sources; the
          # older single-folder settings file used by the other UI tests exercises the
          # Default-source migration. The persistence round trip and migration are also
          # verified at unit level.
          - windows@UpgradeMenuItem_Click_PinnedToNuGetFolderSource_UpgradesFromThatSourceOnly
          - windows@UpgradeMenuItem_Click_SyncsManagedFoldersAndShowsReleaseNotes
          - windows@SettingsWindow_AddZipPackageFolderViaDialog_ListsSourceAndPersistsIt
          - windows@SettingsWindow_AddNuGetPackageFolderViaDialog_RequiresPackageIdAndPersistsIt
          - windows@SelectPackage_FromNuGetFolderSource_PinsThatSourceAndCardShowsPackageChip
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword
          - SettingsStore_SaveThenLoad_RoundTripsAllFields
          - SettingsStore_Load_LegacyPackageSourcePath_MigratesToDefaultZipSource

      - id: AgentControl-System-NuGetSources
        title: >-
          The tool shall obtain agent packages from a NuGet package folder or a NuGet package
          server, offering the configured package IDs with their available versions and applying
          a chosen version's content to a repo exactly as it does a zip package, requiring an
          https address for a server unless the user explicitly allows plain http for that
          source, signing in to a server that needs credentials, and neither reading nor
          writing the repo's NuGet configuration.
        tags: [system]
        justification: |
          Teams that already publish internal packages to a NuGet feed folder or a package server
          (JFrog Artifactory, Azure Artifacts) can deliver agent packages the same way;
          AgentControl must not send a sign-in over an unprotected connection unless told to, and
          must not leave any trace of its sources in the target repo, whose own NuGet
          configuration belongs to the repo's owners.
        children:
          - AgentControl-AgentPackageManagement-NuGetFolderSource
          - AgentControl-AgentPackageManagement-NuGetServerSource
          - AgentControl-PackageCredentials-AskOncePerOperation
          - AgentControl-LauncherUI-TestConnection
          - AgentControl-RepoSync-SyncFromFolderPackage
          - AgentControl-OTS-NuGetCaching-ListAndCache
          - AgentControl-OTS-NuGetCaching-ServerAccess
        tests:
          # End to end through the published application against a real NuGet folder feed and
          # against an in-process NuGet server (plain HTTP, explicitly allowed), plus the
          # unit-level evidence that the repo's NuGet configuration is never touched.
          - windows@UpgradeMenuItem_Click_PinnedToNuGetFolderSource_UpgradesFromThatSourceOnly
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword
          - RepoCardViewModel_ApplySelectedPackage_NuGetFolderSource_ExtractsPinsAliasAndRaisesReleaseNotes
          - NuGetSourceProvider_ListAndAcquire_NeverTouchesRepoNuGetConfig

      - id: AgentControl-System-SourcePinIntegrity
        title: >-
          The tool shall record in each repo's pin the alias of the source its package came
          from and shall resolve that pin only against that source; when the source is not
          configured the tool shall report an error for that repo and shall never substitute
          another source.
        tags: [system]
        justification: |
          A package name is not unique across sources, so resolving a pin by name alone could
          install a different source's package under the repo's pin (a dependency-confusion
          attack, or just an accident). Pins must therefore be bound to their source, and a
          missing source must stop the operation rather than be quietly replaced.
        children:
          - AgentControl-RepoConfig-SourcePin
          - AgentControl-AgentPackageManagement-SourceResolution
          - AgentControl-LauncherUI-SourceAwareActions
        tests:
          # End to end: a pin to the NuGet source is upgraded from that source although the zip
          # source offers a higher version of the same package name, and a pin to an
          # unconfigured source shows an error and offers no upgrade from another source.
          - windows@UpgradeMenuItem_Click_PinnedToNuGetFolderSource_UpgradesFromThatSourceOnly
          - windows@RepoCard_PinnedToUnconfiguredSource_ShowsSourceProblemAndOffersNoUpgrade
          - PackageSourceRegistry_PinToSourceB_SamePackageIdAtBothSources_OnlyBIsContacted
          - RepoCardViewModel_Refresh_PinNamesUnconfiguredSource_ShowsSourceProblemAndOffersNoUpgrade

      - id: AgentControl-System-Settings
        title: >-
          The tool shall let the user configure the package sources - including testing a package
          server's connection before saving it - a git executable override, the agent tool
          selection, and a shell/terminal preference.
        tags: [system]
        justification: |
          The package source locations, git installation, preferred agentic CLI tool, and
          preferred terminal all vary by company/developer, so they must be user-editable
          rather than hardcoded; a server source depends on an address and a sign-in that the
          user can only get right if they can try it.
        children:
          - AgentControl-LauncherUI-Settings
          - AgentControl-LauncherUI-PackageSources
          - AgentControl-LauncherUI-TestConnection
          - AgentControl-Settings-Persistence
        tests:
          - windows@SettingsWindow_AddZipPackageFolderViaDialog_ListsSourceAndPersistsIt
          - windows@SettingsWindow_AddNuGetPackageFolderViaDialog_RequiresPackageIdAndPersistsIt
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword
          - SettingsWindowViewModel_SaveCommand_Execute_InvokesOnSaveWithCurrentValuesAndRaisesSaved

      - id: AgentControl-System-ResponsiveOperations
        title: >-
          The tool shall remain responsive while it reads package sources or applies a
          package, shall show that the operation is running, shall let the user cancel it, and
          shall never interrupt the user with a sign-in dialog for work the user did not start.
        tags: [system]
        justification: |
          Package sources are often network shares or servers that can be slow or offline; a
          window that freezes while waiting looks like a crash, and a dialog that opens by
          itself during background work is disruptive.
        children:
          - AgentControl-LauncherUI-ResponsiveOperations
          - AgentControl-LauncherUI-BackgroundChecksDoNotPrompt
        tests:
          # Verified at unit level with deliberately slow and failing sources: a frozen UI
          # thread is not observable through UI automation without an artificially slow share,
          # so the end-to-end tests cover only the happy path of the same flows.
          - RepoCardViewModel_ApplySelectedPackageAsync_Running_IsBusyIgnoresSecondCallAndCancelLeavesPinUnchanged
          - MainWindowViewModel_BeginUpgradeRefresh_OneSourceUnreachable_OtherCardsStillChecked
          - RepoCardViewModel_RefreshUpgradeStatusAsync_BackgroundCheckNeedsSignIn_DoesNotPromptAndExplains
          - windows@SelectPackage_FromNuGetFolderSource_PinsThatSourceAndCardShowsPackageChip

      - id: AgentControl-System-CredentialSafety
        title: >-
          The tool shall never persist a credential it is given for a package source - not in its
          settings, a repo's pin file, its log or the target repo - shall keep a credential the
          user types only for the current session, shall never show or log one (whether it
          appears in a message, a header, an address or an exception), and shall offer a
          credential only to the server it was typed for.
        tags: [system, security]
        justification: |
          Package servers need credentials, but a credential that is written anywhere outlives
          the session and can leak through backups, synced profiles, shared logs or a commit;
          and a credential offered to a host other than the one it was typed for is a credential
          given away. The tool therefore asks for a credential only when it is needed, keeps it in
          memory, and uses it only for its own server. A server's own index can still direct the
          NuGet client to resources on other hosts that then challenge it, so users must only add
          servers they trust.
        children:
          - AgentControl-Settings-PackageSources
          - AgentControl-AgentPackageManagement-SourceDefinitions
          - AgentControl-PackageCredentials-SessionOnly
          - AgentControl-PackageCredentials-ScopedToFeedOrigin
          - AgentControl-PackageCredentials-SecretsNeverLogged
          - AgentControl-LauncherUI-SignIn
        tests:
          # The end-to-end test signs in with a sentinel password and then searches every file the
          # application wrote - the settings, the repo pin and the log folder - for it. The
          # end-to-end test cannot show that a credential is withheld from a second server, which
          # is verified one level down, and the sentinel search covers the log only for what the
          # application wrote during that flow. That nothing is written into the target repo's
          # files is shown at unit level.
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword
          - PackageCredentials_CredentialForOneFeed_IsNeverOfferedToAnotherOrigin
          - NuGetSourceProvider_ListVersions_ResourcesOnAnotherOrigin_PromptsOnlyForTheFeedOrigin
          - NuGetSourceProvider_ListAndAcquire_NeverTouchesRepoNuGetConfig
          - RepoCardViewModel_PackageSourceFailureWithSecrets_StatusTextAndLogsAreRedacted

      - id: AgentControl-System-DiagnosticLogging
        title: >-
          The tool shall write a rolling diagnostic log file capturing process-launch and
          git-integration detail, to support troubleshooting when a message box alone is
          insufficient.
        tags: [system]
        justification: |
          Per architecture.md, real-world flaky-process-launch troubleshooting showed that a
          message box alone could not root-cause intermittent failures; a diagnostic log
          captures exit codes, timing, stderr, and Win32 error codes a message box cannot show.
        children:
          - AgentControl-Logging-DiagnosticFile
          - AgentControl-OTS-Serilog-WriteLogFile
        tests:
          # Logging has no dedicated test file (see AgentControl-Logging-DiagnosticFile's own
          # justification for the full disclosure); this system requirement inherits the same
          # indirect evidence.
          - GitClient_IsWorkingTreeClean_CleanRepo_ReturnsTrue

      - id: AgentControl-System-About
        title: The tool shall provide an About dialog showing the application version, copyright, and license.
        tags: [system]
        justification: |
          Lets a developer identify exactly which build they are running (e.g. when
          reporting an issue) without inspecting file properties.
        children:
          - AgentControl-LauncherUI-About
          - AgentControl-Program-Version
        tests:
          - windows@AboutButton_Click_OpensAboutWindowShowingVersionAndCopyright

      - id: AgentControl-System-TestIsolation
        title: >-
          The tool shall support a configuration-directory override and git/agent-tool
          command overrides so automated tests can run hermetically against an isolated
          configuration folder.
        tags: [system]
        justification: |
          Per architecture.md's testability decision, FlaUI-driven integration tests must be
          able to point AgentControl at an isolated settings folder and substitute stub
          executables for git/the agentic CLI tool, giving fully repeatable end-to-end
          automation without depending on a real git installation or agentic CLI tool.
        children:
          - AgentControl-Startup-ParseArguments
        tests:
          - StartupOptions_Parse_ConfigDirArgument_CapturesValue

      - id: AgentControl-System-Startup
        title: >-
          The tool shall load persisted settings and display the recent-repos window when
          launched.
        tags: [system]
        justification: |
          The application must present the developer's existing recent-repos list and
          preferences immediately on launch rather than starting from a blank slate every
          time.
        children:
          - AgentControl-Program-Bootstrap
          - AgentControl-Program-ErrorHandling
        tests:
          - windows@MainWindow_Launch_WindowVisibleWithExpectedAutomationId

      - id: AgentControl-System-UiFramework
        title: The tool shall render its user interface using a cross-platform UI framework.
        tags: [system]
        justification: |
          Per architecture.md's Technology Stack, the UI is built on Avalonia so the
          codebase stays platform-portable even though only a Windows MSI ships for v1.
        children:
          - AgentControl-OTS-Avalonia-RenderUi
        tests:
          - windows@MainWindow_Launch_WindowVisibleWithExpectedAutomationId
