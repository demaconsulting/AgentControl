---
# AgentControl System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the tool to provide
# - These requirements capture the externally visible behavior of the complete system: a
#   desktop launcher for syncing/launching proprietary agent-tool configuration alongside
#   public repos (see architecture.md's Purpose/Scope)
# - System requirements are validated through FlaUI end-to-end integration tests that drive
#   the real published application via Windows UI Automation (test project:
#   test/DemaConsulting.AgentControl.UiTests), hence the `windows@` source filters below

sections:
  - title: System-Level Requirements
    requirements:
      - id: AgentControl-System-RecentRepos
        title: >-
          The tool shall display a recent-repos list showing each repo's display name, full
          path, labeled chips for its pinned package with version and source, an available
          upgrade, and its current git branch, and status warnings.
        tags: [system]
        justification: |
          A developer managing several repos needs an at-a-glance view of each repo's sync
          state without opening a terminal, so they can decide which repos need attention
          before starting an AI-assisted development session.
        children:
          - AgentControl-LauncherUI-RecentReposDisplay
          - AgentControl-LauncherUI-StatusBadges
          - AgentControl-LauncherUI-RepoCardChips
          - AgentControl-LauncherUI-CardIdentityAndStatus
          - AgentControl-LauncherUI-CardAvatarTile
          - AgentControl-LauncherUI-RepoPicture
          - AgentControl-LauncherUI-RepoPictureTrusted
          - AgentControl-LauncherUI-LongTextShortened
          - AgentControl-LauncherUI-UpToDateCue
          - AgentControl-LauncherUI-AppBar
          - AgentControl-LauncherUI-AppBarNarrow
          - AgentControl-GitIntegration-DetectCommittedFiles
          - AgentControl-GitIntegration-CurrentBranch
        tests:
          - windows@MainWindow_Launch_WindowVisibleWithExpectedAutomationId
          - windows@RepoCard_PinnedRepoWithNewerVersion_ShowsPackageAndUpgradeChips
          - windows@UpToDateCue_ShownOnlyForPinnedPackageThatIsUpToDate

      - id: AgentControl-System-Favorites
        title: >-
          The tool shall let the user favorite and unfavorite a repo with the star on its card,
          list a favorite first (under a Favorites section when repos are grouped), return it to
          its group when unfavorited, and remember the choice.
        tags: [system]
        justification: |
          Promoting the repos a developer works in most to the top is the point of the star; it
          must work in both directions, and the repo must follow the star between sections.
        children:
          - AgentControl-LauncherUI-FavoriteStar
          - AgentControl-LauncherUI-FavoriteStarMovesRepo
          - AgentControl-LauncherUI-FavoriteStarKeepsFocus
        tests:
          - windows@FavoriteToggleButton_ToggledOnThenOff_MovesRepoBetweenSectionsAndStoresChoice

      - id: AgentControl-System-MissingRepoRecheck
        title: >-
          The tool shall let the user re-check a repo whose folder is missing, from the card's
          menu, so the repo is usable again once its folder is back, without restarting the tool.
        tags: [system]
        justification: |
          A folder on an unmounted drive or share returns without the tool knowing; the user
          needs an in-app way to tell it to look again.
        children:
          - AgentControl-LauncherUI-MissingRepoRecheck
          - AgentControl-LauncherUI-MissingRepoRecheckClears
        tests:
          - windows@RefreshMenuItem_MissingFolder_IsEnabledAsCheckAgain_AndFindsFolderOnceBack

      - id: AgentControl-System-DialogKeyboard
        title: >-
          The tool shall keep the keyboard inside its Settings, About and Select Package dialogs
          while they are open: Tab and Shift+Tab move only between the dialog's own controls and
          typed keys do not reach the window behind it.
        tags: [system]
        justification: |
          Keyboard-only operation is a baseline of accessible desktop software, and a dialog
          whose keyboard focus wanders into the window behind it cannot be used from the keyboard.
        children:
          - AgentControl-LauncherUI-DialogKeyboard
          - AgentControl-LauncherUI-DialogInitialFocus
          - AgentControl-LauncherUI-DialogEscapeCancels
          - AgentControl-LauncherUI-DialogFocusReturn
        tests:
          - windows@SettingsWindow_Opened_ClicksAndKeysOnMainWindowDoNotReachIt
          - windows@AboutWindow_Opened_ClicksAndKeysOnMainWindowDoNotReachIt
          - windows@SelectPackageWindow_Opened_FocusStartsInsideTabCyclesAndEscapeCancels

      - id: AgentControl-System-DialogModal
        title: >-
          The tool shall show its Settings and About dialogs as modal dialogs: while one is open
          the main window behind it is disabled and a mouse click aimed at it does not reach it,
          and the main window is usable again when the dialog closes.
        tags: [system]
        justification: |
          A dialog that leaves the window behind it usable lets the user act on that window while
          the dialog's question is still open.
        children:
          - AgentControl-LauncherUI-DialogModal
        tests:
          - windows@SettingsWindow_Opened_MainWindowBehindItIsDisabledUntilItCloses
          - windows@SettingsWindow_Opened_ClicksAndKeysOnMainWindowDoNotReachIt
          - windows@AboutWindow_Opened_MainWindowIsDisabledUntilItCloses_AndRegainsFocus
          - windows@AboutWindow_Opened_ClicksAndKeysOnMainWindowDoNotReachIt

      - id: AgentControl-System-AddRemoveRepo
        title: >-
          The tool shall let the user add a repo to, and remove a repo (after confirmation)
          from, the recent-repos list.
        tags: [system]
        justification: |
          Developers work across a changing set of repos over time; the recent-repos list
          must be user-maintained rather than fixed, and removal must be confirmed since it
          is a destructive action against AgentControl's own state.
        children:
          - AgentControl-LauncherUI-AddRepo
          - AgentControl-LauncherUI-RemoveRepo
          - AgentControl-LauncherUI-RemovedRepoGoesQuiet
        tests:
          - windows@RemoveMenuItem_ClickThenConfirm_RemovesCard_DecliningLeavesItInPlace

      - id: AgentControl-System-ListChangesKept
        title: >-
          The tool shall keep the changes the user makes to the recent-repos list (favorite, group,
          card color, collapsed sections) in the user's settings, so they are still there when the
          tool is started again, and shall never show a change that it could not save.
        tags: [system]
        justification: |
          A choice that has to be repeated at every start is not a choice that was kept, and a
          change that is shown but not saved would be lost without the user knowing.
        children:
          - AgentControl-LauncherUI-ChangeAppliedWhenSaved
          - AgentControl-LauncherUI-FailedSaveChangesNothing
          - AgentControl-LauncherUI-FailedSaveReported
        tests:
          # End to end the saving of a change is shown; a save that fails cannot be provoked
          # through the published application, so that part is verified at the LauncherUI
          # subsystem and unit levels.
          - windows@FavoriteToggleButton_ToggledOnThenOff_MovesRepoBetweenSectionsAndStoresChoice
          - windows@GroupHeaderToggleButton_Click_CollapsesSectionAndRemembersItAfterRestart
          - windows@CardMenu_CardColor_ChooseSwatchStoresColorInSettingsOnly

      - id: AgentControl-System-SearchAndSort
        title: >-
          The tool shall let the user search/filter the recent-repos list, and shall order
          it with favorited repos first, then by most-recently-launched.
        tags: [system]
        justification: |
          As the recent-repos list grows, developers need to quickly locate a specific repo
          (search) and see their most relevant repos without scrolling (favorites/recency
          ordering), per architecture.md's recent-repos information-design decisions.
        children:
          - AgentControl-LauncherUI-SearchFilter
          - AgentControl-LauncherUI-SortOrder
        tests:
          - windows@FilterTextBox_TypingNonMatchingText_HidesRepoCard_ClearingRestoresIt

      - id: AgentControl-System-UpgradeFromChip
        title: >-
          The tool shall let the user start an agent package upgrade by clicking the card's
          upgrade chip.
        tags: [system]
        justification: |
          The chip that announces an available upgrade is the most direct place to start it; the
          upgrade must run the same flow as the card menu's Upgrade item.
        children:
          - AgentControl-LauncherUI-UpgradeFromChip
        tests:
          - windows@UpgradeChip_Click_SyncsManagedFoldersAndShowsReleaseNotes

      - id: AgentControl-System-Appearance
        title: >-
          The tool shall let the user choose its color theme in Settings and apply the choice to
          the running application without a restart.
        tags: [system]
        justification: |
          Users work in light and dark surroundings and expect the application to match, or to
          follow the operating system, without having to restart it.
        children:
          - AgentControl-LauncherUI-Appearance
          - AgentControl-LauncherUI-ThemeApplied
          - AgentControl-Settings-Appearance
        tests:
          - windows@SettingsWindow_ChooseLightThenDark_ReThemesMainWindowWithoutRestart
          - windows@SettingsWindow_AppearanceIsItsOwnSectionAboveTools

      - id: AgentControl-System-AppearanceAtStartup
        title: >-
          The tool shall start in the color theme the user chose in an earlier session.
        tags: [system]
        justification: |
          A choice that is forgotten when the tool is closed would have to be made again at every
          start, and a window that opens in one theme and then changes to another is jarring.
        children:
          - AgentControl-Program-StartupTheme
          - AgentControl-Settings-Appearance
        tests:
          - windows@MainWindow_LaunchWithPersistedLightTheme_AppliesLightFromStartup
          - windows@MainWindow_LaunchWithPersistedDarkTheme_AppliesDarkFromStartup

      - id: AgentControl-System-WindowsLegible
        title: >-
          The tool shall draw each of its windows in the color theme the user chose, with the
          window's surface light in the light theme and dark in the dark theme and its text legible
          against it, at least AA (4.5:1) contrast.
        tags: [system]
        justification: |
          A window that is readable in one theme only would be unusable for whoever chose the
          other. The rendered windows are measured for their surface and one text; the contrast of
          every state of every control and the keyboard focus ring are not claimed.
        children:
          - AgentControl-LauncherUI-ThemeTextLegible
          - AgentControl-LauncherUI-ThemeGraphicsLegible
        tests:
          - windows@MainSettingsSourceEditorAndAbout_LightTheme_RenderLegibly
          - windows@MainSettingsSourceEditorAndAbout_DarkTheme_RenderLegibly
          - windows@GroupNameConfirmationAndMessageBox_LightTheme_RenderLegibly
          - windows@GroupNameConfirmationAndMessageBox_DarkTheme_RenderLegibly
          - windows@SelectPackageAndReleaseNotes_LightTheme_RenderLegibly
          - windows@SelectPackageAndReleaseNotes_DarkTheme_RenderLegibly
          - windows@CredentialPrompt_LightTheme_RendersLegibly
          - windows@CredentialPrompt_DarkTheme_RendersLegibly

      - id: AgentControl-System-RepoGroups
        title: >-
          The tool shall let the user organize the recent-repos list into groups of their own by
          moving a repo into a new group, into an existing group, or out of its group.
        tags: [system]
        justification: |
          Developers who work across many repos (several clients, or work and personal) need
          to keep related repos together.
        children:
          - AgentControl-LauncherUI-RepoGroupMove
          - AgentControl-LauncherUI-GroupNamePrompt
          # Renaming and removing a group are verified at the LauncherUI subsystem level only.
          - AgentControl-LauncherUI-RepoGroupManagement
        tests:
          - windows@CardMenu_MoveToNewGroup_ShowsGroupHeaderAndStoresInSettingsOnly
          - windows@CardMenu_MoveToExistingGroup_JoinsThatSectionAndStoresInSettingsOnly
          - windows@CardMenu_RemoveFromGroup_ReturnsRepoToUngroupedAndRemovesTheHeader

      - id: AgentControl-System-RepoGroupSections
        title: >-
          The tool shall show the recent-repos list as collapsible sections once a repo is in a
          group - the favorites first, then the groups alphabetically, then the repos in no group
          - and as a list without sections while no repo is in a group.
        tags: [system]
        justification: |
          Sections keep a long list readable; the list must stay exactly as it was for a user who
          does not use groups, and the order must be predictable.
        children:
          - AgentControl-LauncherUI-RepoGroups
          - AgentControl-LauncherUI-RepoGroupsFlatList
          - AgentControl-LauncherUI-RepoGroupCollapse
          - AgentControl-LauncherUI-GroupAddRepository
        tests:
          - windows@RepoList_FavoritesAndGroups_SectionsAreFavoritesThenGroupsAlphabeticallyThenUngrouped
          - windows@CardMenu_RemoveFromGroup_ReturnsRepoToUngroupedAndRemovesTheHeader

      - id: AgentControl-System-RepoGroupCollapseRemembered
        title: >-
          The tool shall remember which sections of the recent-repos list the user collapsed, so
          that they are still collapsed when the tool is started again.
        tags: [system]
        justification: |
          Collapsing the groups not in use is only worth doing if the list stays that way.
        children:
          - AgentControl-LauncherUI-RepoGroupCollapseRemembered
          - AgentControl-Settings-RepoOrganization
        tests:
          - windows@GroupHeaderToggleButton_Click_CollapsesSectionAndRemembersItAfterRestart

      - id: AgentControl-System-RepoGroupFilter
        title: >-
          The tool shall let the filter find a repo even when it is in a collapsed group.
        tags: [system]
        justification: |
          A filter that could not find a repo because its group is collapsed would make the
          grouping a trap.
        children:
          - AgentControl-LauncherUI-RepoGroupFilter
        tests:
          - windows@FilterTextBox_RepoInCollapsedGroup_IsFoundByFilterAndHiddenAgainAfterwards

      - id: AgentControl-System-RepoGroupsSettingsOnly
        title: >-
          The tool shall store the user's groups only in the user's own AgentControl settings and
          never in a repository.
        tags: [system]
        justification: |
          Groups are a personal way of organizing the list, so they must not be written into a
          repository where they would be committed and shared with other people.
        children:
          - AgentControl-LauncherUI-RepoGroupsSettingsOnly
          - AgentControl-Settings-RepoOrganization
        tests:
          - windows@CardMenu_MoveToNewGroup_ShowsGroupHeaderAndStoresInSettingsOnly
          - windows@CardMenu_MoveToExistingGroup_JoinsThatSectionAndStoresInSettingsOnly

      - id: AgentControl-System-CardColor
        title: >-
          The tool shall let the user choose the color of a repo card's tile from a palette, or
          return to the automatic color.
        tags: [system]
        justification: |
          A color of their own lets a developer recognize a repo at a glance among many.
        children:
          - AgentControl-LauncherUI-CardColor
          - AgentControl-LauncherUI-CardColorLettersLegible
        tests:
          - windows@CardMenu_CardColor_ChooseSwatchStoresColorInSettingsOnly
          - windows@CardMenu_CardColor_PaletteOffersEveryColorAndAutomaticClearsTheChoice

      - id: AgentControl-System-CardColorKeepsStatus
        title: >-
          The tool shall not change the status colors of a repo card when the user chooses the
          color of its tile.
        tags: [system]
        justification: |
          The status colors carry a fixed meaning (up to date, upgrade available, problem) and must
          never be confused with a personal choice.
        children:
          - AgentControl-LauncherUI-CardColorKeepsStatus
        tests:
          - windows@CardMenu_CardColor_ChooseSwatchStoresColorInSettingsOnly
          - windows@CardMenu_CardColor_PaletteOffersEveryColorAndAutomaticClearsTheChoice

      - id: AgentControl-System-CardColorSettingsOnly
        title: >-
          The tool shall store the chosen card color only in the user's own AgentControl settings
          and never in a repository.
        tags: [system]
        justification: |
          The choice is personal, so it must not be written into a repository where it would be
          committed and shared with other people.
        children:
          - AgentControl-LauncherUI-RepoGroupsSettingsOnly
          - AgentControl-Settings-RepoOrganization
        tests:
          - windows@CardMenu_CardColor_ChooseSwatchStoresColorInSettingsOnly

      - id: AgentControl-System-Launch
        title: >-
          The tool shall ensure a repo's agent files are synced before launching the
          configured agentic CLI tool in that repo's working directory.
        tags: [system]
        justification: |
          Launching the agent tool with missing or stale agent files (e.g. a fresh clone
          whose gitignored agent folders were never unpacked) would silently defeat the
          tool's core purpose; Launch must first guarantee the pinned agent files are
          actually present on disk.
        children:
          - AgentControl-LauncherUI-Launch
          - AgentControl-AgentToolLauncherSubsystem-Launch
        tests:
          - windows@LaunchButton_Click_InvokesConfiguredAgentToolInRepoWorkingDirectory

      - id: AgentControl-System-Pull
        title: The tool shall let the user pull the latest commits for a repo whose working tree is clean.
        tags: [system]
        justification: |
          Developers commonly want the newest commits before starting an AI-assisted
          session; pulling into a dirty working tree risks merge conflicts the tool cannot
          safely resolve, so the action must be gated on a clean working tree.
        children:
          - AgentControl-LauncherUI-Pull
          - AgentControl-GitIntegration-PullGating
          - AgentControl-GitIntegration-Pull
        tests:
          - windows@PullMenuItem_Click_InvokesConfiguredGitExecutableWithPullArgument

      - id: AgentControl-System-SelectPackage
        title: >-
          The tool shall let the user select an initial agent package, from a chosen configured
          source, and its version for a repo that has no existing pin.
        tags: [system]
        justification: |
          A newly added repo has no prior pin to upgrade from; without an explicit
          "Select Package..." action there would be no UI path to ever acquire agent files
          for it, contrary to the tool's Purpose.
        children:
          - AgentControl-LauncherUI-SelectPackage
          - AgentControl-AgentPackageManagement-DiscoverPackages
        tests:
          - windows@SelectPackageMenuItem_Click_AppliesChosenPackageAndSyncsManagedFolders
          - windows@SelectPackage_FromNuGetFolderSource_PinsThatSourceAndCardShowsPackageChip

      - id: AgentControl-System-ServerSignIn
        title: >-
          The tool shall ask the user to sign in when the user starts an operation on a package
          server that needs credentials.
        tags: [system]
        justification: |
          A protected package server is only usable if the user can sign in at the point they
          choose from it.
        children:
          - AgentControl-LauncherUI-SignIn
          - AgentControl-LauncherUI-SignInDestination
          - AgentControl-LauncherUI-SignInWarnings
          - AgentControl-LauncherUI-SignInPasswordMasked
          - AgentControl-LauncherUI-SignInSessionOnlyNote
          - AgentControl-LauncherUI-SignInPlacement
          - AgentControl-LauncherUI-SignInCancelsWithOperation
          - AgentControl-AgentPackageManagement-NuGetServerSignIn
          - AgentControl-PackageCredentials-AskOncePerOperation
          - AgentControl-PackageCredentials-AskWhenNoCredentialKnown
          - AgentControl-PackageCredentials-DeclinedAnswerShared
          - AgentControl-OTS-NuGetCaching-ServerAccess
          - AgentControl-OTS-NuGetCaching-ServerConfiguredCredentials
          - AgentControl-OTS-NuGetCaching-AuthenticationTimeout
          - AgentControl-OTS-NuGetCaching-UnauthorizedReported
          - AgentControl-OTS-NuGetCaching-ForbiddenReported
          - AgentControl-OTS-NuGetCaching-RejectedCredentialNotRetried
          - AgentControl-OTS-NuGetCaching-NonInteractive
        tests:
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword

      - id: AgentControl-System-Upgrade
        title: >-
          The tool shall let the user sync a repo to the newest available agent package
          version, and shall display the new package's release notes after a successful
          upgrade.
        tags: [system]
        justification: |
          Agent package updates may include instructions/standards changes the developer
          needs to be aware of; surfacing release notes immediately after an upgrade avoids
          the developer missing that information.
        children:
          - AgentControl-LauncherUI-Upgrade
          - AgentControl-RepoSync-Sync
          - AgentControl-RepoSync-ReleaseNotes
          - AgentControl-RepoSync-ReleaseNotesLinks
          - AgentControl-RepoSync-GitIgnorePrevention
          - AgentControl-RepoSync-RefuseLinkedRepoFolders
          - AgentControl-AgentPackageManagement-UpgradeDetection
        tests:
          - windows@UpgradeMenuItem_Click_SyncsManagedFoldersAndShowsReleaseNotes

      - id: AgentControl-System-PinFile
        title: >-
          The tool shall persist each repo's pinned agent package name, exact version,
          package source and content identity, so that upgrades are an explicit user action
          rather than an automatic version float.
        tags: [system]
        justification: |
          Per architecture.md's "Mandatory version pinning" decision, package upgrades can
          require manual migration steps documented in release notes, so silently floating
          to the newest version would risk applying breaking changes unnoticed.
        children:
          - AgentControl-RepoConfig-PinPersistence
          - AgentControl-RepoConfig-ContentIdentityPin
          - AgentControl-RepoConfig-PinSchemaVersion
        tests:
          - windows@UpgradeMenuItem_Click_SyncsManagedFoldersAndShowsReleaseNotes
          # The pin file records the content identity of what was applied, for every kind of source:
          # the SHA-256 of the zip, the SHA-256 of the NuGet package, the commit of a Git tag.
          - windows@SelectPackageMenuItem_Click_RecordsSha256OfZipInPinFile
          - windows@SelectPackage_FromNuGetFolderSource_RecordsSha256OfNupkgInPinFile
          - windows@SelectPackage_FromGitSource_PinsTagCommitAndCardShowsGitSourceChip

      - id: AgentControl-System-AgentsMdTemplate
        title: >-
          The tool shall offer to place a package's optional root-level AGENTS.md template at
          a repo's root when the repo has no AGENTS.md of its own and the package has a
          template to offer, shall never overwrite a pre-existing AGENTS.md, and shall
          remember a user's decline so they are not re-prompted for that repo again.
        tags: [system]
        justification: |
          A package author may want to seed a repo with a starting AGENTS.md (the same
          root-level-entry convention as release-notes.md), but AgentControl must never
          clobber a developer's own AGENTS.md, and must not nag a user who has already said no,
          so the offer is a one-time, reversible-by-the-user-only prompt tied to a sync the
          user already initiated (Select Package, Upgrade, or Launch's best-effort sync).
        children:
          - AgentControl-LauncherUI-AgentsMdTemplateOffer
          - AgentControl-RepoSync-AgentsMdTemplate
          - AgentControl-RepoConfig-AgentsMdDeclinedPersistence
        tests:
          - windows@AgentsMdTemplateOffer_Accept_WritesTemplateToRepoRoot
          - windows@AgentsMdTemplateOffer_Decline_DoesNotWriteFileAndDoesNotReprompt

      - id: AgentControl-System-AgentsMdOfferBeforeReleaseNotes
        title: >-
          The tool shall show the AGENTS.md template offer before the release notes of the same
          upgrade, and open the release notes only after the offer is answered.
        tags: [system]
        justification: |
          The release notes window opened first would cover the question, which would then wait
          unseen behind it.
        children:
          - AgentControl-LauncherUI-AgentsMdOfferBeforeReleaseNotes
        tests:
          - windows@MainWindow_UpgradeWithAgentsMdOfferInRealUi_ShowsQuestionFirstThenReleaseNotes

      - id: AgentControl-System-MultipleSources
        title: >-
          The tool shall support several configured agent package sources at once, each
          identified by a unique alias and being either a folder of zip packages, a NuGet
          package folder or a NuGet package server.
        tags: [system]
        justification: |
          Organizations distribute agent packages in more than one place (a share of zip files,
          a NuGet feed folder, a package server), so a developer needs more than one source
          configured side by side.
        children:
          - AgentControl-AgentPackageManagement-SourceDefinitions
          - AgentControl-AgentPackageManagement-SourceLocationKind
          - AgentControl-AgentPackageManagement-ZipFolderSource
          - AgentControl-AgentPackageManagement-NuGetFolderSource
          - AgentControl-AgentPackageManagement-NuGetServerSource
        tests:
          # End to end: the published application runs with a zip source and a NuGet folder
          # source configured side by side, sources are added through the Settings dialogs
          # (including a NuGet server) and a package is selected from the NuGet sources.
          - windows@UpgradeMenuItem_Click_PinnedToNuGetFolderSource_UpgradesFromThatSourceOnly
          - windows@SettingsWindow_AddZipPackageFolderViaDialog_ListsSourceAndPersistsIt
          - windows@SettingsWindow_AddNuGetPackageFolderViaDialog_RequiresPackageIdAndPersistsIt
          - windows@SelectPackage_FromNuGetFolderSource_PinsThatSourceAndCardShowsPackageChip
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword

      - id: AgentControl-System-AddSourceMenu
        title: >-
          The tool shall let the user choose which type of package source to add (zip-package
          folder, NuGet-package folder, NuGet-package server or Git repository) from one Add menu
          in Settings, each choice shown with its type's icon and a description.
        tags: [system]
        justification: |
          One entry point keeps the Settings window short as source types are added, and the
          descriptions tell the user which type to choose.
        children:
          - AgentControl-LauncherUI-AddSourceMenu
        tests:
          # The first test shows the zip, NuGet folder, NuGet server and Git repository choices with
          # their icons and descriptions; the second shows that the Git repository choice opens the
          # Git source editor.
          - windows@SettingsWindow_AddMenu_OffersAllFourSourceTypesWithIconAndDescription
          - windows@SettingsWindow_AddGitRepositoryViaDialog_TestsConnectionListsTagsAndPersistsIt

      - id: AgentControl-System-SourcesPersisted
        title: >-
          The tool shall keep the configured agent package sources in the user's settings, so
          that they are still configured the next time the tool starts.
        tags: [system]
        justification: |
          A developer sets up package sources once; having to configure them again at every
          start would make several sources impractical.
        children:
          - AgentControl-Settings-PackageSources
        tests:
          # End to end: a source added through the Settings dialogs is found in the saved
          # settings file.
          - windows@SettingsWindow_AddZipPackageFolderViaDialog_ListsSourceAndPersistsIt
          - windows@SettingsWindow_AddNuGetPackageFolderViaDialog_RequiresPackageIdAndPersistsIt

      - id: AgentControl-System-LegacySourceMigration
        title: >-
          The tool shall carry forward a previously configured single package-source folder as a
          zip package source named Default.
        tags: [system]
        justification: |
          Developers who configured the single package-source folder of earlier versions expect
          it to keep working without being asked to set it up again.
        children:
          - AgentControl-Settings-PackageSources
        tests:
          # End to end: the older single-folder settings file used by these tests is migrated, and
          # the package found in that folder is selected or upgraded from the Default source.
          - windows@SelectPackageMenuItem_Click_AppliesChosenPackageAndSyncsManagedFolders
          - windows@UpgradeMenuItem_Click_SyncsManagedFoldersAndShowsReleaseNotes

      - id: AgentControl-System-NuGetSources
        title: >-
          The tool shall obtain agent packages from a NuGet package folder or a NuGet package
          server, offering the configured package IDs with their available versions and applying
          a chosen version's content to a repo exactly as it does a zip package.
        tags: [system]
        justification: |
          Teams that already publish internal packages to a NuGet feed folder or a package server
          (JFrog Artifactory, Azure Artifacts) can deliver agent packages the same way.
        children:
          - AgentControl-AgentPackageManagement-NuGetFolderSource
          - AgentControl-AgentPackageManagement-NuGetServerSource
          - AgentControl-AgentPackageManagement-NuGetServerAcquire
          - AgentControl-RepoSync-SyncFromFolderPackage
          - AgentControl-OTS-NuGetCaching-FolderListing
          - AgentControl-OTS-NuGetCaching-ListAndCache
          - AgentControl-OTS-NuGetCaching-CacheLocation
          - AgentControl-OTS-NuGetCaching-ServerListing
          - AgentControl-OTS-NuGetCaching-ServerDownload
        tests:
          # End to end through the published application against a real NuGet folder feed and
          # against an in-process NuGet server (plain HTTP, explicitly allowed).
          - windows@UpgradeMenuItem_Click_PinnedToNuGetFolderSource_UpgradesFromThatSourceOnly
          - windows@SelectPackage_FromNuGetFolderSource_PinsThatSourceAndCardShowsPackageChip
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword

      - id: AgentControl-System-NuGetTransportSecurity
        title: >-
          The tool shall require an https address for a NuGet package server unless the user
          explicitly allows plain http for that source.
        tags: [system, security]
        justification: |
          A sign-in sent over an unprotected connection can be read by anyone on the network, so
          the tool must not do it unless the user, who knows the network, says so.
        children:
          - AgentControl-AgentPackageManagement-NuGetServerTransportPolicy
          - AgentControl-AgentPackageManagement-SourceServerAddress
          - AgentControl-LauncherUI-InsecureHttpChoice
          - AgentControl-PackageSourceRegistry-PlainHttpServerSourceRefused
        tests:
          # End to end: the server dialog refuses a plain http address until the user ticks the
          # option for that source.
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword

      - id: AgentControl-System-NuGetRepoConfigUntouched
        title: >-
          The tool shall neither use nor change the NuGet configuration of a repo when it
          obtains an agent package for that repo.
        tags: [system]
        justification: |
          A repo's own NuGet configuration belongs to the repo's owners: agent information must
          not leak into it, and it must not be able to redirect where AgentControl reads or
          stores agent packages.
        children:
          - AgentControl-AgentPackageManagement-NuGetFolderSource
          - AgentControl-NuGetSourceProvider-NoRepoNuGetConfig
        tests:
          # End to end: a repo with its own NuGet configuration pointing at an unreachable source
          # and a redirected package folder is upgraded from the configured source, and the
          # configuration is left byte for byte as it was.
          - windows@UpgradeMenuItem_Click_PinnedToNuGetFolderSource_UpgradesFromThatSourceOnly

      - id: AgentControl-System-SourcePinIntegrity
        title: >-
          The tool shall record in each repo's pin the alias of the source its package came
          from and shall resolve that pin only against that source; when the source is not
          configured the tool shall report an error for that repo and shall never substitute
          another source.
        tags: [system]
        justification: |
          A package name is not unique across sources, so resolving a pin by name alone could
          install a different source's package under the repo's pin (a dependency-confusion
          attack, or just an accident). Pins must therefore be bound to their source, and a
          missing source must stop the operation rather than be quietly replaced.
        children:
          - AgentControl-RepoConfig-SourcePin
          - AgentControl-AgentPackageManagement-SourceResolution
          - AgentControl-LauncherUI-SourceAwareActions
        tests:
          # End to end: a pin to the NuGet source is upgraded from that source although the zip
          # source offers a higher version of the same package name, and a pin to an
          # unconfigured source shows an error and offers no upgrade from another source.
          - windows@UpgradeMenuItem_Click_PinnedToNuGetFolderSource_UpgradesFromThatSourceOnly
          - windows@RepoCard_PinnedToUnconfiguredSource_ShowsSourceProblemAndOffersNoUpgrade

      - id: AgentControl-System-PackageContentIntegrity
        title: >-
          The tool shall record in each repo's pin a content identity - a fingerprint of the
          package that was applied - whenever it applies a package from any kind of package
          source (a zip folder, a NuGet package folder or server, or a Git repository).
        tags: [system, security]
        justification: |
          A package version is meant to be immutable, but a folder of zip files, a package feed or
          a Git tag does not enforce it: a package republished (or a tag moved) under the same
          version would silently change the instructions an agent follows in every repo pinned to
          that version (a supply-chain risk as well as an honest mistake). Recording what was
          applied is what makes a republished version detectable, so it must happen for every kind
          of source.
        children:
          - AgentControl-AgentPackageManagement-ContentIdentity
          - AgentControl-AgentPackageManagement-ContentIdentityComparable
          - AgentControl-RepoSync-ContentIdentity
          - AgentControl-RepoSync-ContentIdentityOfAppliedBytes
          - AgentControl-RepoConfig-ContentIdentityPin
          - AgentControl-LauncherUI-ContentChangeProtection
          - AgentControl-AgentPackageManagement-GitSourceContentIdentity
        tests:
          - windows@SelectPackageMenuItem_Click_RecordsSha256OfZipInPinFile
          - windows@SelectPackage_FromNuGetFolderSource_RecordsSha256OfNupkgInPinFile
          - windows@SelectPackage_FromGitSource_PinsTagCommitAndCardShowsGitSourceChip

      - id: AgentControl-System-ChangedContentRefusedAtLaunch
        title: >-
          The tool shall not replace a repo's agent files, when it restores missing agent files
          at launch, with a package of the same version whose content differs from the recorded
          identity (whatever kind of source it comes from), shall tell the user in plain language
          and shall change nothing.
        tags: [system, security]
        justification: |
          A package republished under the version a repo is pinned to would silently change the
          instructions an agent follows; restoring agent files at launch must never be the way
          that change gets in. The refusal of an Upgrade of a republished version is a rule of the
          repo card (see its requirements); the application offers an Upgrade only for a newer
          version than the one pinned, so that refusal has no end-to-end scenario.
        children:
          - AgentControl-LauncherUI-ContentChangeRefusal
        tests:
          - windows@LaunchButton_Click_PinnedVersionRepublished_ExplainsAndSyncsNothing
          - windows@LaunchButton_Click_NuGetPinnedVersionRepublished_ExplainsAndSyncsNothing

      - id: AgentControl-System-MovedTagWarning
        title: >-
          The tool shall, when a Git tag of the version a repo uses now points to a different
          commit than the one the repo's files came from, show a warning on the repo's card and
          shall apply nothing because of it.
        tags: [system, security]
        justification: |
          A moved tag changes the instructions an agent follows without a new version, so the user
          must be told; applying it silently would defeat the point of pinning.
        children:
          - AgentControl-LauncherUI-TagMovedWarning
          - AgentControl-LauncherUI-TagMovedAppliesNothing
          - AgentControl-LauncherUI-TagMovedFreshListing
          - AgentControl-LauncherUI-TagMovedClearedWhenUnknown
          - AgentControl-AgentPackageManagement-GitSourceContentIdentity
        tests:
          - windows@RepoCard_PinnedGitTagMoved_ShowsTagMovedChipAndAppliesNothing

      - id: AgentControl-System-ChangedContentAcceptedDeliberately
        title: >-
          The tool shall let the user accept changed content of the version a repo uses (a
          republished package or a moved Git tag) only deliberately, by choosing the same version
          again with the card's Change package action and confirming, and shall change nothing
          unless the user confirms.
        tags: [system, security]
        justification: |
          The decision to trust changed content belongs to the user; making it a deliberate,
          confirmed action keeps it from happening by accident or by an automatic check.
        children:
          - AgentControl-LauncherUI-ContentChangeConfirmation
          - AgentControl-LauncherUI-ChangePackage
          - AgentControl-LauncherUI-ChangePackageStartsOnCurrentChoice
        tests:
          - windows@ChangePackageMenuItem_SameVersionWithMovedTag_AsksAndDecliningLeavesRepoUnchanged
          - windows@ChangePackageMenuItem_SameVersionWithMovedTag_ConfirmingAppliesNewContentAndRecordsNewCommit

      - id: AgentControl-System-IdentityAdoptedOnUpgrade
        title: >-
          The tool shall record a content identity, without any warning, when the user upgrades a
          repo whose pin has none.
        tags: [system]
        justification: |
          Pins made before identities existed must keep working without nagging; the next
          deliberate upgrade is the moment an identity can be recorded without claiming anything
          changed.
        children:
          - AgentControl-LauncherUI-ContentChangeAdoption
          - AgentControl-RepoConfig-LegacyPinWithoutIdentity
        tests:
          - windows@UpgradeChip_Click_PinWithoutIdentity_AdoptsIdentityOfNewVersionWithoutWarning

      - id: AgentControl-System-GitSources
        title: >-
          The tool shall support a Git repository as a package source in which the tags that match
          a configured pattern are the versions of one package.
        tags: [system]
        justification: |
          Many organizations keep their agent packages in a Git repository and tag releases;
          reading them directly spares a build and publishing step. A tag pattern is easy to get
          subtly wrong (a capital letter, a prefix), which is why adding a source shows the tags
          that match (see the requirements next to this one).
        children:
          - AgentControl-AgentPackageManagement-GitSource
          - AgentControl-AgentPackageManagement-GitSourceDefinition
          - AgentControl-AgentPackageManagement-GitSourceAcquire
          - AgentControl-AgentPackageManagement-GitSourceFailureReporting
          - AgentControl-GitIntegration-RemoteGitBounded
          - AgentControl-GitIntegration-RemoteGitFailureReporting
          - AgentControl-GitIntegration-RemoteGitMinimumVersion
          - AgentControl-LauncherUI-GitSourceSetup
          - AgentControl-LauncherUI-GitTooOld
        tests:
          # The published application against a real local repository: tags matching the pattern are
          # listed as the versions (and the hint when a wrong-case pattern matches nothing), and a
          # chosen version delivers the files of its tag.
          - windows@SettingsWindow_AddGitRepositoryViaDialog_TestsConnectionListsTagsAndPersistsIt
          - windows@SettingsWindow_AddGitRepositoryWithWrongCasePattern_ShowsNoMatchingTagsThenSucceedsWhenFixed
          - windows@SelectPackage_FromGitSource_PinsTagCommitAndCardShowsGitSourceChip

      - id: AgentControl-System-GitSourceSettings
        title: >-
          The tool shall keep the address, tag pattern and sub-folder of a Git source in the
          user's settings, and shall never hold a credential in them.
        tags: [system, security]
        justification: |
          The user's sign-in stays with the user's own Git setup, so the settings never need to
          hold a secret and a settings file can be shared or backed up without leaking one.
        children:
          - AgentControl-Settings-GitSourcePersistence
          - AgentControl-AgentPackageManagement-GitSourceSettingsChecked
          - AgentControl-AgentPackageManagement-GitSourceAddressRules
        tests:
          - windows@SettingsWindow_AddGitRepositoryViaDialog_TestsConnectionListsTagsAndPersistsIt
          - windows@SettingsWindow_AddGitRepositoryWithCredentialInAddress_IsRefusedAndNothingIsSaved

      - id: AgentControl-System-GitSourceSetup
        title: >-
          The tool shall let the user add a Git source from the Settings window and see, before
          saving it, which of the repository's tags match the pattern.
        tags: [system]
        justification: |
          A tag pattern is easy to get subtly wrong, so the user sees which tags it finds before
          relying on it.
        children:
          - AgentControl-LauncherUI-GitSourceEditor
          - AgentControl-LauncherUI-GitSourceConnectionTest
        tests:
          - windows@SettingsWindow_AddGitRepositoryViaDialog_TestsConnectionListsTagsAndPersistsIt
          - windows@SettingsWindow_AddGitRepositoryWithWrongCasePattern_ShowsNoMatchingTagsThenSucceedsWhenFixed

      - id: AgentControl-System-GitSourceSelection
        title: >-
          The tool shall let the user choose a version of a Git source in Select Package and
          apply the files of that version's tag to the repo.
        tags: [system]
        justification: |
          Choosing a version is how a repo gets its first pin from any source, so it must work for
          a Git source the same way.
        children:
          - AgentControl-AgentPackageManagement-GitSourceAcquire
        tests:
          - windows@SelectPackage_FromGitSource_PinsTagCommitAndCardShowsGitSourceChip

      - id: AgentControl-System-GitSourcePresentation
        title: >-
          The tool shall show on the card of a repo pinned to a Git source that the package comes
          from a Git repository.
        tags: [system]
        justification: |
          The same package name can exist in several sources, so the user must be able to tell a
          Git source from a folder or a server at a glance. The tag and the shortened commit the
          files came from are shown too; that detail is a tooltip of the card, verified in the
          LauncherUI subsystem and unit tests, not end to end.
        children:
          - AgentControl-LauncherUI-GitSourcePresentation
          - AgentControl-LauncherUI-GitSourceRowStatus
          - AgentControl-LauncherUI-GitSourceCardTooltip
        tests:
          - windows@SelectPackage_FromGitSource_PinsTagCommitAndCardShowsGitSourceChip

      - id: AgentControl-System-GitSourceSafety
        title: >-
          The tool shall, when it fetches a package from a Git repository, never run code that
          comes from the repository or the remote (hooks, filters, submodules, remote helpers),
          so that a hostile repository cannot execute anything.
        tags: [system, security]
        justification: |
          A repository, and the server that hosts it, are not trusted; fetching a package must be
          as safe as reading a file, or a package source in Git would let whoever controls it run
          programs on every developer's machine.
        children:
          - AgentControl-GitIntegration-RemoteGit
          - AgentControl-GitIntegration-RemoteGitNoCodeExecution
          - AgentControl-AgentPackageManagement-GitSourceNoRepositoryCode
        tests:
          # Hostile user configuration (a hook and a filter program that plain git is shown to run
          # for any repository): neither runs, and the bytes delivered are those of the commit.
          - windows@SelectPackage_FromGitRepositoryUnderHostileUserConfiguration_RunsNoCodeAndAppliesRawBytes
          # A submodule in the layout is refused, and an address that asks git to run a program
          # (a remote helper) is refused by the editor.
          - windows@SelectPackage_FromGitRepositoryWithSubmoduleInLayout_IsRefusedAndWritesNothing
          - windows@SettingsWindow_AddGitRepositoryWithRemoteHelperAddress_IsRefusedAndRunsNothing

      - id: AgentControl-System-GitSourceTransport
        title: >-
          The tool shall, when it reaches a Git repository, use only the transport of the
          configured address (https, ssh or a local path) and shall refuse any address that names
          another transport or a program to run.
        tags: [system, security]
        justification: |
          A repository address is text that anyone can put into a settings file, and git can be
          told to run a program through some address forms; only the supported transports may
          ever be used.
        children:
          - AgentControl-GitIntegration-RemoteGitNoCodeExecution
          - AgentControl-AgentPackageManagement-GitSourceAddressRules
        tests:
          - windows@SettingsWindow_AddGitRepositoryWithRemoteHelperAddress_IsRefusedAndRunsNothing

      - id: AgentControl-System-GitSourceLayoutOnly
        title: >-
          The tool shall, when it applies a package from a Git repository, read only the package
          layout of the chosen tag and write only that layout into the repo, never the
          repository's metadata or its other content.
        tags: [system, security]
        justification: |
          A repository holds much more than the package; what it holds besides the package must
          not influence or leak into the repos that are synced.
        children:
          - AgentControl-RepoSync-LayoutRoot
          - AgentControl-RepoSync-LayoutRootOnlyLayout
          - AgentControl-RepoSync-LayoutRootIgnoresOtherLinks
          - AgentControl-AgentPackageManagement-GitSourceAcquire
        tests:
          - windows@SelectPackage_FromGitRepositoryUnderHostileUserConfiguration_RunsNoCodeAndAppliesRawBytes
          - windows@SelectPackage_FromGitSource_PinsTagCommitAndCardShowsGitSourceChip

      - id: AgentControl-System-GitSourceRefusesLinks
        title: >-
          The tool shall refuse a package from a Git repository whose layout holds a link or a
          submodule, telling the user why and writing nothing.
        tags: [system, security]
        justification: |
          A link in a package could redirect a write, or a read, to any file on the machine, and a
          submodule would pull in content nobody reviewed.
        children:
          - AgentControl-RepoSync-LayoutRootRefusesLinks
          - AgentControl-AgentPackageManagement-GitSourceLayoutSafety
        tests:
          - windows@SelectPackage_FromGitRepositoryWithLinkInLayout_IsRefusedAndWritesNothing
          - windows@SelectPackage_FromGitRepositoryWithSubmoduleInLayout_IsRefusedAndWritesNothing

      - id: AgentControl-System-GitSourceRefusesCollisions
        title: >-
          The tool shall refuse a package from a Git repository whose layout holds names that
          would collide on a case-insensitive file system, telling the user why and writing
          nothing.
        tags: [system, security]
        justification: |
          On a case-insensitive file system two names that differ only in letter case are one
          file, so which of two files a repo ends up with would depend on the machine.
        children:
          - AgentControl-AgentPackageManagement-GitSourceLayoutSafety
        tests:
          - windows@SelectPackage_FromGitRepositoryWithCaseCollidingNames_IsRefusedAndWritesNothing

      - id: AgentControl-System-GitSignIn
        title: >-
          The tool shall let only work the user started ask the user to sign in to a Git
          repository, through the user's own Git sign-in (credential manager or SSH keys).
        tags: [system]
        justification: |
          The user's own tools already know how to sign in, so the tool never needs to store or
          ask for a secret itself; a sign-in the user asked for (testing a connection, refreshing
          a card, choosing a package) is expected, and nothing else may open one.
        children:
          - AgentControl-GitIntegration-RemoteGitSignIn
          - AgentControl-AgentPackageManagement-GitSourceSignIn
          - AgentControl-LauncherUI-GitSourcePrompts
          - AgentControl-LauncherUI-GitSignInGuidance
        tests:
          # Against a private Git server of the test (TLS, 401 without credentials) with the user's
          # own sign-in replaced by a helper that behaves like Git Credential Manager: work the
          # user starts is allowed to prompt, and is then signed in.
          - windows@RepoCard_PrivateGitRepositoryNeedingSignIn_RefreshMayPromptAndThenSignsIn
          - windows@SettingsWindow_TestConnectionToPrivateGitRepository_MaySignInAndListsTheTags

      - id: AgentControl-System-GitSignInBackgroundNeverPrompts
        title: >-
          The tool shall never ask the user to sign in to a Git repository for work it started
          itself (the upgrade check, the restore before launch) and shall report that a sign-in
          is needed instead.
        tags: [system]
        justification: |
          A sign-in window that opens by itself, or a background check that waits for input, would
          be a defect.
        children:
          - AgentControl-GitIntegration-RemoteGitNoBackgroundPrompt
          - AgentControl-AgentPackageManagement-GitSourceSignIn
          - AgentControl-LauncherUI-GitSourcePrompts
        tests:
          - windows@RepoCard_PinnedToPrivateGitRepository_BackgroundCheckNeverPromptsAndReportsSignInNeeded

      - id: AgentControl-System-Settings
        title: >-
          The tool shall let the user configure the package sources, a git executable
          override, the agent tool selection, and a shell/terminal preference.
        tags: [system]
        justification: |
          The package source locations, git installation, preferred agentic CLI tool, and
          preferred terminal all vary by company/developer, so they must be user-editable
          rather than hardcoded.
        children:
          - AgentControl-LauncherUI-Settings
          - AgentControl-LauncherUI-PackageSources
          - AgentControl-LauncherUI-SourceSignedOnlyBadge
          - AgentControl-LauncherUI-ResizableSourceDialogs
          - AgentControl-LauncherUI-AddPackageSource
          - AgentControl-LauncherUI-PackageSourceValidation
          - AgentControl-LauncherUI-PackageSourceLocationTooltip
          - AgentControl-LauncherUI-PackageSourcePackageIds
          - AgentControl-LauncherUI-ServerSourceEditor
          - AgentControl-LauncherUI-ServerSourceSettingsKept
          - AgentControl-LauncherUI-EditPackageSource
          - AgentControl-LauncherUI-RemovePackageSource
          - AgentControl-Settings-Persistence
        tests:
          - windows@SettingsWindow_AddZipPackageFolderViaDialog_ListsSourceAndPersistsIt
          - windows@SettingsWindow_AddNuGetPackageFolderViaDialog_RequiresPackageIdAndPersistsIt
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword
          # Git executable, agent tool and shell preference are verified only through the
          # view-model's own unit test (a disclosed pre-existing granularity limitation).
          - SettingsWindowViewModel_SaveCommand_Execute_InvokesOnSaveWithCurrentValuesAndRaisesSaved

      - id: AgentControl-System-ConnectionTest
        title: >-
          The tool shall let the user test a package server's connection before saving it, and
          shall say in words whether it worked.
        tags: [system]
        justification: |
          A server source depends on an address and a sign-in that the user can only get right
          if they can try them before relying on them.
        children:
          - AgentControl-LauncherUI-TestConnection
          - AgentControl-AgentPackageManagement-NuGetServerFailures
        tests:
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword
          - windows@SettingsWindow_SignInWithRememberTicked_SavedOnlyByTheUsersCredentialHelper

      - id: AgentControl-System-ResponsiveOperations
        title: >-
          The tool shall never open a sign-in dialog for package-source work the user did not
          start, telling the user on the repo's card that a sign-in is needed instead.
        tags: [system]
        justification: |
          Package sources are often network shares or servers that can be slow or offline, and
          a dialog that opens by itself during background work is disruptive and looks like a
          fault.
        children:
          - AgentControl-LauncherUI-BackgroundChecksDoNotPrompt
          # The responsiveness, progress, cancellation and failure-isolation behavior of package
          # operations is specified by the LauncherUI requirements below; a frozen window is not
          # observable through UI automation without an artificially slow share, so it has no
          # system-level scenario.
          - AgentControl-LauncherUI-ResponsiveOperations
          - AgentControl-LauncherUI-OperationProgress
          - AgentControl-LauncherUI-OneOperationPerRepo
          - AgentControl-LauncherUI-CancelOperation
          - AgentControl-LauncherUI-SourceFailureIsolation
          - AgentControl-LauncherUI-RetryFailedRead
          - AgentControl-LauncherUI-StaleResultsDiscarded
        tests:
          # End to end: the background upgrade check of a repo pinned to a server that needs a
          # sign-in opens no dialog and the card says a sign-in is needed.
          - windows@RepoCard_PinnedToServerNeedingSignIn_BackgroundCheckNeverOpensSignInDialog

      - id: AgentControl-System-CredentialSafety
        title: >-
          The tool shall never itself write a credential it is given for a package source to its
          settings, a repo's pin file, its log or the target repo.
        tags: [system, security]
        justification: |
          Package servers need credentials, but a credential that the tool writes anywhere
          outlives the session and can leak through backups, synced profiles, shared logs or a
          commit. The log in particular is a plain file users attach to reports, so no credential
          may reach it, whether it appears in a message, a header, an address or an exception,
          including an exception no part of the tool was prepared for.
        children:
          - AgentControl-Settings-PackageSources
          - AgentControl-AgentPackageManagement-SourceDefinitions
          - AgentControl-AgentPackageManagement-SourceNoSecrets
          - AgentControl-AgentPackageManagement-SourceCredentialBearingLocation
          - AgentControl-AgentPackageManagement-NuGetServerSecretSafety
          - AgentControl-PackageCredentials-SecretsNeverLogged
          - AgentControl-PackageCredentials-SecretRedactedWhileInUse
          - AgentControl-PackageCredentials-UrlUserInfoNeverLogged
          - AgentControl-PackageCredentials-UrlQueryNeverLogged
          - AgentControl-PackageCredentials-UrlFragmentNeverLogged
          - AgentControl-PackageCredentials-AuthorizationValuesNeverLogged
          - AgentControl-PackageCredentials-LoggedMessagesRedacted
          - AgentControl-PackageCredentials-LoggedPropertiesRedacted
          - AgentControl-PackageCredentials-LoggedScopesRedacted
          - AgentControl-PackageCredentials-ExceptionsLoggedSanitized
          - AgentControl-Logging-UnhandledExceptionsRedacted
          - AgentControl-Program-StartupFailureRedacted
        tests:
          # System level, end to end: the sentinel password is searched for in every file the
          # application wrote and in the target repo. What no log line may contain, in every form
          # an address, header or exception can take, is verified at the unit and subsystem
          # levels as evidence of the children.
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword
          - windows@SettingsWindow_SignInWithRememberTicked_SavedOnlyByTheUsersCredentialHelper

      - id: AgentControl-System-CredentialSessionScope
        title: >-
          The tool shall keep a credential the user types for a package source only for the
          current session unless the user explicitly chooses "Remember on this computer", in
          which case only the user's own Git credential helper keeps it and never the tool.
        tags: [system, security]
        justification: |
          Typing a token every session is a real burden, so the user may opt in, per credential,
          to having their own Git credential helper - the operating system's protected store they
          already trust with their other secrets - keep it. The tool itself never stores a secret,
          the choice is off by default, and it is offered only where a helper exists to honor it.
        children:
          - AgentControl-PackageCredentials-SessionOnly
          - AgentControl-PackageCredentials-KeptOnlyAfterSuccess
          - AgentControl-PackageCredentials-SessionCredentialReused
          - AgentControl-PackageCredentials-ForgottenAtExit
          - AgentControl-PackageCredentials-RememberOnRequest
          - AgentControl-PackageCredentials-NeverRememberUnasked
          - AgentControl-PackageCredentials-RememberOnlyAfterSuccess
          - AgentControl-PackageCredentials-RememberOfferedOnlyWhenPossible
          - AgentControl-AgentPackageManagement-NuGetServerCredentialRetention
          - AgentControl-GitIntegration-SavedSignIns
          - AgentControl-LauncherUI-RememberSignIn
        tests:
          # End to end: a typed sign-in is reused within the session without a second dialog,
          # ticking "Remember" hands it to the helper (the arg-logger stub standing in for git,
          # with an emulated credential helper kept outside the application's folders) and to
          # nothing else, and with no helper the choice is unavailable.
          - windows@SettingsWindow_AddNuGetServerWithSignIn_SelectPackagePinsServerSourceAndStoresNoPassword
          - windows@SettingsWindow_SignInWithRememberTicked_SavedOnlyByTheUsersCredentialHelper
          - windows@SettingsWindow_NoCredentialHelper_RememberAndForgetAreUnavailable

      - id: AgentControl-System-SavedSignInLifecycle
        title: >-
          The tool shall use a sign-in saved by the user's Git credential helper without asking,
          and shall remove it from there when the server rejects it or the user asks to forget it.
        tags: [system, security]
        justification: |
          A saved credential must spare the user the dialog while it works, but a stale or
          unwanted one must not linger: the saved credential can be forgotten from the tool and is
          removed when it stops working.
        children:
          - AgentControl-PackageCredentials-SavedCredentialUsedWithoutAsking
          - AgentControl-PackageCredentials-SavedCredentialLookedUpOnce
          - AgentControl-PackageCredentials-RejectedSavedCredentialRemoved
          - AgentControl-PackageCredentials-NewerCredentialSurvivesLateRejection
          - AgentControl-PackageCredentials-RejectedCredentialForgotten
          - AgentControl-PackageCredentials-ForgetSavedSignIn
          - AgentControl-PackageCredentials-ForgetSessionSignIn
          - AgentControl-PackageCredentials-ForgetSignInReportsOutcome
          - AgentControl-LauncherUI-ForgetSavedSignIn
        tests:
          # End to end: a sign-in the helper holds is used without any dialog and "Forget saved
          # sign-in" removes it after a confirmation; a saved sign-in the server refuses is
          # removed from the helper.
          - windows@SettingsWindow_SavedSignIn_UsedWithoutDialogAndForgottenOnRequest
          - windows@SettingsWindow_SavedSignInRejectedByServer_IsRemovedFromTheUsersHelper

      - id: AgentControl-System-CredentialOriginScope
        title: >-
          The tool shall offer a credential for a package server only to the server it was typed
          for.
        tags: [system, security]
        justification: |
          A credential offered to a host other than the one it was typed for is a credential given
          away. A server's own index can still direct the NuGet client to resources on other hosts
          that then challenge it, so users must only add servers they trust.
        children:
          - AgentControl-PackageCredentials-ScopedToFeedOrigin
          - AgentControl-PackageCredentials-NoPromptForOtherOrigins
          - AgentControl-AgentPackageManagement-NuGetServerOriginScoping
        tests:
          # End to end: after signing in to one server, a second server on another origin asks for
          # its own sign-in and never receives the first server's credential.
          - windows@SettingsWindow_SignInToOneServer_IsNeverOfferedToAnotherServer

      - id: AgentControl-System-PackageAuthenticity
        title: >-
          The tool shall let the user require, for each NuGet package source, that packages are
          validly signed, and shall refuse to install a package that does not meet its source's
          requirement, leaving the repo unchanged.
        tags: [system, security]
        justification: |
          An agent package changes the instructions an AI agent follows in a developer's repo, so
          an organization needs to control who may publish what reaches those repos; a signature
          proves who published a package and that it was not altered since, whether it arrives
          from a server or a shared folder. Zip packages carry no signature, so the requirement
          covers NuGet sources only. The finer rules - an optional publisher pin, the re-check of
          packages already on the computer, independence from the user's NuGet trust settings and
          the refusal to rely on a platform that cannot verify signatures - are specified by the
          children and need a real signed package or another platform to demonstrate, so they
          have no system-level scenario.
        children:
          - AgentControl-AgentPackageManagement-SignedPackages
          - AgentControl-AgentPackageManagement-SignaturePlatformSupport
          - AgentControl-AgentPackageManagement-SourceDefinitions
          - AgentControl-AgentPackageManagement-SourceFingerprintNormalization
          - AgentControl-AgentPackageManagement-SourceUnreadableFingerprint
          - AgentControl-LauncherUI-SignatureOptions
          - AgentControl-LauncherUI-SignatureIndicator
          - AgentControl-OTS-NuGetCaching-SignatureVerification
          - AgentControl-OTS-NuGetCaching-UnsignedRejected
          - AgentControl-OTS-NuGetCaching-CachedUnsignedRejected
          - AgentControl-OTS-NuGetCaching-InvalidSignatureRejected
          - AgentControl-OTS-NuGetCaching-UntrustedSignerRejected
          - AgentControl-OTS-NuGetCaching-TrustedSignerAccepted
          - AgentControl-OTS-NuGetCaching-CachedSignerRechecked
          - AgentControl-OTS-NuGetCaching-OtherConfigurationCannotWidenTrust
          - AgentControl-OTS-NuGetCaching-OtherConfigurationCannotNarrowTrust
          - AgentControl-OTS-NuGetCaching-SignatureFailureIdentified
        tests:
          # System level: with a NuGet source that requires signatures the published application
          # refuses to upgrade to an unsigned package and leaves the repo unchanged. The rules the
          # parent text leaves to its children (acceptance of a validly signed package, the
          # publisher pin, the re-check of cached packages, the independence from the user's NuGet
          # trust settings and the refusal on a platform that cannot verify) need a real signed
          # package or another platform and are verified at the subsystem and unit levels (against
          # a real signed package from nuget.org, skipped only where it cannot be reached) as
          # evidence of the child requirements.
          - windows@UpgradeMenuItem_Click_NuGetSourceRequiresSignaturesAndPackageUnsigned_IsRefusedAndRepoUnchanged

      - id: AgentControl-System-DiagnosticLogging
        title: >-
          The tool shall write a rolling diagnostic log file capturing process-launch and
          git-integration detail, to support troubleshooting when a message box alone is
          insufficient.
        tags: [system]
        justification: |
          Per architecture.md, real-world flaky-process-launch troubleshooting showed that a
          message box alone could not root-cause intermittent failures; a diagnostic log
          captures exit codes, timing, stderr, and Win32 error codes a message box cannot show.
        children:
          - AgentControl-Logging-DiagnosticFile
          - AgentControl-OTS-Serilog-WriteLogFile
        tests:
          # Logging has no dedicated test file (see AgentControl-Logging-DiagnosticFile's own
          # justification for the full disclosure); this system requirement inherits the same
          # indirect evidence.
          - GitClient_IsWorkingTreeClean_CleanRepo_ReturnsTrue

      - id: AgentControl-System-About
        title: The tool shall provide an About dialog showing the application version, copyright, and license.
        tags: [system]
        justification: |
          Lets a developer identify exactly which build they are running (e.g. when
          reporting an issue) without inspecting file properties.
        children:
          - AgentControl-LauncherUI-About
          - AgentControl-Program-Version
        tests:
          - windows@AboutButton_Click_OpensAboutWindowShowingVersionAndCopyright

      - id: AgentControl-System-AboutVersionRow
        title: >-
          The tool shall show the application version in its About dialog as a labeled Version
          row, without the build metadata.
        tags: [system]
        justification: |
          A short, labeled version is easy to read out when reporting an issue.
        children:
          - AgentControl-LauncherUI-AboutVersionRow
        tests:
          - windows@AboutButton_Click_OpensAboutWindowShowingVersionAndCopyright

      - id: AgentControl-System-TestIsolation
        title: >-
          The tool shall support a configuration-directory override and git/agent-tool
          command overrides so automated tests can run hermetically against an isolated
          configuration folder.
        tags: [system]
        justification: |
          Per architecture.md's testability decision, FlaUI-driven integration tests must be
          able to point AgentControl at an isolated settings folder and substitute stub
          executables for git/the agentic CLI tool, giving fully repeatable end-to-end
          automation without depending on a real git installation or agentic CLI tool.
        children:
          - AgentControl-Startup-ParseArguments
        tests:
          - StartupOptions_Parse_ConfigDirArgument_CapturesValue

      - id: AgentControl-System-Startup
        title: >-
          The tool shall load persisted settings and display the recent-repos window when
          launched.
        tags: [system]
        justification: |
          The application must present the developer's existing recent-repos list and
          preferences immediately on launch rather than starting from a blank slate every
          time.
        children:
          - AgentControl-Program-Bootstrap
          - AgentControl-Program-ErrorHandling
        tests:
          - windows@MainWindow_Launch_WindowVisibleWithExpectedAutomationId

      - id: AgentControl-System-UiFramework
        title: The tool shall render its user interface using a cross-platform UI framework.
        tags: [system]
        justification: |
          Per architecture.md's Technology Stack, the UI is built on Avalonia so the
          codebase stays platform-portable even though only a Windows MSI ships for v1.
        children:
          - AgentControl-OTS-Avalonia-RenderUi
        tests:
          - windows@MainWindow_Launch_WindowVisibleWithExpectedAutomationId
