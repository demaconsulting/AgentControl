---
# Software Unit Requirements for the SecretRedactingLogger Class
#
# SecretRedactingLogger wraps the logger given to the package client so that nothing secret is
# written to the application log.

sections:
  - title: SecretRedactingLogger Unit Requirements
    requirements:
      - id: AgentControl-SecretRedactingLogger-RemovesUrlSecrets
        title: >-
          The SecretRedactingLogger class shall remove the user name, password, query string and
          fragment from every web address in a message while keeping its scheme, host, port, path
          and the rest of the message text.
        justification: |
          A package client logs the addresses it requests, and a redirect to a download service
          can carry a signed token in the query string; the rest of the address stays because it
          is what makes the message useful for diagnosis.
        tests:
          - SecretRedactingLogger_Redact_UrlsWithSecrets_KeepsOnlySchemeHostPortAndPath
          - SecretRedactingLogger_Redact_PlainText_IsUnchanged

      - id: AgentControl-SecretRedactingLogger-RemovesAuthorizationValues
        title: >-
          The SecretRedactingLogger class shall replace the value of every authorization header,
          basic or bearer credential found in a message with a placeholder.
        justification: |
          An exception message or trace can quote the header a failed request carried, which
          holds the credential in a form that is trivially decoded.
        tests:
          - SecretRedactingLogger_Redact_AuthorizationValues_AreReplaced

      - id: AgentControl-SecretRedactingLogger-AppliesToEveryMessage
        title: >-
          The SecretRedactingLogger class shall apply that redaction to the text of every message
          and every exception it forwards to the wrapped logger, and shall leave the wrapped
          logger's level filtering and scopes in effect.
        justification: |
          The guarantee must not depend on which message source writes the text, and wrapping the
          logger must not change which messages the application log keeps.
        tests:
          - SecretRedactingLogger_Log_MessageAndExceptionWithSecrets_ForwardsRedactedText
          - SecretRedactingLogger_IsEnabledAndScope_DelegatesToTheInnerLogger
