---
# Software Unit Requirements for the SecretRedactingLogger Class
#
# SecretRedactingLogger wraps the logger given to the package client, and to the application's own
# package-source code, so that nothing secret is written to the application log. Its redaction
# engine (SecretRedactor.cs, with the SanitizedException stand-in) is part of the same unit.
#
# Each requirement states one observable criterion and links only unit-level tests (the tests in
# SecretRedactorTests.cs and SecretRedactingLoggerTests.cs); evidence that spans units is linked
# by the PackageCredentials subsystem requirements and by the requirements of the subsystems that
# use the redaction engine.

sections:
  - title: SecretRedactingLogger Unit Requirements
    requirements:
      # --- Web addresses -------------------------------------------------------------------------
      - id: AgentControl-SecretRedactingLogger-RemovesUrlSecrets
        title: >-
          The SecretRedactingLogger class shall remove the query string from every web address in
          a message.
        justification: |
          A package client logs the addresses it requests, and a redirect to a download service
          can carry a signed token in the query string.
        tests:
          - SecretRedactor_Redact_UrlForms_KeepOnlySchemeHostPortAndPath
          - SecretRedactor_Redact_UrlWithEscapedQuotes_NoSuffixSurvives
          - SecretRedactor_Redact_JsonSerializedUrl_NeverLeaksQueryOrFragment
          - SecretRedactor_Redact_UrlInParentheses_RedactsQueryAndKeepsClosingParenthesis
          - SecretRedactor_Redact_UrlWithBalancedParenthesesInPathAndQuery_RedactsWholeQueryAndFragment
          - SecretRedactor_Redact_MarkdownLinkWithUserInfoAndQuery_RedactsUserInfoQueryAndFragment

      - id: AgentControl-SecretRedactingLogger-RemovesUrlUserInfo
        title: >-
          The SecretRedactingLogger class shall remove the user name and password from every web
          address in a message.
        justification: |
          An address can embed a credential before the host; it must not survive into the log,
          not even when the password contains characters such as a slash, a question mark or a
          number sign that look like the end of the user information.
        tests:
          - SecretRedactor_Redact_UrlForms_KeepOnlySchemeHostPortAndPath
          - SecretRedactor_Redact_MarkdownLinkWithUserInfoAndQuery_RedactsUserInfoQueryAndFragment

      - id: AgentControl-SecretRedactingLogger-RemovesUrlFragment
        title: >-
          The SecretRedactingLogger class shall remove the fragment from every web address in a
          message.
        justification: |
          A fragment can carry a token and is as unsuitable for a shared log as a query string.
        tests:
          - SecretRedactor_Redact_UrlForms_KeepOnlySchemeHostPortAndPath
          - SecretRedactor_Redact_JsonSerializedUrl_NeverLeaksQueryOrFragment
          - SecretRedactor_Redact_UrlWithBalancedParenthesesInPathAndQuery_RedactsWholeQueryAndFragment
          - SecretRedactor_Redact_MarkdownLinkWithUserInfoAndQuery_RedactsUserInfoQueryAndFragment

      - id: AgentControl-SecretRedactingLogger-KeepsUrlLocation
        title: >-
          The SecretRedactingLogger class shall keep the scheme, host, port and path of a web
          address in a message.
        justification: |
          The rest of the address stays because it is what makes the message useful for
          diagnosis.
        tests:
          - SecretRedactor_Redact_UrlForms_KeepOnlySchemeHostPortAndPath
          - SecretRedactor_Redact_PlainText_IsUnchanged
          - SecretRedactor_Redact_UrlInParentheses_RedactsQueryAndKeepsClosingParenthesis

      - id: AgentControl-SecretRedactingLogger-KeepsSurroundingText
        title: >-
          The SecretRedactingLogger class shall leave the text around a web address, and text
          without secrets, unchanged.
        justification: |
          Redaction that damaged the surrounding sentence, or altered clean text, would make the
          log harder to read without making it safer.
        tests:
          - SecretRedactor_Redact_UrlForms_KeepOnlySchemeHostPortAndPath
          - SecretRedactor_Redact_PlainText_IsUnchanged
          - SecretRedactor_Redact_UrlInParentheses_RedactsQueryAndKeepsClosingParenthesis

      - id: AgentControl-SecretRedactingLogger-RecognizesIpv6Literal
        title: >-
          The SecretRedactingLogger class shall treat a web address whose host is an IPv6 literal
          in brackets as one address, so that its query string and fragment are removed like any
          other address's.
        justification: |
          The colons and brackets of an IPv6 literal must not make the scanner stop early and
          leave the query string behind.
        tests:
          - SecretRedactor_Redact_UrlForms_KeepOnlySchemeHostPortAndPath

      - id: AgentControl-SecretRedactingLogger-RedactsUrlInsideEscapedQuotes
        title: >-
          The SecretRedactingLogger class shall remove the secret parts of a web address that
          appears inside a quoted or JSON string, without ending the address at a delimiter that
          is escaped with a backslash, written as \u0022 or doubled.
        justification: |
          Logs often carry addresses serialized as JSON, where an escaped quote must not be
          mistaken for the end of the address, which would leave the rest of the query behind.
        tests:
          - SecretRedactor_Redact_UrlWithEscapedQuotes_NoSuffixSurvives
          - SecretRedactor_Redact_JsonSerializedUrl_NeverLeaksQueryOrFragment

      - id: AgentControl-SecretRedactingLogger-RedactsUrlInsideParentheses
        title: >-
          The SecretRedactingLogger class shall treat parentheses in a web address in balance, so
          that a closing parenthesis that belongs to an opening one inside the address, or that is
          not followed by the end of the text, whitespace or closing or sentence punctuation,
          does not end the address, while a closing parenthesis that surrounds the address does.
        justification: |
          A legal address can contain parentheses in its path or query, and a message can wrap an
          address in parentheses or a Markdown link; ending the address at the wrong parenthesis
          would leave the rest of the query in the log.
        tests:
          - SecretRedactor_Redact_UrlForms_KeepOnlySchemeHostPortAndPath
          - SecretRedactor_Redact_UrlInParentheses_RedactsQueryAndKeepsClosingParenthesis
          - SecretRedactor_Redact_UrlWithBalancedParenthesesInPathAndQuery_RedactsWholeQueryAndFragment
          - SecretRedactor_Redact_MarkdownLinkWithUserInfoAndQuery_RedactsUserInfoQueryAndFragment

      # --- Headers and secret-bearing keys -------------------------------------------------------
      - id: AgentControl-SecretRedactingLogger-RemovesAuthorizationValues
        title: >-
          The SecretRedactingLogger class shall replace the complete value of every
          Authorization, Proxy-Authorization, API-key and cookie header found in a message with a
          placeholder.
        justification: |
          An exception message or trace can quote the header a failed request carried, which holds
          the credential in a form that is trivially decoded.
        tests:
          - SecretRedactor_Redact_AuthorizationHeaders_ValueIsReplacedWhateverTheScheme
          - SecretRedactor_Redact_HeaderInsideMultiLineText_KeepsOtherLines

      - id: AgentControl-SecretRedactingLogger-ReplacesValueWhateverScheme
        title: >-
          The SecretRedactingLogger class shall replace the complete value of such a header
          whatever the authentication scheme - basic, bearer, digest, NTLM, negotiate, a custom
          scheme, or none.
        justification: |
          A scheme the program does not know is just as sensitive as one it does, so the whole
          value is removed rather than only the parts of known schemes.
        tests:
          - SecretRedactor_Redact_AuthorizationHeaders_ValueIsReplacedWhateverTheScheme

      - id: AgentControl-SecretRedactingLogger-KeepsHeaderNameAndOtherLines
        title: >-
          The SecretRedactingLogger class shall keep the header name, and every line of the
          message that is not part of the header value, when it replaces a header value.
        justification: |
          The name of the header and the surrounding lines are what make the message useful for
          diagnosis and hold no secret.
        tests:
          - SecretRedactor_Redact_HeaderInsideMultiLineText_KeepsOtherLines

      - id: AgentControl-SecretRedactingLogger-RemovesBareCredentials
        title: >-
          The SecretRedactingLogger class shall replace a basic or bearer credential that appears
          in a message without a header around it.
        justification: |
          A credential can be quoted without its header name, for example in a sentence or a
          trace, and is just as sensitive there.
        tests:
          - SecretRedactor_Redact_BareCredentialsAndSecretKeys_AreReplaced

      - id: AgentControl-SecretRedactingLogger-RemovesSecretBearingKeys
        title: >-
          The SecretRedactingLogger class shall replace the value of a secret-bearing key such as
          password, token or signature found in a message.
        justification: |
          Messages and serialized data quote key and value pairs whose names mark the value as a
          secret; the value must not survive even when no header or address surrounds it.
        tests:
          - SecretRedactor_Redact_BareCredentialsAndSecretKeys_AreReplaced
          - SecretRedactor_Redact_QuotedValueWithEscapedQuotes_NoSuffixSurvives
          - SecretRedactor_Redact_JsonSerializerDefaultEscaping_RedactsHeaderAndKeyValues
          - SecretRedactor_Redact_UnicodeEscapedQuoteDelimiters_RedactsHeaderAndKeyValues
          - SecretRedactor_Redact_NestedJsonText_RedactsHeaderAndKeyValues

      - id: AgentControl-SecretRedactingLogger-RedactsEscapedDelimitedValues
        title: >-
          The SecretRedactingLogger class shall replace a quoted header or key value whose quote
          delimiters are written in plain, backslash-escaped, \uXXXX-escaped or entity form -
          including the default escaping of System.Text.Json - so that nothing after an escaped
          quote inside the value survives.
        justification: |
          Logs often carry headers serialized as JSON, where an escaped quote must not be mistaken
          for the end of the value; a delimiter written as \u0022 is the serializer's default.
        tests:
          - SecretRedactor_Redact_QuotedValueWithEscapedQuotes_NoSuffixSurvives
          - SecretRedactor_Redact_JsonSerializerDefaultEscaping_RedactsHeaderAndKeyValues
          - SecretRedactor_Redact_UnicodeEscapedQuoteDelimiters_RedactsHeaderAndKeyValues

      - id: AgentControl-SecretRedactingLogger-RedactsNestedJsonValues
        title: >-
          The SecretRedactingLogger class shall replace a header or key value in JSON text that is
          itself serialized into a JSON string, at every level of nesting.
        justification: |
          A log line can hold a header dictionary that was serialized, embedded in another
          message and serialized again; each level adds escaping that must not hide the value.
        tests:
          - SecretRedactor_Redact_JsonSerializedAuthorizationValue_IsRedactedWholeAtEveryNestingLevel
          - SecretRedactor_Redact_NestedJsonText_RedactsHeaderAndKeyValues

      - id: AgentControl-SecretRedactingLogger-StopsAtTheRealTerminator
        title: >-
          The SecretRedactingLogger class shall end the replacement of a quoted header or key
          value at its real closing quote and keep the text after it.
        justification: |
          Redaction that ran past the real end of the value would remove text that is not secret
          and make the log harder to read; an even run of backslashes before a quote leaves the
          quote as the terminator.
        tests:
          - SecretRedactor_Redact_QuotedValue_StopsAtTheRealTerminator

      # --- Registered secrets --------------------------------------------------------------------
      - id: AgentControl-SecretRedactingLogger-RemovesKnownSecrets
        title: >-
          The SecretRedactingLogger class shall replace every verbatim occurrence of a secret value
          registered as in use in any text it redacts.
        justification: |
          Pattern matching cannot anticipate every place a password might end up; removing the
          exact secret values currently in use guarantees they cannot be logged, whatever text
          surrounds them.
        tests:
          - SecretRedactor_RegisterAndUnregister_ReplacesEveryOccurrenceOfTheSecretWhileRegistered
          - SecretRedactingLogger_Log_RegisteredPasswordInArbitraryTextPropertiesAndExceptions_IsRemoved

      - id: AgentControl-SecretRedactingLogger-RemovesEncodedSecretForms
        title: >-
          The SecretRedactingLogger class shall also replace the URL-encoded form of a registered
          secret and the Base64 form of a registered basic credential.
        justification: |
          A secret reaches a log in the forms the wire uses - percent-encoded in an address and
          Base64-encoded in a basic authorization value - not only as typed.
        tests:
          - SecretRedactor_RegisterAndUnregister_ReplacesEveryOccurrenceOfTheSecretWhileRegistered

      - id: AgentControl-SecretRedactingLogger-StopsWhenSecretWithdrawn
        title: >-
          The SecretRedactingLogger class shall stop replacing a secret value once its
          registration has been withdrawn.
        justification: |
          Registrations that were never withdrawn would grow without bound and would alter
          unrelated text that happens to contain a former secret.
        tests:
          - SecretRedactor_RegisterAndUnregister_ReplacesEveryOccurrenceOfTheSecretWhileRegistered
          - SecretRedactor_Unregister_SecretRegisteredTwice_StaysRedactedUntilTheLastWithdrawal

      - id: AgentControl-SecretRedactingLogger-RedactsWhileAnyHolderUsesSecret
        title: >-
          The SecretRedactingLogger class shall hold registrations of a secret per user of the
          secret, so that withdrawing one holder's registration never ends redaction while
          another holder is still using the secret.
        justification: |
          Package operations run concurrently; one operation forgetting a rejected credential must
          not strip the protection from an operation that is still running with it.
        tests:
          - SecretRedactor_Unregister_SecretRegisteredTwice_StaysRedactedUntilTheLastWithdrawal
          # needs test: no unit test exercises SecretRedactor.Lease on its own
          - SecretRedactor_Lease_DisposedTwiceOrAlongsideOtherHolders_WithdrawsOnlyItsOwnRegistration

      - id: AgentControl-SecretRedactingLogger-RegistryIsThreadSafe
        title: >-
          The SecretRedactingLogger class shall register, withdraw and apply secrets correctly
          when they are used from many threads at once.
        justification: |
          Package operations run concurrently; a registration that is lost or a redaction that
          throws under contention would let a secret reach the log or break the operation.
        tests:
          - SecretRedactor_RegisterAndRedact_FromManyThreads_IsThreadSafe

      # --- Messages the logger forwards ----------------------------------------------------------
      - id: AgentControl-SecretRedactingLogger-AppliesToEveryMessage
        title: >-
          The SecretRedactingLogger class shall apply its redaction to the formatted text of every
          message it forwards to the wrapped logger.
        justification: |
          The guarantee must not depend on which message source writes the text.
        tests:
          - SecretRedactingLogger_Log_MessageAndExceptionWithSecrets_ForwardsRedactedText
          - SecretRedactingLogger_Log_RegisteredPasswordInArbitraryTextPropertiesAndExceptions_IsRemoved

      - id: AgentControl-SecretRedactingLogger-RedactsStructuredProperties
        title: >-
          The SecretRedactingLogger class shall redact every structured property value of a
          message it forwards, keeping the message template, the property names and the plain
          value types.
        justification: |
          A sink may record the structured properties instead of the formatted text; keeping the
          structure lets such sinks keep working.
        tests:
          - SecretRedactingLogger_Log_StructuredPropertyValues_AreRedactedAndStructureIsKept
          - SecretRedactor_RedactValue_RedactsTextAndKeepsPlainValueTypes

      - id: AgentControl-SecretRedactingLogger-RedactsScopes
        title: >-
          The SecretRedactingLogger class shall redact the state of every logging scope it
          forwards, whether the state is text or structured pairs.
        justification: |
          A sink may record the scopes that surround a message, and a scope can carry an address or
          a header just as a message can.
        tests:
          - SecretRedactingLogger_BeginScope_TextAndStructuredState_AreRedacted

      - id: AgentControl-SecretRedactingLogger-KeepsLevelFiltering
        title: >-
          The SecretRedactingLogger class shall leave the wrapped logger's level filtering in
          effect.
        justification: |
          Wrapping the logger must not change which messages the application log keeps.
        tests:
          - SecretRedactingLogger_IsEnabled_DelegatesToTheInnerLogger

      - id: AgentControl-SecretRedactingLogger-ForwardsOnlySanitizedException
        title: >-
          The SecretRedactingLogger class shall forward an exception to the wrapped logger only
          as a secret-free description, never the original exception object.
        justification: |
          The original object, its inner exceptions and its data can carry secrets that no
          message-level redaction can reach once the object is with the wrapped logger.
        tests:
          - SecretRedactingLogger_Log_Exception_IsForwardedAsASanitizedStandIn
          - SecretRedactingLogger_Log_MessageAndExceptionWithSecrets_ForwardsRedactedText

      # --- Secret-free exception description ----------------------------------------------------
      - id: AgentControl-SecretRedactingLogger-SanitizesExceptions
        title: >-
          The SecretRedactingLogger class shall provide a description of any exception whose
          message chain - the exception's message and those of its inner and aggregated
          exceptions - is redacted.
        justification: |
          An exception can be kept, logged or shown only if the text it carries is free of
          secrets, whatever exception it describes.
        tests:
          - SecretRedactor_Sanitize_ExceptionWithSecretsInChain_KeepsOnlyRedactedText

      - id: AgentControl-SecretRedactingLogger-KeepsExceptionTypeName
        title: >-
          The SecretRedactingLogger class shall keep the type name of the exception in its
          description.
        justification: |
          The type of an exception is the first thing a person diagnosing a failure needs, and it
          holds no secret.
        tests:
          - SecretRedactor_Sanitize_ExceptionWithSecretsInChain_KeepsOnlyRedactedText
          - SecretRedactor_Sanitize_ThrownException_KeepsStackTrace

      - id: AgentControl-SecretRedactingLogger-KeepsRedactedStackTrace
        title: >-
          The SecretRedactingLogger class shall keep the stack trace of a thrown exception in its
          description, redacted.
        justification: |
          The stack trace shows where a failure happened; it can contain addresses, so it is kept
          only after redaction.
        tests:
          - SecretRedactor_Sanitize_ThrownException_KeepsStackTrace
          - SecretRedactor_Sanitize_ExceptionWithSecretsInChain_KeepsOnlyRedactedText

      - id: AgentControl-SecretRedactingLogger-DropsOriginalExceptionData
        title: >-
          The SecretRedactingLogger class shall not keep the original exception, its inner
          exceptions or its data in the description of an exception.
        justification: |
          A raw exception object, its inner exceptions and its data can carry headers, addresses
          and credentials that redaction of text cannot reach; replacing them makes the guarantee
          hold for everything that handles the description afterwards.
        tests:
          - SecretRedactor_Sanitize_ExceptionWithSecretsInChain_KeepsOnlyRedactedText

      - id: AgentControl-SecretRedactingLogger-RedactsConstructorInputs
        title: >-
          The SecretRedactingLogger class shall redact the type name, message and stack trace a
          description of an exception is built from, however the description is constructed.
        justification: |
          A description that kept whatever text its constructor was given would not be secret-free
          by construction; redacting every input makes the contract hold for every construction
          path.
        tests:
          - SanitizedException_Constructor_UnredactedText_IsRedactedByTheConstructor
