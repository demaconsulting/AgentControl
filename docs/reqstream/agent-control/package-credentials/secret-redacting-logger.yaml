---
# Software Unit Requirements for the SecretRedactingLogger Class
#
# SecretRedactingLogger wraps the logger given to the package client, and to the application's own
# package-source code, so that nothing secret is written to the application log. Its redaction
# engine (SecretRedactor.cs, with the SanitizedException stand-in) is part of the same unit.

sections:
  - title: SecretRedactingLogger Unit Requirements
    requirements:
      - id: AgentControl-SecretRedactingLogger-RemovesUrlSecrets
        title: >-
          The SecretRedactingLogger class shall remove the user name, password, query string and
          fragment from every web address in a message - whether the host is a name, an IPv4
          address or an IPv6 literal, and wherever the address appears in the message - while
          keeping its scheme, host, port, path and the rest of the message text.
        justification: |
          A package client logs the addresses it requests, and a redirect to a download service
          can carry a signed token in the query string; the rest of the address stays because it
          is what makes the message useful for diagnosis.
        tests:
          - SecretRedactor_Redact_UrlForms_KeepOnlySchemeHostPortAndPath
          - SecretRedactor_Redact_PlainText_IsUnchanged

      - id: AgentControl-SecretRedactingLogger-RemovesAuthorizationValues
        title: >-
          The SecretRedactingLogger class shall replace the complete value of every Authorization,
          Proxy-Authorization, API-key and cookie header found in a message with a placeholder,
          whatever the authentication scheme (basic, bearer, digest, NTLM, negotiate, a custom
          scheme, or none), and shall replace bare basic or bearer credentials and secret-bearing
          keys such as password, token or signature.
        justification: |
          An exception message or trace can quote the header a failed request carried, which
          holds the credential in a form that is trivially decoded; a scheme the program does not
          know is just as sensitive as one it does, so the whole value is removed rather than
          only the parts of known schemes.
        tests:
          - SecretRedactor_Redact_AuthorizationHeaders_ValueIsReplacedWhateverTheScheme
          - SecretRedactor_Redact_HeaderInsideMultiLineText_KeepsOtherLines
          - SecretRedactor_Redact_BareCredentialsAndSecretKeys_AreReplaced

      - id: AgentControl-SecretRedactingLogger-RemovesKnownSecrets
        title: >-
          The SecretRedactingLogger class shall replace every verbatim occurrence of a secret
          value registered as in use - including its URL-encoded form and the Base64 form of a
          basic credential - in any text it redacts, for as long as the secret is registered,
          and shall stop doing so when the registration is withdrawn.
        justification: |
          Pattern matching cannot anticipate every place a password might end up; removing the
          exact secret values currently in use guarantees they cannot be logged, whatever text
          surrounds them. The registry is thread-safe because package operations run
          concurrently.
        tests:
          - SecretRedactor_RegisterAndUnregister_ReplacesEveryOccurrenceOfTheSecretWhileRegistered
          - SecretRedactor_Unregister_SecretRegisteredTwice_StaysRedactedUntilTheLastWithdrawal
          - SecretRedactor_RegisterAndRedact_FromManyThreads_IsThreadSafe
          - SecretRedactingLogger_Log_RegisteredPasswordInArbitraryTextPropertiesAndExceptions_IsRemoved

      - id: AgentControl-SecretRedactingLogger-AppliesToEveryMessage
        title: >-
          The SecretRedactingLogger class shall apply that redaction to the formatted text, every
          structured property value and the scope state of every message it forwards to the
          wrapped logger, shall forward an exception only as a secret-free description (never the
          original exception object, its inner exceptions or its data), and shall leave the
          wrapped logger's level filtering in effect.
        justification: |
          The guarantee must not depend on which message source writes the text or on whether a
          sink records the formatted message, the structured properties, the scopes or the
          exception, and wrapping the logger must not change which messages the application log
          keeps.
        tests:
          - SecretRedactingLogger_Log_MessageAndExceptionWithSecrets_ForwardsRedactedText
          - SecretRedactingLogger_Log_StructuredPropertyValues_AreRedactedAndStructureIsKept
          - SecretRedactingLogger_BeginScope_TextAndStructuredState_AreRedacted
          - SecretRedactingLogger_Log_Exception_IsForwardedAsASanitizedStandIn
          - SecretRedactingLogger_IsEnabled_DelegatesToTheInnerLogger
          - SecretRedactor_RedactValue_RedactsTextAndKeepsPlainValueTypes

      - id: AgentControl-SecretRedactingLogger-SanitizesExceptions
        title: >-
          The SecretRedactingLogger class shall provide a secret-free description of any
          exception, holding only the redacted type name, redacted message chain (inner and
          aggregated exceptions included) and redacted stack trace, so that an exception can be
          kept, logged or shown without carrying a secret.
        justification: |
          A raw exception object, its inner exceptions and its data can carry headers, addresses
          and credentials that no message-level redaction can reach once the object travels on;
          replacing it at the boundary makes the guarantee hold for everything that handles it
          afterwards.
        tests:
          - SecretRedactor_Sanitize_ExceptionWithSecretsInChain_KeepsOnlyRedactedText
          - SecretRedactor_Sanitize_ThrownException_KeepsStackTrace
          - PackageSourceAccessException_InnerExceptionWithSecrets_IsReplacedByASanitizedDescription
          - SourceEditorViewModel_TestConnection_ExceptionsWithSecrets_ShowOnlyRedactedText
          - SelectPackageWindowViewModel_SourceAndVersionFailuresWithSecrets_ShowOnlyRedactedText
          - RepoCardViewModel_PackageSourceFailureWithSecrets_StatusTextAndLogsAreRedacted
