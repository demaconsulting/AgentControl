---
# Software Unit Requirements for the PackageCredentialCallback Class
#
# PackageCredentialCallback answers a package client's requests for credentials during one
# operation against one server.

sections:
  - title: PackageCredentialCallback Unit Requirements
    requirements:
      - id: AgentControl-PackageCredentialCallback-ForeignOriginRefused
        title: >-
          The PackageCredentialCallback class shall answer a request for credentials for an
          address outside the server's origin with no credential, without consulting the
          remembered credentials and without asking the user.
        justification: |
          A redirect or a link inside a feed can lead the package client to another host; that
          host must not receive the credential, and the user must not be asked for a credential
          on its behalf, which could be used to harvest one.
        tests:
          - PackageCredentialCallback_GetCredential_ForeignOrigin_ReturnsNullWithoutPrompting

      - id: AgentControl-PackageCredentialCallback-TierOrder
        title: >-
          The PackageCredentialCallback class shall answer a request from the server with the
          credential the user already entered during the session when there is one, otherwise
          ask the user for the server's credential, telling the user which server and which
          configured source it is for, and shall answer with no credential when none is
          remembered and the user may not be asked.
        justification: |
          Using what the user already typed avoids repeated dialogs, and background work that
          must not interrupt the user needs a way to proceed with only what is already known.
        tests:
          - PackageCredentialCallback_GetCredential_SessionCredentialStored_UsesItWithoutPrompting
          - PackageCredentialCallback_GetCredential_NothingStored_AsksTheUserForThatFeed
          - PackageCredentialCallback_GetCredential_NoPromptAndNothingStored_ReturnsNull
          - PackageCredentialCallback_Callback_InvokedLikeTheNuGetLibraryDoes_AnswersFromTheStore

      - id: AgentControl-PackageCredentialCallback-AnswerMemoized
        title: >-
          The PackageCredentialCallback class shall ask the user at most once per operation
          however many requests or retries the operation makes, shall remember a declined or
          unavailable answer as well as a credential, shall give concurrent requests the same
          answer, and shall stop waiting for the user when the operation is canceled.
        justification: |
          A package client retries a refused request; without a single remembered answer a wrong
          password would reopen the dialog in a loop, and an abandoned dialog must not hold the
          operation forever.
        tests:
          - PackageCredentialCallback_GetCredential_SeveralChallenges_PromptsOnce
          - PackageCredentialCallback_GetCredential_UserDeclines_NullIsMemoizedAndNotAskedAgain
          - PackageCredentialCallback_GetCredential_CancelledWhilePrompting_ThrowsOperationCanceled

      - id: AgentControl-PackageCredentialCallback-CommitOnSuccess
        title: >-
          The PackageCredentialCallback class shall remember a credential the user entered for
          the rest of the session only when told that the operation succeeded, and shall forget
          the server's remembered credential when told that the server rejected it.
        justification: |
          A credential typed wrongly must never be kept or reused; only a credential that worked
          is worth remembering, and one that stopped working must be dropped.
        tests:
          - PackageCredentialCallback_Commit_PromptedCredential_IsStoredOnlyAfterCommit
          - PackageCredentialCallback_Commit_NothingPrompted_StoresNothing
          - PackageCredentialCallback_Reject_SessionCredential_IsForgotten
          - PackageCredentialCallback_Constructor_NullArguments_Throw

      - id: AgentControl-PackageCredentialCallback-RegistersTypedSecret
        title: >-
          The PackageCredentialCallback class shall hold its own redaction lease on the credential
          its operation uses - a remembered session credential, taken atomically from the store, or
          one the user entered, from the moment it is entered - and shall end that lease when the
          operation ends (on commit, on rejection or on release), so that another operation
          forgetting the credential cannot end redaction while this operation still uses it, while
          a credential kept by the session store stays registered by the store.
        justification: |
          A password must be removable from any log line or message, including those written
          while the operation is still running, even when a concurrent operation's rejection
          forgets it from the store; but it must not stay tracked after no operation uses it.
        tests:
          - PackageCredentialCallback_PromptedCredential_IsRegisteredForRedactionUntilTheOperationEnds
          - PackageCredentialCallback_ConcurrentOperationRejectsCredential_ActiveOperationStaysRedactedUntilItEnds
          - PackageCredentialCallback_StoreClearedWhileOperationRuns_OperationStaysRedactedUntilItEnds
