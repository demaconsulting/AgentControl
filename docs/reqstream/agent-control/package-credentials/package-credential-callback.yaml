---
# Software Unit Requirements for the PackageCredentialCallback Class
#
# PackageCredentialCallback answers a package client's requests for credentials during one
# operation against one server.

sections:
  - title: PackageCredentialCallback Unit Requirements
    requirements:
      - id: AgentControl-PackageCredentialCallback-ForeignOriginRefused
        title: >-
          The PackageCredentialCallback class shall answer a request for credentials for an
          address outside the server's origin with no credential, without consulting the
          remembered credentials and without asking the user.
        justification: |
          A redirect or a link inside a feed can lead the package client to another host; that
          host must not receive the credential, and the user must not be asked for a credential
          on its behalf, which could be used to harvest one.
        tests:
          - PackageCredentialCallback_GetCredential_ForeignOrigin_ReturnsNullWithoutPrompting

      - id: AgentControl-PackageCredentialCallback-TierOrder
        title: >-
          The PackageCredentialCallback class shall answer a request from the server with the
          credential the user already entered during the session or saved on this computer when
          there is one, otherwise ask the user for the server's credential, telling the user which
          server and which configured source it is for and whether a sign-in can be remembered on
          this computer, and shall answer with no credential when none is remembered and the user
          may not be asked.
        justification: |
          Using what the user already typed or saved avoids repeated dialogs, the option to
          remember is only honest when something can keep the credential, and background work that
          must not interrupt the user needs a way to proceed with only what is already known.
        tests:
          - PackageCredentialCallback_GetCredential_SessionCredentialStored_UsesItWithoutPrompting
          - PackageCredentialCallback_GetCredential_NothingStored_AsksTheUserForThatFeed
          - PackageCredentialCallback_GetCredential_NoPromptAndNothingStored_ReturnsNull
          - PackageCredentialCallback_Callback_InvokedLikeTheNuGetLibraryDoes_AnswersFromTheStore
          - PackageCredentialCallback_GetCredential_Prompting_ReportsWhetherRememberingIsPossible
          - PackageCredentialCallback_GetCredential_NoUsersStore_PromptCannotRemember

      - id: AgentControl-PackageCredentialCallback-SavedCredentialLookup
        title: >-
          The PackageCredentialCallback class shall, when the session holds no credential for the
          server, look for a credential the user saved in their own credential store before asking
          the user - without any user interface and also when it may not ask the user - shall look
          at most once per server per session however many operations run at the same time, shall
          not consult that store when the session already holds a credential, and shall ask the
          user as usual, without offering to remember, when that store fails.
        justification: |
          A saved credential must work without a dialog or the saving would be pointless, but
          reading a credential store costs time and must not be repeated for every operation; a
          credential store that is broken must not turn into a failed sign-in.
        tests:
          - PackageCredentialCallback_GetCredential_SavedCredentialExists_UsesItWithoutPrompting
          - PackageCredentialCallback_GetCredential_SilentCallbackAndSavedCredential_UsesIt
          - PackageCredentialCallback_GetCredential_NothingSaved_LooksUpOncePerSessionThenPrompts
          - PackageCredentialCallback_GetCredential_ConcurrentOperations_ShareOneLookup
          - PackageCredentialCallback_GetCredential_SessionCredentialExists_DoesNotConsultTheUsersStore
          - PackageCredentialCallback_GetCredential_UsersStoreThrows_FallsThroughToPromptWithoutRememberOption

      - id: AgentControl-PackageCredentialCallback-AnswerMemoized
        title: >-
          The PackageCredentialCallback class shall ask the user at most once per operation
          however many requests or retries the operation makes, shall remember a declined or
          unavailable answer as well as a credential, shall give concurrent requests the same
          answer, and shall stop waiting for the user when the operation is canceled.
        justification: |
          A package client retries a refused request; without a single remembered answer a wrong
          password would reopen the dialog in a loop, and an abandoned dialog must not hold the
          operation forever.
        tests:
          - PackageCredentialCallback_GetCredential_SeveralChallenges_PromptsOnce
          - PackageCredentialCallback_GetCredential_UserDeclines_NullIsMemoizedAndNotAskedAgain
          - PackageCredentialCallback_GetCredential_CancelledWhilePrompting_ThrowsOperationCanceled

      - id: AgentControl-PackageCredentialCallback-CommitOnSuccess
        title: >-
          The PackageCredentialCallback class shall remember a credential the user entered for
          the rest of the session only when told that the operation succeeded, and shall forget
          the server's remembered credential when told that the server rejected it.
        justification: |
          A credential typed wrongly must never be kept or reused; only a credential that worked
          is worth remembering, and one that stopped working must be dropped.
        tests:
          - PackageCredentialCallback_Commit_PromptedCredential_IsStoredOnlyAfterCommit
          - PackageCredentialCallback_Commit_NothingPrompted_StoresNothing
          - PackageCredentialCallback_Reject_SessionCredential_IsForgotten
          - PackageCredentialCallback_Constructor_NullArguments_Throw

      - id: AgentControl-PackageCredentialCallback-RememberOnRequest
        title: >-
          The PackageCredentialCallback class shall hand a credential the user entered to the
          user's own credential store only when the user chose to remember it and was told the
          operation succeeded, shall never do so for a credential the user did not choose to
          remember or for one that came from the session or from that store, and shall keep the
          credential for the session and not fail the operation when that store refuses the
          credential, fails or takes too long.
        justification: |
          Saving is a decision the user makes for one credential, taken only once the credential
          is known to work; the user's credential store is outside the application's control, so
          its failure must cost the user the convenience of remembering, not the operation they
          asked for.
        tests:
          - PackageCredentialCallback_Commit_RememberTicked_ApprovesInTheUsersStore
          - PackageCredentialCallback_Commit_RememberNotTicked_NeverApproves
          - PackageCredentialCallback_Commit_UsersStoreRefusesOrFails_StillKeepsTheSessionCredential

      - id: AgentControl-PackageCredentialCallback-RejectRemovesSavedCredential
        title: >-
          The PackageCredentialCallback class shall, when told that the server rejected the
          credential it supplied, forget exactly that credential - and not a different one that
          another operation has stored for the server meanwhile - and, when that credential came
          from the user's own credential store, also remove it from there so the next operation
          asks the user, while leaving that store alone when the credential was only a session one.
        justification: |
          A credential that stopped working must not be offered again; a late rejection of an old
          credential must not discard a newer working one (a race between concurrent operations);
          and the user's credential store must not be touched for a credential it never held.
        tests:
          - PackageCredentialCallback_Reject_SavedCredential_IsRemovedFromTheUsersStoreAndTheNextOperationPrompts
          - PackageCredentialCallback_Reject_SessionOnlyCredential_LeavesTheUsersStoreAlone
          - PackageCredentialCallback_Reject_CredentialReplacedMeanwhile_KeepsTheNewerCredential

      - id: AgentControl-PackageCredentialCallback-RegistersTypedSecret
        title: >-
          The PackageCredentialCallback class shall hold its own redaction lease on the credential
          its operation uses - a remembered session credential, taken atomically from the store, or
          one the user entered, from the moment it is entered - and shall end that lease when the
          operation ends (on commit, on rejection or on release), so that another operation
          forgetting the credential cannot end redaction while this operation still uses it, while
          a credential kept by the session store stays registered by the store.
        justification: |
          A password must be removable from any log line or message, including those written
          while the operation is still running, even when a concurrent operation's rejection
          forgets it from the store; but it must not stay tracked after no operation uses it.
        tests:
          - PackageCredentialCallback_PromptedCredential_IsRegisteredForRedactionUntilTheOperationEnds
          - PackageCredentialCallback_ConcurrentOperationRejectsCredential_ActiveOperationStaysRedactedUntilItEnds
          - PackageCredentialCallback_StoreClearedWhileOperationRuns_OperationStaysRedactedUntilItEnds
