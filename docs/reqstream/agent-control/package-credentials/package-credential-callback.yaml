---
# Software Unit Requirements for the PackageCredentialCallback Class
#
# PackageCredentialCallback answers a package client's requests for credentials during one
# operation against one server.

sections:
  - title: PackageCredentialCallback Unit Requirements
    requirements:
      - id: AgentControl-PackageCredentialCallback-ForeignOriginRefused
        title: >-
          The PackageCredentialCallback class shall answer a request for credentials for an
          address outside the server's origin with no credential, even when a credential is
          remembered for the server.
        justification: |
          A redirect or a link inside a feed can lead the package client to another host; that
          host must not receive the credential.
        tests:
          - PackageCredentialCallback_GetCredential_ForeignOrigin_ReturnsNullWithoutPrompting

      - id: AgentControl-PackageCredentialCallback-ForeignOriginNotPrompted
        title: >-
          The PackageCredentialCallback class shall not ask the user for a credential on behalf of
          an address outside the server's origin.
        justification: |
          Asking the user for a credential for a foreign host could be used to harvest one.
        tests:
          - PackageCredentialCallback_GetCredential_ForeignOrigin_ReturnsNullWithoutPrompting

      - id: AgentControl-PackageCredentialCallback-TierOrder
        title: >-
          The PackageCredentialCallback class shall answer a request from the server with the
          credential the user already entered during the session, when there is one, without
          asking the user.
        justification: |
          Using what the user already typed avoids repeated dialogs.
        tests:
          - PackageCredentialCallback_GetCredential_SessionCredentialStored_UsesItWithoutPrompting
          - PackageCredentialCallback_Callback_InvokedLikeTheNuGetLibraryDoes_AnswersFromTheStore

      - id: AgentControl-PackageCredentialCallback-PromptsWhenNothingKnown
        title: >-
          The PackageCredentialCallback class shall ask the user for the server's credential when
          neither the session nor the user's own credential store holds one and the user may be
          asked.
        justification: |
          A server that needs a sign-in the application does not know can only be reached by
          asking the user.
        tests:
          - PackageCredentialCallback_GetCredential_NothingStored_AsksTheUserForThatFeed

      - id: AgentControl-PackageCredentialCallback-PromptNamesServerAndSource
        title: >-
          The PackageCredentialCallback class shall tell the user which server, and which
          configured source, a requested credential is for.
        justification: |
          A user who is not told what the credential is for cannot decide whether to give it.
        tests:
          - PackageCredentialCallback_GetCredential_NothingStored_AsksTheUserForThatFeed

      - id: AgentControl-PackageCredentialCallback-PromptReportsRememberPossible
        title: >-
          The PackageCredentialCallback class shall tell the user whether a sign-in can be
          remembered on this computer, offering it only when the user's own credential store has a
          helper that can keep it.
        justification: |
          The option to remember is only honest when something can keep the credential.
        tests:
          - PackageCredentialCallback_GetCredential_Prompting_ReportsWhetherRememberingIsPossible
          - PackageCredentialCallback_GetCredential_NoUsersStore_PromptCannotRemember

      - id: AgentControl-PackageCredentialCallback-SilentNoCredential
        title: >-
          The PackageCredentialCallback class shall answer with no credential, without asking,
          when none is remembered and the user may not be asked.
        justification: |
          Background work that must not interrupt the user needs a way to proceed with only what is
          already known.
        tests:
          - PackageCredentialCallback_GetCredential_NoPromptAndNothingStored_ReturnsNull

      - id: AgentControl-PackageCredentialCallback-SavedCredentialLookup
        title: >-
          The PackageCredentialCallback class shall, when the session holds no credential for the
          server, look for a credential the user saved in their own credential store before asking
          the user, and answer with it without asking.
        justification: |
          A saved credential must work without a dialog or the saving would be pointless.
        tests:
          - PackageCredentialCallback_GetCredential_SavedCredentialExists_UsesItWithoutPrompting

      - id: AgentControl-PackageCredentialCallback-SavedCredentialLookupWhenSilent
        title: >-
          The PackageCredentialCallback class shall look for a credential the user saved in their
          own credential store also when it may not ask the user, without any user interface.
        justification: |
          Looking a saved credential up needs no dialog, so background work can use the sign-ins
          the user already saved.
        tests:
          - PackageCredentialCallback_GetCredential_SilentCallbackAndSavedCredential_UsesIt

      - id: AgentControl-PackageCredentialCallback-SavedCredentialLookupOnce
        title: >-
          The PackageCredentialCallback class shall look in the user's own credential store at
          most once per server per session, however many operations run at the same time.
        justification: |
          Reading a credential store costs time and must not be repeated for every operation.
        tests:
          - PackageCredentialCallback_GetCredential_NothingSaved_LooksUpOncePerSessionThenPrompts
          - PackageCredentialCallback_GetCredential_ConcurrentOperations_ShareOneLookup

      - id: AgentControl-PackageCredentialCallback-SessionCredentialSkipsLookup
        title: >-
          The PackageCredentialCallback class shall not consult the user's own credential store
          when the session already holds a credential for the server.
        justification: |
          A credential already in memory makes reading the user's credential store pointless and
          slow.
        tests:
          - PackageCredentialCallback_GetCredential_SessionCredentialExists_DoesNotConsultTheUsersStore

      - id: AgentControl-PackageCredentialCallback-FailedLookupFallsThroughToPrompt
        title: >-
          The PackageCredentialCallback class shall ask the user as usual when the look-up in the
          user's own credential store fails, without failing the operation.
        justification: |
          A credential store that is broken must not turn into a failed sign-in.
        tests:
          - PackageCredentialCallback_GetCredential_UsersStoreThrows_FallsThroughToPromptWithoutRememberOption

      - id: AgentControl-PackageCredentialCallback-FailedLookupDisablesRemember
        title: >-
          The PackageCredentialCallback class shall not offer to remember a sign-in on this
          computer in the prompt of an operation whose look-up in the user's own credential store
          failed, even when that store reports that it is available.
        justification: |
          A credential store that just failed cannot be trusted to keep a credential, so offering
          to remember would promise something that cannot be honored.
        tests:
          - PackageCredentialCallback_GetCredential_UsersStoreThrows_FallsThroughToPromptWithoutRememberOption
          - PackageCredentialCallback_GetCredential_LookupFailsWhileHelperAvailable_PromptCannotRemember

      - id: AgentControl-PackageCredentialCallback-AnswerMemoized
        title: >-
          The PackageCredentialCallback class shall ask the user at most once per operation
          however many requests or retries the operation makes.
        justification: |
          A package client retries a refused request; without a single remembered answer a wrong
          password would reopen the dialog in a loop.
        tests:
          - PackageCredentialCallback_GetCredential_SeveralChallenges_PromptsOnce

      - id: AgentControl-PackageCredentialCallback-DeclineMemoized
        title: >-
          The PackageCredentialCallback class shall remember a declined answer for the rest of the
          operation and not ask the user again.
        justification: |
          A user who declined must not be asked again by every retry of the package client.
        tests:
          - PackageCredentialCallback_GetCredential_UserDeclines_NullIsMemoizedAndNotAskedAgain

      - id: AgentControl-PackageCredentialCallback-ConcurrentRequestsSameAnswer
        title: >-
          The PackageCredentialCallback class shall give concurrent requests of one operation the
          same answer.
        justification: |
          The package client asks for several addresses at once; they must not each get their own
          dialog or a different credential.
        tests:
          - PackageCredentialCallback_GetCredential_SeveralChallenges_PromptsOnce

      - id: AgentControl-PackageCredentialCallback-CancellationStopsWaiting
        title: >-
          The PackageCredentialCallback class shall stop waiting for the user, by throwing an
          OperationCanceledException that is not recorded as a decline, when the operation is
          canceled.
        justification: |
          An abandoned dialog must not hold the operation forever, and a cancellation must not be
          reported as the user refusing to sign in.
        tests:
          - PackageCredentialCallback_GetCredential_CancelledWhilePrompting_ThrowsOperationCanceled

      - id: AgentControl-PackageCredentialCallback-CommitOnSuccess
        title: >-
          The PackageCredentialCallback class shall remember a credential the user entered for
          the rest of the session only when told that the operation succeeded.
        justification: |
          A credential typed wrongly must never be kept or reused; only a credential that worked
          is worth remembering.
        tests:
          - PackageCredentialCallback_Commit_PromptedCredential_IsStoredOnlyAfterCommit

      - id: AgentControl-PackageCredentialCallback-CommitStoresNothingWhenNoneEntered
        title: >-
          The PackageCredentialCallback class shall store nothing in the session when told that the
          operation succeeded and the user entered no credential.
        justification: |
          A credential that came from the session or from nowhere is already known or absent;
          committing must not invent an entry.
        tests:
          - PackageCredentialCallback_Commit_NothingPrompted_StoresNothing

      - id: AgentControl-PackageCredentialCallback-NullArgumentsRefused
        title: >-
          The PackageCredentialCallback class shall refuse a null constructor argument with an
          ArgumentNullException.
        justification: |
          A callback without its origin, source name or session store cannot scope or answer
          requests safely.
        tests:
          - PackageCredentialCallback_Constructor_NullArguments_Throw

      - id: AgentControl-PackageCredentialCallback-RememberOnRequest
        title: >-
          The PackageCredentialCallback class shall hand a credential the user entered to the
          user's own credential store only when the user chose to remember it and was told the
          operation succeeded.
        justification: |
          Saving is a decision the user makes for one credential, taken only once the credential
          is known to work.
        tests:
          - PackageCredentialCallback_Commit_RememberTicked_ApprovesInTheUsersStore

      - id: AgentControl-PackageCredentialCallback-RememberNeverUnchosen
        title: >-
          The PackageCredentialCallback class shall never hand a credential to the user's own
          credential store when the user did not choose to remember it.
        justification: |
          A credential the user did not choose to save must stay in the session only.
        tests:
          - PackageCredentialCallback_Commit_RememberNotTicked_NeverApproves

      - id: AgentControl-PackageCredentialCallback-UsersStoreFailureKeepsSessionCredential
        title: >-
          The PackageCredentialCallback class shall keep a credential for the session when the
          user's own credential store refuses or fails to keep it.
        justification: |
          The user's credential store is outside the application's control; its failure must cost
          the convenience of remembering, not the sign-in the user just typed.
        tests:
          - PackageCredentialCallback_Commit_UsersStoreRefusesOrFails_StillKeepsTheSessionCredential

      - id: AgentControl-PackageCredentialCallback-UsersStoreFailureDoesNotFailOperation
        title: >-
          The PackageCredentialCallback class shall not fail the operation when the user's own
          credential store refuses or fails to keep a credential.
        justification: |
          The operation succeeded; a failure of the user's credential store must not turn it into
          an error.
        tests:
          - PackageCredentialCallback_Commit_UsersStoreRefusesOrFails_StillKeepsTheSessionCredential

      - id: AgentControl-PackageCredentialCallback-RejectForgetsSessionCredential
        title: >-
          The PackageCredentialCallback class shall forget the server's remembered credential in
          the session when told that the server rejected the credential it supplied.
        justification: |
          A credential that stopped working must not be offered again.
        tests:
          - PackageCredentialCallback_Reject_SessionCredential_IsForgotten
          - PackageCredentialCallback_Reject_SavedCredential_IsRemovedFromTheUsersStoreAndTheNextOperationPrompts

      - id: AgentControl-PackageCredentialCallback-RejectForgetsExactSessionCredential
        title: >-
          The PackageCredentialCallback class shall, when told that the server rejected the
          credential it supplied, forget exactly that credential in the session and not a different
          one that another operation has stored for the server meanwhile.
        justification: |
          A late rejection of an old credential must not discard a newer working one (a race
          between concurrent operations).
        tests:
          - PackageCredentialCallback_Reject_CredentialReplacedMeanwhile_KeepsTheNewerCredential

      - id: AgentControl-PackageCredentialCallback-RejectRemovesSavedCredential
        title: >-
          The PackageCredentialCallback class shall, when told that the server rejected a
          credential that came from the user's own credential store, also remove it from there so
          the next operation asks the user.
        justification: |
          A saved credential that stopped working must not be offered again by the user's
          credential store.
        tests:
          - PackageCredentialCallback_Reject_SavedCredential_IsRemovedFromTheUsersStoreAndTheNextOperationPrompts

      - id: AgentControl-PackageCredentialCallback-RejectRemovesExactSavedCredential
        title: >-
          The PackageCredentialCallback class shall remove from the user's own credential store
          only the exact credential the server rejected, leaving a different credential saved
          there for the server meanwhile.
        justification: |
          A late rejection of an old credential must not discard a newer credential the user saved
          in the meantime.
        tests:
          - PackageCredentialCallback_Reject_SavedCredentialReplacedInUsersStoreMeanwhile_KeepsTheNewerCredentialThere

      - id: AgentControl-PackageCredentialCallback-RejectSessionOnlyLeavesUsersStoreAlone
        title: >-
          The PackageCredentialCallback class shall leave the user's own credential store alone
          when told that the server rejected a credential that was only a session credential.
        justification: |
          The user's credential store must not be touched for a credential it never held.
        tests:
          - PackageCredentialCallback_Reject_SessionOnlyCredential_LeavesTheUsersStoreAlone

      - id: AgentControl-PackageCredentialCallback-RegistersTypedSecret
        title: >-
          The PackageCredentialCallback class shall hold its own redaction lease on a credential
          the user entered from the moment it is entered.
        justification: |
          A password must be removable from any log line or message, including those written
          while the operation is still running.
        tests:
          - PackageCredentialCallback_PromptedCredential_IsRegisteredForRedactionUntilTheOperationEnds

      - id: AgentControl-PackageCredentialCallback-LeasesSessionCredential
        title: >-
          The PackageCredentialCallback class shall hold its own redaction lease on a remembered
          session credential its operation uses, taken in the same atomic step as finding the
          credential in the store.
        justification: |
          A credential found in the store must never be unprotected between being found and being
          leased.
        tests:
          - PackageCredentialCallback_ConcurrentOperationRejectsCredential_ActiveOperationStaysRedactedUntilItEnds
          - PackageCredentialCallback_StoreClearedWhileOperationRuns_OperationStaysRedactedUntilItEnds

      - id: AgentControl-PackageCredentialCallback-LeaseEndsWithOperation
        title: >-
          The PackageCredentialCallback class shall end its redaction lease on the credential its
          operation used when the operation ends, whether on commit, on rejection or on release.
        justification: |
          A secret must not stay tracked after no operation uses it.
        tests:
          - PackageCredentialCallback_PromptedCredential_IsRegisteredForRedactionUntilTheOperationEnds
          - PackageCredentialCallback_ConcurrentOperationRejectsCredential_ActiveOperationStaysRedactedUntilItEnds

      - id: AgentControl-PackageCredentialCallback-LeaseSurvivesForgetting
        title: >-
          The PackageCredentialCallback class shall keep the credential its operation uses
          redacted while that operation runs, even when another operation forgets the credential
          or the store is cleared.
        justification: |
          A concurrent operation's rejection or the exit-time clearing must not let a secret
          appear in clear text in what a still-running operation logs or throws.
        tests:
          - PackageCredentialCallback_ConcurrentOperationRejectsCredential_ActiveOperationStaysRedactedUntilItEnds
          - PackageCredentialCallback_StoreClearedWhileOperationRuns_OperationStaysRedactedUntilItEnds

      - id: AgentControl-PackageCredentialCallback-CommittedCredentialStaysRegistered
        title: >-
          The PackageCredentialCallback class shall leave a credential that the session store
          keeps after a commit registered for redaction by the store.
        justification: |
          A credential kept by the session must stay registered for redaction after the operation
          that typed it has ended.
        tests:
          - PackageCredentialCallback_PromptedCredential_IsRegisteredForRedactionUntilTheOperationEnds
