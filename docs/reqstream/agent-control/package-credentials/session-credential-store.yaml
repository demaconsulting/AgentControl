---
# Software Unit Requirements for the SessionCredentialStore Class
#
# SessionCredentialStore holds the credentials the user entered for package servers, in memory
# only, for the length of the session.

sections:
  - title: SessionCredentialStore Unit Requirements
    requirements:
      - id: AgentControl-SessionCredentialStore-InMemoryOnly
        title: >-
          The SessionCredentialStore class shall hold the credentials entered for package servers
          in memory only, keyed by server origin so that a credential is found only for the exact
          server it was entered for, shall replace the credential of a server that is entered
          again, and shall never contain or reveal a stored secret when the store is serialized.
        justification: |
          The store is the whole of the application's own credential memory; if it could be
          written out, or looked up by anything weaker than the server's origin, a credential
          could outlive the session or reach the wrong server.
        tests:
          - SessionCredentialStore_SetAndTryGet_SameOrigin_ReturnsTheCredential
          - SessionCredentialStore_TryGet_DifferentOrigin_ReturnsFalse
          - SessionCredentialStore_Set_ExistingOrigin_ReplacesTheCredential
          - SessionCredentialStore_Serialize_NeverContainsStoredSecret
          - SessionCredentialStore_NullArguments_Throw

      - id: AgentControl-SessionCredentialStore-ForgetAndClear
        title: >-
          The SessionCredentialStore class shall forget the credential of one server on request,
          leaving the credentials of other servers, and shall forget every credential when it is
          cleared.
        justification: |
          A credential that a server rejected must stop being used, and every credential must be
          dropped when the application exits.
        tests:
          - SessionCredentialStore_Forget_StoredOrigin_RemovesOnlyThatCredential
          - SessionCredentialStore_Clear_StoredCredentials_ForgetsAll
