---
# Software Unit Requirements for the SessionCredentialStore Class
#
# SessionCredentialStore holds the credentials the user entered for package servers, in memory
# only, for the length of the session.

sections:
  - title: SessionCredentialStore Unit Requirements
    requirements:
      - id: AgentControl-SessionCredentialStore-InMemoryOnly
        title: >-
          The SessionCredentialStore class shall hold the credentials entered for package servers
          in memory only, never containing or revealing a stored secret when the store is
          serialized or printed.
        justification: |
          The store is the whole of the application's own credential memory; if it could be
          written out, a credential could outlive the session.
        tests:
          - SessionCredentialStore_Serialize_NeverContainsStoredSecret

      - id: AgentControl-SessionCredentialStore-KeyedByOrigin
        title: >-
          The SessionCredentialStore class shall find a credential only for the exact server
          origin it was stored for, so that a different scheme, host or port finds nothing.
        justification: |
          A credential looked up by anything weaker than the server's origin could reach the wrong
          server.
        tests:
          - SessionCredentialStore_SetAndTryGet_SameOrigin_ReturnsTheCredential
          - SessionCredentialStore_TryGet_DifferentOrigin_ReturnsFalse

      - id: AgentControl-SessionCredentialStore-ReplaceOnSet
        title: >-
          The SessionCredentialStore class shall replace the credential of a server whose
          credential is stored again.
        justification: |
          A server holds one credential at a time; a newly entered credential must supersede the
          old one rather than coexist with it.
        tests:
          - SessionCredentialStore_Set_ExistingOrigin_ReplacesTheCredential

      - id: AgentControl-SessionCredentialStore-NullArgumentsRefused
        title: >-
          The SessionCredentialStore class shall refuse a null argument with an
          ArgumentNullException.
        justification: |
          A missing origin or credential is a programming error that must surface at the call
          rather than corrupt the store.
        tests:
          - SessionCredentialStore_NullArguments_Throw

      - id: AgentControl-SessionCredentialStore-ForgetAndClear
        title: >-
          The SessionCredentialStore class shall forget the credential of one server on request,
          leaving the credentials of other servers.
        justification: |
          A credential that a server rejected must stop being used without disturbing the sign-ins
          of other servers.
        tests:
          - SessionCredentialStore_Forget_StoredOrigin_RemovesOnlyThatCredential

      - id: AgentControl-SessionCredentialStore-ClearForgetsAll
        title: >-
          The SessionCredentialStore class shall forget every credential when it is cleared.
        justification: |
          Every credential must be dropped when the application exits.
        tests:
          - SessionCredentialStore_Clear_StoredCredentials_ForgetsAll

      - id: AgentControl-SessionCredentialStore-ForgetExactCredential
        title: >-
          The SessionCredentialStore class shall, when asked to forget a credential that a server
          rejected, remove the server's stored credential only if it is that same credential,
          leaving a different one that was stored for the server meanwhile.
        justification: |
          Concurrent operations on one server can each hold a different credential; a rejection
          of the old one arriving late must not discard the newer credential that works.
        tests:
          - SessionCredentialStore_ForgetExactCredential_OnlyRemovesTheSameCredential

      - id: AgentControl-SessionCredentialStore-RememberedOrigin
        title: >-
          The SessionCredentialStore class shall record whether a credential it holds came from the
          user's own credential store, and shall report that record for the credential.
        justification: |
          A rejected credential must be removed from the user's credential store only if it came
          from there, so the store must remember where each credential came from.
        tests:
          - SessionCredentialStore_FromRememberedStoreMark_FollowsTheCredential

      - id: AgentControl-SessionCredentialStore-RememberedOriginReplaced
        title: >-
          The SessionCredentialStore class shall replace the record of whether a credential came
          from the user's own credential store when a different credential is stored for the
          server.
        justification: |
          The record must never describe a different credential than the one held, or a credential
          that never came from the user's credential store could be removed from there.
        tests:
          - SessionCredentialStore_FromRememberedStoreMark_FollowsTheCredential

      - id: AgentControl-SessionCredentialStore-RememberedOriginDropped
        title: >-
          The SessionCredentialStore class shall drop the record of whether a credential came from
          the user's own credential store when the credential is forgotten.
        justification: |
          A stale record would mark the next credential stored for the server as saved by the
          user's credential store when it was not.
        tests:
          - SessionCredentialStore_FromRememberedStoreMark_FollowsTheCredential

      - id: AgentControl-SessionCredentialStore-RememberedLookupOnce
        title: >-
          The SessionCredentialStore class shall run the look-up of a server's saved credential
          in the user's own credential store once per server per session, giving every operation
          that asks at the same time, or later, the same single look-up.
        justification: |
          Reading a credential store takes time and can hit a slow keychain; several operations on
          one server must not each repeat it.
        tests:
          - SessionCredentialStore_EnsureRememberedLookup_RunsOncePerOrigin

      - id: AgentControl-SessionCredentialStore-RememberedLookupAfterClear
        title: >-
          The SessionCredentialStore class shall start a fresh look-up of a server's saved
          credential for an operation that asks after the store has been cleared, and shall store
          what that look-up finds as it would normally.
        justification: |
          Clearing the store ends the session's memory of every look-up; a look-up that started
          after the clear belongs to the new state and must not be discarded.
        tests:
          - SessionCredentialStore_EnsureRememberedLookup_RunsOncePerOrigin
          - SessionCredentialStore_EnsureRememberedLookup_LookupAfterClear_StartsFreshAndStoresNormally

      - id: AgentControl-SessionCredentialStore-RememberedLookupFaultSurfaced
        title: >-
          The SessionCredentialStore class shall surface a fault of a server's saved-credential
          look-up to every operation waiting for that look-up.
        justification: |
          Every waiter must learn that the look-up failed so that it can treat the user's
          credential store as unavailable instead of mistaking the failure for an empty result.
        tests:
          - SessionCredentialStore_EnsureRememberedLookup_LookupFaults_SurfacesToEveryCallerAndIsNotRepeated

      - id: AgentControl-SessionCredentialStore-RememberedLookupFaultNotRepeated
        title: >-
          The SessionCredentialStore class shall not repeat a server's saved-credential look-up
          that faulted, until the store is cleared.
        justification: |
          A broken credential store would otherwise be retried, and possibly slow every operation,
          for every request.
        tests:
          - SessionCredentialStore_EnsureRememberedLookup_LookupFaults_SurfacesToEveryCallerAndIsNotRepeated

      - id: AgentControl-SessionCredentialStore-ClearInvalidatesInFlightLookups
        title: >-
          The SessionCredentialStore class shall, when it is cleared, invalidate every
          saved-credential look-up still in flight, so that a credential such a look-up stores
          after the clear is discarded and not kept.
        justification: |
          Clearing the store at exit must not be undone by a look-up of the user's credential
          store that finishes late and would put a credential back in memory.
        tests:
          - SessionCredentialStore_EnsureRememberedLookup_ClearWhileLookupInFlight_LateSetIsDiscardedAndNotRedacted

      - id: AgentControl-SessionCredentialStore-DiscardedLookupSecretNotRegistered
        title: >-
          The SessionCredentialStore class shall not register with the secret redaction engine the
          secret of a credential discarded because its look-up was invalidated by a clear.
        justification: |
          A discarded credential is not held, so registering it would leave a secret tracked that
          nothing will ever withdraw.
        tests:
          - SessionCredentialStore_EnsureRememberedLookup_ClearWhileLookupInFlight_LateSetIsDiscardedAndNotRedacted

      - id: AgentControl-SessionCredentialStore-RegistersSecretsForRedaction
        title: >-
          The SessionCredentialStore class shall register the secret of every credential it holds
          with the secret redaction engine for as long as the credential is stored.
        justification: |
          Registering the exact secret values in use lets the redaction engine remove them from any
          text, whatever surrounds them.
        tests:
          - SessionCredentialStore_SetReplaceForgetAndClear_RegistersAndWithdrawsTheSecretForRedaction

      - id: AgentControl-SessionCredentialStore-WithdrawsSecretsForRedaction
        title: >-
          The SessionCredentialStore class shall withdraw the registration of a credential's secret
          with the secret redaction engine when the credential is replaced, forgotten or cleared.
        justification: |
          Withdrawing secrets that stop being used keeps the registry from growing and from
          altering unrelated text.
        tests:
          - SessionCredentialStore_SetReplaceForgetAndClear_RegistersAndWithdrawsTheSecretForRedaction

      - id: AgentControl-SessionCredentialStore-AcquireGivesRedactionLease
        title: >-
          The SessionCredentialStore class shall give a caller that looks a credential up a
          redaction lease of its own, taken in the same step as the look-up, that keeps the secret
          redacted until the caller disposes it, after the store has withdrawn its own registration.
        justification: |
          The caller's own lease keeps a credential redacted while the caller still uses it after
          another operation has made the store forget it.
        tests:
          - SessionCredentialStore_TryAcquire_LeaseOutlivesTheStoresOwnRegistrationUntilDisposed
