---
# Software Unit Requirements for the SettingsStore Class
#
# SettingsStore loads and saves the application's settings file (package sources,
# git/agent-tool overrides, recent-repos list, shell preference), and resolves the default
# configuration directory under the user's application-data folder.

sections:
  - title: SettingsStore Unit Requirements
    requirements:
      - id: AgentControl-SettingsStore-Load
        title: >-
          The SettingsStore class shall load previously saved settings, returning default
          settings when no settings file exists yet, and shall treat a settings file that
          explicitly sets a list (the package sources, the recent repos or a source's package
          IDs) to null as holding an empty list.
        justification: |
          A first-ever run of AgentControl has no settings file; the application must still
          start successfully with a well-defined default configuration rather than failing.
          A hand-edited or tool-written file with an explicit null must not crash startup either.
        tests:
          - SettingsStore_SaveThenLoad_RoundTripsAllFields
          - SettingsStore_Load_NoSettingsFile_ReturnsDefaults
          - SettingsStore_Load_ExplicitJsonNulls_NormalizedToEmptyCollections
          - SettingsStore_Load_NullSourcesWithLegacyPath_MigratesToDefaultZipSource

      - id: AgentControl-SettingsStore-Save
        title: >-
          The SettingsStore class shall save settings to the configuration directory,
          creating the directory when it does not yet exist, and shall reject a null settings
          value.
        justification: |
          The configuration directory may not exist yet on a first-ever run; save must not
          require the developer to manually create it.
        tests:
          - SettingsStore_Save_DirectoryDoesNotExist_CreatesDirectory
          - SettingsStore_Save_NullSettings_ThrowsArgumentNullException

      - id: AgentControl-SettingsStore-DefaultDirectory
        title: >-
          The SettingsStore class shall resolve a default configuration directory under the
          user's application-data folder.
        justification: |
          Provides a per-user, OS-conventional storage location for settings when no
          configuration-directory override has been supplied at startup.
        tests:
          - SettingsStore_GetDefaultConfigDirectory_ReturnsPathUnderApplicationData

      - id: AgentControl-SettingsStore-SourcesRoundTrip
        title: >-
          The SettingsStore class shall save and load the configured package sources with all
          of their fields (alias, type, location, package IDs and trust options).
        justification: |
          Source definitions are the user's configuration; any field lost across a restart would
          silently change which packages are offered or how they are checked.
        tests:
          - SettingsStore_SaveThenLoad_RoundTripsAllFields

      - id: AgentControl-SettingsStore-LegacySourceMigration
        title: >-
          The SettingsStore class shall, when loading a settings file whose only package source
          is the legacy single folder path, present it as a zip source named Default, shall let
          a configured source list take precedence over a legacy path, and shall save the
          sources rather than the legacy path.
        justification: |
          Users who configured the single package folder before multiple sources existed must
          keep their setup without any manual step, and the old field must not be written back
          where it could be mistaken for a second source.
        tests:
          - SettingsStore_Load_LegacyPackageSourcePath_MigratesToDefaultZipSource
          - SettingsStore_Load_SourcesAndLegacyPath_SourcesWin
          - SettingsStore_Save_LegacyPackageSourcePath_WritesSourcesNotLegacyField

      - id: AgentControl-SettingsStore-NoSecretsPersisted
        title: >-
          The SettingsStore class shall write no password, token or other secret to the
          settings file, whatever the configured sources contain, and shall refuse - writing
          nothing - to save a source whose location embeds a credential such as URL user
          information.
        justification: |
          The settings file is plain text under the user's profile; AgentControl must not store
          secrets there, so no credential can leak through a backup, a synced profile or a
          support attachment.
        tests:
          - SettingsStore_Save_FullyPopulatedSources_JsonContainsNoSecretLikeProperties
          - SettingsStore_Save_SourceLocationWithEmbeddedCredential_ThrowsAndWritesNothing
          - SettingsStore_Save_LegacyPackageSourcePathWithEmbeddedCredential_ThrowsAndWritesNothing

      - id: AgentControl-SettingsStore-AtomicSave
        title: >-
          The SettingsStore class shall replace the settings file atomically, so that a save
          leaves only the settings file holding the latest content and never a partial file or a
          stray temporary file.
        justification: |
          The settings file holds the user's whole configuration including the recent-repos list;
          a crash or full disk during a save must not leave it truncated.
        tests:
          - SettingsStore_Save_RepeatedSaves_LeavesOnlySettingsFileWithLatestContent

      - id: AgentControl-SettingsStore-Theme
        title: >-
          The SettingsStore class shall persist the user's theme choice (system default, light or
          dark) by name, shall read a settings file without the value as the system default, and
          shall read an unknown or invalid value as the system default instead of failing the
          load.
        justification: |
          Existing settings files have no theme value and must keep following the operating
          system; a mistyped or future value in the file must never keep the application from
          starting.
        tests:
          - SettingsStore_Load_NoThemeValue_DefaultsToSystem
          - SettingsStore_SaveThenLoad_Theme_RoundTripsByName
          - SettingsStore_Load_UnknownOrInvalidTheme_FallsBackToSystem

      - id: AgentControl-SettingsStore-RepoOrganization
        title: >-
          The SettingsStore class shall write a repo's group, a repo's chosen card color and the
          collapsed section names to the settings file only (omitting a group or color the repo
          does not have), shall read them back, shall read a missing, null or wrongly typed value
          as no group, the automatic color or an empty list - keeping the string entries of a
          damaged list - and shall repair stored group names: trimmed and cleaned, cut to 40
          characters, the built-in section names Favorites and Ungrouped read as no group, and
          names that differ only in letter case given one spelling.
        justification: |
          These values are personal and must not reach a repository; a hand-edited or damaged
          file must degrade to the plain list instead of keeping the application from starting,
          and a group needs exactly one name however its repos were recorded.
        tests:
          - SettingsStore_SaveThenLoad_GroupColorAndCollapsedGroups_RoundTrip
          - SettingsStore_Load_FileWithoutOrganizingValues_UsesDefaults
          - SettingsStore_Load_InvalidGroupOrColorType_ReadsAsNone
          - SettingsStore_Load_InvalidCollapsedGroups_KeepsOnlyCleanStrings
          - SettingsStore_Load_GroupNames_AreRepairedAndUnified
          - RepoGroupName_Normalize_CleansWhiteSpaceAndControlCharacters
          - RepoGroupName_Validate_ReportsEachProblem
          - RepoGroupName_Sanitize_RepairsStoredNames
          - RepoGroupName_DistinctNames_UnifiesCaseAndSorts
          - RepoGroupName_Canonicalize_AdoptsExistingSpelling
