---
# Software Unit Requirements for the SettingsStore Class
#
# SettingsStore loads and saves the application's settings file (package sources,
# git/agent-tool overrides, recent-repos list, shell preference), and resolves the default
# configuration directory under the user's application-data folder.

sections:
  - title: SettingsStore Unit Requirements
    requirements:
      - id: AgentControl-SettingsStore-Load
        title: >-
          The SettingsStore class shall load previously saved settings, returning default
          settings when no settings file exists yet, and shall treat a settings file that
          explicitly sets a list (the package sources, the recent repos or a source's package
          IDs) to null as holding an empty list.
        justification: |
          A first-ever run of AgentControl has no settings file; the application must still
          start successfully with a well-defined default configuration rather than failing.
          A hand-edited or tool-written file with an explicit null must not crash startup either.
        tests:
          - SettingsStore_SaveThenLoad_RoundTripsAllFields
          - SettingsStore_Load_NoSettingsFile_ReturnsDefaults
          - SettingsStore_Load_ExplicitJsonNulls_NormalizedToEmptyCollections
          - SettingsStore_Load_NullSourcesWithLegacyPath_MigratesToDefaultZipSource

      - id: AgentControl-SettingsStore-Save
        title: >-
          The SettingsStore class shall save settings to the configuration directory,
          creating the directory when it does not yet exist, and shall reject a null settings
          value.
        justification: |
          The configuration directory may not exist yet on a first-ever run; save must not
          require the developer to manually create it.
        tests:
          - SettingsStore_Save_DirectoryDoesNotExist_CreatesDirectory
          - SettingsStore_Save_NullSettings_ThrowsArgumentNullException

      - id: AgentControl-SettingsStore-DefaultDirectory
        title: >-
          The SettingsStore class shall resolve a default configuration directory under the
          user's application-data folder.
        justification: |
          Provides a per-user, OS-conventional storage location for settings when no
          configuration-directory override has been supplied at startup.
        tests:
          - SettingsStore_GetDefaultConfigDirectory_ReturnsPathUnderApplicationData

      - id: AgentControl-SettingsStore-SourcesRoundTrip
        title: >-
          The SettingsStore class shall save and load the configured package sources with all
          of their fields (alias, type, location, package IDs and trust options).
        justification: |
          Source definitions are the user's configuration; any field lost across a restart would
          silently change which packages are offered or how they are checked.
        tests:
          - SettingsStore_SaveThenLoad_RoundTripsAllFields

      - id: AgentControl-SettingsStore-LegacySourceMigration
        title: >-
          The SettingsStore class shall, when loading a settings file whose only package source
          is the legacy single folder path, present it as a zip source named Default, shall let
          a configured source list take precedence over a legacy path, and shall save the
          sources rather than the legacy path.
        justification: |
          Users who configured the single package folder before multiple sources existed must
          keep their setup without any manual step, and the old field must not be written back
          where it could be mistaken for a second source.
        tests:
          - SettingsStore_Load_LegacyPackageSourcePath_MigratesToDefaultZipSource
          - SettingsStore_Load_SourcesAndLegacyPath_SourcesWin
          - SettingsStore_Save_LegacyPackageSourcePath_WritesSourcesNotLegacyField

      - id: AgentControl-SettingsStore-NoSecretsPersisted
        title: >-
          The SettingsStore class shall write no password, token or other secret to the
          settings file, whatever the configured sources contain, and shall refuse - writing
          nothing - to save a source whose location embeds a credential such as URL user
          information.
        justification: |
          The settings file is plain text under the user's profile; AgentControl must not store
          secrets there, so no credential can leak through a backup, a synced profile or a
          support attachment.
        tests:
          - SettingsStore_Save_FullyPopulatedSources_JsonContainsNoSecretLikeProperties
          - SettingsStore_Save_SourceLocationWithEmbeddedCredential_ThrowsAndWritesNothing
          - SettingsStore_Save_LegacyPackageSourcePathWithEmbeddedCredential_ThrowsAndWritesNothing

      - id: AgentControl-SettingsStore-AtomicSave
        title: >-
          The SettingsStore class shall replace the settings file atomically, so that a save
          leaves only the settings file holding the latest content and never a partial file or a
          stray temporary file.
        justification: |
          The settings file holds the user's whole configuration including the recent-repos list;
          a crash or full disk during a save must not leave it truncated.
        tests:
          - SettingsStore_Save_RepeatedSaves_LeavesOnlySettingsFileWithLatestContent

      - id: AgentControl-SettingsStore-LockedFileTolerance
        title: >-
          The SettingsStore class shall, when another process briefly holds the settings file
          open so that it cannot be replaced, retry the replace a bounded number of times with a
          short back-off and then save normally, shall report a lock that outlasts the retries
          and any other failure as a failed save without retrying the other failures, and shall
          apply this to every write of the settings file, including the write-back made while
          loading.
        justification: |
          Virus scanners, search indexers and sync clients routinely open a file for a moment
          without allowing it to be replaced; a user must not see a "settings could not be saved"
          error, or lose a change, because of such a transient hold, while a real failure such as a
          full disk must still be reported at once. The wait is bounded because saves run on a
          background worker one at a time, and the next change, and closing the window, wait for
          the one in progress.
        tests:
          - SettingsStore_Save_ReplaceBrieflyLocked_RetriesAndSaves
          - SettingsStore_Save_ReplaceLockedBeyondRetries_ThrowsInvalidOperationAndCleansUp
          - SettingsStore_Save_NonTransientReplaceFailure_IsNotRetried
          - SettingsStore_Save_SettingsFileHeldOpenThenReleased_Saves
          - SettingsStore_Load_SeedWriteBrieflyLocked_RetriesAndPersistsSeededOrder

      - id: AgentControl-SettingsStore-Theme
        title: >-
          The SettingsStore class shall save the user's theme choice (system default, light or
          dark) by name and read it back.
        justification: |
          The theme is a per-user preference that must survive a restart, and a name rather than
          a number keeps the file readable and valid when the choices are reordered.
        tests:
          - SettingsStore_SaveThenLoad_Theme_RoundTripsByName

      - id: AgentControl-SettingsStore-ThemeDefaultsToSystem
        title: >-
          The SettingsStore class shall read a settings file that has no theme value as the
          system default.
        justification: |
          Existing settings files have no theme value and must keep following the operating
          system.
        tests:
          - SettingsStore_Load_NoThemeValue_DefaultsToSystem

      - id: AgentControl-SettingsStore-ThemeInvalidReadsAsSystem
        title: >-
          The SettingsStore class shall read an unknown or invalid theme value as the system
          default instead of failing the load.
        justification: |
          A mistyped or future value in the file must never keep the application from starting.
        tests:
          - SettingsStore_Load_UnknownOrInvalidTheme_FallsBackToSystem

      - id: AgentControl-SettingsStore-KeepShellOpen
        title: >-
          The SettingsStore class shall save the user's keep-shell-open choice as a boolean and
          read it back.
        justification: |
          The choice is a per-user preference that must survive a restart, and a plain boolean
          keeps the file readable.
        tests:
          - SettingsStore_SaveThenLoad_KeepShellOpen_RoundTrips

      - id: AgentControl-SettingsStore-KeepShellOpenDefaultsToOn
        title: >-
          The SettingsStore class shall read a settings file that has no keep-shell-open value
          as on.
        justification: |
          Existing settings files have no such value, and those users have always had the shell
          kept open.
        tests:
          - SettingsStore_Load_NoKeepShellOpenValue_DefaultsToOn

      - id: AgentControl-SettingsStore-KeepShellOpenInvalidReadsAsOn
        title: >-
          The SettingsStore class shall read a null or non-boolean keep-shell-open value as on
          instead of failing the load.
        justification: |
          A mistyped or damaged value in the file must never keep the application from starting.
        tests:
          - SettingsStore_Load_InvalidKeepShellOpenValue_ReadsAsOn

      - id: AgentControl-SettingsStore-RepoOrganization
        title: >-
          The SettingsStore class shall save a repo's group, a repo's chosen card color and the
          collapsed section names in the settings file and read them back.
        justification: |
          These values are personal choices that must survive a restart; they belong in the
          user's own settings file and must not reach a repository.
        tests:
          - SettingsStore_SaveThenLoad_GroupColorAndCollapsedGroups_RoundTrip

      - id: AgentControl-SettingsStore-RepoOrganizationOmitsUnset
        title: >-
          The SettingsStore class shall write nothing for a repo's group or card color when the
          repo has none.
        justification: |
          A repo without a group or a chosen color must leave the file as plain as before these
          choices existed.
        tests:
          - SettingsStore_SaveThenLoad_GroupColorAndCollapsedGroups_RoundTrip

      - id: AgentControl-SettingsStore-RepoOrganizationDefaults
        title: >-
          The SettingsStore class shall read a settings file written before groups, card colors
          and collapsed sections existed as no group, the automatic color and nothing collapsed.
        justification: |
          Existing settings files must load unchanged with the plain list.
        tests:
          - SettingsStore_Load_FileWithoutOrganizingValues_UsesDefaults

      - id: AgentControl-SettingsStore-InvalidGroupOrColorReadsAsNone
        title: >-
          The SettingsStore class shall read a repo's group or card color that is null or of the
          wrong type as none, without disturbing the values after it.
        justification: |
          A hand-edited or damaged file must degrade to the plain list instead of keeping the
          application from starting.
        tests:
          - SettingsStore_Load_InvalidGroupOrColorType_ReadsAsNone

      - id: AgentControl-SettingsStore-InvalidCollapsedGroupsRepaired
        title: >-
          The SettingsStore class shall read a collapsed-sections value that is not a list of
          strings as an empty list, and shall keep only the clean, distinct string entries of a
          damaged list.
        justification: |
          A damaged list of collapsed sections must not keep the application from starting, and
          must not lose the entries that can still be understood.
        tests:
          - SettingsStore_Load_InvalidCollapsedGroups_KeepsOnlyCleanStrings

      - id: AgentControl-SettingsStore-GroupNamesRepaired
        title: >-
          The SettingsStore class shall repair every stored group name on load by the repo group
          name rules, so that a loaded group name is always a usable name and names that differ
          only in letter case are one group.
        justification: |
          A group exists only as the name stored on its repos, so a hand-edited or damaged file
          must never produce an unusable group or two look-alike groups; what a usable name is
          is decided by the repo group name rules, which the store only applies.
        tests:
          - SettingsStore_Load_GroupNames_AreRepairedAndUnified

      - id: AgentControl-SettingsStore-UnknownCardColorIsAutomatic
        title: >-
          The SettingsStore class shall read a card color name that is not one of the known card
          colors as the automatic color, so that a later save does not write it back.
        justification: |
          A mistyped color, or one from a newer version, must not stay in the settings where
          nothing can show it; the card then follows the automatic color again.
        tests:
          - SettingsStore_Load_UnknownCardColorName_ReadsAsAutomaticAndIsNotSavedBack

      - id: AgentControl-SettingsStore-RepoOrder
        title: >-
          The SettingsStore class shall save and load the repos in the sequence the user gave them,
          together with the marker that says the sequence is the user's own order.
        justification: |
          The user's order is the sequence of the repo list itself, so it survives a restart only if
          the store keeps the sequence, and the marker is what stops it from being arranged again.
        tests:
          - SettingsStore_SaveThenLoad_RepoOrder_RoundTripsInTheStoredSequence

      - id: AgentControl-SettingsStore-RepoOrderLegacySeed
        title: >-
          The SettingsStore class shall, when loading a file without the repo-order marker, arrange the
          repos once as favorites first, then the most recently launched with never launched repos
          last (repos with equal keys keeping their sequence), mark the result as the user's
          order and write the arrangement and the marker back to the file so it happens only once,
          without failing the load when that write fails; a file with the marker keeps its sequence.
        justification: |
          A file written before the order was stored lists the repos in the order they were added, not
          in the order the user saw; arranging it once keeps the list where it was without ever
          re-sorting an order the user made. Unless the result is written back, the next start would
          seed again from launch times that have since changed and cards could move.
        tests:
          - SettingsStore_Load_FileWithoutOrderMarker_SeedsFavoritesFirstThenMostRecentlyLaunched
          - SettingsStore_Load_FileWithoutOrderMarker_PersistsSeededOrderSoLaterLoadsDoNotReorder
          - SettingsStore_Load_FileWithoutOrderMarker_SeedWriteFails_LoadStillSucceedsAndFileIsUnchanged
          - SettingsStore_Load_FileWithOrderMarker_KeepsTheStoredSequence

      - id: AgentControl-SettingsStore-RepoOrderMarkerRepaired
        title: >-
          The SettingsStore class shall read a repo-order marker that is not a boolean as "not
          arranged yet", without failing the load or disturbing the values around it.
        justification: |
          A damaged or hand-edited marker must not keep the application from starting; the list is
          then simply arranged as for a file without the marker.
        tests:
          - SettingsStore_Load_InvalidOrderMarker_ReadsAsNotSeededAndSeeds

      - id: AgentControl-SettingsStore-GitSourceRoundTrip
        title: >-
          The SettingsStore class shall save and load a Git source with its repository address, tag
          pattern, sub-folder and single package ID, writing its type by name.
        justification: |
          A Git source is configured once and must survive restarts like every other source.
        tests:
          - SettingsStore_SaveThenLoad_GitSource_RoundTripsByNameWithoutSecretLikeProperties

      - id: AgentControl-SettingsStore-GitSourceRefusesCredential
        title: >-
          The SettingsStore class shall refuse to save a Git source whose address embeds a
          credential, without repeating it and without changing the saved file.
        justification: |
          The settings file must never become a place where an address with a secret is stored.
        tests:
          - SettingsStore_Save_GitSourceAddressWithCredential_IsRefusedWithoutChangingTheFile

      - id: AgentControl-SettingsStore-GroupColorsAndOrder
        title: >-
          The SettingsStore class shall save and load the color of each of the user's groups and the
          order of the groups, the colors found by group name ignoring letter case.
        justification: |
          Both are personal choices that must survive restarts.
        tests:
          - SettingsStore_SaveThenLoad_GroupColorsAndOrder_RoundTrip

      - id: AgentControl-SettingsStore-GroupColorsAndOrderDefaults
        title: >-
          The SettingsStore class shall read a settings file without group colors or a group order
          as no group colors and no stored order.
        justification: |
          A file written by an older version must load with the groups uncolored and alphabetical,
          as they were.
        tests:
          - SettingsStore_Load_FileWithoutGroupColorsOrOrder_ReadsAsNone

      - id: AgentControl-SettingsStore-InvalidGroupColorsAndOrderRepaired
        title: >-
          The SettingsStore class shall read group colors and a group order of the wrong kind as
          none, keep only their usable entries, drop a color the palette does not know (and not
          write it back), and keep one entry per group spelled as the group is.
        justification: |
          A damaged, hand-edited or newer file must never fail the load nor carry a value the
          application cannot use.
        tests:
          - SettingsStore_Load_DamagedGroupColorsAndOrder_KeepsOnlyUsableEntries
          - SettingsStore_Load_UnknownGroupColor_IsDroppedAndNotSavedBack

      - id: AgentControl-SettingsStore-StaleGroupSettingsDropped
        title: >-
          The SettingsStore class shall drop, on load, the color and the place in the order of a
          group that no repo is in and that is not part of the group hierarchy, and of a built-in
          section's name.
        justification: |
          A group exists only while a repo is in it; a choice left behind for a group that is gone
          must not come back on a new group of the same name.
        tests:
          - SettingsStore_Load_ColorAndOrderOfGroupWithoutRepos_AreDropped

      - id: AgentControl-SettingsStore-GroupParents
        title: >-
          The SettingsStore class shall save and load the hierarchy of the user's groups - which
          group is inside which, with an empty parent for a top-level group - the entries found by
          group name ignoring letter case.
        justification: |
          How the user nested their groups is a personal choice that must survive restarts.
        tests:
          - SettingsStore_SaveThenLoad_GroupParents_RoundTrip

      - id: AgentControl-SettingsStore-GroupParentsDefaults
        title: >-
          The SettingsStore class shall read a settings file without a group hierarchy as no
          hierarchy, so every group is top level in its stored order, and shall write an empty
          hierarchy back.
        justification: |
          A file written before groups nested must load with its groups as the flat list they
          were.
        tests:
          - SettingsStore_Load_FileWithoutGroupParents_ReadsEveryGroupAsTopLevel

      - id: AgentControl-SettingsStore-InvalidGroupParentsRepaired
        title: >-
          The SettingsStore class shall read a group hierarchy of the wrong kind as none, keep only
          its usable entries, drop an entry of a blank or built-in section name, read an unknown,
          self or built-in section parent as the top level (the group itself stays registered, as a
          top-level group, even with no repo in it), cut a cycle, and spell the groups as
          they are spelled, without changing the file on disk (the repair is what a later save
          writes), and a further save and load of the repaired settings shall change nothing.
        justification: |
          A damaged, hand-edited or newer file must never fail the load nor leave groups that
          cannot be shown, and must not be rewritten behind the user's back.
        tests:
          - SettingsStore_Load_UnknownSelfAndCyclicParents_AreRepairedOnLoad
          - SettingsStore_Load_DamagedHierarchy_DoesNotRewriteTheFile
          - SettingsStore_Load_DamagedHierarchyShapes_AreRepairedAndAFurtherLoadSaveIsAFixedPoint
          - SettingsStore_Load_ReservedAndBlankNamesInGroupParents_AreDropped
          - SettingsStore_Load_DamagedGroupParents_KeepsOnlyUsableEntries
          - SettingsStore_Load_GroupParentsInOtherLetterCase_AreSpelledLikeTheGroups

      - id: AgentControl-SettingsStore-RegisteredGroupKept
        title: >-
          The SettingsStore class shall keep, on load, a group that takes part in the hierarchy
          (with its color and place in the order) even when no repo is in it, while still dropping
          the color and place of a group that is neither in the hierarchy nor has a repo.
        justification: |
          A group the user created inside another group exists until they delete it; a choice left
          behind for a group that is gone must still not come back on a new group of the same name.
        tests:
          - SettingsStore_Load_RegisteredGroupWithoutRepos_SurvivesButUnregisteredIsDropped

      - id: AgentControl-SettingsStore-RefusesGuardedThread
        title: >-
          The SettingsStore class shall refuse a save made on a thread that is guarded against
          blocking calls, before anything is written, recording the refusal.
        justification: |
          A save writes the disk and can wait for about a second on a locked file; made on the
          window's UI thread it freezes the window. The tests guard that thread, so a settings save
          that slips back onto it fails them at once.
        tests:
          - SettingsStore_Save_OnGuardedThread_IsRefusedAndWritesNothing
