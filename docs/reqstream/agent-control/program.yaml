---
# Software Unit Requirements for the Program Class
#
# The Program unit is the application entry point: it parses the fixed set of startup
# arguments, initializes diagnostic logging, and hands off to Avalonia's classic desktop
# lifetime. Avalonia's App class (App.axaml.cs) has no dedicated unit test file (it is
# exercised only indirectly, via ProgramTests.Program_BuildAvaloniaApp_ReturnsConfiguredAppBuilder
# and end-to-end via the FlaUI UiTests project), so its bootstrap responsibility - loading
# settings and showing the main window once the desktop lifetime initializes - is documented
# here rather than as a separate unit, per sysml2-modeling.md's documented exception for units
# without a dedicated companion test file.

sections:
  - title: Program Unit Requirements
    requirements:
      - id: AgentControl-Program-Version
        title: The Program class shall expose the application's version string.
        justification: |
          The About dialog and diagnostic log entries both need a single, reliable source for
          the running build's version.
        tests:
          - Program_Version_ReturnsNonEmptyString

      - id: AgentControl-Program-Bootstrap
        title: >-
          The Program class shall parse startup arguments, initialize diagnostic logging, and
          configure the Avalonia application so that settings are loaded and the main window
          is shown.
        justification: |
          Diagnostic logging must be initialized before the Avalonia app builder runs so that
          even startup-time failures are captured on disk; the parsed startup options (config
          directory, git/agent-tool overrides) must reach App.OnFrameworkInitializationCompleted
          so it can load settings from the correct (possibly overridden) configuration
          directory before showing the main window.
        tests:
          - Program_BuildAvaloniaApp_ReturnsConfiguredAppBuilder

      - id: AgentControl-Program-ErrorHandling
        title: >-
          The Program class shall report a startup argument error to stderr and return a
          non-zero exit code without starting the UI.
        justification: |
          An invalid startup argument must fail fast with a clear message rather than allow
          the UI to start with unexpected/undefined behavior.
        tests:
          - Program_Main_WithInvalidArgument_ReturnsNonZeroExitCode
