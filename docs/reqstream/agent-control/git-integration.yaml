---
# GitIntegration Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl GitIntegration subsystem
# - GitIntegration spans GitClient.cs (invokes the configured git executable for status,
#   pull, branch, and committed-files queries and for stopping git tracking managed agent folders),
#   CommittedAgentFilesCache.cs (caches the
#   committed-agent-files-changed check keyed by HEAD commit hash), GitCredentialClient.cs
#   (keeps, finds and removes a package feed's sign-in in the user's own Git credential helper)
#   and GitRemoteClient.cs (runs git against a remote repository whose content and answers are
#   untrusted: lists its tags, fetches one tag, reads the tree and the raw blobs of a commit)
# - Subsystem requirements describe the observable git-derived status/actions surfaced on
#   each repo card, the use of the user's Git credential helper for saved sign-ins, and the
#   safe, bounded use of git against a remote repository

sections:
  - title: GitIntegration Subsystem Requirements
    requirements:
      - id: AgentControl-GitIntegration-PullGating
        title: >-
          The GitIntegration subsystem shall report whether a repo's working tree is clean, so
          pull can be gated on that state.
        justification: |
          Pull must only be offered when it cannot produce a merge conflict AgentControl
          cannot resolve automatically.
        children:
          - AgentControl-GitClient-CheckWorkingTree
        tests:
          - GitClient_IsWorkingTreeClean_CleanRepo_ReturnsTrue
          - GitClient_IsWorkingTreeClean_DirtyRepo_ReturnsFalse

      - id: AgentControl-GitIntegration-Pull
        title: >-
          The GitIntegration subsystem shall pull a repo's latest commits using the configured
          git executable, reporting success or failure without throwing.
        justification: |
          A pull failure (network issue, auth failure, no upstream) is a normal, expected
          outcome the UI must be able to display, not treat as an application error.
        children:
          - AgentControl-GitClient-Pull
        tests:
          - GitClient_Pull_Succeeds_ReturnsSucceededResult
          - GitClient_Pull_Fails_ReturnsNonSucceededResultWithoutThrowing

      - id: AgentControl-GitIntegration-DetectCommittedFiles
        title: >-
          The GitIntegration subsystem shall detect whether a repo has committed agent files
          (rather than only gitignored/local ones), caching the result per HEAD commit hash so
          repeated checks against an unchanged commit avoid re-invoking git.
        justification: |
          Surfaces the committed-agent-files-changed badge cheaply across frequent UI
          refreshes, since the underlying git query only needs to be redone when the repo's
          HEAD commit actually changes.
        children:
          - AgentControl-GitClient-DetectCommittedFiles
          - AgentControl-CommittedAgentFilesCache-Cache
          - AgentControl-GitClient-HeadHash
        tests:
          - GitClient_HasCommittedAgentFiles_LsFilesReportsFiles_ReturnsTrue
          - CommittedAgentFilesCache_SameRepoAndHash_ReturnsCachedValue

      - id: AgentControl-GitIntegration-UntrackAgentFolders
        title: >-
          The GitIntegration subsystem shall report which of a repo's managed agent folders have
          files tracked by git and shall stop git tracking chosen ones, leaving every file on disk
          and every other tracked path as it was.
        justification: |
          A repo that committed its agent folders can only be managed from a package once git no
          longer tracks them; this must be possible without deleting what the team committed and
          without touching anything else in the repo.
        children:
          - AgentControl-GitClient-ListTrackedAgentFolders
          - AgentControl-GitClient-UntrackAgentFolders
          - AgentControl-GitClient-RestoreAgentFolderTracking
          - AgentControl-GitClient-UntrackOnlyAgentFolders
        tests:
          - GitIntegrationSubsystem_CommittedAgentFolders_ReportedThenUntrackedWithoutTouchingFilesOrOtherPaths

      - id: AgentControl-GitIntegration-CurrentBranch
        title: >-
          The GitIntegration subsystem shall resolve a repo's current branch name for display
          on each repo card.
        justification: |
          The recent-repos list shows each repo's current git branch so a developer can tell
          at a glance which branch they last worked from, without opening a terminal.
        children:
          - AgentControl-GitClient-CurrentBranch
        tests:
          - GitClient_GetCurrentBranch_FastPathNormalBranch_ReturnsBranchNameWithoutInvokingGit

      - id: AgentControl-GitIntegration-SavedSignIns
        title: >-
          The GitIntegration subsystem shall, on request, find, keep and remove a package feed's
          sign-in using the user's own Git credential helper - so that the application never
          stores a secret itself - without ever letting Git or the helper ask the user anything,
          within a bounded time, without writing a secret to the log, and treating a missing Git
          or helper as "nothing saved" rather than as an error.
        justification: |
          A user who chooses to remember a sign-in expects it to be kept in the place their
          operating system protects secrets, which their Git credential helper already is;
          reusing it keeps secret storage out of the application, and the safeguards (never
          interactive, bounded, never logged) keep a stuck or chatty helper from hanging an
          operation or leaking what it is given.
        children:
          - AgentControl-GitCredentialClient-FillApproveReject
          - AgentControl-GitCredentialClient-HelperAvailability
          - AgentControl-GitCredentialClient-NeverInteractive
          - AgentControl-GitCredentialClient-BoundedTime
          - AgentControl-GitCredentialClient-UnavailableIsNotAnError
          - AgentControl-GitCredentialClient-SecretsNeverLogged
        tests:
          # Subsystem tests with the real git executable and an isolated credential store; they
          # are skipped only where git is not installed. The stub-git evidence (exact requests,
          # environment, time limit, log content) is in the GitCredentialClient unit tests and
          # covers the child requirements.
          - GitIntegrationSubsystem_SavedSignIn_KeptInOneSessionFoundInAnotherAndRemovedOnRequest
          - GitIntegrationSubsystem_SavedSignIn_ValueWithLineBreakIsNeverStoredButEqualsIs
          - GitIntegrationSubsystem_SavedSignIn_NoHelperConfigured_ReportsUnavailableAndNothingSaved

      - id: AgentControl-GitIntegration-RemoteGit
        title: >-
          The GitIntegration subsystem shall run git against a remote repository whose content and
          answers are untrusted - listing its tags without a clone, fetching exactly one tag
          shallow, reading the tree of a commit and the raw content of listed blobs.
        justification: |
          Package sources in Git repositories make the repository, and the remote that serves it,
          the source of what lands on a developer's machine; the operations a package source needs
          must be available without a clone or a checkout.
        children:
          - AgentControl-GitRemoteClient-ListTagsWithoutClone
          - AgentControl-GitRemoteClient-ListTagsLiteralArguments
          - AgentControl-GitRemoteClient-ListTagsKeepsWellFormedTags
          - AgentControl-GitRemoteClient-PeeledTags
          - AgentControl-GitRemoteClient-ShallowFetchExactTag
          - AgentControl-GitRemoteClient-FetchIntoHooklessRepository
          - AgentControl-GitRemoteClient-ReportFetchedCommit
          - AgentControl-GitRemoteClient-SafeTagNames
          - AgentControl-GitRemoteClient-IgnoreHostileServerTagNames
          - AgentControl-GitRemoteClient-RefuseUnsafeTagNameBeforeGit
          - AgentControl-GitRemoteClient-ListLayoutTree
          - AgentControl-GitRemoteClient-ListLayoutTreeRejectsEmptyPaths
          - AgentControl-GitRemoteClient-AcceptOnlyFullCommitId
          - AgentControl-GitRemoteClient-ReadBlobsWithoutCheckout
          - AgentControl-GitRemoteClient-ReadBlobsRawBytes
          - AgentControl-GitRemoteClient-ReadBlobsVerifyAnswers
          - AgentControl-GitRemoteClient-ReadBlobsBounded
        tests:
          # Subsystem test with the real git executable and a local repository: tags are listed
          # without a clone, one tag is fetched shallow and its tree read.
          - GitIntegrationSubsystem_RemoteClient_ListsFetchesOneTagAndRefusesOtherTransports
          - GitIntegrationSubsystem_RemoteClient_ReadsRawBlobsWithoutCheckoutFiltersOrConversion

      - id: AgentControl-GitIntegration-RemoteGitNoCodeExecution
        title: >-
          The GitIntegration subsystem shall run git against a remote repository so that nothing
          from the repository, the remote or the user's configuration can run code: no hooks, only
          the transport of the address, no submodules, no filter programs and no trace output.
        justification: |
          A repository, and the remote that serves it, are not trusted; none of it may run code on
          the machine, and every protection must be scoped to the command so that the user's own
          git configuration is neither relied on nor changed.
        children:
          - AgentControl-GitRemoteClient-NoHooks
          - AgentControl-GitRemoteClient-TransportAllowList
          - AgentControl-GitRemoteClient-NoSubmodules
          - AgentControl-GitRemoteClient-NoContentFilters
          - AgentControl-GitRemoteClient-SshBatchMode
          - AgentControl-GitRemoteClient-SshNonOpenSshUntouched
          - AgentControl-GitRemoteClient-CommandScopedConfiguration
          - AgentControl-GitRemoteClient-NoTraceVariables
          - AgentControl-GitRemoteClient-NeutralWorkingFolder
        tests:
          - GitIntegrationSubsystem_RemoteClient_ListsFetchesOneTagAndRefusesOtherTransports
          - GitIntegrationSubsystem_RemoteClient_ReadsRawBlobsWithoutCheckoutFiltersOrConversion

      - id: AgentControl-GitIntegration-RemoteGitNoBackgroundPrompt
        title: >-
          The GitIntegration subsystem shall run git against a remote repository for work the
          application started itself without any prompt: git cannot ask for a credential, and
          reports that a sign-in is needed instead.
        justification: |
          A sign-in window that opens by itself, or a background check that waits for input, would
          be a defect.
        children:
          - AgentControl-GitRemoteClient-NoPromptInBackground
        tests:
          - GitIntegrationSubsystem_RemoteClient_BackgroundWorkNeverPromptsWhileUserStartedWorkMay
          - GitIntegrationSubsystem_RemoteClient_PrivateRepositorySignInIsOnlyRequestedForUserStartedWork

      - id: AgentControl-GitIntegration-RemoteGitSignIn
        title: >-
          The GitIntegration subsystem shall leave the user's own sign-in (the credential manager,
          the askpass program, the SSH agent) free to ask the user when git runs against a remote
          repository for work the user started.
        justification: |
          The user's own tools already know how to sign in; work the user started is the moment a
          sign-in is expected.
        children:
          - AgentControl-GitRemoteClient-InteractiveWhenUserStarted
        tests:
          - GitIntegrationSubsystem_RemoteClient_BackgroundWorkNeverPromptsWhileUserStartedWorkMay
          - GitIntegrationSubsystem_RemoteClient_PrivateRepositorySignInIsOnlyRequestedForUserStartedWork

      - id: AgentControl-GitIntegration-RemoteGitBounded
        title: >-
          The GitIntegration subsystem shall run git against a remote repository within a time and
          output limit, stopping the whole process tree on a timeout or a cancellation and never
          hiding a process that could not be stopped.
        justification: |
          A stuck or silent git, or a hostile server that streams without end, must never hang the
          application or fill its memory.
        children:
          - AgentControl-GitRemoteClient-TimeoutAndCancel
          - AgentControl-GitRemoteClient-TimeoutReportedAsTimedOut
          - AgentControl-GitRemoteClient-CancellationReportedAsCancellation
          - AgentControl-GitRemoteClient-UnstoppedProcessReported
          - AgentControl-GitRemoteClient-OutputBoundedInBytes
        tests:
          - GitIntegrationSubsystem_RemoteClient_OldGitIsRefusedAndHungGitIsStoppedAtTheTimeLimit

      - id: AgentControl-GitIntegration-RemoteGitFailureReporting
        title: >-
          The GitIntegration subsystem shall report a failure of git against a remote repository
          classified (sign-in needed, not found, unreachable, host key, timed out, git missing)
          in one fixed sentence that repeats neither the address nor git's text, and shall keep
          the address and arguments out of its logs.
        justification: |
          Git's error text commonly repeats an address, a host or a local path that must not reach
          messages and logs, and the caller needs the class of the failure to act on it.
        children:
          - AgentControl-GitRemoteClient-FailureMessagesFixed
          - AgentControl-GitRemoteClient-SecretFreeLogs
          - AgentControl-GitRemoteClient-RefuseUnsafeCommandLineValues
          - AgentControl-GitRemoteClient-FailureClassification
          - AgentControl-GitRemoteClient-MissingGitExplained
        tests:
          - GitIntegrationSubsystem_RemoteClient_FailuresAreClassifiedAndTheirMessagesNeverRepeatThePath

      - id: AgentControl-GitIntegration-RemoteGitMinimumVersion
        title: >-
          The GitIntegration subsystem shall refuse a git that is older than the minimum it
          supports with a message that says what to do, before running any other command.
        justification: |
          An old git fails with an error that means nothing to the user; saying what is wrong and
          what to do is what makes the failure fixable.
        children:
          - AgentControl-GitRemoteClient-MinimumGitVersion
          - AgentControl-GitRemoteClient-MinimumGitVersionMessage
          - AgentControl-GitRemoteClient-UnreadableVersionNotBlocked
          - AgentControl-GitRemoteClient-MinimumGitVersionCheckedOnce
        tests:
          - GitIntegrationSubsystem_RemoteClient_OldGitIsRefusedAndHungGitIsStoppedAtTheTimeLimit
