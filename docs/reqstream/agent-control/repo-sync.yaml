---
# RepoSync Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl RepoSync subsystem
# - RepoSync spans PackageContentExtractor.cs (applies a package's managed folders - from a zip
#   or an unpacked folder package, via the content readers - to a repo, blind
#   delete-replace), PackageZipExtractor.cs (the zip-file entry point to it),
#   ReleaseNotesViewerViewModel.cs (backs the release-notes
#   dialog shown after a sync), and GitIgnoreEnsurer.cs (proactively ensures a repo's
#   .gitignore covers the four managed folders after a successful sync); the
#   ReleaseNotesViewerView .axaml has no dedicated test file and is folded into this
#   subsystem-level description
# - Subsystem requirements describe the observable behavior of syncing a repo's agent files
#   to a package's contents

sections:
  - title: RepoSync Subsystem Requirements
    requirements:
      - id: AgentControl-RepoSync-Sync
        title: >-
          The RepoSync subsystem shall replace a repo's managed agent-file folders with the
          contents of a package zip, and shall reject a zip file that is not a valid archive.
        justification: |
          Per architecture.md's "blind delete-replace sync" decision, agent files are
          entirely package-managed content, so a sync must fully replace the managed folders
          rather than attempt a partial merge; a corrupt/invalid zip must not damage the
          repo's existing files.
        children:
          - AgentControl-PackageZipExtractor-Extract
          - AgentControl-PackageZipExtractor-AllManagedFoldersExist
          - AgentControl-PackageContentExtractor-ZipOpenFailure
          - AgentControl-Utilities-SafePaths
        tests:
          - PackageZipExtractor_Extract_FreshRepo_CreatesManagedFoldersOnly
          - PackageZipExtractor_Extract_ExistingManagedFolder_ReplacesOldContents
          - PackageZipExtractor_Extract_InvalidZipFile_ThrowsInvalidOperationException

      - id: AgentControl-RepoSync-RefuseLinkedRepoFolders
        title: >-
          The RepoSync subsystem shall refuse to replace a repo's managed agent-file folders when
          the repo's .github folder or a managed folder is a symbolic link or junction (or is a
          file), or a package file's destination is a link, changing nothing inside or outside
          the repo.
        justification: |
          A repo can contain links the developer did not intend a sync to follow; replacing
          managed folders through one would delete or overwrite files outside the repository.
        children:
          - AgentControl-PackageZipExtractor-RefuseLinkedRepoFolders
          - AgentControl-PackageContentExtractor-RefuseLinkedRepoFolders
          - AgentControl-PackageContentExtractor-RefuseNonFolderRepoComponent
          - AgentControl-PackageContentExtractor-RefuseLinkedDestinationFile
          - AgentControl-PackageContentExtractor-ManagedFoldersExist
          - AgentControl-PackageContentExtractor-AcceptRepoRootThroughLink
        tests:
          - windows@RepoSync_Extract_GitHubFolderIsJunction_RefusesAndLeavesTargetUntouched
          - windows@RepoSync_Extract_ManagedFolderIsJunction_RefusesAndLeavesTargetUntouched
          - ubuntu@RepoSync_Extract_GitHubFolderIsSymlink_RefusesAndLeavesTargetUntouched
          - ubuntu@RepoSync_Extract_ManagedFolderIsSymlink_RefusesAndLeavesTargetUntouched

      - id: AgentControl-RepoSync-ReleaseNotes
        title: >-
          The RepoSync subsystem shall read a package's release notes from its zip without
          extracting the package, and shall display them to the user after a successful sync,
          using a placeholder message when the package has none.
        justification: |
          Per architecture.md's Scope, release notes must be surfaced immediately after an
          upgrade so the developer notices any migration steps, without requiring a full
          extraction just to preview them.
        children:
          - AgentControl-PackageZipExtractor-ReadReleaseNotes
          - AgentControl-ReleaseNotesViewerViewModel-Display
          - AgentControl-ReleaseNotesViewerViewModel-MarkdownParsing
        tests:
          - PackageZipExtractor_ReadReleaseNotes_EntryPresent_ReturnsContentWithoutExtracting
          - PackageZipExtractor_ReadReleaseNotes_NoEntry_ReturnsNull
          - ReleaseNotesViewerViewModel_Constructor_EmptyReleaseNotes_UsesPlaceholderMessage
          - ReleaseNotesViewer_BuildBlockTextBlock_HeadingBlock_RendersAllRunsBold
          - ReleaseNotesViewer_BuildBlockTextBlock_BodyBlock_OnlyBoldsMarkedRuns

      - id: AgentControl-RepoSync-GitIgnorePrevention
        title: >-
          The RepoSync subsystem shall ensure a repo's .gitignore covers the four managed
          agent-file folders after every successful sync, without disturbing any pre-existing
          .gitignore content.
        justification: |
          Prevents an agentic tool (or a developer) from accidentally committing
          package-managed agent files into a repo meant to keep them untracked, proactively -
          before an accidental commit can happen - as an additive, narrow exception to the
          otherwise purely advisory "Committed agent files" badge documented in
          architecture.md.
        children:
          - AgentControl-GitIgnoreEnsurer-Ensure
        tests:
          - GitIgnoreEnsurer_Ensure_MarkerAlreadyPresent_DoesNotModifyFile
          - GitIgnoreEnsurer_Ensure_NoGitIgnoreFile_CreatesFileWithManagedFoldersBlock
          - GitIgnoreEnsurer_Ensure_ExistingContentWithoutMarker_AppendsBlockPreservingExistingLines
          - GitIgnoreEnsurer_Ensure_ExistingContentEndsWithBlankLine_AppendsBlockWithoutExtraBlankLine
          - GitIgnoreEnsurer_Ensure_ExistingContentUsesCrLf_AppendsBlockWithCrLf
          - GitIgnoreEnsurer_Ensure_ExistingFileHasUtf8Bom_PreservesBomOnWrite
          - GitIgnoreEnsurer_Ensure_PathIsDirectory_ThrowsInvalidOperationException

      - id: AgentControl-RepoSync-AgentsMdTemplate
        title: >-
          The RepoSync subsystem shall read a package's optional root-level AGENTS.md
          template from its zip without extracting the package, and shall never extract that
          entry into any managed folder.
        justification: |
          Per the same root-level-entry convention as release-notes.md, a package may want to
          seed a repo with a starting AGENTS.md; the template must be readable for the
          LauncherUI subsystem to offer it, without ever being silently applied as part of the
          blind-delete-and-replace managed-folder sync.
        children:
          - AgentControl-PackageZipExtractor-ReadAgentsMdTemplate
        tests:
          - PackageZipExtractor_ReadAgentsMdTemplate_EntryPresent_ReturnsContentWithoutExtracting
          - PackageZipExtractor_ReadAgentsMdTemplate_NoEntry_ReturnsNull
          - PackageZipExtractor_Extract_FreshRepoWithAgentsMdEntry_DoesNotExtractAgentsMdRootEntry

      - id: AgentControl-RepoSync-SyncFromFolderPackage
        title: >-
          The RepoSync subsystem shall replace a repo's managed agent-file folders with the
          contents of an unpacked package folder (a NuGet package's content folder) exactly as
          it does for a package zip, reading its release notes and AGENTS.md template the same
          way, and shall refuse links and path traversal in the package before changing the
          repo.
        justification: |
          NuGet sources deliver their package as an unpacked folder in a shared cache; the repo
          must end up in the same state whichever package format delivered the agent files, and
          a cache that other tools can write to must be treated as untrusted input.
        children:
          - AgentControl-PackageContentExtractor-ExtractFromFolder
          - AgentControl-PackageContentExtractor-ReplaceManagedFolders
          - AgentControl-PackageContentExtractor-NoRootFilesCopied
          - AgentControl-PackageContentExtractor-PackageNeverModified
          - AgentControl-PackageContentExtractor-RejectMissingContentFolder
          - AgentControl-PackageContentExtractor-RejectLinksAndTraversal
          - AgentControl-PackageContentExtractor-RejectPathOutsideContent
          - AgentControl-PackageContentExtractor-RejectLinkedPackageFolder
          - AgentControl-PackageContentExtractor-RejectLinkedPackageDirectory
          - AgentControl-PackageContentExtractor-RejectLinkedPackageFile
          - AgentControl-PackageContentExtractor-RejectBrokenLink
          - AgentControl-PackageContentExtractor-ReadReleaseNotes
          - AgentControl-PackageContentExtractor-ReadAgentsMdTemplate
          - AgentControl-Utilities-SafePaths
        tests:
          - PackageContentExtractor_Extract_DirectoryPackageIntoFreshRepo_CreatesManagedFoldersOnly
          - PackageContentExtractor_Extract_ZipAndDirectoryWithSameContent_ProduceIdenticalRepoTrees
          - PackageContentExtractor_Extract_TraversalPathFromReader_ThrowsBeforeDeletingManagedFolders

      - id: AgentControl-RepoSync-ContentIdentity
        title: >-
          The RepoSync subsystem shall expose, for a package it reads, the content identity that
          the package's source supplied or computed for it, and for a zip package shall compute it
          from the very bytes that are extracted, so that what is recorded is always what was
          applied.
        justification: |
          An identity taken in a separate look at the package file could describe different bytes
          than the ones extracted if the file were replaced in between; computing it from the one
          open handle that is also read closes that window.
        children:
          - AgentControl-PackageContentExtractor-ReaderContentIdentity
          - AgentControl-PackageContentExtractor-ZipReaderReleasesHandleOnFailure
          - AgentControl-PackageContentExtractor-FolderReaderIdentity
          - AgentControl-PackageContentExtractor-FolderReaderNoIdentity
        tests:
          - ZipPackageContentReader_Open_ValidZip_ReportsSha256OfFileAndReadsEntries
          - DirectoryPackageContentReader_Open_WithAndWithoutIdentity_ReportsSuppliedIdentityOrNull

      - id: AgentControl-RepoSync-LayoutRoot
        title: >-
          The RepoSync subsystem shall be able to read a package from a folder whose root is the
          package layout - a checked-out Git repository - seeing only the managed agent folders and
          the two root files, never the repository's metadata or other content, and refusing any
          link that is part of the layout while ignoring links that are not.
        justification: |
          A Git package is delivered as a checked-out folder rather than a zip or a NuGet package;
          the same extraction rules must apply to it, and what a repository holds besides the
          package must not influence or leak into the repos that are synced.
        children:
          - AgentControl-PackageContentExtractor-ReadLayoutRoot
          - AgentControl-PackageContentExtractor-LayoutRootIdentity
          - AgentControl-PackageContentExtractor-RefuseMissingOrLinkedLayoutRoot
          - AgentControl-PackageContentExtractor-RefuseOutsideLayoutPaths
          - AgentControl-PackageContentExtractor-IgnoreLinksOutsideLayout
          - AgentControl-PackageContentExtractor-RefuseLinkInManagedFolder
          - AgentControl-PackageContentExtractor-RefuseLinkInPlaceOfGitHub
          - AgentControl-PackageContentExtractor-RefuseLinkInPlaceOfManagedFolder
          - AgentControl-PackageContentExtractor-RefuseLinkAsRootFile
          - AgentControl-PackageContentExtractor-ExcludeGitFolder
        tests:
          - DirectoryPackageContentReader_OpenLayoutRoot_ListsOnlyLayoutAndCarriesIdentity
          - DirectoryPackageContentReader_OpenLayoutRoot_PathOutsideLayout_IsRefused
