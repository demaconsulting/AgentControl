---
# Settings Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl Settings subsystem
# - Settings spans SettingsStore.cs (loads/saves application-wide settings), and the
#   AppSettings.cs/RecentRepo.cs/AgentToolKind.cs/ThemePreference.cs data types and the
#   RepoGroupName.cs rules helper, which are documented as supporting types of this subsystem
#   rather than as units of their own (RepoGroupName has its own RepoGroupNameTests.cs)
# - Subsystem requirements describe the observable behavior of persisting application-wide
#   preferences (package sources, git/agent tool overrides, recent repos, shell preference)

sections:
  - title: Settings Subsystem Requirements
    requirements:
      - id: AgentControl-Settings-Persistence
        title: >-
          The Settings subsystem shall persist application-wide settings to a configuration
          file, returning default settings when none has yet been saved, and shall resolve a
          default configuration directory under the user's application-data folder.
        justification: |
          The developer's package source path, tool preferences, and recent-repos list must
          survive across application restarts, and a first-ever run (with no existing
          settings file) must still produce a usable, non-null default configuration.
        children:
          - AgentControl-SettingsStore-Load
          - AgentControl-SettingsStore-Save
          - AgentControl-SettingsStore-DefaultDirectory
        tests:
          - SettingsStore_SaveThenLoad_RoundTripsAllFields
          - SettingsStore_Load_NoSettingsFile_ReturnsDefaults

      - id: AgentControl-Settings-PackageSources
        title: >-
          The Settings subsystem shall persist the list of configured package sources,
          shall migrate a legacy single package-source folder to a source named Default
          when no sources are configured, and shall never persist a password, token or other
          secret.
        justification: |
          Users configure several package sources side by side and expect the single folder
          they already configured to keep working; the settings file is plain text in the
          user's profile, so it must not be able to hold credentials.
        children:
          - AgentControl-SettingsStore-SourcesRoundTrip
          - AgentControl-SettingsStore-LegacySourceMigration
          - AgentControl-SettingsStore-NoSecretsPersisted
          - AgentControl-SettingsStore-AtomicSave
        tests:
          - SettingsStore_SaveThenLoad_RoundTripsAllFields
          - SettingsStore_Load_LegacyPackageSourcePath_MigratesToDefaultZipSource
          - SettingsStore_Save_FullyPopulatedSources_JsonContainsNoSecretLikeProperties

      - id: AgentControl-Settings-Appearance
        title: >-
          The Settings subsystem shall persist the user's theme choice, treating a missing or
          unrecognized value as the system default.
        justification: |
          The theme is a per-user preference that must survive restarts, and a settings file from
          an older or newer version must never prevent the application from starting.
        children:
          - AgentControl-SettingsStore-Theme
        tests:
          - SettingsStore_SaveThenLoad_Theme_RoundTripsByName
          - SettingsStore_Load_UnknownOrInvalidTheme_FallsBackToSystem

      - id: AgentControl-Settings-RepoOrganization
        title: >-
          The Settings subsystem shall persist, per repo and only in the user's own settings file,
          the user's group for the repo and the user's chosen card color, and, per user, which
          list sections are collapsed, and shall read missing, null or invalid values of these as
          "no group", the automatic color and "nothing collapsed" instead of failing the load.
        justification: |
          Groups, colors and collapsed sections are personal choices that must survive restarts
          but must not be shared through a repository; a settings file that is damaged, edited by
          hand or written by another version must never keep the application from starting.
        children:
          - AgentControl-SettingsStore-RepoOrganization
        tests:
          - SettingsStore_SaveThenLoad_GroupColorAndCollapsedGroups_RoundTrip
          - SettingsStore_Load_FileWithoutOrganizingValues_UsesDefaults
          - SettingsStore_Load_InvalidGroupOrColorType_ReadsAsNone
          - SettingsStore_Load_InvalidCollapsedGroups_KeepsOnlyCleanStrings
          - SettingsStore_Load_GroupNames_AreRepairedAndUnified
