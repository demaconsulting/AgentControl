---
# Settings Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl Settings subsystem
# - Settings spans SettingsStore.cs (loads/saves application-wide settings), and the
#   AppSettings.cs/RecentRepo.cs/AgentToolKind.cs/ThemePreference.cs data types, which are
#   documented as supporting types of this subsystem rather than as units of their own, and
#   RepoGroupName.cs, the rules for the names of the user's own repo groups, which is a unit
#   with its own requirements file (settings/repo-group-name.yaml), RepoGroupHierarchy.cs, the
#   rules for how those groups nest (settings/repo-group-hierarchy.yaml), and SettingsWriter.cs,
#   which writes settings snapshots in the background (settings/settings-writer.yaml)
# - Subsystem requirements describe the observable behavior of persisting application-wide
#   preferences (package sources, git/agent tool overrides, recent repos, shell preference,
#   keep-shell-open choice, color theme) and the user's own organizing choices (repo groups,
#   card colors, collapsed sections, group colors, group order and the group hierarchy)
# - The theme, keep-shell-open and organization requirements are evidenced by the Settings
#   subsystem tests (SettingsSubsystemTests.cs), which use the subsystem the way the
#   application does: saved by one session, loaded by the next; the unit requirements below
#   them carry the unit tests

sections:
  - title: Settings Subsystem Requirements
    requirements:
      - id: AgentControl-Settings-Persistence
        title: >-
          The Settings subsystem shall persist application-wide settings to a configuration
          file, returning default settings when none has yet been saved, and shall resolve a
          default configuration directory under the user's application-data folder.
        justification: |
          The developer's package source path, tool preferences, and recent-repos list must
          survive across application restarts, and a first-ever run (with no existing
          settings file) must still produce a usable, non-null default configuration.
        children:
          - AgentControl-SettingsStore-Load
          - AgentControl-SettingsStore-Save
          - AgentControl-SettingsStore-DefaultDirectory
        tests:
          - SettingsStore_SaveThenLoad_RoundTripsAllFields
          - SettingsStore_Load_NoSettingsFile_ReturnsDefaults

      - id: AgentControl-Settings-PackageSources
        title: >-
          The Settings subsystem shall persist the list of configured package sources,
          shall migrate a legacy single package-source folder to a source named Default
          when no sources are configured, and shall never persist a password, token or other
          secret.
        justification: |
          Users configure several package sources side by side and expect the single folder
          they already configured to keep working; the settings file is plain text in the
          user's profile, so it must not be able to hold credentials.
        children:
          - AgentControl-SettingsStore-SourcesRoundTrip
          - AgentControl-SettingsStore-LegacySourceMigration
          - AgentControl-SettingsStore-NoSecretsPersisted
          - AgentControl-SettingsStore-AtomicSave
          - AgentControl-SettingsStore-LockedFileTolerance
        tests:
          - SettingsStore_SaveThenLoad_RoundTripsAllFields
          - SettingsStore_Load_LegacyPackageSourcePath_MigratesToDefaultZipSource
          - SettingsStore_Save_FullyPopulatedSources_JsonContainsNoSecretLikeProperties

      - id: AgentControl-Settings-GitSourcePersistence
        title: >-
          The Settings subsystem shall persist a Git source - its repository address, tag
          pattern, optional sub-folder and single package ID, with its type written by name - and
          shall refuse to persist an address that embeds a credential, without repeating it and
          without changing the saved settings.
        justification: |
          A Git source is configured once and must survive restarts like every other source, and
          the settings file must never become a place where an address with a secret is stored.
        children:
          - AgentControl-SettingsStore-GitSourceRoundTrip
          - AgentControl-SettingsStore-GitSourceRefusesCredential
        tests:
          - Settings_GitSource_SurvivesSessionsAndAddressWithCredentialIsRefusedWithoutChangingTheFile

      - id: AgentControl-Settings-Appearance
        title: >-
          The Settings subsystem shall persist the user's theme choice, treating a missing or
          unrecognized value as the system default.
        justification: |
          The theme is a per-user preference that must survive restarts, and a settings file from
          an older or newer version must never prevent the application from starting.
        children:
          - AgentControl-SettingsStore-Theme
          - AgentControl-SettingsStore-ThemeDefaultsToSystem
          - AgentControl-SettingsStore-ThemeInvalidReadsAsSystem
        tests:
          - Settings_Appearance_ChosenThemeSurvivesSessionsAndDamagedValueReadsAsSystemDefault

      - id: AgentControl-Settings-KeepShellOpen
        title: >-
          The Settings subsystem shall persist the user's choice of keeping the shell open after
          the agent tool exits, and shall read a missing, null or invalid value as on instead of
          failing the load.
        justification: |
          The choice is a per-user preference that must survive restarts; a settings file from an
          older version has no value and must keep the shell open as before, and a damaged value
          must never keep the application from starting.
        children:
          - AgentControl-SettingsStore-KeepShellOpen
          - AgentControl-SettingsStore-KeepShellOpenDefaultsToOn
          - AgentControl-SettingsStore-KeepShellOpenInvalidReadsAsOn
        tests:
          - Settings_KeepShellOpen_ChosenValueSurvivesSessionsAndMissingOrDamagedValueReadsAsOn

      - id: AgentControl-Settings-RepoOrganization
        title: >-
          The Settings subsystem shall persist, per repo and only in the user's own settings file,
          the user's group for the repo and the user's chosen card color, and, per user, which
          list sections are collapsed, and shall read missing, null or invalid values of these as
          "no group", the automatic color and "nothing collapsed" instead of failing the load.
        justification: |
          Groups, colors and collapsed sections are personal choices that must survive restarts
          but must not be shared through a repository; a settings file that is damaged, edited by
          hand or written by another version must never keep the application from starting.
        children:
          - AgentControl-SettingsStore-RepoOrganization
          - AgentControl-SettingsStore-RepoOrganizationOmitsUnset
          - AgentControl-SettingsStore-RepoOrganizationDefaults
          - AgentControl-SettingsStore-InvalidGroupOrColorReadsAsNone
          - AgentControl-SettingsStore-InvalidCollapsedGroupsRepaired
          - AgentControl-SettingsStore-GroupNamesRepaired
          - AgentControl-SettingsStore-UnknownCardColorIsAutomatic
          - AgentControl-RepoGroupName-Normalize
          - AgentControl-RepoGroupName-NormalizeNothingLeft
          - AgentControl-RepoGroupName-AcceptsUsableName
          - AgentControl-RepoGroupName-RefusesBlankName
          - AgentControl-RepoGroupName-RefusesTooLongName
          - AgentControl-RepoGroupName-RefusesReservedNames
          - AgentControl-RepoGroupName-SanitizeStoredName
          - AgentControl-RepoGroupName-SanitizeCutsLongName
          - AgentControl-RepoGroupName-SanitizeReservedIsNoGroup
          - AgentControl-RepoGroupName-DistinctNames
          - AgentControl-RepoGroupName-DistinctNamesSorted
          - AgentControl-RepoGroupName-DistinctNamesLeaveOutNoGroup
          - AgentControl-RepoGroupName-CanonicalizeAdoptsExisting
          - AgentControl-RepoGroupName-CanonicalizeKeepsNewName
        tests:
          - Settings_RepoOrganization_GroupColorAndCollapsedSectionsSurviveSessionsInSettingsFileOnly
          - Settings_RepoOrganization_DamagedValuesFallBackAndNextSaveWritesCleanFile

      - id: AgentControl-Settings-RepoOrder
        title: >-
          The Settings subsystem shall persist the order of the repos only in the user's own settings
          file, shall arrange a file that holds no stored order once as favorites first and then the
          most recently launched, and shall read a damaged order marker as "not arranged yet"
          instead of failing the load.
        justification: |
          The order is a personal choice that must survive restarts but must not be shared through a
          repository; a user who upgrades must keep the order that was shown before it was stored,
          and a settings file that is damaged or written by another version must never keep the
          application from starting.
        children:
          - AgentControl-SettingsStore-RepoOrder
          - AgentControl-SettingsStore-RepoOrderLegacySeed
          - AgentControl-SettingsStore-RepoOrderMarkerRepaired
        tests:
          - SettingsSubsystem_RepoOrder_SurvivesSessionsAndSeedsALegacyFileOnce

      - id: AgentControl-Settings-GroupOrganization
        title: >-
          The Settings subsystem shall persist, per user and only in the user's own settings file, a
          color and a place in the order for each of the user's groups, found by group name ignoring
          letter case, shall read missing, null or invalid values of these as none, and shall drop
          unknown colors and the entries of groups that do not exist (no repo names them and they are
          not registered in the hierarchy).
        justification: |
          Group colors and the order of the groups are personal choices that must survive restarts
          but must not be shared through a repository; a damaged or hand-edited file must never keep
          the application from starting, and a choice left behind for a group that does not exist
          any more must not come back on a new group of the same name.
        children:
          - AgentControl-SettingsStore-GroupColorsAndOrder
          - AgentControl-SettingsStore-GroupColorsAndOrderDefaults
          - AgentControl-SettingsStore-InvalidGroupColorsAndOrderRepaired
          - AgentControl-SettingsStore-StaleGroupSettingsDropped
        tests:
          - SettingsSubsystem_GroupOrganization_ColorAndOrderSurviveSessionsAndDamagedOrStaleEntriesAreDropped

      - id: AgentControl-Settings-GroupHierarchy
        title: >-
          The Settings subsystem shall persist, per user and only in the user's own settings file,
          which of the user's groups is inside which, found by group name ignoring letter case,
          shall keep a group that takes part in the hierarchy until it is deleted even with no repo
          in it, shall read a file without a hierarchy as a flat list of top-level groups, and
          shall repair a missing, null, invalid, unknown, self-referencing or cyclic hierarchy
          instead of failing the load.
        justification: |
          Nesting groups by customer and then by project is a personal way of organizing that must
          survive restarts but must not be shared through a repository; a file written before
          groups nested must keep working as it did, and a damaged or hand-edited file must never
          keep the application from starting or leave groups that cannot be shown.
        children:
          - AgentControl-SettingsStore-GroupParents
          - AgentControl-SettingsStore-GroupParentsDefaults
          - AgentControl-SettingsStore-InvalidGroupParentsRepaired
          - AgentControl-SettingsStore-RegisteredGroupKept
          - AgentControl-RepoGroupHierarchy-ArrangeLevel
          - AgentControl-RepoGroupHierarchy-FlatListIsTopLevel
          - AgentControl-RepoGroupHierarchy-TreeOrder
          - AgentControl-RepoGroupHierarchy-Navigation
          - AgentControl-RepoGroupHierarchy-AnyDepth
          - AgentControl-RepoGroupHierarchy-RefusesLoops
          - AgentControl-RepoGroupHierarchy-PutInsideRegisters
          - AgentControl-RepoGroupHierarchy-PopKeepsSubgroups
          - AgentControl-RepoGroupHierarchy-PopForgetsGroup
          - AgentControl-RepoGroupHierarchy-RepairDropsUnusable
          - AgentControl-RepoGroupHierarchy-RepairRegistersParents
          - AgentControl-RepoGroupHierarchy-RepairCycles
        tests:
          - SettingsSubsystem_GroupHierarchy_NestedGroupsSurviveSessionsAndDamagedHierarchyIsRepaired

      - id: AgentControl-Settings-BackgroundWriter
        title: >-
          The Settings subsystem shall write the settings in the background without making its
          caller wait - one write at a time, a burst of changes written once with the newest state,
          and a confirmed write that tells its caller whether it succeeded - shall tell its caller,
          once per failure streak, when a background write fails, keeping the change to write it
          later, shall write what is waiting when asked, and shall refuse a settings save made on a
          thread guarded against blocking calls.
        justification: |
          Writing the settings file can take up to about a second when another program holds it; the
          window that saved on every click froze for that long. The guard lets the tests catch a
          settings save that slips back onto the UI thread.
        children:
          - AgentControl-SettingsWriter-Debounce
          - AgentControl-SettingsWriter-Serialize
          - AgentControl-SettingsWriter-ConfirmedSave
          - AgentControl-SettingsWriter-FailureReportedOnce
          - AgentControl-SettingsWriter-Flush
          - AgentControl-SettingsStore-RefusesGuardedThread
        tests:
          - SettingsSubsystem_BackgroundWriter_WritesNewestStateOffTheGuardedThread
