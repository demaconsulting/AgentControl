---
# Software Unit Requirements for the PackageZipExtractor Class
#
# PackageZipExtractor extracts a package zip's managed folders into a repo, fully replacing
# any existing managed-folder contents, and can read a package's release notes or optional
# root-level AGENTS.md template without extracting the archive.

sections:
  - title: PackageZipExtractor Unit Requirements
    requirements:
      - id: AgentControl-PackageZipExtractor-Extract
        title: >-
          The PackageZipExtractor class shall extract a package zip's managed folders into a
          repo, creating them when absent and replacing their prior contents when present;
          shall reject a file that is not a valid zip archive; shall not extract any zip entry
          that resolves outside the four managed folders, skipping it when it stays within the
          repo root and rejecting the whole extraction when it resolves outside the repo root,
          in either case without having deleted any pre-existing managed folder beforehand.
        justification: |
          Guarantees the repo's agent files are always an exact match for the pinned
          package's contents, whether this is the first extraction or replacing an older
          version, and fails clearly on a corrupt input rather than partially extracting it;
          a malicious or malformed zip entry (path-traversal/zip-slip) must never write
          outside a managed folder, and must never leave a repo with its existing managed
          folders deleted but the replacement files not applied.
        tests:
          - PackageZipExtractor_Extract_FreshRepo_CreatesManagedFoldersOnly
          - PackageZipExtractor_Extract_ExistingManagedFolder_ReplacesOldContents
          - PackageZipExtractor_Extract_InvalidZipFile_ThrowsInvalidOperationException
          - PackageZipExtractor_Extract_TraversalEntryWithinRepoRoot_DoesNotEscapeManagedFolders
          - PackageZipExtractor_Extract_EntryEscapesRepoRoot_ThrowsBeforeDeletingManagedFolders

      - id: AgentControl-PackageZipExtractor-RefuseLinkedRepoFolders
        title: >-
          The PackageZipExtractor class shall refuse to extract a package zip into a repo whose
          .github folder or a managed folder is a symbolic link or junction, changing nothing
          inside or outside the repo.
        justification: |
          The same protection applies whatever the package format: replacing managed folders
          through a link the developer did not intend a sync to follow would delete or overwrite
          files outside the repository, so the zip entry point must refuse exactly as the
          folder-package path does.
        tests:
          - windows@PackageZipExtractor_Extract_GitHubFolderIsJunction_RefusesAndLeavesTargetUntouched
          - windows@PackageZipExtractor_Extract_ManagedFolderIsJunction_RefusesAndLeavesTargetUntouched
          - ubuntu@PackageZipExtractor_Extract_GitHubFolderIsSymlink_RefusesAndLeavesTargetUntouched
          - ubuntu@PackageZipExtractor_Extract_ManagedFolderIsSymlink_RefusesAndLeavesTargetUntouched

      - id: AgentControl-PackageZipExtractor-AllManagedFoldersExist
        title: >-
          The PackageZipExtractor class shall report whether all of a repo's managed agent-file
          folders are present, returning false if any are missing.
        justification: |
          Used by the ensure-synced-before-launch check to decide whether a re-extraction is
          needed without re-scanning file contents.
        tests:
          - PackageZipExtractor_AllManagedFoldersExist_AllFourPresent_ReturnsTrue
          - PackageZipExtractor_AllManagedFoldersExist_SomeMissing_ReturnsFalse
          - PackageZipExtractor_AllManagedFoldersExist_NoneExist_ReturnsFalse

      - id: AgentControl-PackageZipExtractor-ReadReleaseNotes
        title: >-
          The PackageZipExtractor class shall read a package's release notes entry from its
          zip without extracting the archive, and shall return none when the package has no
          release notes entry.
        justification: |
          Lets the UI preview release notes for an upgrade candidate before committing to a
          full extraction.
        tests:
          - PackageZipExtractor_ReadReleaseNotes_EntryPresent_ReturnsContentWithoutExtracting
          - PackageZipExtractor_ReadReleaseNotes_NoEntry_ReturnsNull

      - id: AgentControl-PackageZipExtractor-ReadAgentsMdTemplate
        title: >-
          The PackageZipExtractor class shall read a package's optional root-level AGENTS.md
          template entry from its zip without extracting the archive, shall return none when
          the package has no such entry, and shall never extract a root-level AGENTS.md entry
          into any of the four managed folders.
        justification: |
          Lets the UI offer a starting AGENTS.md template to a repo that lacks one, mirroring
          the existing release-notes precedent, while keeping the entry out of the
          blind-delete-and-replace managed folders so it is never silently discarded on a
          later sync.
        tests:
          - PackageZipExtractor_ReadAgentsMdTemplate_EntryPresent_ReturnsContentWithoutExtracting
          - PackageZipExtractor_ReadAgentsMdTemplate_NoEntry_ReturnsNull
          - PackageZipExtractor_Extract_FreshRepoWithAgentsMdEntry_DoesNotExtractAgentsMdRootEntry
