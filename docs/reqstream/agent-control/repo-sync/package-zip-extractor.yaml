---
# Software Unit Requirements for the PackageZipExtractor Class
#
# PackageZipExtractor extracts a package zip's managed folders into a repo, fully replacing
# any existing managed-folder contents, and can read a package's release notes without
# extracting the archive.

sections:
  - title: PackageZipExtractor Unit Requirements
    requirements:
      - id: AgentControl-PackageZipExtractor-Extract
        title: >-
          The PackageZipExtractor class shall extract a package zip's managed folders into a
          repo, creating them when absent and replacing their prior contents when present, and
          shall reject a file that is not a valid zip archive.
        justification: |
          Guarantees the repo's agent files are always an exact match for the pinned
          package's contents, whether this is the first extraction or replacing an older
          version, and fails clearly on a corrupt input rather than partially extracting it.
        tests:
          - PackageZipExtractor_Extract_FreshRepo_CreatesManagedFoldersOnly
          - PackageZipExtractor_Extract_ExistingManagedFolder_ReplacesOldContents
          - PackageZipExtractor_Extract_InvalidZipFile_ThrowsInvalidOperationException

      - id: AgentControl-PackageZipExtractor-RejectsReparsePoints
        title: >-
          The PackageZipExtractor class shall refuse to extract into, or delete through, a
          managed folder that is reachable only through a reparse point (symlink/junction) -
          whether the repo root itself, an ancestor of a managed folder, the managed folder
          itself, or a directory nested inside it - throwing UnsafeRepositoryStateException
          and leaving the affected content untouched.
        justification: |
          Extract's blind-delete-and-replace sequence uses recursive filesystem operations
          that would otherwise follow a symlink/junction, letting a crafted or accidentally
          misconfigured link redirect a delete or write outside the intended repo root. This
          is treated as a distinct security concern (UnsafeRepositoryStateException, a
          dedicated InvalidOperationException subtype) rather than an ordinary extraction
          failure, so callers that must react differently to it can do so. Detection uses
          File.GetAttributes rather than Directory.Exists so a dangling link (whose target no
          longer exists) is still caught, and the managed-folder tree is fully preflighted for
          nested reparse points before any deletion begins, so a partial delete cannot occur
          before the guard fires.
        tests:
          - windows@PackageZipExtractor_Extract_ManagedFolderAncestorIsJunction_ThrowsAndDoesNotWriteThroughLink
          - windows@PackageZipExtractor_Extract_ManagedFolderAncestorIsJunctionWithExistingContent_DoesNotBlindDeleteThroughLink
          - windows@PackageZipExtractor_Extract_RepoRootIsJunction_ThrowsAndDoesNotWriteThroughLink
          - windows@PackageZipExtractor_Extract_ManagedFolderContainsNestedJunction_ThrowsAndDoesNotDeleteThroughLink
          - PackageZipExtractor_Extract_ManagedFolderAncestorIsDanglingLink_ThrowsAndDoesNotBypassGuard

      - id: AgentControl-PackageZipExtractor-AllManagedFoldersExist
        title: >-
          The PackageZipExtractor class shall report whether all of a repo's managed agent-file
          folders are present, returning false if any are missing, and shall also treat a
          managed folder as absent when it is only reachable through a reparse point
          (symlink/junction) repo root, ancestor, or the folder itself.
        justification: |
          Used by the ensure-synced-before-launch check to decide whether a re-extraction is
          needed without re-scanning file contents. Trusting a reparse-point-reached folder as
          "present" would let this check skip Extract entirely and let a launch proceed using
          files outside the repo root, bypassing Extract's own symlink/junction protections.
        tests:
          - PackageZipExtractor_AllManagedFoldersExist_AllFourPresent_ReturnsTrue
          - PackageZipExtractor_AllManagedFoldersExist_SomeMissing_ReturnsFalse
          - PackageZipExtractor_AllManagedFoldersExist_NoneExist_ReturnsFalse
          - windows@PackageZipExtractor_AllManagedFoldersExist_AncestorIsJunctionWithRealFolders_ReturnsFalse
          - windows@PackageZipExtractor_AllManagedFoldersExist_ManagedFolderItselfIsJunction_ReturnsFalse

      - id: AgentControl-PackageZipExtractor-ReadReleaseNotes
        title: >-
          The PackageZipExtractor class shall read a package's release notes entry from its
          zip without extracting the archive, and shall return none when the package has no
          release notes entry.
        justification: |
          Lets the UI preview release notes for an upgrade candidate before committing to a
          full extraction.
        tests:
          - PackageZipExtractor_ReadReleaseNotes_EntryPresent_ReturnsContentWithoutExtracting
          - PackageZipExtractor_ReadReleaseNotes_NoEntry_ReturnsNull
