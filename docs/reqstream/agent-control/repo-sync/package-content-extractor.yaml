---
# Software Unit Requirements for the PackageContentExtractor Class
#
# PackageContentExtractor applies a package's content (a zip file or an unpacked package
# folder) to a repo's managed agent folders with the same blind delete-and-replace sequence,
# path containment and link rules for every package format, and reads the package's
# release notes and AGENTS.md template. Each requirement states one observable behavior.
#
# Grouping note: AgentControl-PackageContentExtractor-RejectLinksAndTraversal and
# AgentControl-PackageContentExtractor-RefuseLinkedRepoFolders each name one criterion - an
# unsafe package, or a linked repo folder anywhere on the destination chain, is refused before
# anything is changed - that is verified at several positions; the positions that need their own
# evidence are separate requirements below.

sections:
  - title: PackageContentExtractor Unit Requirements
    requirements:
      # ---- Extracting a folder package ----
      - id: AgentControl-PackageContentExtractor-ExtractFromFolder
        title: >-
          The PackageContentExtractor class shall, for a package supplied as an unpacked folder,
          give a repo the same managed agent folders as the same content supplied as a zip
          package.
        justification: |
          NuGet packages are unpacked into a cache the user does not manage; agent files must
          reach the repo identically whatever the package format.
        tests:
          - PackageContentExtractor_Extract_DirectoryPackageIntoFreshRepo_CreatesManagedFoldersOnly
          - PackageContentExtractor_Extract_ZipAndDirectoryWithSameContent_ProduceIdenticalRepoTrees

      - id: AgentControl-PackageContentExtractor-ReplaceManagedFolders
        title: >-
          The PackageContentExtractor class shall delete a repo's old managed agent folders
          before copying the package's, so that no stale file from an earlier version remains.
        justification: |
          A package upgrade must leave exactly the package's files; a file the new version no
          longer ships must not linger in the repo.
        tests:
          - PackageContentExtractor_Extract_DirectoryPackageOverExistingFolder_ReplacesOldContents

      - id: AgentControl-PackageContentExtractor-NoRootFilesCopied
        title: >-
          The PackageContentExtractor class shall not copy root-level package files, such as the
          release notes or the AGENTS.md template, or anything else outside the managed agent
          folders into the repo.
        justification: |
          Release notes and the AGENTS.md template are offered to the user, not applied to the
          repo; silently writing them would overwrite files the developer owns.
        tests:
          - PackageContentExtractor_Extract_DirectoryPackageIntoFreshRepo_CreatesManagedFoldersOnly

      - id: AgentControl-PackageContentExtractor-PackageNeverModified
        title: >-
          The PackageContentExtractor class shall never modify the package folder it reads from.
        justification: |
          An unpacked NuGet package lives in a cache that other tools share; it must be left
          exactly as found.
        tests:
          - PackageContentExtractor_Extract_DirectoryPackage_NeverModifiesPackageFolder

      - id: AgentControl-PackageContentExtractor-RejectMissingContentFolder
        title: >-
          The PackageContentExtractor class shall reject a package folder that has no content
          folder when it is opened, naming the folder.
        justification: |
          A package with the wrong layout must never make a sync delete a repo's managed folders
          for nothing.
        tests:
          - DirectoryPackageContentReader_Open_NoContentFolder_ThrowsInvalidOperationException

      # ---- Rejecting an unsafe package ----
      - id: AgentControl-PackageContentExtractor-RejectLinksAndTraversal
        title: >-
          The PackageContentExtractor class shall reject an unsafe package - one with a file
          whose destination would fall outside the repo, or a folder package that contains a
          symbolic link, junction or other link among the files it would copy - before deleting
          anything from the repo.
        justification: |
          A package is untrusted input: a crafted path could write outside the repo and a link
          inside an unpacked package could redirect a read to an arbitrary file. Refusing it
          up front means a hostile package can neither escape nor leave the repo half upgraded.
        tests:
          - PackageContentExtractor_Extract_TraversalPathFromReader_ThrowsBeforeDeletingManagedFolders
          - ubuntu@PackageContentExtractor_Extract_SymlinkedFileInPackage_ThrowsBeforeDeletingManagedFolders
          # Directory junctions need no privilege on Windows, so the rejection has passing
          # evidence there too.
          - windows@PackageContentExtractor_Extract_JunctionInPackage_ThrowsBeforeDeletingManagedFolders

      - id: AgentControl-PackageContentExtractor-RefuseCaseCollision
        title: >-
          The PackageContentExtractor class shall refuse a package whose files for the managed
          folders include two paths that differ only in letter case, with a message that names both
          files, before deleting or writing anything in the repo.
        justification: |
          On a case-insensitive file system such files are one file, so the extracted content would
          depend on the order of the entries in the package; a package that cannot be applied
          unambiguously must not be applied, on any platform, and must leave the repo untouched.
        tests:
          - PackageContentExtractor_Extract_ZipWithPathsDifferingOnlyInCase_ThrowsBeforeDeletingManagedFolders
          - PackageContentExtractor_RejectCaseCollisions_OnlyWholePathsThatFoldTogetherAreRefused

      - id: AgentControl-PackageContentExtractor-RejectPathOutsideContent
        title: >-
          The PackageContentExtractor class shall refuse to read a package file outside the
          package's content folder.
        justification: |
          A crafted path such as a parent-directory reference could otherwise read any file the
          user can read.
        tests:
          - DirectoryPackageContentReader_OpenReadAndReadText_TraversalOrMissingPath_Rejected

      - id: AgentControl-PackageContentExtractor-RejectLinkedPackageFolder
        title: >-
          The PackageContentExtractor class shall reject a folder package whose package folder or
          content folder is itself a symbolic link, junction or other link, when it is opened.
        justification: |
          A linked package or content folder would redirect every read to wherever the link
          points.
        tests:
          - ubuntu@DirectoryPackageContentReader_Open_PackageFolderIsSymlink_ThrowsInvalidOperationException
          - ubuntu@DirectoryPackageContentReader_Open_ContentFolderIsSymlink_ThrowsInvalidOperationException
          - windows@DirectoryPackageContentReader_Open_PackageFolderIsJunction_ThrowsInvalidOperationException
          - windows@DirectoryPackageContentReader_Open_ContentFolderIsJunction_ThrowsInvalidOperationException

      - id: AgentControl-PackageContentExtractor-RejectLinkedPackageDirectory
        title: >-
          The PackageContentExtractor class shall reject a folder package in which a directory
          leading to a file is a symbolic link, junction or other link, whether the package is
          listed or a single file in it is read.
        justification: |
          A linked parent directory holding an ordinary file would otherwise redirect a read
          outside the package without the file itself looking like a link.
        tests:
          - ubuntu@DirectoryPackageContentReader_ListFiles_SymlinkedDirectoryInPackage_ThrowsInvalidOperationException
          - ubuntu@DirectoryPackageContentReader_OpenRead_LinkedParentDirectoryWithOrdinaryFile_ThrowsInvalidOperationException
          - windows@DirectoryPackageContentReader_ListFiles_JunctionInPackage_ThrowsInvalidOperationException
          - windows@DirectoryPackageContentReader_OpenRead_JunctionParentDirectoryWithOrdinaryFile_ThrowsInvalidOperationException

      - id: AgentControl-PackageContentExtractor-RejectLinkedPackageFile
        title: >-
          The PackageContentExtractor class shall reject a requested package file that is
          itself a symbolic link or other link.
        justification: |
          A link in place of release notes or a template would let a package make the
          application read an arbitrary file.
        tests:
          - ubuntu@DirectoryPackageContentReader_ReadText_SymlinkedReleaseNotes_ThrowsInvalidOperationException

      - id: AgentControl-PackageContentExtractor-RejectBrokenLink
        title: >-
          The PackageContentExtractor class shall reject a broken symbolic link or junction at a
          requested root-level package file like any other link, and not treat the file as
          missing.
        justification: |
          A link whose target does not exist is still a link a package author placed there;
          treating it as an absent file would hide it, and the target could be created later.
        tests:
          - ubuntu@DirectoryPackageContentReader_ReadText_BrokenFileSymlinkAtRoot_ThrowsInvalidOperationException

      # ---- Refusing a linked repo ----
      - id: AgentControl-PackageContentExtractor-RefuseLinkedRepoFolders
        title: >-
          The PackageContentExtractor class shall refuse to extract into a repo - deleting and
          writing nothing, and reporting a clear error - when the repo's .github folder, a
          managed agent folder or a folder on the path of a file to be written is a symbolic
          link or junction.
        justification: |
          Deleting and copying through a link in the repo would delete or write files outside
          the repository, wherever the link points; refusing before anything is changed keeps a
          sync from ever escaping the repo.
        tests:
          - windows@PackageContentExtractor_Extract_GitHubFolderIsJunction_RefusesAndLeavesTargetUntouched
          - windows@PackageContentExtractor_Extract_ManagedFolderIsJunction_RefusesAndLeavesTargetUntouched
          - windows@PackageContentExtractor_Extract_DestinationSubfolderIsJunction_RefusesAndLeavesTargetUntouched
          - ubuntu@PackageContentExtractor_Extract_GitHubFolderIsSymlink_RefusesAndLeavesTargetUntouched
          - ubuntu@PackageContentExtractor_Extract_ManagedFolderIsSymlink_RefusesAndLeavesTargetUntouched
          - ubuntu@PackageContentExtractor_Extract_DestinationSubfolderIsSymlink_RefusesAndLeavesTargetUntouched

      - id: AgentControl-PackageContentExtractor-RefuseNonFolderRepoComponent
        title: >-
          The PackageContentExtractor class shall refuse to extract into a repo - deleting and
          writing nothing - when a component of a managed agent folder's path or of a
          destination path exists but is a file rather than a folder.
        justification: |
          A file where a managed folder belongs makes the later copy fail after the other
          managed folders were already deleted, leaving the repo partially erased; refusing up
          front keeps a failed sync from destroying content.
        tests:
          - PackageContentExtractor_Extract_ManagedFolderIsAFile_RefusesBeforeDeletingAnything

      - id: AgentControl-PackageContentExtractor-RefuseLinkedDestinationFile
        title: >-
          The PackageContentExtractor class shall refuse to write a package file through a
          symbolic link or other reparse point found at the file's destination immediately
          before it is written.
        justification: |
          Creating a file follows a link at its destination, so a link planted there after the
          folder checks would let a package overwrite a file outside the repository.
        tests:
          - ubuntu@PackageContentExtractor_Extract_DestinationFileBecomesSymlink_RefusesAndLeavesTargetUntouched

      - id: AgentControl-PackageContentExtractor-ManagedFoldersExist
        title: >-
          The PackageContentExtractor class shall report that a repo's managed agent folders
          exist only when all four exist as ordinary folders, so that a linked managed folder is
          not treated as an existing one.
        justification: |
          A caller that skips syncing because the folders exist must fall through to the
          extraction, which refuses the link with a clear error, rather than trust a link.
        tests:
          - windows@PackageContentExtractor_AllManagedFoldersExist_ManagedFolderIsJunction_ReturnsFalse
          - ubuntu@PackageContentExtractor_AllManagedFoldersExist_ManagedFolderIsSymlink_ReturnsFalse
          - PackageContentExtractor_AllManagedFoldersExist_AllFoldersOrdinary_ReturnsTrue

      - id: AgentControl-PackageContentExtractor-AcceptRepoRootThroughLink
        title: >-
          The PackageContentExtractor class shall extract into a repo whose root itself is
          reached through a symbolic link or junction.
        justification: |
          A repo root reached through a link, such as a redirected user profile, is legitimate
          and must keep working; only folders at or below the repo root are checked.
        tests:
          - windows@PackageContentExtractor_Extract_RepoRootUnderJunction_Succeeds
          - ubuntu@PackageContentExtractor_Extract_RepoRootUnderSymlink_Succeeds

      # ---- Reading root-level files ----
      - id: AgentControl-PackageContentExtractor-ReadReleaseNotes
        title: >-
          The PackageContentExtractor class shall read a package's root-level release notes
          without copying them to disk, returning none when the package has no such file.
        justification: |
          Release notes are offered to the user, not applied to the managed folders, and must
          be available from a NuGet package's content folder exactly as from a zip's root.
        tests:
          - PackageContentExtractor_ReadReleaseNotes_DirectoryPackage_ReturnsContentOrNull

      - id: AgentControl-PackageContentExtractor-ReadAgentsMdTemplate
        title: >-
          The PackageContentExtractor class shall read a package's optional root-level AGENTS.md
          template without copying it to disk, returning none when the package has no such file.
        justification: |
          A package may offer a starting AGENTS.md for the user to adopt; it must be readable
          without being applied to the repo.
        tests:
          - PackageContentExtractor_ReadAgentsMdTemplate_DirectoryPackage_ReturnsContentOrNull

      # ---- Opening a zip package ----
      - id: AgentControl-PackageContentExtractor-ZipOpenFailure
        title: >-
          The PackageContentExtractor class shall report a zip package that cannot be opened
          because its path is invalid or unsupported as an error that names the zip, rather than
          letting a low-level path exception escape.
        justification: |
          Callers handle one kind of failure for a package that cannot be read; a path exception
          escaping from the operating system would bypass that handling and show the user a
          message that does not name the package.
        tests:
          - ZipPackageContentReader_Open_InvalidPath_ThrowsInvalidOperationException

      # ---- Content identity of the package that was read ----
      - id: AgentControl-PackageContentExtractor-ReaderContentIdentity
        title: >-
          The zip package reader shall report, as the content identity of the zip, the identity of
          the agent files that its entries hold - not of the zip file - computed from the same open
          handle its entries are read from.
        justification: |
          The identity recorded in a repo's pin must describe the files that were actually
          extracted, and not depend on how they were compressed or ordered in the zip; an identity
          taken in a separate look at the file could describe other files if the file were replaced
          in between.
        tests:
          - ZipPackageContentReader_Open_ValidZip_ReportsFilesIdentityAndReadsEntries

      - id: AgentControl-PackageContentExtractor-ZipReaderReleasesHandleOnFailure
        title: >-
          The zip package reader shall release the file handle it holds when opening the zip fails.
        justification: |
          The identity and the entries share one handle; a handle that leaks on a failed open would
          keep the user's package file locked.
        tests:
          - ZipPackageContentReader_Open_NotAZip_ReleasesFileHandle

      - id: AgentControl-PackageContentExtractor-FolderReaderIdentity
        title: >-
          The folder package reader shall report, as its content identity, the identity of the
          agent files in the folder, so that an unpacked package folder, a layout folder and a zip
          with the same agent files report the same identity, and shall report no source revision
          unless its opener supplied one.
        justification: |
          The identity recorded in a repo's pin must describe the files that were extracted, so
          that the same files from any kind of source are recognized as the same; a plain folder
          has no revision of its own.
        tests:
          - DirectoryPackageContentReader_Open_FolderFiles_ReportsFilesIdentityAndNoRevision

      # ---- Package layout in the root of a folder (Git packages) ----
      - id: AgentControl-PackageContentExtractor-ReadLayoutRoot
        title: >-
          The folder package reader shall be able to read a folder whose root is the package layout
          (for example the files of a Git package), listing and reading only the four managed agent
          folders and the two root files.
        justification: |
          A folder that holds a package holds many things that are not the package; the extractor
          must see only the layout.
        tests:
          - DirectoryPackageContentReader_OpenLayoutRoot_ListsOnlyLayoutAndCarriesRevision

      - id: AgentControl-PackageContentExtractor-LayoutRootIdentity
        title: >-
          The folder package reader, when reading a layout root, shall report the source revision
          its opener supplied, or none when none was supplied, and the same identity of the agent
          files whether or not a revision was supplied.
        justification: |
          A Git package is identified by the commit it was fetched at, which only its opener knows;
          that commit is kept apart from the identity of the files, which must not depend on it.
        tests:
          - DirectoryPackageContentReader_OpenLayoutRoot_WithAndWithoutRevision_ReportsSuppliedRevisionOrNull

      - id: AgentControl-PackageContentExtractor-ManagedPackagePath
        title: >-
          The PackageContentExtractor class shall say, for a path in a package, whether extraction
          would write the file into one of the managed agent folders and under which canonical path,
          and shall refuse a path that extraction would refuse.
        justification: |
          Whatever vouches for the files a package delivers - its content identity - must cover
          exactly the files that end up in a repo; asking the extractor's own rule, instead of
          repeating it, keeps the two from drifting apart.
        tests:
          - PackageContentExtractor_GetManagedPackagePath_ManagedAndOtherPaths_ReportsCanonicalPathOrNull
          - PackageContentExtractor_GetManagedPackagePath_PathEscapingPackage_ThrowsInvalidOperationException

      - id: AgentControl-PackageContentExtractor-RefuseMissingOrLinkedLayoutRoot
        title: >-
          The folder package reader shall refuse to open a layout root that does not exist or that
          is a link.
        justification: |
          A link in place of the layout folder could make the extractor read content from
          anywhere; a missing folder is a failed fetch that must be reported, not read as empty.
        tests:
          - DirectoryPackageContentReader_OpenLayoutRoot_MissingFolderOrLink_ThrowsInvalidOperationException

      - id: AgentControl-PackageContentExtractor-RefuseOutsideLayoutPaths
        title: >-
          The folder package reader, when reading a layout root, shall refuse any path outside the
          layout, including a path that starts in the layout and climbs out of it.
        justification: |
          The extractor must not be talked into reading the repository's other files or its
          metadata.
        tests:
          - DirectoryPackageContentReader_OpenLayoutRoot_PathOutsideLayout_IsRefused

      - id: AgentControl-PackageContentExtractor-IgnoreLinksOutsideLayout
        title: >-
          The folder package reader, when reading a layout root, shall neither inspect nor refuse a
          link that is not part of the layout.
        justification: |
          A link that is not copied cannot hurt, and refusing it would reject good packages because
          of unrelated files.
        tests:
          - windows@DirectoryPackageContentReader_OpenLayoutRoot_JunctionOutsideLayoutIgnoredInsideLayoutRefused
          - ubuntu@DirectoryPackageContentReader_OpenLayoutRoot_SymlinkOutsideLayoutIgnoredInsideLayoutRefused

      - id: AgentControl-PackageContentExtractor-RefuseLinkInManagedFolder
        title: >-
          The folder package reader, when reading a layout root, shall refuse a link to a file
          inside a managed folder.
        justification: |
          A link inside what is copied could redirect a read outside the package.
        tests:
          - ubuntu@DirectoryPackageContentReader_OpenLayoutRoot_SymlinkFileInManagedFolder_IsRefused

      - id: AgentControl-PackageContentExtractor-RefuseLinkInPlaceOfGitHub
        title: >-
          The folder package reader, when reading a layout root, shall refuse a link standing in
          place of the .github folder itself.
        justification: |
          A linked .github folder would make every managed folder below it come from outside the
          package.
        tests:
          - windows@DirectoryPackageContentReader_OpenLayoutRoot_JunctionReplacingGitHubFolder_IsRefused
          - ubuntu@DirectoryPackageContentReader_OpenLayoutRoot_SymlinkReplacingGitHubFolder_IsRefused

      - id: AgentControl-PackageContentExtractor-RefuseLinkInPlaceOfManagedFolder
        title: >-
          The folder package reader, when reading a layout root, shall refuse a link standing in
          place of a managed folder.
        justification: |
          A linked managed folder would make its content come from outside the package.
        tests:
          - windows@DirectoryPackageContentReader_OpenLayoutRoot_JunctionReplacingManagedFolder_IsRefused
          - ubuntu@DirectoryPackageContentReader_OpenLayoutRoot_SymlinkReplacingManagedFolder_IsRefused

      - id: AgentControl-PackageContentExtractor-RefuseLinkAsRootFile
        title: >-
          The folder package reader, when reading a layout root, shall refuse a link standing in
          place of a root file (the release notes or the AGENTS.md template).
        justification: |
          A linked root file would read a file from outside the package into the synced repo.
        tests:
          - ubuntu@DirectoryPackageContentReader_OpenLayoutRoot_SymlinkAsRootFile_IsRefused

      - id: AgentControl-PackageContentExtractor-ExcludeGitFolder
        title: >-
          The folder package reader, when reading a layout root, shall never list or read a .git
          folder or any other path outside the layout.
        justification: |
          A repository's metadata is not part of a package and must not be copied into
          another repository.
        tests:
          - DirectoryPackageContentReader_OpenLayoutRoot_ListsOnlyLayoutAndCarriesRevision
          - DirectoryPackageContentReader_OpenLayoutRoot_PathOutsideLayout_IsRefused
