---
# Software Unit Requirements for the PackageContentExtractor Class
#
# PackageContentExtractor applies a package's content (a zip file or an unpacked package
# folder) to a repo's managed agent folders with the same blind delete-and-replace sequence,
# path containment and link rules for every package format, and reads the package's
# release notes and AGENTS.md template.

sections:
  - title: PackageContentExtractor Unit Requirements
    requirements:
      - id: AgentControl-PackageContentExtractor-ExtractFromFolder
        title: >-
          The PackageContentExtractor class shall, for a package supplied as an unpacked folder,
          replace a repo's managed agent folders with the package's managed folders exactly as it
          does for a zip package - deleting the old folders first and never copying root-level
          files such as release notes or the AGENTS.md template - and shall never modify the
          package it reads from.
        justification: |
          NuGet packages are unpacked into a cache the user does not manage and that other
          tools share; agent files must reach the repo identically whatever the package format,
          and the cache must be left exactly as found.
        tests:
          - PackageContentExtractor_Extract_DirectoryPackageIntoFreshRepo_CreatesManagedFoldersOnly
          - PackageContentExtractor_Extract_DirectoryPackageOverExistingFolder_ReplacesOldContents
          - PackageContentExtractor_Extract_DirectoryPackage_NeverModifiesPackageFolder
          - PackageContentExtractor_Extract_ZipAndDirectoryWithSameContent_ProduceIdenticalRepoTrees
          - DirectoryPackageContentReader_Open_NoContentFolder_ThrowsInvalidOperationException

      - id: AgentControl-PackageContentExtractor-RejectLinksAndTraversal
        title: >-
          The PackageContentExtractor class shall reject, before deleting anything from the
          repo, any package file whose destination would fall outside the repo and any
          symbolic link, junction or other link in a folder package - at the package folder,
          at its content folder, at any directory leading to a file, or at the file itself -
          and shall refuse to read package files outside the package's content folder.
        justification: |
          A package is untrusted input: a crafted path could write outside the repo, and a link
          inside an unpacked package could redirect a read to an arbitrary file, so both must
          be refused up front so that a hostile package can neither escape nor leave the repo
          half upgraded.
        tests:
          - PackageContentExtractor_Extract_TraversalPathFromReader_ThrowsBeforeDeletingManagedFolders
          - DirectoryPackageContentReader_OpenReadAndReadText_TraversalOrMissingPath_Rejected
          - ubuntu@PackageContentExtractor_Extract_SymlinkedFileInPackage_ThrowsBeforeDeletingManagedFolders
          - ubuntu@DirectoryPackageContentReader_ListFiles_SymlinkedDirectoryInPackage_ThrowsInvalidOperationException
          - ubuntu@DirectoryPackageContentReader_Open_ContentFolderIsSymlink_ThrowsInvalidOperationException
          - ubuntu@DirectoryPackageContentReader_ReadText_SymlinkedReleaseNotes_ThrowsInvalidOperationException
          - ubuntu@DirectoryPackageContentReader_Open_PackageFolderIsSymlink_ThrowsInvalidOperationException
          - ubuntu@DirectoryPackageContentReader_OpenRead_LinkedParentDirectoryWithOrdinaryFile_ThrowsInvalidOperationException
          # Directory junctions need no privilege on Windows, so the directory-level rejection
          # has passing evidence there too.
          - windows@PackageContentExtractor_Extract_JunctionInPackage_ThrowsBeforeDeletingManagedFolders
          - windows@DirectoryPackageContentReader_ListFiles_JunctionInPackage_ThrowsInvalidOperationException
          - windows@DirectoryPackageContentReader_Open_PackageFolderIsJunction_ThrowsInvalidOperationException
          - windows@DirectoryPackageContentReader_Open_ContentFolderIsJunction_ThrowsInvalidOperationException
          - windows@DirectoryPackageContentReader_OpenRead_JunctionParentDirectoryWithOrdinaryFile_ThrowsInvalidOperationException

      - id: AgentControl-PackageContentExtractor-RefuseLinkedRepoFolders
        title: >-
          The PackageContentExtractor class shall refuse to extract into a repo - deleting and
          writing nothing, and reporting a clear error - when the repo's .github folder, a
          managed agent folder or a folder on the path of a file to be written is a symbolic
          link or junction, shall not treat a linked managed folder as an existing one, and
          shall accept a repo whose root itself is reached through a link, because only folders
          at or below the repo root are checked.
        justification: |
          Deleting and copying through a link in the repo would delete or write files outside
          the repository, wherever the link points; refusing before anything is changed keeps
          a sync from ever escaping the repo, while a repo root reached through a link (such as
          a redirected user profile) is legitimate and must keep working.
        tests:
          - windows@PackageContentExtractor_Extract_GitHubFolderIsJunction_RefusesAndLeavesTargetUntouched
          - windows@PackageContentExtractor_Extract_ManagedFolderIsJunction_RefusesAndLeavesTargetUntouched
          - windows@PackageContentExtractor_Extract_DestinationSubfolderIsJunction_RefusesAndLeavesTargetUntouched
          - windows@PackageContentExtractor_Extract_RepoRootUnderJunction_Succeeds
          - windows@PackageContentExtractor_AllManagedFoldersExist_ManagedFolderIsJunction_ReturnsFalse
          - ubuntu@PackageContentExtractor_Extract_GitHubFolderIsSymlink_RefusesAndLeavesTargetUntouched
          - ubuntu@PackageContentExtractor_Extract_ManagedFolderIsSymlink_RefusesAndLeavesTargetUntouched
          - ubuntu@PackageContentExtractor_Extract_DestinationSubfolderIsSymlink_RefusesAndLeavesTargetUntouched
          - ubuntu@PackageContentExtractor_Extract_RepoRootUnderSymlink_Succeeds
          - ubuntu@PackageContentExtractor_AllManagedFoldersExist_ManagedFolderIsSymlink_ReturnsFalse
          - PackageContentExtractor_AllManagedFoldersExist_AllFoldersOrdinary_ReturnsTrue

      - id: AgentControl-PackageContentExtractor-ReadRootFiles
        title: >-
          The PackageContentExtractor class shall read a package's root-level release notes and
          optional AGENTS.md template from either package format without copying them to disk,
          returning none when the package has no such file.
        justification: |
          Release notes and the AGENTS.md template are offered to the user, not applied to the
          managed folders, and must be available from a NuGet package's content folder exactly
          as from a zip's root.
        tests:
          - PackageContentExtractor_ReadReleaseNotes_DirectoryPackage_ReturnsContentOrNull
          - PackageContentExtractor_ReadAgentsMdTemplate_DirectoryPackage_ReturnsContentOrNull
          - PackageContentExtractor_Extract_NullArguments_ThrowsArgumentNullException
