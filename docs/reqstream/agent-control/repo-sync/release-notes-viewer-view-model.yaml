---
# Software Unit Requirements for the ReleaseNotesViewerViewModel Class
#
# ReleaseNotesViewerViewModel backs the release-notes dialog shown after a successful sync,
# exposing the repo name, package title, and release-notes content (or a placeholder when
# the package has none).

sections:
  - title: ReleaseNotesViewerViewModel Unit Requirements
    requirements:
      - id: AgentControl-ReleaseNotesViewerViewModel-Display
        title: >-
          The ReleaseNotesViewerViewModel class shall expose the repo name, package title, and
          release-notes content for display, substituting a placeholder message when the
          package has no release notes, and shall reject a null repo name or release notes
          value.
        justification: |
          The developer must always see a coherent dialog after an upgrade, even for a
          package version that ships no release notes, rather than a blank or broken view.
        tests:
          - ReleaseNotesViewerViewModel_Constructor_NonEmptyReleaseNotes_ExposesTitleAndContent
          - ReleaseNotesViewerViewModel_Constructor_EmptyReleaseNotes_UsesPlaceholderMessage
          - ReleaseNotesViewerViewModel_Constructor_NullRepoName_ThrowsArgumentNullException
          - ReleaseNotesViewerViewModel_Constructor_NullReleaseNotes_ThrowsArgumentNullException

      - id: AgentControl-ReleaseNotesViewerViewModel-MarkdownParsing
        title: >-
          The ReleaseNotesViewerViewModel class shall parse release-notes text into renderable
          blocks, recognizing  #/##/### headings, -/* bullet-list items, and **bold**/*italic*
          inline emphasis, skipping blank lines and treating unterminated emphasis markers as
          literal text.
        justification: |
          Release notes commonly use headings, bullet lists, and bold/italic emphasis; showing
          this content as raw Markdown source (literal  # and ** characters) is harder to read
          than rendering it, even without a full CommonMark implementation.
        tests:
          - ReleaseNotesViewerViewModel_Blocks_HeadingLine_ParsesHeadingLevelAndText
          - ReleaseNotesViewerViewModel_Blocks_BulletLine_ParsesAsBulletWithoutMarker
          - ReleaseNotesViewerViewModel_Blocks_BoldAndItalicSpans_ParseIntoSeparateRuns
          - ReleaseNotesViewerViewModel_Blocks_BlankLines_AreSkipped
          - ReleaseNotesViewerViewModel_Blocks_UnterminatedAsterisk_TreatedAsLiteralText
