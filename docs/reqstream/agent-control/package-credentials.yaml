---
# PackageCredentials Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl PackageCredentials subsystem
# - PackageCredentials spans FeedOrigin.cs (the server a credential belongs to),
#   SessionCredentialStore.cs (in-memory session credentials), PackageCredentialCallback.cs (the
#   per-operation answer to a server's request for credentials) and SecretRedactingLogger.cs (log
#   redaction); the supporting ICredentialPrompt/CredentialPromptRequest/CredentialPromptAnswer
#   (ICredentialPrompt.cs), IRememberedCredentialStore (IRememberedCredentialStore.cs, the user's
#   own credential store) and PackageCredentialContext (PackageCredentialContext.cs) types have no
#   dedicated unit documents and are folded into this subsystem-level description
# - Subsystem requirements describe how credentials for package servers are handled safely:
#   never persisted by the application (only the user's own credential store may keep one, and
#   only when the user asks), offered only to the server they were entered for, asked for at most
#   once per operation, and never written to a log
# - Each requirement states one observable criterion; behaviors that were once combined in a
#   single requirement are separate requirements so that each has its own test evidence

sections:
  - title: PackageCredentials Subsystem Requirements
    requirements:
      # --- Session credentials -------------------------------------------------------------------
      - id: AgentControl-PackageCredentials-SessionOnly
        title: >-
          The PackageCredentials subsystem shall keep a credential the user enters for a package
          server only for the current session.
        justification: |
          A credential that is written anywhere - the settings file, a repo, a log - outlives the
          session and can leak through backups and synced profiles; keeping it only in the
          running session gives the convenience of not asking again without the exposure.
        children:
          - AgentControl-SessionCredentialStore-InMemoryOnly
          - AgentControl-SessionCredentialStore-NullArgumentsRefused
          - AgentControl-PackageCredentialCallback-NullArgumentsRefused
        tests:
          - PackageCredentials_TwoOperations_FirstPromptsAndSecondReusesTheSessionCredential
          - PackageCredentials_RememberLifeCycle_SavedByTheUsersStoreAndFoundInALaterSession

      - id: AgentControl-PackageCredentials-KeptOnlyAfterSuccess
        title: >-
          The PackageCredentials subsystem shall keep a credential the user enters for the session
          only after the operation that used it succeeded.
        justification: |
          A credential typed wrongly must never be kept or reused; only a credential that is known
          to work is worth remembering.
        children:
          - AgentControl-PackageCredentialCallback-CommitOnSuccess
          - AgentControl-PackageCredentialCallback-CommitStoresNothingWhenNoneEntered
        tests:
          - PackageCredentials_TwoOperations_FirstPromptsAndSecondReusesTheSessionCredential
          - PackageCredentials_RejectedCredential_IsForgottenAndTheNextOperationAsksAgain

      - id: AgentControl-PackageCredentials-SessionCredentialReused
        title: >-
          The PackageCredentials subsystem shall answer a later operation on the same server with
          the credential kept for the session, without asking the user again.
        justification: |
          A package server needs a credential on every operation, so asking each time would make a
          protected server unusable.
        children:
          - AgentControl-PackageCredentialCallback-TierOrder
          - AgentControl-PackageCredentialCallback-SessionCredentialSkipsLookup
        tests:
          - PackageCredentials_TwoOperations_FirstPromptsAndSecondReusesTheSessionCredential

      - id: AgentControl-PackageCredentials-AskWhenNoCredentialKnown
        title: >-
          The PackageCredentials subsystem shall ask the user for a server's credential when the
          server requests one, none is known for it and the operation may ask.
        justification: |
          When neither the session nor the user's own credential store holds a credential, asking
          is the only way to sign in, and a rejected credential must lead to a fresh question
          rather than a repeated failure.
        children:
          - AgentControl-PackageCredentialCallback-TierOrder
          - AgentControl-PackageCredentialCallback-PromptsWhenNothingKnown
          - AgentControl-PackageCredentialCallback-PromptNamesServerAndSource
          - AgentControl-PackageCredentialCallback-SilentNoCredential
          - AgentControl-PackageCredentialCallback-FailedLookupFallsThroughToPrompt
        tests:
          - PackageCredentials_TwoOperations_FirstPromptsAndSecondReusesTheSessionCredential
          - PackageCredentials_RejectedCredential_IsForgottenAndTheNextOperationAsksAgain

      - id: AgentControl-PackageCredentials-RejectedCredentialForgotten
        title: >-
          The PackageCredentials subsystem shall forget the credential kept for the session when
          the server rejects it, so that the next operation asks the user again.
        justification: |
          A credential that stopped working must not be offered again and again; the user needs to
          be asked for a working one.
        children:
          - AgentControl-SessionCredentialStore-ForgetAndClear
          - AgentControl-PackageCredentialCallback-CommitOnSuccess
          - AgentControl-PackageCredentialCallback-RejectForgetsSessionCredential
        tests:
          - PackageCredentials_RejectedCredential_IsForgottenAndTheNextOperationAsksAgain

      - id: AgentControl-PackageCredentials-ForgottenAtExit
        title: >-
          The PackageCredentials subsystem shall forget every credential kept for the session when
          the application exits.
        justification: |
          Credentials are meant to live only as long as the session; dropping all of them at exit
          leaves nothing for a later session or process to find.
        children:
          - AgentControl-SessionCredentialStore-ClearForgetsAll
          - AgentControl-SessionCredentialStore-ClearInvalidatesInFlightLookups
        tests:
          # needs test: no subsystem test exercises clearing the store yet
          - PackageCredentials_ClearedSessionStore_ForgetsEveryCredentialAndTheNextOperationAsksAgain

      # --- Scoping to the server ------------------------------------------------------------------
      - id: AgentControl-PackageCredentials-ScopedToFeedOrigin
        title: >-
          The PackageCredentials subsystem shall offer a credential only to requests for the
          server it was entered for - the same scheme, host and port.
        justification: |
          The credential leak that matters is a credential reaching a server other than the one
          the user typed it for, for example through a redirect or a link inside a feed; tying a
          credential to its origin, and treating every other origin as not entitled to it, is
          the control the application itself can guarantee.
        children:
          - AgentControl-FeedOrigin-NormalizedOrigin
          - AgentControl-FeedOrigin-EquivalentSpellings
          - AgentControl-FeedOrigin-RefusesNonWebAddress
          - AgentControl-FeedOrigin-RefusesUserInfo
          - AgentControl-FeedOrigin-MatchesSameOriginOnly
          - AgentControl-FeedOrigin-NeverMatchesRelativeOrMissingAddress
          - AgentControl-PackageCredentialCallback-ForeignOriginRefused
          - AgentControl-SessionCredentialStore-KeyedByOrigin
        tests:
          - PackageCredentials_CredentialForOneFeed_IsNeverOfferedToAnotherOrigin
          - PackageCredentials_ChallengeFromDifferentSchemeHostOrPort_GetsNoCredentialAndNoPrompt

      - id: AgentControl-PackageCredentials-NoPromptForOtherOrigins
        title: >-
          The PackageCredentials subsystem shall not ask the user for a credential on behalf of a
          server other than the one an operation was started for.
        justification: |
          A dialog opened for a host that a redirect or a link inside a feed named could be used
          to harvest a credential from a user who believes they are signing in to their own
          server.
        children:
          - AgentControl-PackageCredentialCallback-ForeignOriginRefused
          - AgentControl-PackageCredentialCallback-ForeignOriginNotPrompted
        tests:
          - PackageCredentials_CredentialForOneFeed_IsNeverOfferedToAnotherOrigin
          - PackageCredentials_ChallengeFromDifferentSchemeHostOrPort_GetsNoCredentialAndNoPrompt

      # --- Asking the user -----------------------------------------------------------------------
      - id: AgentControl-PackageCredentials-AskOncePerOperation
        title: >-
          The PackageCredentials subsystem shall ask the user for credentials at most once per
          operation, however many requests or retries the operation makes.
        justification: |
          A package client may challenge several addresses of one server and retry after a
          failure; without a single answer for the operation a wrong password would open the
          dialog again and again.
        children:
          - AgentControl-PackageCredentialCallback-AnswerMemoized
          - AgentControl-PackageCredentialCallback-ConcurrentRequestsSameAnswer
          - AgentControl-PackageCredentialCallback-CancellationStopsWaiting
        tests:
          - PackageCredentials_RepeatedChallengesOnOneCallback_PromptsOnceAndSharesTheAnswer
          - PackageCredentials_TwoOperations_FirstPromptsAndSecondReusesTheSessionCredential

      - id: AgentControl-PackageCredentials-DeclinedAnswerShared
        title: >-
          The PackageCredentials subsystem shall treat a declined prompt as the answer for the
          rest of the operation, without asking the user again.
        justification: |
          A user who cancels the dialog has said no for this operation; asking again on every
          retry would turn a refusal into a loop.
        children:
          - AgentControl-PackageCredentialCallback-AnswerMemoized
          - AgentControl-PackageCredentialCallback-DeclineMemoized
        tests:
          - PackageCredentials_RepeatedChallengesOnOneCallback_PromptsOnceAndSharesTheAnswer

      # --- Remembering in the user's own credential store ---------------------------------------
      - id: AgentControl-PackageCredentials-RememberOnRequest
        title: >-
          The PackageCredentials subsystem shall keep a credential beyond the session, in the
          user's own credential store, when the user explicitly asks to remember it.
        justification: |
          Typing a token every session is a burden that pushes users to weaker habits, but a secret
          written by the application itself leaks through backups and shared profiles; the user's
          own credential store is already trusted with their other secrets, and an explicit,
          off-by-default choice keeps the decision with the user.
        children:
          - AgentControl-PackageCredentialCallback-RememberOnRequest
          - AgentControl-PackageCredentialCallback-UsersStoreFailureKeepsSessionCredential
          - AgentControl-PackageCredentialCallback-UsersStoreFailureDoesNotFailOperation
        tests:
          - PackageCredentials_RememberLifeCycle_SavedByTheUsersStoreAndFoundInALaterSession

      - id: AgentControl-PackageCredentials-NeverRememberUnasked
        title: >-
          The PackageCredentials subsystem shall not keep a credential beyond the session unless
          the user explicitly asked to remember it.
        justification: |
          Keeping a credential longer than the user asked would silently widen its exposure; the
          choice must stay off unless the user turns it on.
        children:
          - AgentControl-PackageCredentialCallback-RememberOnRequest
          - AgentControl-PackageCredentialCallback-RememberNeverUnchosen
        tests:
          # needs test: no subsystem test covers the not-ticked and not-succeeded paths yet
          - PackageCredentials_RememberNotTickedOrOperationNotSucceeded_NothingIsSavedInTheUsersStore

      - id: AgentControl-PackageCredentials-RememberOnlyAfterSuccess
        title: >-
          The PackageCredentials subsystem shall hand a credential to the user's own credential
          store only after the operation that used it succeeded.
        justification: |
          A credential that has not been shown to work is not worth keeping and would leave a
          wrong password behind in the user's store.
        children:
          - AgentControl-PackageCredentialCallback-RememberOnRequest
        tests:
          # needs test: shared with the requirement above
          - PackageCredentials_RememberNotTickedOrOperationNotSucceeded_NothingIsSavedInTheUsersStore

      - id: AgentControl-PackageCredentials-RememberOfferedOnlyWhenPossible
        title: >-
          The PackageCredentials subsystem shall offer the user the choice to remember a
          credential only when the user's own credential store can keep it.
        justification: |
          An option that would silently do nothing misleads the user into believing a credential
          was saved; the choice is shown disabled, with an explanation, and is never answered as
          remembered when no store can keep the credential.
        children:
          - AgentControl-PackageCredentialCallback-TierOrder
          - AgentControl-PackageCredentialCallback-PromptReportsRememberPossible
          - AgentControl-PackageCredentialCallback-FailedLookupDisablesRemember
        tests:
          # needs test: no subsystem test inspects the prompt request's remember capability yet
          - PackageCredentials_PromptRequest_OffersRememberOnlyWhenTheUsersStoreCanKeepIt

      - id: AgentControl-PackageCredentials-SavedCredentialUsedWithoutAsking
        title: >-
          The PackageCredentials subsystem shall use a credential saved in the user's own
          credential store without asking the user, also for work the user did not start.
        justification: |
          A saved credential that still needs a dialog would defeat the purpose of saving it, and
          background work must not interrupt the user.
        children:
          - AgentControl-PackageCredentialCallback-SavedCredentialLookup
          - AgentControl-PackageCredentialCallback-SavedCredentialLookupWhenSilent
        tests:
          - PackageCredentials_RememberLifeCycle_SavedByTheUsersStoreAndFoundInALaterSession
          - PackageCredentialContext_WithoutPrompt_KeepsStoreAndTheUsersCredentialStore

      - id: AgentControl-PackageCredentials-SavedCredentialLookedUpOnce
        title: >-
          The PackageCredentials subsystem shall look for a credential saved in the user's own
          credential store at most once per server per session, however many operations run at
          the same time.
        justification: |
          Reading a credential store takes time and can reach a slow keychain; several operations
          on one server must share one look-up instead of each repeating it.
        children:
          - AgentControl-PackageCredentialCallback-SavedCredentialLookup
          - AgentControl-SessionCredentialStore-RememberedLookupOnce
          - AgentControl-PackageCredentialCallback-SavedCredentialLookupOnce
          - AgentControl-SessionCredentialStore-RememberedLookupAfterClear
          - AgentControl-SessionCredentialStore-RememberedLookupFaultSurfaced
          - AgentControl-SessionCredentialStore-RememberedLookupFaultNotRepeated
        tests:
          # needs test: no subsystem test runs concurrent operations against one saved credential
          - PackageCredentials_ConcurrentOperationsOnOneServer_LookUpTheSavedCredentialOnce

      - id: AgentControl-PackageCredentials-RejectedSavedCredentialRemoved
        title: >-
          The PackageCredentials subsystem shall remove a credential from the user's own
          credential store when the server rejects that saved credential, so that it is not
          offered again.
        justification: |
          A saved credential that stopped working would otherwise be tried, and refused, in every
          later session; removing it lets the next operation ask the user once.
        children:
          - AgentControl-PackageCredentialCallback-RejectRemovesSavedCredential
          - AgentControl-SessionCredentialStore-RememberedOrigin
          - AgentControl-SessionCredentialStore-RememberedOriginReplaced
          - AgentControl-SessionCredentialStore-RememberedOriginDropped
          - AgentControl-PackageCredentialCallback-RejectSessionOnlyLeavesUsersStoreAlone
        tests:
          # needs test: no subsystem test rejects a credential that came from the user's store
          - PackageCredentials_RejectedSavedCredential_IsRemovedFromTheUsersStoreAndTheNextSessionAsks

      - id: AgentControl-PackageCredentials-NewerCredentialSurvivesLateRejection
        title: >-
          The PackageCredentials subsystem shall keep a newer credential that replaced a rejected
          one in the user's credential store when the rejection of the old credential arrives
          late.
        justification: |
          Concurrent operations on one server can each hold a different credential; a late
          rejection of the old one must not discard the newer credential that works.
        children:
          - AgentControl-PackageCredentialCallback-RejectRemovesSavedCredential
          - AgentControl-SessionCredentialStore-ForgetExactCredential
          - AgentControl-SessionCredentialStore-ReplaceOnSet
          - AgentControl-PackageCredentialCallback-RejectForgetsExactSessionCredential
          - AgentControl-PackageCredentialCallback-RejectRemovesExactSavedCredential
        tests:
          - PackageCredentials_LateRejectionOfAnOldCredential_KeepsTheNewerRememberedCredential

      # --- Forgetting a saved sign-in ------------------------------------------------------------
      - id: AgentControl-PackageCredentials-ForgetSavedSignIn
        title: >-
          The PackageCredentials subsystem shall, on request, remove a server's sign-in from the
          user's own credential store.
        justification: |
          A user who ticked "remember" by mistake, or who is handing the computer on, needs a way
          to take the sign-in back from inside the application.
        tests:
          - PackageCredentialContext_ForgetSavedSignIn_ReportsWhatWasDone
          - PackageCredentials_RememberLifeCycle_SavedByTheUsersStoreAndFoundInALaterSession

      - id: AgentControl-PackageCredentials-ForgetSessionSignIn
        title: >-
          The PackageCredentials subsystem shall, on request to forget a server's sign-in, also
          forget the copy kept for the session.
        justification: |
          Forgetting only the saved copy would leave the sign-in usable until the application
          exits, which is not what a user who asks to forget it expects.
        tests:
          - PackageCredentialContext_ForgetSavedSignIn_ReportsWhatWasDone

      - id: AgentControl-PackageCredentials-ForgetSignInReportsOutcome
        title: >-
          The PackageCredentials subsystem shall report, when it forgets a server's sign-in,
          whether nothing was saved, the saved sign-in was removed, or the user's credential store
          could not remove it.
        justification: |
          A user needs an honest answer when the credential store refused, so they can remove the
          sign-in with the store's own tools.
        tests:
          - PackageCredentialContext_ForgetSavedSignIn_ReportsWhatWasDone

      # --- Nothing secret reaches the log ----------------------------------------------------------
      - id: AgentControl-PackageCredentials-SecretsNeverLogged
        title: >-
          The PackageCredentials subsystem shall ensure that no password or token the user entered
          reaches the application log, whatever the package client writes to it.
        justification: |
          Package clients log the addresses they request and the errors they meet, and such
          messages can quote a credential; the diagnostic log is a plain file that users attach to
          reports, so it must be safe to share.
        children:
          - AgentControl-SecretRedactingLogger-RemovesKnownSecrets
          - AgentControl-SecretRedactingLogger-RemovesEncodedSecretForms
          - AgentControl-SecretRedactingLogger-StopsWhenSecretWithdrawn
          - AgentControl-SecretRedactingLogger-RegistryIsThreadSafe
          - AgentControl-SecretRedactingLogger-RemovesBareCredentials
          - AgentControl-SecretRedactingLogger-RemovesSecretBearingKeys
          - AgentControl-FeedOrigin-RefusalNeverRepeatsAddress
          - AgentControl-FeedOrigin-TextFormShowsOnlyOrigin
          - AgentControl-SessionCredentialStore-RegistersSecretsForRedaction
          - AgentControl-PackageCredentialCallback-RegistersTypedSecret
          - AgentControl-PackageCredentialCallback-CommittedCredentialStaysRegistered
          - AgentControl-SessionCredentialStore-WithdrawsSecretsForRedaction
          - AgentControl-SessionCredentialStore-DiscardedLookupSecretNotRegistered
        tests:
          - PackageCredentials_SignInThroughCallbackAndRedactingLogger_NeverLogsASecret
          - PackageCredentials_RedactionLease_SecretIsRedactedUntilTheLeaseEnds

      - id: AgentControl-PackageCredentials-SecretRedactedWhileInUse
        title: >-
          The PackageCredentials subsystem shall keep a credential redacted in the log for as long
          as any operation still uses it, even after another operation has forgotten it.
        justification: |
          One operation forgetting a rejected credential must not strip the protection from an
          operation that is still running with it and still writing log lines.
        children:
          - AgentControl-SecretRedactingLogger-RedactsWhileAnyHolderUsesSecret
          - AgentControl-SessionCredentialStore-RegistersSecretsForRedaction
          - AgentControl-PackageCredentialCallback-RegistersTypedSecret
          - AgentControl-SessionCredentialStore-AcquireGivesRedactionLease
          - AgentControl-PackageCredentialCallback-LeasesSessionCredential
          - AgentControl-PackageCredentialCallback-LeaseEndsWithOperation
          - AgentControl-PackageCredentialCallback-LeaseSurvivesForgetting
        tests:
          - PackageCredentials_RedactionLease_SecretIsRedactedUntilTheLeaseEnds

      - id: AgentControl-PackageCredentials-UrlUserInfoNeverLogged
        title: >-
          The PackageCredentials subsystem shall ensure that no web-address user information
          (user name or password) reaches the application log.
        justification: |
          An address can embed a user name and password; the log is a plain file that users attach
          to reports.
        children:
          - AgentControl-SecretRedactingLogger-RemovesUrlUserInfo
        tests:
          - PackageCredentials_LoggedUrlParts_NeverReachTheLog

      - id: AgentControl-PackageCredentials-UrlQueryNeverLogged
        title: >-
          The PackageCredentials subsystem shall ensure that no web-address query string reaches
          the application log, while the scheme, host, port, path and the rest of the message stay.
        justification: |
          A redirect to a download service can carry a signed token in the query string; the rest
          of the address stays because it is what makes the message useful for diagnosis.
        children:
          - AgentControl-SecretRedactingLogger-RemovesUrlSecrets
          - AgentControl-SecretRedactingLogger-KeepsUrlLocation
          - AgentControl-SecretRedactingLogger-KeepsSurroundingText
          - AgentControl-SecretRedactingLogger-RecognizesIpv6Literal
          - AgentControl-SecretRedactingLogger-RedactsUrlInsideEscapedQuotes
          - AgentControl-SecretRedactingLogger-RedactsUrlInsideParentheses
        tests:
          - PackageCredentials_LoggedUrlParts_NeverReachTheLog
          - PackageCredentials_SignInThroughCallbackAndRedactingLogger_NeverLogsASecret

      - id: AgentControl-PackageCredentials-UrlFragmentNeverLogged
        title: >-
          The PackageCredentials subsystem shall ensure that no web-address fragment reaches the
          application log.
        justification: |
          A fragment can carry a token (for example in an implicit-grant style redirect) and is
          as unsuitable for a shared log as a query string.
        children:
          - AgentControl-SecretRedactingLogger-RemovesUrlFragment
        tests:
          - PackageCredentials_LoggedUrlParts_NeverReachTheLog

      - id: AgentControl-PackageCredentials-AuthorizationValuesNeverLogged
        title: >-
          The PackageCredentials subsystem shall ensure that no authorization header value, of
          any authentication scheme, reaches the application log.
        justification: |
          An exception message or trace can quote the header a failed request carried, which holds
          the credential in a form that is trivially decoded; a scheme the program does not know
          is just as sensitive as one it does.
        children:
          - AgentControl-SecretRedactingLogger-RemovesAuthorizationValues
          - AgentControl-SecretRedactingLogger-ReplacesValueWhateverScheme
          - AgentControl-SecretRedactingLogger-KeepsHeaderNameAndOtherLines
          - AgentControl-SecretRedactingLogger-RedactsEscapedDelimitedValues
          - AgentControl-SecretRedactingLogger-RedactsNestedJsonValues
          - AgentControl-SecretRedactingLogger-StopsAtTheRealTerminator
        tests:
          - PackageCredentials_LoggedAuthorizationSchemes_NeverReachTheLog
          - PackageCredentials_SignInThroughCallbackAndRedactingLogger_NeverLogsASecret

      - id: AgentControl-PackageCredentials-LoggedMessagesRedacted
        title: >-
          The PackageCredentials subsystem shall redact the formatted text of every message the
          package client writes to the application log, and shall leave the wrapped logger's level
          filtering in effect.
        justification: |
          The guarantee must not depend on which message source writes the text, and wrapping the
          logger must not change which messages the application log keeps.
        children:
          - AgentControl-SecretRedactingLogger-AppliesToEveryMessage
          - AgentControl-SecretRedactingLogger-KeepsLevelFiltering
        tests:
          - PackageCredentials_SignInThroughCallbackAndRedactingLogger_NeverLogsASecret

      - id: AgentControl-PackageCredentials-LoggedPropertiesRedacted
        title: >-
          The PackageCredentials subsystem shall redact every structured property value of a
          message written to the application log.
        justification: |
          A sink may record the structured properties instead of the formatted text, so a secret
          passed as a property must be removed there too.
        children:
          - AgentControl-SecretRedactingLogger-RedactsStructuredProperties
        tests:
          - PackageCredentials_LoggedScopesAndProperties_AreRedacted

      - id: AgentControl-PackageCredentials-LoggedScopesRedacted
        title: >-
          The PackageCredentials subsystem shall redact the state of every logging scope written
          to the application log.
        justification: |
          A sink may record the scopes that surround a message, and a scope can carry an address or
          header just as a message can.
        children:
          - AgentControl-SecretRedactingLogger-RedactsScopes
        tests:
          - PackageCredentials_LoggedScopesAndProperties_AreRedacted

      - id: AgentControl-PackageCredentials-ExceptionsLoggedSanitized
        title: >-
          The PackageCredentials subsystem shall write an exception to the application log only
          as a secret-free description of its type, message chain and stack trace.
        justification: |
          A raw exception object, its inner exceptions and its data can carry headers, addresses
          and credentials that no message-level redaction can reach once the object travels on;
          replacing it at the boundary makes the guarantee hold for everything that handles it
          afterwards.
        children:
          - AgentControl-SecretRedactingLogger-ForwardsOnlySanitizedException
          - AgentControl-SecretRedactingLogger-SanitizesExceptions
          - AgentControl-SecretRedactingLogger-KeepsExceptionTypeName
          - AgentControl-SecretRedactingLogger-KeepsRedactedStackTrace
          - AgentControl-SecretRedactingLogger-DropsOriginalExceptionData
          - AgentControl-SecretRedactingLogger-RedactsConstructorInputs
        tests:
          - PackageCredentials_LoggedExceptions_AreSanitized
