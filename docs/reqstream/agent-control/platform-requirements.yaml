---
# System-Level Platform Requirements
#
# These requirements specify the platform and runtime the tool must support.
#
# Test links can include a source filter prefix (e.g. "windows@") to restrict which test
# results count as evidence for a requirement - critical for platform requirements, since
# removing the filter would invalidate the evidence-based proof. AgentControl ships as a
# Windows-only MSI for v1 (see architecture.md's Scope: "Non-Windows installers for v1... only
# an MSI is produced initially"), so every requirement here is Windows-scoped.
#
# Source filter prefix:
#   windows@TestName - proves the test passed on a Windows platform

sections:
  - title: Platform Support
    requirements:
      - id: AgentControl-Platform-Windows
        title: >-
          The tool shall run as a native Windows desktop application exposing UI Automation
          identifiers for automated testing.
        tags: [system]
        justification: |
          Per architecture.md's Technology Stack, v1 is distributed as a Windows MSI installer
          (a WinExe build) and relies on Avalonia 12's AutomationId support so FlaUI-driven
          integration tests can reliably locate UI elements. Non-Windows installers are
          explicitly deferred (Open Concerns  # 2).
        tests:
          - "windows@MainWindow_Launch_WindowVisibleWithExpectedAutomationId"

      - id: AgentControl-Platform-Net10
        title: The tool shall run on the .NET 10 runtime.
        tags: [system]
        justification: |
          Per architecture.md's Technology Stack, AgentControl targets .NET 10 to remain
          compatible with the current .NET ecosystem and its tooling.
        tests:
          - "Program_Version_ReturnsNonEmptyString"
