---
# Software Unit Requirements for the AgentToolLauncher Class
#
# AgentToolLauncher builds the process-start information needed to run the configured agent
# tool command inside a detected shell, shaping the shell's arguments so the resulting
# terminal window either stays open after the tool exits (the default) or ends together with
# it, and validating its inputs.

sections:
  - title: AgentToolLauncher Unit Requirements
    requirements:
      - id: AgentControl-AgentToolLauncher-BuildCommand
        title: >-
          The AgentToolLauncher class shall, when asked to keep the shell open (the default),
          build process-start information appropriate to the detected shell kind: no-exit
          arguments for PowerShell Core and Windows PowerShell, keep-open (`/K`) arguments for
          the Command shell, and a `-c` argument for POSIX shells.
        justification: |
          Each shell has a different way of running a command while leaving an interactive
          session open afterward for the developer, and the correct argument form must be
          produced per shell so the agent tool is actually launched and the terminal remains
          usable.
        tests:
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellCore_ProducesNoExitCommandArguments
          - AgentToolLauncher_BuildProcessStartInfo_WindowsPowerShell_ProducesNoExitCommandArguments
          - AgentToolLauncher_BuildProcessStartInfo_Cmd_ProducesKeepOpenArguments
          - AgentToolLauncher_BuildProcessStartInfo_Posix_ProducesDashCArgument
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellCore_KeepShellOpenTrue_HasNoExit
          - AgentToolLauncher_BuildProcessStartInfo_WindowsPowerShell_KeepShellOpenTrue_HasNoExit
          - AgentToolLauncher_BuildProcessStartInfo_Cmd_KeepShellOpenTrue_UsesSlashK

      - id: AgentControl-AgentToolLauncher-ShellEndsWithTool
        title: >-
          The AgentToolLauncher class shall, when not asked to keep the shell open, build
          arguments that run the command and then end the shell: PowerShell without the no-exit
          argument, the Command shell with `/C`, POSIX shells unchanged, and a quoted-path
          command for PowerShell still adapted so it is executed.
        justification: |
          A user who prefers the window to close together with the tool needs the shell to end
          when the command does; the command itself must still be run exactly as before, so the
          adaptation that makes PowerShell execute a quoted path is kept, and POSIX shells,
          which already end after `-c`, are left alone.
        tests:
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellCore_KeepShellOpenFalse_OmitsNoExit
          - AgentToolLauncher_BuildProcessStartInfo_WindowsPowerShell_KeepShellOpenFalse_OmitsNoExit
          - AgentToolLauncher_BuildProcessStartInfo_Cmd_KeepShellOpenFalse_UsesSlashC
          - AgentToolLauncher_BuildProcessStartInfo_Posix_KeepShellOpenFalse_IsUnchanged
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellQuotedPath_KeepShellOpenFalse_StillPrefixesCallOperator

      - id: AgentControl-AgentToolLauncher-QuotedPathInvocation
        title: >-
          The AgentToolLauncher class shall execute, rather than echo, a custom agent tool
          command that begins with a quoted executable path when the shell is PowerShell Core
          or Windows PowerShell, and shall leave the command unchanged for the Command shell,
          POSIX shells, and PowerShell commands that already run as written.
        justification: |
          PowerShell treats a leading quoted string as an expression and merely prints it, so
          a custom command such as a quoted path containing spaces would never start the tool
          unless the command is adapted for PowerShell. The command must be adapted only where
          PowerShell needs it, so commands that already work are not altered; how the command is
          adapted is described in the unit's design.
        tests:
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellCoreQuotedPathWithArguments_PrefixesCallOperator
          - AgentToolLauncher_BuildProcessStartInfo_WindowsPowerShellQuotedPathWithArguments_PrefixesCallOperator
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellQuotedPathOnly_PrefixesCallOperator
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellSingleQuotedPath_PrefixesCallOperator
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellLeadingWhitespaceBeforeQuote_PrefixesCallOperator
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellCommandAlreadyHasOperator_IsNotDoublePrefixed
          - AgentToolLauncher_BuildProcessStartInfo_PowerShellUnquotedCommand_IsUnchanged
          - AgentToolLauncher_BuildProcessStartInfo_CmdQuotedPath_IsUnchanged
          - AgentToolLauncher_BuildProcessStartInfo_PosixQuotedPath_IsUnchanged

      - id: AgentControl-AgentToolLauncher-Validation
        title: >-
          The AgentToolLauncher class shall reject a null shell, an empty command, an empty
          working directory, or an unrecognized shell kind.
        justification: |
          Launch must fail fast with a clear error for any invalid input rather than attempt
          to start a process with incomplete or nonsensical configuration.
        tests:
          - AgentToolLauncher_BuildProcessStartInfo_NullShell_ThrowsArgumentNullException
          - AgentToolLauncher_BuildProcessStartInfo_EmptyCommand_ThrowsArgumentException
          - AgentToolLauncher_BuildProcessStartInfo_EmptyWorkingDirectory_ThrowsArgumentException
          - AgentToolLauncher_BuildProcessStartInfo_UnrecognizedShellKind_ThrowsArgumentOutOfRangeException
