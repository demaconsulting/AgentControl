---
# AgentPackageManagement Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl AgentPackageManagement subsystem
# - AgentPackageManagement spans PackageSource.cs (discovers packages/versions at a zip source
#   folder), PackageVersion.cs (parses/compares version strings), PackageVersionCache.cs
#   (caches per-source results), the source providers (ZipFolderSourceProvider.cs,
#   NuGetSourceProvider.cs) behind the IPackageSourceProvider contract, PackageSourceRegistry.cs
#   (resolves a source alias to its provider) and SignatureVerificationSupport.cs (tells whether
#   the platform can verify package signatures); the supporting
#   PackageSourceDefinition/PackageSourceType/PackageReference/IPackageSourceProvider/
#   PackageSourceAccessException types have no dedicated unit documents and are folded into
#   this subsystem-level description
# - Subsystem requirements describe the package-discovery/version-comparison behavior shared
#   by the rest of the application, and how configured package sources are modeled and
#   resolved

sections:
  - title: AgentPackageManagement Subsystem Requirements
    requirements:
      - id: AgentControl-AgentPackageManagement-DiscoverPackages
        title: >-
          The AgentPackageManagement subsystem shall determine a package's name and version
          from its zip filename, and shall enumerate the distinct package names and available
          versions present in a package source folder.
        justification: |
          The package-selection window and upgrade-detection logic both need to know what
          package names and versions physically exist at a configured source folder, derived
          purely from the zip filenames present there.
        children:
          - AgentControl-PackageSource-EnumeratePackages
          - AgentControl-PackageSource-DiscoverNames
          - AgentControl-PackageSource-FindLatest
          - AgentControl-PackageVersion-Parse
          - AgentControl-PackageVersion-ExtendedVersions
          - AgentControl-PackageVersionCache-CachePackageNames
          - AgentControl-PackageVersionCache-CacheVersions
          - AgentControl-PackageVersionCache-Invalidate
          - AgentControl-PackageVersionCache-KeyedBySource
          - AgentControl-PackageVersionCache-InvalidateBySource
        tests:
          - PackageSource_EnumeratePackageNames_MixedDirectory_ReturnsDistinctSortedNames

      - id: AgentControl-AgentPackageManagement-UpgradeDetection
        title: >-
          The AgentPackageManagement subsystem shall determine whether a newer package version
          exists at the source than a repo's pinned version, treating an unparsable pinned
          version as always upgradable.
        justification: |
          Drives the upgrade-available badge and the Upgrade action; an unparsable pin (e.g.
          from manual file editing) must not silently block the developer from being offered
          an upgrade path back to a known-good version.
        children:
          - AgentControl-PackageSource-DetectNewerVersion
          - AgentControl-PackageVersion-Compare
          - AgentControl-PackageVersion-MetadataIgnoredInComparison
          - AgentControl-PackageVersionCache-CacheNewerVersion
        tests:
          - PackageSource_IsNewerVersionAvailable_SourceHasNewerVersion_ReturnsTrue
          - PackageSource_IsNewerVersionAvailable_UnparsablePin_ReturnsTrue

      - id: AgentControl-AgentPackageManagement-SourceDefinitions
        title: >-
          The AgentPackageManagement subsystem shall describe a configured package source by a
          unique alias, a type (zip package folder or NuGet package folder or server), a
          location, and - for NuGet sources - the package IDs it offers, together with trust
          options, shall never hold a password, token or other secret in that description, shall
          identify a location that embeds a credential (such as URL user information) so it is
          never persisted, and shall identify a server address that is not an https address of a
          service index ending in index.json (accepting http only when the source explicitly
          allows it). The trust options are whether signed packages are required and, optionally,
          the fingerprint of the one publisher's certificate to trust; the description shall
          accept a fingerprint written with or without separators and in either letter case, hold
          it in one normalized form, and identify a fingerprint of a source that requires signed
          packages that cannot be read as a SHA-256 fingerprint.
        justification: |
          The source description is persisted in the user's settings file, so it must carry
          everything needed to reach a source and nothing that would turn the settings file
          into a credential store; the derived folder-versus-server distinction must follow
          the location so the two can never disagree; and a server address that would send a
          sign-in unprotected or be treated as another protocol must be caught where the source
          is described, so every user of the description applies the same rules. A fingerprint
          that is pasted from a certificate viewer or a tool is written in many ways, and one that
          cannot be read must be caught rather than ignored, because ignoring it would widen the
          trust from one publisher to any signer.
        tests:
          - PackageSourceDefinition_Members_HaveNoSecretLikeProperty
          - PackageSourceDefinition_LocationKind_DerivedFromLocation
          - PackageSourceDefinition_Serialize_TypeAsNameAndNoDerivedLocationKind
          - PackageSourceDefinition_GetCredentialProblem_CredentialBearingLocation_ReturnsMessageWithoutSecret
          - PackageSourceDefinition_GetCredentialProblem_OrdinaryLocation_ReturnsNull
          - PackageSourceDefinition_GetServerLocationProblem_AcceptableAddress_ReturnsNull
          - PackageSourceDefinition_GetServerLocationProblem_UnacceptableAddress_ReturnsClearMessage
          - PackageSourceDefinition_TryNormalizeFingerprint_ValidSpellings_NormalizeToUpperCaseHex
          - PackageSourceDefinition_TryNormalizeFingerprint_InvalidText_IsRefused
          - PackageSourceDefinition_GetSignaturePolicyProblem_OnlyAnUnreadableFingerprintOfARequiringNuGetSource

      - id: AgentControl-AgentPackageManagement-SourceResolution
        title: >-
          The AgentPackageManagement subsystem shall resolve a package source by its alias to
          that source alone, and shall report an error for an alias that is not configured
          without ever consulting, or falling back to, any other source.
        justification: |
          A package name is not unique across sources; resolving a pin or a request by anything
          weaker than the source alias could fetch another source's package under the wrong
          identity, so a missing source must be an error rather than be quietly replaced.
        children:
          - AgentControl-PackageSourceRegistry-ResolveAlias
          - AgentControl-PackageSourceRegistry-MissingAliasIsError
          - AgentControl-PackageSourceRegistry-NoCrossSourceFallback
        tests:
          - PackageSourceRegistry_PinToSourceB_SamePackageIdAtBothSources_OnlyBIsContacted
          - PackageSourceRegistry_Resolve_MissingAliasWithSingleConfiguredSource_DoesNotFallBack

      - id: AgentControl-AgentPackageManagement-ZipFolderSource
        title: >-
          The AgentPackageManagement subsystem shall offer the packages and versions found in a
          folder of zip packages, and supply a chosen package's content, only from the
          configured folder.
        justification: |
          The zip package folder is the original, still supported source type; exposing it
          through the common source contract lets it sit beside other source types without any
          change to how its packages are named, discovered or compared.
        children:
          - AgentControl-ZipFolderSourceProvider-ListAndAcquire
          - AgentControl-ZipFolderSourceProvider-AcquireOnlyFromOwnSource
        tests:
          - ZipFolderSourceProvider_ListVersions_MixedFolder_ReturnsMatchingPackagesStampedWithAlias
          - ZipFolderSourceProvider_Acquire_DiscoveredPackage_ReturnsReaderOverZipRoot

      - id: AgentControl-AgentPackageManagement-NuGetFolderSource
        title: >-
          The AgentPackageManagement subsystem shall offer the versions of the configured
          packages found in a NuGet package folder, and supply a chosen version's content from
          the package's content folder, keeping everything it creates in AgentControl's own
          storage and never in, or influenced by, the target repo.
        justification: |
          Agent information must never be written into the target repo's NuGet configuration,
          and a repo's own NuGet settings must not be able to redirect where AgentControl reads
          or stores packages, so each NuGet source is accessed through storage that AgentControl
          alone owns.
        children:
          - AgentControl-NuGetSourceProvider-ListVersions
          - AgentControl-NuGetSourceProvider-AcquireToPrivateCache
          - AgentControl-NuGetSourceProvider-ExplicitCacheRoot
          - AgentControl-NuGetSourceProvider-NoRepoNuGetConfig
          - AgentControl-NuGetSourceProvider-NoCredentialServiceRegistration
          - AgentControl-NuGetSourceProvider-ValidateLocation
          - AgentControl-NuGetSourceProvider-AcquireOnlyFromOwnSource
        tests:
          - NuGetSourceProvider_ListVersions_FolderFeedWithVersions_ReturnsAllVersionsStampedWithAlias
          - NuGetSourceProvider_Acquire_ExistingPackage_ReturnsReaderOverContentFolder
          - NuGetSourceProvider_ListAndAcquire_NeverTouchesRepoNuGetConfig

      - id: AgentControl-AgentPackageManagement-NuGetServerSource
        title: >-
          The AgentPackageManagement subsystem shall offer the versions of the configured
          packages found on a NuGet package server, and supply a chosen version's content, only
          from an https address of the server's service index (http only when the source
          explicitly allows it), signing in only through the credential facilities it is given,
          offering a credential only to the server's own origin, reporting each failure in terms
          the user can act on, and never letting a secret reach a message or the log.
        justification: |
          Teams publish agent packages to servers such as JFrog Artifactory or Azure Artifacts;
          reaching them safely means encrypted transport by default, credentials that are used
          only for the server they were entered for and never kept beyond the session, and error
          messages that say what to do without revealing a secret.
        children:
          - AgentControl-NuGetSourceProvider-ServerListAndAcquire
          - AgentControl-NuGetSourceProvider-ValidateLocation
          - AgentControl-NuGetSourceProvider-SignInOrder
          - AgentControl-NuGetSourceProvider-SavedSignIn
          - AgentControl-NuGetSourceProvider-CredentialOnlyForFeedOrigin
          - AgentControl-NuGetSourceProvider-ServerFailures
          - AgentControl-NuGetSourceProvider-SecretsNotLogged
          - AgentControl-PackageSourceRegistry-MissingAliasIsError
        tests:
          - NuGetSourceProvider_ListVersions_AnonymousServer_ReturnsVersionsWithoutDownloading
          - NuGetSourceProvider_ListVersions_ServerNeedsSignIn_PromptsOnceAndRemembersCredentialForTheSession
          - NuGetSourceProvider_Constructor_PlainHttp_RefusedUnlessInsecureHttpIsAllowed
          - PackageSourceDefinition_GetServerLocationProblem_UnacceptableAddress_ReturnsClearMessage

      - id: AgentControl-AgentPackageManagement-SignedPackages
        title: >-
          The AgentPackageManagement subsystem shall, for a NuGet package folder or server source
          that requires signed packages, supply only a package that carries a valid signature -
          and, when the source pins a publisher's certificate, only one signed by that publisher -
          checking it every time the package is supplied, whether it was just downloaded or is
          already held in the source's private cache, so that a changed requirement or pin takes
          effect at once; shall not let trust settings outside the source's own description widen
          or narrow what the source accepts; shall report a refused package as a signature failure
          in words that name the package and the source but no secret; and shall leave a package
          that fails the check uninstalled.
        justification: |
          A package that is installed into a repo is instructions an AI agent will follow, so a
          package from an untrusted publisher, or one tampered with in transit or on a share, is a
          real attack; requiring a signature, ideally from one named publisher, lets an organization
          decide who may publish to its sources. The check must not depend on whether the package
          happened to be downloaded just now, and must not be weakened or strengthened by whatever
          signers the user's machine happens to trust for other purposes. A zip package carries no
          signature, so the requirement applies to NuGet sources only.
        children:
          - AgentControl-NuGetSourceProvider-RequireSigned
          - AgentControl-NuGetSourceProvider-SignerPin
          - AgentControl-NuGetSourceProvider-SignerTrustIsolated
          - AgentControl-NuGetSourceProvider-SignatureFailureReported
          - AgentControl-NuGetSourceProvider-UnreadableFingerprintRefused
        tests:
          # The accepted and rejected signed-package tests use a real signed package downloaded
          # from nuget.org and are skipped only where nuget.org cannot be reached or the machine
          # lacks the trust roots the package needs; the unsigned-package tests need no network.
          - NuGetSourceProvider_Acquire_RequireSignedAndPackageUnsigned_IsRejectedAndNothingIsInstalled
          - NuGetSourceProvider_Acquire_SignedPackageAndMatchingAuthorPinned_SignatureIsAccepted
          - NuGetSourceProvider_Acquire_SignedPackageAndOtherSignerPinned_IsRejectedAndNotInstalled
          - NuGetSourceProvider_Acquire_PinnedSignerChangedAfterPackageWasCached_RejectsTheCachedPackage
          - NuGetSourceProvider_Acquire_ServerRequiresSignaturesAndPackageUnsigned_IsRejectedAsASignatureFailure

      - id: AgentControl-AgentPackageManagement-SignaturePlatformSupport
        title: >-
          The AgentPackageManagement subsystem shall know whether the current platform can verify
          package signatures, shall refuse to list or supply packages from a source that requires
          signed packages when it cannot - rather than skip the verification and install
          unchecked packages - and shall give the same explanation wherever the requirement
          cannot be honored.
        justification: |
          A signature requirement that is silently skipped is worse than none, because the user
          believes packages are being checked; a settings file edited by hand can require
          signatures on any machine, so the refusal must not depend on the settings dialog having
          prevented it.
        children:
          - AgentControl-SignatureVerificationSupport-PlatformSupport
          - AgentControl-SignatureVerificationSupport-UnsupportedExplanation
          - AgentControl-NuGetSourceProvider-FailClosedWithoutVerification
        tests:
          - SignatureVerificationSupport_IsSupportedPlatform_WindowsLinuxAndMacOsOnly
          - SignatureVerificationSupport_UnsupportedMessage_IsTheDocumentedExplanation
          - NuGetSourceProvider_RequireSignedOnUnsupportedPlatform_FailsClosedForListAndAcquire
