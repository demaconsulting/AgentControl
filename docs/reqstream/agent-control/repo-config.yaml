---
# RepoConfig Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl RepoConfig subsystem
# - RepoConfig spans RepoPinStore.cs (loads/saves a repo's `.agentcontrol.json` pin file) and
#   the RepoPin.cs data record, which is folded into this subsystem-level description as it
#   has no dedicated test file
# - Subsystem requirements describe the observable behavior of persisting a repo's pinned
#   package name/version/source and the content identity of what was applied, and whether the
#   user has declined the AGENTS.md template offer

sections:
  - title: RepoConfig Subsystem Requirements
    requirements:
      - id: AgentControl-RepoConfig-PinPersistence
        title: >-
          The RepoConfig subsystem shall persist a repo's pinned package name, exact version
          and source alias in a per-repo pin file, and shall report no pin for a repo that has
          none.
        justification: |
          Per architecture.md's mandatory version-pinning decision, the pinned package/version
          must survive across application restarts and be readable per-repo without any
          central registry.
        children:
          - AgentControl-RepoPinStore-Load
          - AgentControl-RepoPinStore-Save
        tests:
          - RepoPinStore_SaveThenLoad_RoundTripsAllFields
          - RepoPinStore_Load_NoPinFile_ReturnsNull

      - id: AgentControl-RepoConfig-AgentsMdDeclinedPersistence
        title: >-
          The RepoConfig subsystem shall persist, per repo, whether the user has declined the
          offer to place the package's AGENTS.md template at the repo root, shall default this
          flag to false for a pin file written before the flag existed, and shall never reset
          an already-declined flag back to false.
        justification: |
          Ensures the user is prompted at most once per repo for the AGENTS.md template offer,
          without requiring a migration step for pin files written by an earlier AgentControl
          version that predates this field.
        tests:
          - RepoPinStore_SaveThenLoad_AgentsMdTemplateDeclinedTrue_RoundTrips
          - RepoPinStore_Load_LegacyPinFileMissingAgentsMdTemplateDeclinedField_DefaultsToFalse

      - id: AgentControl-RepoConfig-SourcePin
        title: >-
          The RepoConfig subsystem shall record the alias of the package source in a repo's
          pin, shall read a pin written before sources existed as a pin to the source named
          Default, shall reject a pin of the current schema version that names no source,
          shall preserve pin-file properties it does not understand when rewriting,
          and shall neither interpret nor overwrite a pin file written by a newer version of
          the tool.
        justification: |
          Binding a pin to its source is what lets every later operation resolve the pin at the
          right source only; existing pins must keep working, a pin file may be shared with
          other tool versions, and an older tool must never damage a file it does not
          understand.
        children:
          - AgentControl-RepoPinStore-SourceAlias
          - AgentControl-RepoPinStore-LegacyV1
          - AgentControl-RepoPinStore-RejectUnnamedSource
          - AgentControl-RepoPinStore-PreserveUnknownFields
          - AgentControl-RepoPinStore-RejectNewerSchema
        tests:
          - RepoPinStore_SaveThenLoad_SourceAlias_WritesSchemaVersion3AndRoundTripsSource
          - RepoPinStore_Load_LegacyV1PinFile_MapsToDefaultSource
          - RepoPinStore_Load_CurrentSchemaPinWithoutSource_IsRejectedInsteadOfMappedToDefault
          - RepoPinStore_Save_UnknownProperties_ArePreserved
          - RepoPinStore_Load_NewerSchemaVersion_ThrowsUnsupportedPinSchemaExceptionWithActionableMessage

      - id: AgentControl-RepoConfig-ContentIdentityPin
        title: >-
          The RepoConfig subsystem shall record in a repo's pin the content identity of the
          package that was applied, in whatever form its source gave it, and shall omit it when
          none is known.
        justification: |
          The identity is what lets a later sync notice a republished package version, so it must
          survive across sessions with the pin; a pin whose source reported none must not claim one.
        children:
          - AgentControl-RepoPinStore-SaveContentIdentity
        tests:
          - RepoConfig_ContentIdentityPin_SurvivesSessionsIsNeverInventedAndIsAdoptedOnTheNextApply

      - id: AgentControl-RepoConfig-LegacyPinWithoutIdentity
        title: >-
          The RepoConfig subsystem shall read a pin written before identities were recorded as a
          pin with no identity, and shall record an identity in it when the next package is
          applied.
        justification: |
          A pin without an identity must keep working (it adopts an identity the next time a
          package is applied) instead of raising a false alarm or needing a migration step.
        children:
          - AgentControl-RepoPinStore-LoadWithoutIdentity
        tests:
          - RepoConfig_ContentIdentityPin_SurvivesSessionsIsNeverInventedAndIsAdoptedOnTheNextApply

      - id: AgentControl-RepoConfig-PinSchemaVersion
        title: >-
          The RepoConfig subsystem shall write pins in a schema version that an older version of
          the tool refuses to interpret or overwrite, and shall itself refuse, with advice, to read
          or overwrite a pin of a newer schema version.
        justification: |
          A tool version that does not know the content identity must not re-pin the repo to
          another version while carrying the old identity forward, which would raise a false
          alarm - so it has to refuse the file instead.
        children:
          - AgentControl-RepoPinStore-SchemaVersion3
        tests:
          - RepoConfig_NewerSchemaPin_IsRefusedWithAdviceAndNeverOverwritten
