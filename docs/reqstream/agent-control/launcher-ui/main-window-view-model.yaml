---
# Software Unit Requirements for the MainWindowViewModel Class
#
# MainWindowViewModel backs the main repo-list window: it owns the collection of
# RepoCardViewModel instances, applies search filtering and the user's own ordering, and mediates
# add/remove/reorder of tracked repos and settings changes.

sections:
  - title: MainWindowViewModel Unit Requirements
    requirements:
      - id: AgentControl-MainWindowViewModel-PopulateRecentRepos
        title: >-
          The MainWindowViewModel class shall create a repo card for every recent repo
          recorded in settings on construction.
        justification: |
          The main window must reflect the developer's previously tracked repos immediately
          on startup, without requiring any manual re-add step.
        tests:
          - MainWindowViewModel_Constructor_SettingsHaveRecentRepos_PopulatesRepoCards
          - MainWindowViewModel_Constructor_DoesNotInvokeWorkingTreeDirtyCheckSubprocess

      - id: AgentControl-MainWindowViewModel-AddRepo
        title: >-
          The MainWindowViewModel class shall add a new repo card and persist it to settings
          when given an existing, not-already-tracked folder that is the top folder of a Git
          repository, and shall reject nonexistent or duplicate paths (the same folder ignoring
          letter case and a trailing directory separator) and folders that are not Git repository
          roots.
        justification: |
          Prevents the recent-repos list from accumulating invalid or duplicate entries while
          still letting the developer register new repos.
        tests:
          - MainWindowViewModel_AddRepo_ValidNewPath_InsertsCardAndPersistsSettings
          - MainWindowViewModel_AddRepo_PathDoesNotExist_ReturnsFalse
          - MainWindowViewModel_AddRepo_DuplicatePath_ReturnsFalse
          - MainWindowViewModel_AddRepos_ListedFolderWithTrailingSeparator_IsAlreadyListed
          - MainWindowViewModel_AddRepo_StoredWithTrailingSeparator_IsAlreadyListed
          - MainWindowViewModel_NormalizeRepoPath_TrailingSeparatorAndRoot_TrimsOnlyTheSeparator
          - MainWindowViewModel_AddRepo_FolderWithoutGit_IsRefusedAsNotAGitRepository
          - MainWindowViewModel_AddRepo_SubfolderOfARepository_IsRefused

      - id: AgentControl-MainWindowViewModel-AddRepoToGroup
        title: >-
          The MainWindowViewModel class shall add a repo straight into one of the user's groups,
          moving the existing entry into that group instead when the repo is already tracked,
          shall reject a nonexistent folder, a folder that is not a Git repository root and an
          invalid group name, shall open a collapsed target group so the repo is visible, and shall
          keep the group only in the user's settings.
        justification: |
          Adding a repo to a group in one step saves the developer the add-then-move round trip,
          while the duplicate, nonexistent-path and repository protections of the plain add still
          apply.
        tests:
          - MainWindowViewModel_AddRepoToGroup_NewRepo_AddsCardInTheGroupAndPersistsIt
          - MainWindowViewModel_AddRepoToGroup_RepoAlreadyListed_MovesItIntoTheGroup
          - MainWindowViewModel_AddRepoToGroup_FolderMissing_AddsNothing
          - MainWindowViewModel_AddRepoToGroup_CollapsedGroup_ExpandsIt
          - MainWindowViewModel_AddRepoToGroup_InvalidGroupName_ThrowsAndAddsNothing
          - MainWindowViewModel_AddRepo_SubfolderOfARepository_IsRefused

      - id: AgentControl-MainWindowViewModel-AddRepos
        title: >-
          The MainWindowViewModel class shall add several folders in one request, with or without a
          group, handling each folder as a single add would, reporting what became of each (added,
          moved into the group, already listed, missing, not a Git repository, not saved) in the
          order given, handling a folder given twice (in another letter case or with a trailing
          directory separator) once, opening a collapsed target group, and saving the whole
          request once and rebuilding the list once - changing nothing when that save fails, and
          then reporting every folder that would have been added or moved as not saved, with the
          reason.
        justification: |
          A multi-folder pick or a drop of many folders must not stop at the first folder that
          cannot be added, and the caller needs every outcome to tell the user what happened.
          Saving and redrawing once per folder made large adds slow; saving once keeps memory,
          the list and the file in step whatever happens.
        tests:
          - MainWindowViewModel_AddRepos_MixedPaths_ReportsAnOutcomePerPath
          - MainWindowViewModel_AddRepos_SameFolderWithAndWithoutTrailingSeparator_AddsOneCard
          - MainWindowViewModel_AddRepos_SaveFails_NothingAddedAndEveryFolderReportedNotSaved
          - MainWindowViewModel_AddRepos_IntoCollapsedGroup_OpensItOnce
          - MainWindowViewModel_AddReposAsync_SeveralFolders_SavesOnceAndUpdatesTheListOnce

      - id: AgentControl-MainWindowViewModel-AddReposInBackground
        title: >-
          The MainWindowViewModel class shall check the folders of an add without making its caller
          wait for the file system or git, add nothing until every folder was checked, check each
          folder again against the list when it adds - so a repo listed meanwhile is not added
          twice, a repo removed meanwhile is added again (its card's pin and branch read in the
          background), a target group removed meanwhile is created again and a target group
          collapsed meanwhile is opened - and not check the working tree of a repo it adds (its Git
          status stays not checked until the card asks for it).
        justification: |
          The window's thread must stay free while many folders are read; the list may change
          meanwhile; and the working-tree check is deferred to when a card is shown, so an add does
          not run git status for every repo.
        tests:
          - MainWindowViewModel_AddReposAsync_WhileFoldersAreChecked_ReturnsAndAddsNothingYet
          - MainWindowViewModel_AddReposAsync_RepoListedMeanwhile_IsAlreadyListed
          - MainWindowViewModel_AddReposAsync_ListedRepoAndTargetGroupRemovedMeanwhile_AddsBothToRecreatedGroupWithOneSave
          - MainWindowViewModel_AddReposAsync_TargetGroupCollapsedMeanwhile_OpensItWithTheNewRepo
          - MainWindowViewModel_AddReposAsync_NewRepo_GitStatusNotCheckedAndNoStatusRun

      - id: AgentControl-MainWindowViewModel-AddReposProgress
        title: >-
          The MainWindowViewModel class shall report the progress of an add - how many of its
          folders have been checked out of how many - and show it in the global progress while the
          add runs, clearing it when the add has ended.
        justification: |
          The user must see that an add is running and how far it has got.
        tests:
          - MainWindowViewModel_AddReposAsync_ReportsProgressCounts
          - MainWindowViewModel_EnqueueAddRepos_ShowsAndClearsGlobalProgress

      - id: AgentControl-MainWindowViewModel-AddReposCancel
        title: >-
          The MainWindowViewModel class shall stop an add, and every add queued after it, when it is
          canceled before it saves, saving nothing and adding nothing.
        justification: |
          A canceled add must leave no trace in the list or the settings.
        tests:
          - MainWindowViewModel_EnqueueAddRepos_Canceled_SavesNothingAndAddsNothing

      - id: AgentControl-MainWindowViewModel-AddReposQueued
        title: >-
          The MainWindowViewModel class shall run an add requested while another add runs after that
          add has ended, never at the same time, without adding a folder twice.
        justification: |
          Two adds changing the list and the settings at once could add a repo twice or lose one
          add's changes.
        tests:
          - MainWindowViewModel_EnqueueAddRepos_SecondBatchWhileFirstRuns_RunsAfterItWithoutDuplicates

      - id: AgentControl-MainWindowViewModel-AddReposSaveFailure
        title: >-
          The MainWindowViewModel class shall, when the save at the end of an add fails, ask whether
          to retry (with the reason) and wait for the answer, saving the add again on Retry and, on
          Discard or when nobody can be asked, reporting the folders as not saved while the
          settings, the cards and the list - including the group, the place and the collapsed state
          of repos the add would have moved - stay as they were saved.
        justification: |
          A failed save must not lose the user's add without a choice, and giving up must never
          leave memory different from the file.
        tests:
          - MainWindowViewModel_EnqueueAddRepos_SaveFailsThenRetry_AddsTheBatch
          - MainWindowViewModel_EnqueueAddRepos_SaveFailsThenDiscard_LeavesEverythingAsSavedIncludingMovedRepos
          - MainWindowViewModel_EnqueueAddRepos_SaveFailsWithNoOneToAsk_Discards

      - id: AgentControl-MainWindowViewModel-AddGitReposOnly
        title: >-
          The MainWindowViewModel class shall refuse to add a folder that has no .git folder or file
          directly in it (including a subfolder of a repository) and a file, shall accept a folder
          with a .git file (a worktree or submodule), and shall keep the repos already listed even
          when they are not Git repository roots.
        justification: |
          Only a repository's top folder can be synced, pulled and launched in; the repos a user
          already tracks must not disappear because of a check introduced later.
        tests:
          - MainWindowViewModel_AddRepo_FolderWithoutGit_IsRefusedAsNotAGitRepository
          - MainWindowViewModel_AddRepo_SubfolderOfARepository_IsRefused
          - MainWindowViewModel_AddRepo_FolderWithGitFile_IsAdded
          - MainWindowViewModel_AddRepos_ExistingFile_IsNotAGitRepository
          - MainWindowViewModel_Constructor_ListedFolderWithoutGit_IsKept

      - id: AgentControl-MainWindowViewModel-AddReposSummary
        title: >-
          The MainWindowViewModel class shall describe the outcome of an add as no message when
          every folder was added, the single-add message for one folder, and otherwise one summary
          giving how many folders were added and one line per kind of outcome naming at most five
          folders followed by how many more.
        justification: |
          The user needs to know what was not added and why without a message per folder.
        tests:
          - MainWindowViewModel_DescribeAddOutcomes_AllAdded_ReturnsNull
          - MainWindowViewModel_DescribeAddOutcomes_Single_KeepsTheSingleAddMessages
          - MainWindowViewModel_DescribeAddOutcomes_SeveralMixed_OneSummaryByOutcomeWithAtMostFiveNames

      - id: AgentControl-MainWindowViewModel-RemoveRepo
        title: >-
          The MainWindowViewModel class shall remove a repo card from its collections and
          persist the updated settings.
        justification: |
          Once removal is confirmed by the user, the repo must no longer appear in the
          recent-repos list on this or any future launch.
        tests:
          - MainWindowViewModel_RemoveRepo_RemovesFromCollectionsAndPersistsSettings
          - MainWindowViewModel_CardRaisesRemoveRequested_DoesNotRemoveCardWithoutConfirmation

      - id: AgentControl-MainWindowViewModel-SearchFilter
        title: >-
          The MainWindowViewModel class shall filter displayed repo cards by a
          case-insensitive match against the repo's name or path.
        justification: |
          Lets the developer narrow a long list to the repo they are looking for by typing
          any recognizable substring of its name or path.
        children:
          - AgentControl-MainWindowViewModel-EmptyState
        tests:
          - MainWindowViewModel_FilterText_MatchesRepoNameCaseInsensitive_FiltersDisplayedRepoCards
          - MainWindowViewModel_FilterText_MatchesRepoPath_FiltersDisplayedRepoCards

      - id: AgentControl-MainWindowViewModel-EmptyState
        title: >-
          The MainWindowViewModel class shall indicate when no repo cards are currently
          displayed, and shall distinguish an empty recent-repos list from a filter that
          matches none of the tracked repos.
        justification: |
          A blank list area gives the user no indication of whether there is simply nothing
          tracked yet, or whether their filter text is too narrow; an explicit empty-state
          flag and context-specific message let the view show the right next action (add a
          repo, or adjust the filter) instead of an unexplained gap.
        tests:
          - MainWindowViewModel_NoRepoCardsAtAll_HasNoDisplayedReposTrueWithAddRepoMessage
          - MainWindowViewModel_FilterMatchesNoRepos_HasNoDisplayedReposTrueWithFilterMessage
          - MainWindowViewModel_HasDisplayedRepos_HasNoDisplayedReposFalse

      - id: AgentControl-MainWindowViewModel-SortOrder
        title: >-
          The MainWindowViewModel class shall list displayed repo cards with favorites first and
          otherwise in the user's own list order, never by launch time.
        justification: |
          The list shows what the user arranged; a launch must not reorder it.
        tests:
          - MainWindowViewModel_DisplayedRepoCards_FavoritesFirstThenStoredOrder
          - MainWindowViewModel_DisplayedRepoCards_LaunchTimesDoNotAffectStoredOrder

      - id: AgentControl-MainWindowViewModel-StableOrder
        title: >-
          The MainWindowViewModel class shall leave the order of the repo cards unchanged when a
          repo is launched, when cards are refreshed and when settings are applied.
        justification: |
          Only the user's own reordering, and adding or removing a repo, may change the order, so
          nothing the application does on its own moves a card.
        tests:
          - MainWindowViewModel_Launch_DoesNotReorderCards
          - MainWindowViewModel_RefreshAndApplySettings_DoNotReorderCards

      - id: AgentControl-MainWindowViewModel-NewRepoAtEnd
        title: >-
          The MainWindowViewModel class shall put a repo that is added at the end of the list, so it is
          at the bottom of its section, and shall put an already listed repo that is added to a group
          at the bottom of that group.
        justification: |
          A new repo has no place in the user's order yet; the end is the one place that moves no
          other repo, and the bottom of the section is where the user was looking.
        tests:
          - MainWindowViewModel_AddRepo_NewRepoGoesToTheEndOfTheList
          - MainWindowViewModel_AddRepoToGroup_NewRepoGoesToTheBottomOfTheGroup
          - MainWindowViewModel_AddRepoToGroup_RepoAlreadyListed_MovesToTheBottomOfTheGroup

      - id: AgentControl-MainWindowViewModel-LegacyOrderSeeded
        title: >-
          The MainWindowViewModel class shall, when the settings hold no stored repo order, arrange the
          repos once as favorites first, then the most recently launched with never launched repos
          last, store that as the user's order with the next save, and not arrange them again.
        justification: |
          A user who upgrades, or starts for the first time, sees the list as it was and finds it
          where it was, and from then on the launch times no longer matter.
        tests:
          - MainWindowViewModel_Constructor_NoStoredOrder_SeedsFavoritesFirstThenMostRecentlyLaunched
          - MainWindowViewModel_Constructor_SeededOrder_IsWrittenByTheNextSave

      - id: AgentControl-MainWindowViewModel-OrderKept
        title: >-
          The MainWindowViewModel class shall keep a stored repo order exactly as it is, whatever the
          favorites and launch times say.
        justification: |
          The stored order is the user's own and is never re-sorted.
        tests:
          - MainWindowViewModel_Constructor_StoredOrder_IsKeptWhateverTheLaunchTimes

      - id: AgentControl-MainWindowViewModel-MoveCard
        title: >-
          The MainWindowViewModel class shall move a card to the top, one up, one down or to the bottom
          of its section, leaving the order of the other sections' cards unchanged, refuse a move that
          leads nowhere without saving, and change nothing when the order cannot be saved.
        justification: |
          The Move items work within the section the user sees, although the cards of the sections are
          interleaved in the stored list, and a failed save must not leave the display ahead of the file.
        tests:
          - MainWindowViewModel_MoveCard_TopUpDownBottom_ReordersWithinTheSection
          - MainWindowViewModel_MoveCard_AtBoundary_IsRefusedAndChangesNothing
          - MainWindowViewModel_MoveCard_SectionsInterleavedInTheList_KeepsOtherSectionsOrder
          - MainWindowViewModel_MoveCard_SaveFails_ChangesNothingAndReports

      - id: AgentControl-MainWindowViewModel-MoveAvailability
        title: >-
          The MainWindowViewModel class shall tell for each move whether it is available for a card and,
          when it is not, why: the filter has text, or the card is already first or last in its section;
          and shall tell whether the Reorder submenu as a whole is available, which it is not when
          the filter has text or no move applies (the only repo of its section).
        justification: |
          The menu disables the items that do not apply and shows the reason as their tooltip, so the
          rules live in one place.
        tests:
          - MainWindowViewModel_CanMoveCard_FirstMiddleAndLast_ReportsEachItem
          - MainWindowViewModel_GetMoveDisabledReason_NamesTheReason
          - MainWindowViewModel_GetReorderDisabledReason_NamesTheReason

      - id: AgentControl-MainWindowViewModel-DropReorder
        title: >-
          The MainWindowViewModel class shall put a dropped card before or after a card of the same
          section, accept a drop on the card itself without changing anything, refuse a drop whose
          target card is no longer in that section, and in the flat list refuse a drop in the other
          tier.
        justification: |
          A drop is decided from where it lands, and a target that went stale while dragging or one that
          would silently change the favorite state of a list without headers must not be guessed at.
        tests:
          - MainWindowViewModel_DropCard_BeforeAndAfterAnAnchor_ReordersWithinTheSection
          - MainWindowViewModel_DropCard_OnItself_ChangesNothing
          - MainWindowViewModel_DropCard_FlatListOtherTier_IsRefused
          - MainWindowViewModel_DropCard_StaleAnchor_IsRefused

      - id: AgentControl-MainWindowViewModel-DropChangesSection
        title: >-
          The MainWindowViewModel class shall, when a card is dropped in another section, change the
          card's group or favorite state through the card's own group and favorite operations - a group
          sets the group, Ungrouped removes it, Favorites marks the repo a favorite and keeps its group,
          and leaving Favorites clears the favorite state - and then put the card at the drop position,
          changing nothing further when the section change cannot be saved.
        justification: |
          A drag and the menu or the star must give the same result, so the same operations are used,
          and a failed save of the first change must not be followed by a move.
        tests:
          - MainWindowViewModel_DropCard_IntoAnotherGroup_SetsTheGroupAtTheDropPosition
          - MainWindowViewModel_DropCard_IntoUngrouped_RemovesTheGroup
          - MainWindowViewModel_DropCard_IntoFavorites_MarksFavoriteAndKeepsTheGroup
          - MainWindowViewModel_DropCard_OutOfFavoritesIntoGroup_ClearsFavoriteAndSetsTheGroup
          - MainWindowViewModel_DropCard_OutOfFavoritesIntoUngrouped_ClearsFavoriteAndGroup
          - MainWindowViewModel_DropCard_SectionChangeSaveFails_ChangesNothingAndReports

      - id: AgentControl-MainWindowViewModel-DropOnHeader
        title: >-
          The MainWindowViewModel class shall put a card dropped on a section header at the bottom of
          that section, also when the section is collapsed, which leaves it collapsed with its count
          updated.
        justification: |
          A header is a drop target for the whole section; changing the collapsed state the user chose
          would be a side effect of the drop.
        tests:
          - MainWindowViewModel_DropCard_OnGroupHeader_GoesToTheBottomOfTheGroup
          - MainWindowViewModel_DropCard_OnCollapsedGroupHeader_KeepsItCollapsedAndUpdatesTheCount
          - MainWindowViewModel_DropCard_OnFavoritesAndUngroupedHeaders_MoveTheCardThere

      - id: AgentControl-MainWindowViewModel-ReorderOffWhileFiltering
        title: >-
          The MainWindowViewModel class shall report reordering as off while the filter has text, refuse
          a move and a drop then, and leave the stored order unchanged by filtering.
        justification: |
          A filtered list shows only some of the repos, so places in it are not places in the user's
          order.
        tests:
          - MainWindowViewModel_FilterText_DisablesReorderingAndRefusesMoveAndDrop
          - MainWindowViewModel_FilterText_DoesNotChangeTheStoredOrder
          - MainWindowViewModel_IsReorderEnabled_RaisesPropertyChangedWithTheFilter

      - id: AgentControl-MainWindowViewModel-OrderPersisted
        title: >-
          The MainWindowViewModel class shall save the repo order in the settings with every change of
          it, and keep the order of the remaining repos when a repo is removed.
        justification: |
          The order is the user's data; it must be in the file as soon as it is shown, and removing a
          repo must not disturb the others.
        tests:
          - MainWindowViewModel_MoveCard_OrderIsPersistedAndReloaded
          - MainWindowViewModel_RemoveRepo_LeavesTheRestOfTheOrderAndPersistsIt

      - id: AgentControl-MainWindowViewModel-OrderKeptOnApplySettings
        title: >-
          The MainWindowViewModel class shall keep the repo order, and the fact that it is the user's
          order, when settings from the Settings window are applied.
        justification: |
          The Settings window builds a new settings object that knows nothing about the repo list; the
          order must not be lost or seeded again by applying it.
        tests:
          - MainWindowViewModel_ApplySettings_KeepsTheRepoOrder

      - id: AgentControl-MainWindowViewModel-ApplySettings
        title: >-
          The MainWindowViewModel class shall apply updated settings by persisting the new
          values while preserving the existing recent-repos list, shall invalidate any cached
          package version data, shall perform a cheap refresh for every card, and shall
          additionally perform a fresh Git status check for a present card that either
          reappeared (was missing, now present) since it was last checked or whose
          GitExecutablePath setting changed, so it is not left showing a stale, indefinitely
          "not yet checked", or wrong-executable Pull-disabled state, without re-checking the
          Git status of every other already-present, unchanged-executable repo. It shall
          refuse, leaving the current settings unchanged, updated settings whose package source
          location embeds a credential, and updated settings that cannot be saved to disk.
        justification: |
          A settings change (e.g. a new package source path) must take effect immediately for
          subsequent upgrade checks, without discarding the developer's tracked repos. Because
          an already-realized card's one-time lazy Git-status-check trigger will not fire
          again, a settings change is the next opportunity to recover a card whose repo
          disappeared and reappeared while visible; a cheap-only refresh here would leave such
          a card's Pull button showing "not yet checked" until the user manually refreshes it.
          Likewise, a cached clean/dirty result computed against the previously configured Git
          executable must not keep being shown once the user has pointed AgentControl at a
          different executable, since subsequent Pull operations will use the new one. However,
          GitClient's git status check is un-timed, so eagerly re-checking every tracked repo's
          status on every settings save (rather than only the repos that actually need a recheck)
          could take long for a large or slow/networked repo list.
        tests:
          - MainWindowViewModel_ApplySettings_PreservesRecentReposAndPersistsUpdatedFields
          - MainWindowViewModel_ApplySettings_InvalidatesSharedPackageVersionCache
          - MainWindowViewModel_ApplySettings_RepoReappeared_RefreshesGitStatusImmediately
          - MainWindowViewModel_ApplySettings_RepoAlreadyPresentAndChecked_DoesNotRecheckGitStatus
          - MainWindowViewModel_ApplySettings_GitExecutablePathChanged_RefreshesGitStatus
          - MainWindowViewModel_ApplySettings_SourceLocationWithEmbeddedCredential_ThrowsAndKeepsCurrentSettings
          - MainWindowViewModel_ApplySettings_SaveFails_KeepsPreviousSettingsLive

      - id: AgentControl-MainWindowViewModel-ApplySettingsInBackground
        title: >-
          The MainWindowViewModel class shall return from applying settings once they are saved,
          before the cards' refresh has read the disk and git, show that refresh in the global
          progress with how many of the cards were refreshed out of how many (for example
          "Refreshing repositories 0 of 1...", without a cancel) while it runs, and clear the
          progress when it has finished.
        justification: |
          Refreshing every card after a settings save reads git for each repo; the window that
          saved the settings must not wait for it.
        tests:
          - MainWindowViewModel_ApplySettings_CardRefreshHeld_ReturnsAndShowsRefreshingProgress

      - id: AgentControl-MainWindowViewModel-InvalidateChangedSources
        title: >-
          The MainWindowViewModel class shall, when settings are applied, discard the cached
          package results of each package source that was edited or removed, and keep those of
          sources that did not change.
        justification: |
          A cached answer for the old definition of a source must not be reused for the edited
          one, yet unrelated sources (which may be slow network locations) should not be
          queried again just because another source changed.
        tests:
          - MainWindowViewModel_ApplySettings_InvalidatesSharedPackageVersionCache
          - MainWindowViewModel_ApplySettings_OnlyEditedSourceIsInvalidated

      - id: AgentControl-MainWindowViewModel-BackgroundUpgradeCheck
        title: >-
          The MainWindowViewModel class shall not read any package source while it is being
          constructed, shall check every card's upgrade availability in the background when
          asked, when a repo is added and after settings are applied - each card once its queued
          or running repo-state read was applied, at most four source reads at a time across all
          of these checks, with a source that cannot be read hiding nothing the readable sources
          offer, and skipping a card that is busy with an action of its own when its turn comes.
        justification: |
          Starting the window must not wait for package sources, which may be slow network
          locations; one offline source must not hide the upgrade state of repos served by
          other sources. A background check running beside an action the user started on the
          card would break the card's one-action-at-a-time rule and could replace the action's
          result with its own. A card's repo state is read in the background, and applying it
          makes a check started against the older state irrelevant, so a check started before the
          read landed would be lost. Checks that overlap (startup, an add, Settings, the periodic
          round) must not multiply the number of sources read at once.
        tests:
          - MainWindowViewModel_Constructor_DoesNotReadSourcesUntilUpgradeRefreshBegins
          - MainWindowViewModel_BeginUpgradeRefresh_OneSourceUnreachable_ReadableSourceStillOffersUpgrades
          - MainWindowViewModel_AddRepo_PinnedRepo_UpgradeCheckRunsInBackground
          - MainWindowViewModel_LaunchCheck_WaitingCardBecomesBusy_IsNotChecked
          - MainWindowViewModel_Startup_UpgradeCheckWaitsForCardState
          - MainWindowViewModel_Startup_BusyCardSkippedByUpgradeCheck
          - MainWindowViewModel_UpgradeChecks_OverlappingChecks_ShareOneLimit

      - id: AgentControl-MainWindowViewModel-ConnectionTestProvider
        title: >-
          The MainWindowViewModel class shall give the settings window's connection test a
          package-source provider that signs in through the same session credentials and
          sign-in dialog as the repo cards, so that a sign-in made during a test is remembered for
          the session and not asked for again when a package is selected.
        justification: |
          A user who has typed a credential to test a server expects the application to remember
          it for the session, and to ask exactly once, wherever the next use of the server
          happens.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_ReturnsNuGetProviderWithCredentials
          - MainWindowViewModel_CreateConnectionTestProvider_NuGetSource_ReturnsNuGetProvider

      - id: AgentControl-MainWindowViewModel-GitConnectionTestProvider
        title: >-
          The MainWindowViewModel class shall give the settings window's connection test of a Git
          source a provider that runs git with the configured git executable.
        justification: |
          The connection test must use the same git as the rest of the application.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_GitSource_RunsTheConfiguredGitExecutable

      - id: AgentControl-MainWindowViewModel-GitConnectionTestInteractive
        title: >-
          The MainWindowViewModel class shall let git show its own sign-in during the settings
          window's connection test of a Git source.
        justification: |
          The connection test is something the user started, so Git's credential UI may appear.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_GitSource_ReturnsInteractiveGitProvider

      - id: AgentControl-MainWindowViewModel-GitConnectionTestRefusesOldGit
        title: >-
          The MainWindowViewModel class shall make the settings window's connection test of a Git
          source refuse a git that is older than the supported version, reporting that git is too
          old before any tag is listed.
        justification: |
          Testing with an unsupported git would fail in a way that means nothing to the user.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_GitSource_OldGit_IsRefusedBeforeAnyTagIsListed

      - id: AgentControl-MainWindowViewModel-ApplyTheme
        title: >-
          The MainWindowViewModel class shall, once saved settings have been written, hand the
          saved theme choice to the application so it takes effect without a restart.
        justification: |
          A theme that only changes after a restart would look like a broken setting.
        tests:
          - MainWindowViewModel_ApplySettings_ThemeChanged_PersistsAndAppliesTheme

      - id: AgentControl-MainWindowViewModel-RefusedThemeNotApplied
        title: >-
          The MainWindowViewModel class shall not apply the theme of settings that were refused.
        justification: |
          A choice that was never saved must not be shown as if it had been.
        tests:
          - MainWindowViewModel_ApplySettings_SaveFails_DoesNotApplyTheme

      - id: AgentControl-MainWindowViewModel-GroupSections
        title: >-
          The MainWindowViewModel class shall, while at least one repo is in a group, order the
          displayed items as sections - a Favorites section first, then one section per group in
          the user's group order (groups without a stored place alphabetically ignoring letter case,
          after the ordered ones), then an Ungrouped section last.
        justification: |
          Sections let a long list be read by topic, with the repos the user cares about most
          first and the repos that belong to no group last.
        tests:
          - MainWindowViewModel_DisplayedItems_Groups_AreSectionedAndOrdered
          - MainWindowViewModel_Constructor_NamesDifferingInCase_FormOneSection
          - MainWindowViewModel_DisplayedItems_GroupsInStoredOrderThenAlphabetically

      - id: AgentControl-MainWindowViewModel-GroupOrder
        title: >-
          The MainWindowViewModel class shall show the groups in the order stored in the settings,
          the groups without a stored place after them alphabetically, and shall keep in the stored
          order only groups that exist, spelled as the groups are.
        justification: |
          The stored order is the user's; a stale or differently spelled entry must neither show a
          group that is gone nor duplicate one that exists.
        tests:
          - MainWindowViewModel_DisplayedItems_GroupsInStoredOrderThenAlphabetically

      - id: AgentControl-MainWindowViewModel-MoveGroup
        title: >-
          The MainWindowViewModel class shall move a group one place up or down by swapping it with
          the group before or after it, and store and save the whole order of the groups as shown.
        justification: |
          Storing the whole order keeps the place of every group the user can see, including those
          that had no stored place yet.
        tests:
          - MainWindowViewModel_MoveGroup_UpAndDown_SwapsWithNeighborAndStoresTheFullOrder
          - MainWindowViewModel_MoveGroup_SaveFails_ChangesNothingAndReports

      - id: AgentControl-MainWindowViewModel-MoveGroupAvailability
        title: >-
          The MainWindowViewModel class shall refuse, with a reason, to move the first group up, the
          last group down, Favorites, Ungrouped, a group without a section and any group while the
          filter has text, and shall give the group headers that availability.
        justification: |
          The reason is what the disabled menu item shows, so the user knows why the move is not
          offered and how to get it back.
        tests:
          - MainWindowViewModel_GetGroupMoveDisabledReason_EndsBuiltInSectionsAndFilter

      - id: AgentControl-MainWindowViewModel-DropGroup
        title: >-
          The MainWindowViewModel class shall put a dragged group before or after another group and
          save the order, keeping a collapsed group collapsed, and shall refuse a drop on the group
          itself, on Favorites or Ungrouped, on or of a group that is not listed, and while the
          filter has text.
        justification: |
          The drag is decided by the same rules as the menu, so both ways of reordering agree.
        tests:
          - MainWindowViewModel_DropGroup_BeforeOrAfterAnotherGroup_Reorders
          - MainWindowViewModel_CanDropGroup_SelfBuiltInUnknownOrFiltering_Refused

      - id: AgentControl-MainWindowViewModel-GroupOrderPersisted
        title: >-
          The MainWindowViewModel class shall keep the order of the groups in the settings file, so
          a view model created from the saved settings shows the groups in the same order.
        justification: |
          The order must survive a restart to be the user's order.
        tests:
          - MainWindowViewModel_MoveGroup_PersistsOrderForANewViewModel

      - id: AgentControl-MainWindowViewModel-GroupColor
        title: >-
          The MainWindowViewModel class shall store a color from the card color palette, or none,
          for one of the user's groups under the group's own spelling, saving it only in the user's
          settings, and shall refuse an unknown color, an unknown group and the built-in sections,
          changing nothing when the choice cannot be saved and reporting that.
        justification: |
          The group color is a personal choice that must be kept like the other organizing choices,
          and only a known color for an existing group of the user's own makes sense.
        tests:
          - MainWindowViewModel_SetGroupColor_StoresColorAndNoneClears
          - MainWindowViewModel_SetGroupColor_UnknownColorGroupOrBuiltInSection_ChangesNothing
          - MainWindowViewModel_SetGroupColor_SaveFails_ChangesNothingAndReports

      - id: AgentControl-MainWindowViewModel-GroupColorShown
        title: >-
          The MainWindowViewModel class shall give a group's color to the group's header and tell the
          cards of the group that their tile color may have changed when the color is chosen or
          cleared.
        justification: |
          The header and the tiles must show the new color at once, without a restart.
        tests:
          - MainWindowViewModel_SetGroupColor_UpdatesHeaderAndCardsOfTheGroup

      - id: AgentControl-MainWindowViewModel-GroupSettingsFollowRenameAndRemove
        title: >-
          The MainWindowViewModel class shall move a group's color and its place in the group order
          to the new name when the group is renamed, and forget them when the group is removed or
          its last repo leaves it.
        justification: |
          The color and place belong to the group, not to a name that no longer has repos.
        tests:
          - MainWindowViewModel_RenameGroup_KeepsColorAndPosition
          - MainWindowViewModel_RemoveGroup_ForgetsColorAndPosition
          - MainWindowViewModel_LastRepoLeavesGroup_ForgetsColorAndPosition

      - id: AgentControl-MainWindowViewModel-GroupSettingsKeptOnApplySettings
        title: >-
          The MainWindowViewModel class shall keep the group colors and the group order when settings
          are applied from the Settings window.
        justification: |
          The Settings window does not edit them, so applying its changes must not lose them.
        tests:
          - MainWindowViewModel_ApplySettings_KeepsGroupColorsAndOrder

      - id: AgentControl-MainWindowViewModel-GroupSectionHeaders
        title: >-
          The MainWindowViewModel class shall introduce each section of repos with a header that
          shows the section's name and its number of matching repos, and shall show no header for a
          section without a repo.
        justification: |
          The header names what the section holds and how much is in it; a header with nothing
          under it would only be clutter.
        tests:
          - MainWindowViewModel_DisplayedItems_Groups_AreSectionedAndOrdered
          - MainWindowViewModel_DisplayedItems_EmptySections_HaveNoHeader

      - id: AgentControl-MainWindowViewModel-GroupSectionRepoOrder
        title: >-
          The MainWindowViewModel class shall order the repos within a section in the user's own
          order (the order of the repo list), whatever their launch times.
        justification: |
          Each section shows its repos in the same relative order as the user's one list, so a
          repo keeps its place when it moves between sections and the order does not change with use.
        tests:
          - MainWindowViewModel_DisplayedItems_Groups_AreSectionedAndOrdered

      - id: AgentControl-MainWindowViewModel-FavoriteListedOnce
        title: >-
          The MainWindowViewModel class shall, while repos are in groups, list a favorite repo only
          in the Favorites section, not again in its own group, and shall keep its group.
        justification: |
          Listing a favorite once keeps every repo in exactly one place, while remembering its group
          lets it return there when it stops being a favorite.
        tests:
          - MainWindowViewModel_Favorite_IsListedOnlyUnderFavoritesAndKeepsItsGroup

      - id: AgentControl-MainWindowViewModel-FlatListWithoutGroups
        title: >-
          The MainWindowViewModel class shall, while no repo is in a group, show the displayed
          repos as one list without any header, favorites first.
        justification: |
          A user who has no groups must see the list exactly as before.
        tests:
          - MainWindowViewModel_DisplayedItems_NoGroups_FlatListWithoutHeaders

      - id: AgentControl-MainWindowViewModel-DamagedGroupSettings
        title: >-
          The MainWindowViewModel class shall show a usable list when the group names or the
          collapsed sections in the settings are damaged (a missing list, blank, reserved or
          overlong names, names that differ only in letter case) instead of failing.
        justification: |
          The settings file can be edited by hand or damaged; the application must still start and
          show every repo.
        tests:
          - MainWindowViewModel_Constructor_NullAndInvalidOrganizingSettings_FallBack
          - MainWindowViewModel_Constructor_NamesDifferingInCase_FormOneSection

      - id: AgentControl-MainWindowViewModel-GroupCollapse
        title: >-
          The MainWindowViewModel class shall collapse and expand any section (a group, Favorites
          or Ungrouped) on request, hiding the cards of a collapsed section but keeping its header
          with its count.
        justification: |
          A user collapses what they are not working on and still sees that the section is there.
        tests:
          - MainWindowViewModel_ToggleGroupCollapsed_HidesCardsAndPersists
          - MainWindowViewModel_ToggleGroupCollapsed_BuiltInSections_CollapseAndPersist
          - MainWindowViewModel_AllGroupsCollapsed_HeadersRemainAndListIsNotEmpty
          - MainWindowViewModel_ToggleGroupCollapsed_KeepsHeaderAndUnchangedCardsInPlace

      - id: AgentControl-MainWindowViewModel-GroupCollapseRemembered
        title: >-
          The MainWindowViewModel class shall remember the collapsed sections in the settings file
          so that they are still collapsed the next time the application starts.
        justification: |
          A user who collapsed a section expects it to stay that way.
        tests:
          - MainWindowViewModel_ToggleGroupCollapsed_HidesCardsAndPersists
          - MainWindowViewModel_ToggleGroupCollapsed_BuiltInSections_CollapseAndPersist

      - id: AgentControl-MainWindowViewModel-GroupCollapseKeptOnApplySettings
        title: >-
          The MainWindowViewModel class shall keep the collapsed sections when other settings are
          applied.
        justification: |
          Changing a package source or the theme must not reopen the sections the user collapsed.
        tests:
          - MainWindowViewModel_ApplySettings_KeepsCollapsedGroups

      - id: AgentControl-MainWindowViewModel-GroupFilter
        title: >-
          The MainWindowViewModel class shall, while a filter is active, show every repo that
          matches it, including those in a collapsed section.
        justification: |
          A repo the user searches for must never be hidden by the way the list is organized.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes
          - MainWindowViewModel_FilterText_NoMatch_ShowsNothing

      - id: AgentControl-MainWindowViewModel-GroupFilterCounts
        title: >-
          The MainWindowViewModel class shall, while a filter is active, show in each section's
          header the number of matching repos only.
        justification: |
          The count tells how many repos the filter found in that section, not how many the section
          holds.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes

      - id: AgentControl-MainWindowViewModel-GroupFilterOmitsEmpty
        title: >-
          The MainWindowViewModel class shall, while a filter is active, show no header for a
          section without a match.
        justification: |
          Sections the filter found nothing in are noise while the user is searching.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes
          - MainWindowViewModel_FilterText_NoMatch_ShowsNothing

      - id: AgentControl-MainWindowViewModel-GroupFilterToggleDisabled
        title: >-
          The MainWindowViewModel class shall, while a filter is active, disable the collapse
          toggles of the section headers.
        justification: |
          While searching every match is shown, so collapsing a section would do nothing visible
          and only confuse the user.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes

      - id: AgentControl-MainWindowViewModel-GroupFilterKeepsCollapsedState
        title: >-
          The MainWindowViewModel class shall leave the remembered collapsed sections unchanged
          while a filter is active, so that clearing the filter restores them.
        justification: |
          Searching must not undo how the user organized the list.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes

      - id: AgentControl-MainWindowViewModel-GroupManagement
        title: >-
          The MainWindowViewModel class shall rename a group, moving all its repos and its
          collapsed state to the new name.
        justification: |
          Groups must be maintainable without editing a file.
        tests:
          - MainWindowViewModel_RenameGroup_MovesMembersAndRefusesBadNames

      - id: AgentControl-MainWindowViewModel-GroupRenameRules
        title: >-
          The MainWindowViewModel class shall accept a group rename that changes only the letter
          case of the group's own name, and shall refuse, changing nothing, a rename of an unknown
          group, to an invalid name or to another group's name.
        justification: |
          A rename must never merge two groups or leave a repo in a group that has an unusable
          name.
        tests:
          - MainWindowViewModel_RenameGroup_MovesMembersAndRefusesBadNames

      - id: AgentControl-MainWindowViewModel-GroupRemove
        title: >-
          The MainWindowViewModel class shall remove a group so that its repos become ungrouped and
          its collapsed state is forgotten.
        justification: |
          Removing a group removes only the grouping, never the repos in it.
        tests:
          - MainWindowViewModel_RemoveGroup_LeavesMembersUngrouped

      - id: AgentControl-MainWindowViewModel-GroupSettingsOnly
        title: >-
          The MainWindowViewModel class shall persist grouping, card color and collapsed sections to
          the settings file only, writing nothing into a repository.
        justification: |
          The user's own repositories must not be touched by how the list is organized.
        tests:
          - RepoCardViewModel_GroupAndColor_NeverWriteToTheRepository

      - id: AgentControl-MainWindowViewModel-GroupHeaderRequests
        title: >-
          The MainWindowViewModel class shall forward a section header's rename and remove requests
          to the window, with the group's name, changing nothing by itself.
        justification: |
          The window shows the name prompt or the confirmation; the list must change only after
          the user has answered.
        tests:
          - MainWindowViewModel_HeaderCommands_RaiseGroupRequestsWithTheGroupName

      - id: AgentControl-MainWindowViewModel-ChangeAppliedWhenSaved
        title: >-
          The MainWindowViewModel class shall, for every change the user makes to a repo or a section
          (favorite, group, card color, launch time, collapse, rename or removal of a group, adding
          or removing a repo), apply the change and write it to the settings file when the save
          succeeds.
        justification: |
          A change the user makes must be there the next time the application starts.
        tests:
          - MainWindowViewModel_ChangesThatSave_AreAppliedAndWritten

      - id: AgentControl-MainWindowViewModel-FailedSaveChangesNothing
        title: >-
          The MainWindowViewModel class shall, when a change the user makes cannot be saved, leave
          the settings in memory, the repo cards, the displayed list and the settings file as they
          were.
        justification: |
          A list that shows a change the file does not have would be lost at the next start without
          the user knowing; applying a change only after it was saved keeps what the user sees equal
          to what is kept.
        tests:
          - MainWindowViewModel_FavoriteSaveFails_ChangesNothingAndLaterSaveDoesNotPersistIt
          - MainWindowViewModel_MoveToGroupSaveFails_ChangesNothingAndReports
          - MainWindowViewModel_CardColorSaveFails_ChangesNothingAndReports
          - MainWindowViewModel_LaunchRecordSaveFails_StampNotRecordedAndReports
          - MainWindowViewModel_CollapseSaveFails_SectionStaysExpanded
          - MainWindowViewModel_RenameGroupSaveFails_GroupUnchanged
          - MainWindowViewModel_RemoveGroupSaveFails_GroupUnchanged
          - MainWindowViewModel_AddRepoSaveFails_NothingAdded
          - MainWindowViewModel_RemoveRepoSaveFails_RepoStaysListedAndWorking

      - id: AgentControl-MainWindowViewModel-FailedSaveNotPersistedLater
        title: >-
          The MainWindowViewModel class shall never write a change whose save failed with a later,
          unrelated save.
        justification: |
          A change the user was told was not applied must not reappear in the file because of
          something else they did afterwards.
        tests:
          - MainWindowViewModel_FavoriteSaveFails_ChangesNothingAndLaterSaveDoesNotPersistIt
          - MainWindowViewModel_AddRepoSaveFails_NothingAdded
          - MainWindowViewModel_RemoveRepoSaveFails_RepoStaysListedAndWorking

      - id: AgentControl-MainWindowViewModel-SaveFailureReported
        title: >-
          The MainWindowViewModel class shall tell the user, through a notice to the window with a
          message, when a favorite, group, card color, launch time or collapse request from a card
          or a header button could not be saved.
        justification: |
          The user pressed a button and nothing visible happened; without a message they cannot
          tell that the change was refused or why.
        tests:
          - MainWindowViewModel_FavoriteSaveFails_ChangesNothingAndLaterSaveDoesNotPersistIt
          - MainWindowViewModel_MoveToGroupSaveFails_ChangesNothingAndReports
          - MainWindowViewModel_CardColorSaveFails_ChangesNothingAndReports
          - MainWindowViewModel_LaunchRecordSaveFails_StampNotRecordedAndReports
          - MainWindowViewModel_CollapseSaveFails_SectionStaysExpanded

      - id: AgentControl-MainWindowViewModel-SaveFailureRefusesOperation
        title: >-
          The MainWindowViewModel class shall refuse the collapse of a section, the rename or removal
          of a group and the adding or removing of a repo whose save failed, by reporting the failure
          to the caller instead of returning normally.
        justification: |
          The window that called the operation tells the user; an operation that failed to save must
          not look as if it had succeeded.
        tests:
          - MainWindowViewModel_CollapseSaveFails_SectionStaysExpanded
          - MainWindowViewModel_RenameGroupSaveFails_GroupUnchanged
          - MainWindowViewModel_RemoveGroupSaveFails_GroupUnchanged
          - MainWindowViewModel_AddRepoSaveFails_NothingAdded
          - MainWindowViewModel_RemoveRepoSaveFails_RepoStaysListedAndWorking

      - id: AgentControl-MainWindowViewModel-RemoveRepoRetiresCard
        title: >-
          The MainWindowViewModel class shall, once a repo's removal was saved, retire its card so
          that nothing the card still has running reports anything afterwards.
        justification: |
          A removed repo's pending upgrade check or running operation must not show an error, release
          notes or a prompt for a repo that is no longer in the list.
        tests:
          - MainWindowViewModel_RemoveRepo_RetiresTheCard

      - id: AgentControl-MainWindowViewModel-PeriodicUpgradeRecheck
        title: >-
          The MainWindowViewModel class shall, every five minutes while it is alive once the
          re-check was started, check again the upgrade availability of each card that has a pin,
          is not busy and whose folder is not missing, without ever asking the user to sign in,
          reading each package source once per round however many cards share a package (also when
          the source cannot be read, without remembering that failure beyond the round), and
          report a failure through the card's state as the check at launch does.
        justification: |
          The application is left open all day while packages are published; without a periodic
          check the upgrade badges would only show what existed when the window opened. The check
          must never interrupt the user with a dialog, and a slow or unreachable source must not be
          read once per card (a user who is off the VPN with many cards would otherwise send a
          request per card to a feed that cannot answer, every round).
        tests:
          - MainWindowViewModel_Constructor_RecheckInterval_DefaultsToFiveMinutesAndMustBePositive
          - MainWindowViewModel_PeriodicRecheck_VersionPublishedAfterLaunchCheck_ShowsUpgradeAfterInterval
          - MainWindowViewModel_PeriodicRecheck_CustomInterval_RepeatsEveryInterval
          - MainWindowViewModel_PeriodicRecheck_SeveralCardsSamePackage_ReadsTheSourceOnce
          - MainWindowViewModel_PeriodicRecheck_SourceUnreachable_ReadsOncePerRoundAndEveryCardShowsFailure
          - MainWindowViewModel_PeriodicRecheck_SourceStaysUnreachable_ReadsOnceInEachRound
          - MainWindowViewModel_PeriodicRecheck_SourceNeedsSignIn_ReadsOncePerRoundAndEveryCardReportsIt
          - MainWindowViewModel_PeriodicRecheck_OneSourceFails_FailingSourceReadOncePerRound
          - MainWindowViewModel_LaunchCheck_SourceUnreachable_CardsShareTheFailure
          - MainWindowViewModel_PeriodicRecheck_CardsWithNoPinOrMissingFolder_AreSkipped
          - MainWindowViewModel_PeriodicRecheck_CardIsBusy_IsSkipped
          - MainWindowViewModel_PeriodicRecheck_SourceNeedsSignIn_IsReportedOnTheCard
          - MainWindowViewModel_PeriodicRecheck_UiThreadRunnerSupplied_TickRunsThroughIt

      - id: AgentControl-MainWindowViewModel-PeriodicRecheckLifecycle
        title: >-
          The MainWindowViewModel class shall not start a periodic re-check round while the
          previous round is still running - including a round that was cancelled by a newer check
          but has not finished unwinding - or while any launch-time upgrade check is still running,
          including one that a newer check superseded but that has not finished unwinding, shall
          run one timer however often the re-check is
          started, and shall stop the timer and cancel the running round and the running
          background upgrade check when it is disposed.
        justification: |
          A slow source must not pile up rounds (two rounds would race through the shared cache and
          the cards' state), a superseded check that is still inside a provider call that ignores
          cancellation must not overlap a new round, and a closed window must not keep checking
          package sources in the background, neither by the periodic rounds nor by the check that
          runs at launch.
        tests:
          - MainWindowViewModel_PeriodicRecheck_PreviousRoundStillRunning_SkipsTheTick
          - MainWindowViewModel_PeriodicRecheck_RoundSuperseded_NoNewRoundUntilItHasUnwound
          - MainWindowViewModel_PeriodicRecheck_SupersededLaunchCheckStillRunning_NoRoundUntilItHasUnwound
          - MainWindowViewModel_StartPeriodicUpgradeRecheck_CalledTwice_RunsOneTimer
          - MainWindowViewModel_Dispose_StopsThePeriodicRecheck
          - MainWindowViewModel_Dispose_RoundRunning_CancelsIt
          - MainWindowViewModel_Dispose_LaunchCheckRunning_CancelsIt

      - id: AgentControl-MainWindowViewModel-RecheckAfterSettingsClosed
        title: >-
          The MainWindowViewModel class shall, when told that the Settings window closed without
          saving, check again in the background, without ever asking the user to sign in and using the
          credentials of the session, the upgrade availability of each card that has a pin, is not
          busy, whose folder is not missing and that shows a package source problem or a failed
          upgrade check or is being checked by a background check at that moment, without reading a
          source for any other card or canceling a check that is running, shall make a check that is
          running read again a source whose failure it recorded before being told, and shall start
          no further check when told that the settings were saved or after it was disposed.
        justification: |
          A sign-in made with Test connection, or a connection that came back, while Settings was open
          must show on the cards when Settings closes, not only at the next periodic round; checking
          only the cards with a problem keeps the extra reads small, and a save already checks every
          card, so checking again would read every source twice. A periodic round still running
          when Settings closes would otherwise give the cards it reaches afterwards the failure it
          recorded before the sign-in, putting "Sign-in needed" back on a card the re-check cleared;
          and a card whose source read was in flight would show that read's failure, made with the
          state from before the sign-in, unless a newer check of the card replaces it.
        tests:
          - MainWindowViewModel_RecheckAfterSettingsClosed_SourceNoLongerNeedsSignIn_ClearsTheProblem
          - MainWindowViewModel_RecheckAfterSettingsClosed_SourceUnreachableBefore_ChecksAgain
          - MainWindowViewModel_RecheckAfterSettingsClosed_NoCardHasAProblem_ReadsNoSource
          - MainWindowViewModel_RecheckAfterSettingsClosed_SettingsSaved_StartsNoSecondCheck
          - MainWindowViewModel_RecheckAfterSettingsClosed_CardIsBusy_IsSkipped
          - MainWindowViewModel_RecheckAfterSettingsClosed_WaitingCardBecomesBusy_IsNotChecked
          - MainWindowViewModel_RecheckAfterSettingsClosed_Disposed_ChecksNothing
          - MainWindowViewModel_RecheckAfterSettingsClosed_RoundRecordedFailureBeforeSignIn_RoundReadsTheSourceAgain
          - MainWindowViewModel_RecheckAfterSettingsClosed_CardCheckInFlight_OldFailureIsNotShown
          - MainWindowViewModel_RecheckAfterSettingsClosed_SignedInDuringConnectionTest_UsesTheSignInWithoutAsking

      - id: AgentControl-MainWindowViewModel-SharedRepoReads
        title: >-
          The MainWindowViewModel class shall read the folders of an add and refresh the cards after
          a settings save under one limit of two repo reads at a time, shared with the cards' own
          reads, so adds and refreshes that run at the same time never read more repos at once.
        justification: |
          Each of these used to have its own limit of four, so overlapping work multiplied the number
          of git processes.
        tests:
          - MainWindowViewModel_AddReposAsync_ManyFolders_AtMostTwoInspectedAtOnce
          - MainWindowViewModel_ApplySettings_RefreshUsesSharedQueueLimit

      - id: AgentControl-MainWindowViewModel-StartupReadsQueued
        title: >-
          The MainWindowViewModel class shall build its repo cards from the settings without reading
          the disk or running git, queue each card's repo-state read through the shared refresh queue
          in display order (the cards shown first), and report the progress of those reads as
          "Refreshing repositories {n} of {total}..." without Cancel until they are done, and give up
          the reads that have not been applied when the window closes.
        justification: |
          Reading every repo (a pin file and three git processes each) before the window could show
          kept the window from appearing for a long list or a slow or offline drive. The window must
          appear at once and fill the cards in, showing that it is still working. Once the window is
          closed nothing is shown any more, so its reads must neither start nor be applied.
        tests:
          - MainWindowViewModel_Constructor_GitHeld_ReturnsWithCardsRefreshingAndProgressShown
          - MainWindowViewModel_Constructor_ReadsComplete_CardsFillInAndProgressClears
          - MainWindowViewModel_Dispose_StartupReadsHeld_GivesThemUpAndAppliesNothing
