---
# Software Unit Requirements for the MainWindowViewModel Class
#
# MainWindowViewModel backs the main recent-repos window: it owns the collection of
# RepoCardViewModel instances, applies search filtering and sort ordering, and mediates
# add/remove of tracked repos and settings changes.

sections:
  - title: MainWindowViewModel Unit Requirements
    requirements:
      - id: AgentControl-MainWindowViewModel-PopulateRecentRepos
        title: >-
          The MainWindowViewModel class shall create a repo card for every recent repo
          recorded in settings on construction.
        justification: |
          The main window must reflect the developer's previously tracked repos immediately
          on startup, without requiring any manual re-add step.
        tests:
          - MainWindowViewModel_Constructor_SettingsHaveRecentRepos_PopulatesRepoCards
          - MainWindowViewModel_Constructor_DoesNotInvokeWorkingTreeDirtyCheckSubprocess

      - id: AgentControl-MainWindowViewModel-AddRepo
        title: >-
          The MainWindowViewModel class shall add a new repo card and persist it to settings
          when given an existing, not-already-tracked folder path, and shall reject
          nonexistent or duplicate paths.
        justification: |
          Prevents the recent-repos list from accumulating invalid or duplicate entries while
          still letting the developer register new repos.
        tests:
          - MainWindowViewModel_AddRepo_ValidNewPath_InsertsCardAndPersistsSettings
          - MainWindowViewModel_AddRepo_PathDoesNotExist_ReturnsFalse
          - MainWindowViewModel_AddRepo_DuplicatePath_ReturnsFalse

      - id: AgentControl-MainWindowViewModel-RemoveRepo
        title: >-
          The MainWindowViewModel class shall remove a repo card from its collections and
          persist the updated settings.
        justification: |
          Once removal is confirmed by the user, the repo must no longer appear in the
          recent-repos list on this or any future launch.
        tests:
          - MainWindowViewModel_RemoveRepo_RemovesFromCollectionsAndPersistsSettings
          - MainWindowViewModel_CardRaisesRemoveRequested_DoesNotRemoveCardWithoutConfirmation

      - id: AgentControl-MainWindowViewModel-SearchFilter
        title: >-
          The MainWindowViewModel class shall filter displayed repo cards by a
          case-insensitive match against the repo's name or path.
        justification: |
          Lets the developer narrow a long list to the repo they are looking for by typing
          any recognizable substring of its name or path.
        children:
          - AgentControl-MainWindowViewModel-EmptyState
        tests:
          - MainWindowViewModel_FilterText_MatchesRepoNameCaseInsensitive_FiltersDisplayedRepoCards
          - MainWindowViewModel_FilterText_MatchesRepoPath_FiltersDisplayedRepoCards

      - id: AgentControl-MainWindowViewModel-EmptyState
        title: >-
          The MainWindowViewModel class shall indicate when no repo cards are currently
          displayed, and shall distinguish an empty recent-repos list from a filter that
          matches none of the tracked repos.
        justification: |
          A blank list area gives the user no indication of whether there is simply nothing
          tracked yet, or whether their filter text is too narrow; an explicit empty-state
          flag and context-specific message let the view show the right next action (add a
          repo, or adjust the filter) instead of an unexplained gap.
        tests:
          - MainWindowViewModel_NoRepoCardsAtAll_HasNoDisplayedReposTrueWithAddRepoMessage
          - MainWindowViewModel_FilterMatchesNoRepos_HasNoDisplayedReposTrueWithFilterMessage
          - MainWindowViewModel_HasDisplayedRepos_HasNoDisplayedReposFalse

      - id: AgentControl-MainWindowViewModel-SortOrder
        title: >-
          The MainWindowViewModel class shall order displayed repo cards with favorites
          first, then by most-recently-launched, with never-launched repos last.
        justification: |
          Surfaces the repos most relevant to the developer's current work without requiring
          manual reordering.
        tests:
          - MainWindowViewModel_DisplayedRepoCards_SortsFavoritesAboveNonFavorites
          - MainWindowViewModel_DisplayedRepoCards_SortsByLastLaunchedUtcDescendingWithNullsLast

      - id: AgentControl-MainWindowViewModel-ApplySettings
        title: >-
          The MainWindowViewModel class shall apply updated settings by persisting the new
          values while preserving the existing recent-repos list, shall invalidate any cached
          package version data, shall perform a cheap refresh for every card, and shall
          additionally perform a fresh Git status check for a present card that either
          reappeared (was missing, now present) since it was last checked or whose
          GitExecutablePath setting changed, so it is not left showing a stale, indefinitely
          "not yet checked", or wrong-executable Pull-disabled state, without re-checking the
          Git status of every other already-present, unchanged-executable repo. It shall
          refuse, leaving the current settings unchanged, updated settings whose package source
          location embeds a credential, and updated settings that cannot be saved to disk.
        justification: |
          A settings change (e.g. a new package source path) must take effect immediately for
          subsequent upgrade checks, without discarding the developer's tracked repos. Because
          an already-realized card's one-time lazy Git-status-check trigger will not fire
          again, a settings change is the next opportunity to recover a card whose repo
          disappeared and reappeared while visible; a cheap-only refresh here would leave such
          a card's Pull button showing "not yet checked" until the user manually refreshes it.
          Likewise, a cached clean/dirty result computed against the previously configured Git
          executable must not keep being shown once the user has pointed AgentControl at a
          different executable, since subsequent Pull operations will use the new one. However,
          GitClient's git status check is synchronous and un-timed, so eagerly re-checking
          every tracked repo's status on every settings save (rather than only the repos that
          actually need a recheck) could block the UI thread for a large or slow/networked repo
          list.
        tests:
          - MainWindowViewModel_ApplySettings_PreservesRecentReposAndPersistsUpdatedFields
          - MainWindowViewModel_ApplySettings_InvalidatesSharedPackageVersionCache
          - MainWindowViewModel_ApplySettings_RepoReappeared_RefreshesGitStatusImmediately
          - MainWindowViewModel_ApplySettings_RepoAlreadyPresentAndChecked_DoesNotRecheckGitStatus
          - MainWindowViewModel_ApplySettings_GitExecutablePathChanged_RefreshesGitStatus
          - MainWindowViewModel_ApplySettings_SourceLocationWithEmbeddedCredential_ThrowsAndKeepsCurrentSettings
          - MainWindowViewModel_ApplySettings_SaveFails_KeepsPreviousSettingsLive

      - id: AgentControl-MainWindowViewModel-InvalidateChangedSources
        title: >-
          The MainWindowViewModel class shall, when settings are applied, discard the cached
          package results of each package source that was edited or removed, and keep those of
          sources that did not change.
        justification: |
          A cached answer for the old definition of a source must not be reused for the edited
          one, yet unrelated sources (which may be slow network locations) should not be
          queried again just because another source changed.
        tests:
          - MainWindowViewModel_ApplySettings_InvalidatesSharedPackageVersionCache
          - MainWindowViewModel_ApplySettings_OnlyEditedSourceIsInvalidated

      - id: AgentControl-MainWindowViewModel-BackgroundUpgradeCheck
        title: >-
          The MainWindowViewModel class shall not read any package source while it is being
          constructed, shall check every card's upgrade availability in the background when
          asked, when a repo is added and after settings are applied - a few cards at a time,
          with a source that cannot be read affecting only the cards pinned to it.
        justification: |
          Starting the window must not wait for package sources, which may be slow network
          locations; one offline source must not hide the upgrade state of repos pinned to
          other sources.
        tests:
          - MainWindowViewModel_Constructor_DoesNotReadSourcesUntilUpgradeRefreshBegins
          - MainWindowViewModel_BeginUpgradeRefresh_OneSourceUnreachable_OtherCardsStillChecked
          - MainWindowViewModel_AddRepo_PinnedRepo_UpgradeCheckRunsInBackground

      - id: AgentControl-MainWindowViewModel-ConnectionTestProvider
        title: >-
          The MainWindowViewModel class shall give the settings window's connection test a
          package-source provider that signs in through the same session credentials and
          sign-in dialog as the repo cards, so that a sign-in made during a test is remembered for
          the session and not asked for again when a package is selected.
        justification: |
          A user who has typed a credential to test a server expects the application to remember
          it for the session, and to ask exactly once, wherever the next use of the server
          happens.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_ReturnsNuGetProviderWithCredentials

      - id: AgentControl-MainWindowViewModel-ApplyTheme
        title: >-
          The MainWindowViewModel class shall, once saved settings have been written, hand the
          saved theme choice to the application so it takes effect without a restart, and shall
          not apply the theme of settings that were refused.
        justification: |
          A theme that only changes after a restart would look like a broken setting, and a
          choice that was never saved must not be shown as if it had been.
        tests:
          - MainWindowViewModel_ApplySettings_ThemeChanged_PersistsAndAppliesTheme
          - MainWindowViewModel_ApplySettings_SaveFails_DoesNotApplyTheme

      - id: AgentControl-MainWindowViewModel-GroupSections
        title: >-
          The MainWindowViewModel class shall, while at least one repo is in a group, order the
          displayed items as sections - a Favorites section of the favorite repos (a favorite
          only there), then one section per group alphabetically ignoring letter case, then an
          Ungrouped section last - each introduced by a header with the section's name and its
          number of matching repos, repos within a section by most recent launch, and no header
          for a section without a repo; while no repo is in a group it shall show the flat list
          without any header, favorites first.
        justification: |
          Sections let a long list be read by topic; listing a favorite once keeps every repo
          in exactly one place, and a user who has no groups must see the list exactly as before.
        tests:
          - MainWindowViewModel_DisplayedItems_NoGroups_FlatListWithoutHeaders
          - MainWindowViewModel_DisplayedItems_Groups_AreSectionedAndOrdered
          - MainWindowViewModel_Favorite_IsListedOnlyUnderFavoritesAndKeepsItsGroup
          - MainWindowViewModel_DisplayedItems_EmptySections_HaveNoHeader
          - MainWindowViewModel_ToggleGroupCollapsed_KeepsHeaderAndUnchangedCardsInPlace
          - MainWindowViewModel_Constructor_NullAndInvalidOrganizingSettings_FallBack
          - MainWindowViewModel_Constructor_NamesDifferingInCase_FormOneSection
          - RepoGroupHeaderViewModel_Kind_SelectsSectionFlags
          - RepoGroupHeaderViewModel_Update_DescribesCountAndState
          - RepoGroupHeaderViewModel_ToString_IsTheAccessibleName
          - RepoGroupHeaderViewModel_Constructor_BlankName_Throws

      - id: AgentControl-MainWindowViewModel-GroupCollapse
        title: >-
          The MainWindowViewModel class shall collapse and expand any section (a group, Favorites
          or Ungrouped) on request, hiding the cards of a collapsed section but keeping its header
          with its count, shall remember the collapsed sections in the settings file, and shall
          keep them when other settings are applied.
        justification: |
          A user collapses what they are not working on and expects it to stay that way the next
          time the application starts.
        tests:
          - MainWindowViewModel_ToggleGroupCollapsed_HidesCardsAndPersists
          - MainWindowViewModel_ToggleGroupCollapsed_BuiltInSections_CollapseAndPersist
          - MainWindowViewModel_AllGroupsCollapsed_HeadersRemainAndListIsNotEmpty
          - MainWindowViewModel_ApplySettings_KeepsCollapsedGroups
          - RepoGroupHeaderViewModel_ToggleCommand_FollowsToggleEnabled

      - id: AgentControl-MainWindowViewModel-GroupFilter
        title: >-
          The MainWindowViewModel class shall, while a filter is active, show every repo that
          matches it - including those in a collapsed section - under headers that count only the
          matches, omit sections without a match, disable the headers' collapse toggles and leave
          the remembered collapsed state unchanged, so that clearing the filter restores it.
        justification: |
          A repo the user searches for must never be hidden by the way the list is organized.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes
          - MainWindowViewModel_FilterText_NoMatch_ShowsNothing

      - id: AgentControl-MainWindowViewModel-GroupManagement
        title: >-
          The MainWindowViewModel class shall rename a group (moving all its repos and its
          collapsed state, accepting a change of letter case only, and refusing an unknown group,
          an invalid name and another group's name) and shall remove a group (its repos become
          ungrouped and its collapsed state is forgotten), persisting the result to the settings
          file only, and shall forward a header's rename and remove requests to the window.
        justification: |
          Groups must be maintainable without editing a file; the user's own repositories must
          not be touched by it.
        tests:
          - MainWindowViewModel_RenameGroup_MovesMembersAndRefusesBadNames
          - MainWindowViewModel_RemoveGroup_LeavesMembersUngrouped
          - MainWindowViewModel_HeaderCommands_RaiseGroupRequestsWithTheGroupName
          - RepoGroupHeaderViewModel_RenameAndRemoveCommands_RaiseRequests
          - RepoCardViewModel_GroupAndColor_NeverWriteToTheRepository

      - id: AgentControl-MainWindowViewModel-GroupNamePrompt
        title: >-
          The group-name prompt shall validate the typed name as the user types - refusing a blank
          name, a name longer than 40 characters and the built-in names Favorites and Ungrouped,
          and, when renaming, another group's name - shall let a new group join an existing group
          of the same name ignoring letter case (with a note), shall only accept a usable name, and
          shall complete exactly once, with the name or with none when canceled.
        justification: |
          A name can only be used if it is valid; telling the user why as they type is quicker than
          refusing afterwards, and a group must not exist twice under different letter case.
        tests:
          - GroupNameViewModel_NewGroup_ValidName_AcceptsCleanedName
          - GroupNameViewModel_InvalidName_ShowsMessageAndCannotAccept
          - GroupNameViewModel_TooLongName_ShowsLengthMessage
          - GroupNameViewModel_NewGroup_ExistingName_HintsAndAdoptsSpelling
          - GroupNameViewModel_Rename_RefusesOtherGroupsAcceptsCaseChange
          - GroupNameViewModel_Cancel_CompletesOnceWithNull
          - GroupNameViewModel_Constructor_NullArguments_Throw
