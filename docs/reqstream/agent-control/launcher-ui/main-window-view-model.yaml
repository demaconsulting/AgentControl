---
# Software Unit Requirements for the MainWindowViewModel Class
#
# MainWindowViewModel backs the main recent-repos window: it owns the collection of
# RepoCardViewModel instances, applies search filtering and sort ordering, and mediates
# add/remove of tracked repos and settings changes.

sections:
  - title: MainWindowViewModel Unit Requirements
    requirements:
      - id: AgentControl-MainWindowViewModel-PopulateRecentRepos
        title: >-
          The MainWindowViewModel class shall create a repo card for every recent repo
          recorded in settings on construction.
        justification: |
          The main window must reflect the developer's previously tracked repos immediately
          on startup, without requiring any manual re-add step.
        tests:
          - MainWindowViewModel_Constructor_SettingsHaveRecentRepos_PopulatesRepoCards
          - MainWindowViewModel_Constructor_DoesNotInvokeWorkingTreeDirtyCheckSubprocess

      - id: AgentControl-MainWindowViewModel-AddRepo
        title: >-
          The MainWindowViewModel class shall add a new repo card and persist it to settings
          when given an existing, not-already-tracked folder path, and shall reject
          nonexistent or duplicate paths.
        justification: |
          Prevents the recent-repos list from accumulating invalid or duplicate entries while
          still letting the developer register new repos.
        tests:
          - MainWindowViewModel_AddRepo_ValidNewPath_InsertsCardAndPersistsSettings
          - MainWindowViewModel_AddRepo_PathDoesNotExist_ReturnsFalse
          - MainWindowViewModel_AddRepo_DuplicatePath_ReturnsFalse

      - id: AgentControl-MainWindowViewModel-AddRepoToGroup
        title: >-
          The MainWindowViewModel class shall add a repo straight into one of the user's groups,
          moving the existing entry into that group instead when the repo is already tracked,
          shall reject a nonexistent folder and an invalid group name, shall open a collapsed
          target group so the repo is visible, and shall keep the group only in the user's
          settings.
        justification: |
          Adding a repo to a group in one step saves the developer the add-then-move round trip,
          while the duplicate and nonexistent-path protections of the plain add still apply.
        tests:
          - MainWindowViewModel_AddRepoToGroup_NewRepo_AddsCardInTheGroupAndPersistsIt
          - MainWindowViewModel_AddRepoToGroup_RepoAlreadyListed_MovesItIntoTheGroup
          - MainWindowViewModel_AddRepoToGroup_FolderMissing_AddsNothing
          - MainWindowViewModel_AddRepoToGroup_CollapsedGroup_ExpandsIt
          - MainWindowViewModel_AddRepoToGroup_InvalidGroupName_ThrowsAndAddsNothing

      - id: AgentControl-MainWindowViewModel-RemoveRepo
        title: >-
          The MainWindowViewModel class shall remove a repo card from its collections and
          persist the updated settings.
        justification: |
          Once removal is confirmed by the user, the repo must no longer appear in the
          recent-repos list on this or any future launch.
        tests:
          - MainWindowViewModel_RemoveRepo_RemovesFromCollectionsAndPersistsSettings
          - MainWindowViewModel_CardRaisesRemoveRequested_DoesNotRemoveCardWithoutConfirmation

      - id: AgentControl-MainWindowViewModel-SearchFilter
        title: >-
          The MainWindowViewModel class shall filter displayed repo cards by a
          case-insensitive match against the repo's name or path.
        justification: |
          Lets the developer narrow a long list to the repo they are looking for by typing
          any recognizable substring of its name or path.
        children:
          - AgentControl-MainWindowViewModel-EmptyState
        tests:
          - MainWindowViewModel_FilterText_MatchesRepoNameCaseInsensitive_FiltersDisplayedRepoCards
          - MainWindowViewModel_FilterText_MatchesRepoPath_FiltersDisplayedRepoCards

      - id: AgentControl-MainWindowViewModel-EmptyState
        title: >-
          The MainWindowViewModel class shall indicate when no repo cards are currently
          displayed, and shall distinguish an empty recent-repos list from a filter that
          matches none of the tracked repos.
        justification: |
          A blank list area gives the user no indication of whether there is simply nothing
          tracked yet, or whether their filter text is too narrow; an explicit empty-state
          flag and context-specific message let the view show the right next action (add a
          repo, or adjust the filter) instead of an unexplained gap.
        tests:
          - MainWindowViewModel_NoRepoCardsAtAll_HasNoDisplayedReposTrueWithAddRepoMessage
          - MainWindowViewModel_FilterMatchesNoRepos_HasNoDisplayedReposTrueWithFilterMessage
          - MainWindowViewModel_HasDisplayedRepos_HasNoDisplayedReposFalse

      - id: AgentControl-MainWindowViewModel-SortOrder
        title: >-
          The MainWindowViewModel class shall order displayed repo cards with favorites
          first, then by most-recently-launched, with never-launched repos last.
        justification: |
          Surfaces the repos most relevant to the developer's current work without requiring
          manual reordering.
        tests:
          - MainWindowViewModel_DisplayedRepoCards_SortsFavoritesAboveNonFavorites
          - MainWindowViewModel_DisplayedRepoCards_SortsByLastLaunchedUtcDescendingWithNullsLast

      - id: AgentControl-MainWindowViewModel-ApplySettings
        title: >-
          The MainWindowViewModel class shall apply updated settings by persisting the new
          values while preserving the existing recent-repos list, shall invalidate any cached
          package version data, shall perform a cheap refresh for every card, and shall
          additionally perform a fresh Git status check for a present card that either
          reappeared (was missing, now present) since it was last checked or whose
          GitExecutablePath setting changed, so it is not left showing a stale, indefinitely
          "not yet checked", or wrong-executable Pull-disabled state, without re-checking the
          Git status of every other already-present, unchanged-executable repo. It shall
          refuse, leaving the current settings unchanged, updated settings whose package source
          location embeds a credential, and updated settings that cannot be saved to disk.
        justification: |
          A settings change (e.g. a new package source path) must take effect immediately for
          subsequent upgrade checks, without discarding the developer's tracked repos. Because
          an already-realized card's one-time lazy Git-status-check trigger will not fire
          again, a settings change is the next opportunity to recover a card whose repo
          disappeared and reappeared while visible; a cheap-only refresh here would leave such
          a card's Pull button showing "not yet checked" until the user manually refreshes it.
          Likewise, a cached clean/dirty result computed against the previously configured Git
          executable must not keep being shown once the user has pointed AgentControl at a
          different executable, since subsequent Pull operations will use the new one. However,
          GitClient's git status check is synchronous and un-timed, so eagerly re-checking
          every tracked repo's status on every settings save (rather than only the repos that
          actually need a recheck) could block the UI thread for a large or slow/networked repo
          list.
        tests:
          - MainWindowViewModel_ApplySettings_PreservesRecentReposAndPersistsUpdatedFields
          - MainWindowViewModel_ApplySettings_InvalidatesSharedPackageVersionCache
          - MainWindowViewModel_ApplySettings_RepoReappeared_RefreshesGitStatusImmediately
          - MainWindowViewModel_ApplySettings_RepoAlreadyPresentAndChecked_DoesNotRecheckGitStatus
          - MainWindowViewModel_ApplySettings_GitExecutablePathChanged_RefreshesGitStatus
          - MainWindowViewModel_ApplySettings_SourceLocationWithEmbeddedCredential_ThrowsAndKeepsCurrentSettings
          - MainWindowViewModel_ApplySettings_SaveFails_KeepsPreviousSettingsLive

      - id: AgentControl-MainWindowViewModel-InvalidateChangedSources
        title: >-
          The MainWindowViewModel class shall, when settings are applied, discard the cached
          package results of each package source that was edited or removed, and keep those of
          sources that did not change.
        justification: |
          A cached answer for the old definition of a source must not be reused for the edited
          one, yet unrelated sources (which may be slow network locations) should not be
          queried again just because another source changed.
        tests:
          - MainWindowViewModel_ApplySettings_InvalidatesSharedPackageVersionCache
          - MainWindowViewModel_ApplySettings_OnlyEditedSourceIsInvalidated

      - id: AgentControl-MainWindowViewModel-BackgroundUpgradeCheck
        title: >-
          The MainWindowViewModel class shall not read any package source while it is being
          constructed, shall check every card's upgrade availability in the background when
          asked, when a repo is added and after settings are applied - a few cards at a time,
          with a source that cannot be read hiding nothing the readable sources offer.
        justification: |
          Starting the window must not wait for package sources, which may be slow network
          locations; one offline source must not hide the upgrade state of repos served by
          other sources.
        tests:
          - MainWindowViewModel_Constructor_DoesNotReadSourcesUntilUpgradeRefreshBegins
          - MainWindowViewModel_BeginUpgradeRefresh_OneSourceUnreachable_ReadableSourceStillOffersUpgrades
          - MainWindowViewModel_AddRepo_PinnedRepo_UpgradeCheckRunsInBackground

      - id: AgentControl-MainWindowViewModel-ConnectionTestProvider
        title: >-
          The MainWindowViewModel class shall give the settings window's connection test a
          package-source provider that signs in through the same session credentials and
          sign-in dialog as the repo cards, so that a sign-in made during a test is remembered for
          the session and not asked for again when a package is selected.
        justification: |
          A user who has typed a credential to test a server expects the application to remember
          it for the session, and to ask exactly once, wherever the next use of the server
          happens.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_ReturnsNuGetProviderWithCredentials
          - MainWindowViewModel_CreateConnectionTestProvider_NuGetSource_ReturnsNuGetProvider

      - id: AgentControl-MainWindowViewModel-GitConnectionTestProvider
        title: >-
          The MainWindowViewModel class shall give the settings window's connection test of a Git
          source a provider that runs git with the configured git executable.
        justification: |
          The connection test must use the same git as the rest of the application.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_GitSource_RunsTheConfiguredGitExecutable

      - id: AgentControl-MainWindowViewModel-GitConnectionTestInteractive
        title: >-
          The MainWindowViewModel class shall let git show its own sign-in during the settings
          window's connection test of a Git source.
        justification: |
          The connection test is something the user started, so Git's credential UI may appear.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_GitSource_ReturnsInteractiveGitProvider

      - id: AgentControl-MainWindowViewModel-GitConnectionTestRefusesOldGit
        title: >-
          The MainWindowViewModel class shall make the settings window's connection test of a Git
          source refuse a git that is older than the supported version, reporting that git is too
          old before any tag is listed.
        justification: |
          Testing with an unsupported git would fail in a way that means nothing to the user.
        tests:
          - MainWindowViewModel_CreateConnectionTestProvider_GitSource_OldGit_IsRefusedBeforeAnyTagIsListed

      - id: AgentControl-MainWindowViewModel-ApplyTheme
        title: >-
          The MainWindowViewModel class shall, once saved settings have been written, hand the
          saved theme choice to the application so it takes effect without a restart.
        justification: |
          A theme that only changes after a restart would look like a broken setting.
        tests:
          - MainWindowViewModel_ApplySettings_ThemeChanged_PersistsAndAppliesTheme

      - id: AgentControl-MainWindowViewModel-RefusedThemeNotApplied
        title: >-
          The MainWindowViewModel class shall not apply the theme of settings that were refused.
        justification: |
          A choice that was never saved must not be shown as if it had been.
        tests:
          - MainWindowViewModel_ApplySettings_SaveFails_DoesNotApplyTheme

      - id: AgentControl-MainWindowViewModel-GroupSections
        title: >-
          The MainWindowViewModel class shall, while at least one repo is in a group, order the
          displayed items as sections - a Favorites section first, then one section per group
          alphabetically ignoring letter case, then an Ungrouped section last.
        justification: |
          Sections let a long list be read by topic, with the repos the user cares about most
          first and the repos that belong to no group last.
        tests:
          - MainWindowViewModel_DisplayedItems_Groups_AreSectionedAndOrdered
          - MainWindowViewModel_Constructor_NamesDifferingInCase_FormOneSection

      - id: AgentControl-MainWindowViewModel-GroupSectionHeaders
        title: >-
          The MainWindowViewModel class shall introduce each section of repos with a header that
          shows the section's name and its number of matching repos, and shall show no header for a
          section without a repo.
        justification: |
          The header names what the section holds and how much is in it; a header with nothing
          under it would only be clutter.
        tests:
          - MainWindowViewModel_DisplayedItems_Groups_AreSectionedAndOrdered
          - MainWindowViewModel_DisplayedItems_EmptySections_HaveNoHeader

      - id: AgentControl-MainWindowViewModel-GroupSectionRepoOrder
        title: >-
          The MainWindowViewModel class shall order the repos within a section by most recent
          launch, those never launched last.
        justification: |
          Inside a section the repo used last is the one most likely wanted next.
        tests:
          - MainWindowViewModel_DisplayedItems_Groups_AreSectionedAndOrdered

      - id: AgentControl-MainWindowViewModel-FavoriteListedOnce
        title: >-
          The MainWindowViewModel class shall, while repos are in groups, list a favorite repo only
          in the Favorites section, not again in its own group, and shall keep its group.
        justification: |
          Listing a favorite once keeps every repo in exactly one place, while remembering its group
          lets it return there when it stops being a favorite.
        tests:
          - MainWindowViewModel_Favorite_IsListedOnlyUnderFavoritesAndKeepsItsGroup

      - id: AgentControl-MainWindowViewModel-FlatListWithoutGroups
        title: >-
          The MainWindowViewModel class shall, while no repo is in a group, show the displayed
          repos as one list without any header, favorites first.
        justification: |
          A user who has no groups must see the list exactly as before.
        tests:
          - MainWindowViewModel_DisplayedItems_NoGroups_FlatListWithoutHeaders

      - id: AgentControl-MainWindowViewModel-DamagedGroupSettings
        title: >-
          The MainWindowViewModel class shall show a usable list when the group names or the
          collapsed sections in the settings are damaged (a missing list, blank, reserved or
          overlong names, names that differ only in letter case) instead of failing.
        justification: |
          The settings file can be edited by hand or damaged; the application must still start and
          show every repo.
        tests:
          - MainWindowViewModel_Constructor_NullAndInvalidOrganizingSettings_FallBack
          - MainWindowViewModel_Constructor_NamesDifferingInCase_FormOneSection

      - id: AgentControl-MainWindowViewModel-GroupCollapse
        title: >-
          The MainWindowViewModel class shall collapse and expand any section (a group, Favorites
          or Ungrouped) on request, hiding the cards of a collapsed section but keeping its header
          with its count.
        justification: |
          A user collapses what they are not working on and still sees that the section is there.
        tests:
          - MainWindowViewModel_ToggleGroupCollapsed_HidesCardsAndPersists
          - MainWindowViewModel_ToggleGroupCollapsed_BuiltInSections_CollapseAndPersist
          - MainWindowViewModel_AllGroupsCollapsed_HeadersRemainAndListIsNotEmpty
          - MainWindowViewModel_ToggleGroupCollapsed_KeepsHeaderAndUnchangedCardsInPlace

      - id: AgentControl-MainWindowViewModel-GroupCollapseRemembered
        title: >-
          The MainWindowViewModel class shall remember the collapsed sections in the settings file
          so that they are still collapsed the next time the application starts.
        justification: |
          A user who collapsed a section expects it to stay that way.
        tests:
          - MainWindowViewModel_ToggleGroupCollapsed_HidesCardsAndPersists
          - MainWindowViewModel_ToggleGroupCollapsed_BuiltInSections_CollapseAndPersist

      - id: AgentControl-MainWindowViewModel-GroupCollapseKeptOnApplySettings
        title: >-
          The MainWindowViewModel class shall keep the collapsed sections when other settings are
          applied.
        justification: |
          Changing a package source or the theme must not reopen the sections the user collapsed.
        tests:
          - MainWindowViewModel_ApplySettings_KeepsCollapsedGroups

      - id: AgentControl-MainWindowViewModel-GroupFilter
        title: >-
          The MainWindowViewModel class shall, while a filter is active, show every repo that
          matches it, including those in a collapsed section.
        justification: |
          A repo the user searches for must never be hidden by the way the list is organized.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes
          - MainWindowViewModel_FilterText_NoMatch_ShowsNothing

      - id: AgentControl-MainWindowViewModel-GroupFilterCounts
        title: >-
          The MainWindowViewModel class shall, while a filter is active, show in each section's
          header the number of matching repos only.
        justification: |
          The count tells how many repos the filter found in that section, not how many the section
          holds.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes

      - id: AgentControl-MainWindowViewModel-GroupFilterOmitsEmpty
        title: >-
          The MainWindowViewModel class shall, while a filter is active, show no header for a
          section without a match.
        justification: |
          Sections the filter found nothing in are noise while the user is searching.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes
          - MainWindowViewModel_FilterText_NoMatch_ShowsNothing

      - id: AgentControl-MainWindowViewModel-GroupFilterToggleDisabled
        title: >-
          The MainWindowViewModel class shall, while a filter is active, disable the collapse
          toggles of the section headers.
        justification: |
          While searching every match is shown, so collapsing a section would do nothing visible
          and only confuse the user.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes

      - id: AgentControl-MainWindowViewModel-GroupFilterKeepsCollapsedState
        title: >-
          The MainWindowViewModel class shall leave the remembered collapsed sections unchanged
          while a filter is active, so that clearing the filter restores them.
        justification: |
          Searching must not undo how the user organized the list.
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes

      - id: AgentControl-MainWindowViewModel-GroupManagement
        title: >-
          The MainWindowViewModel class shall rename a group, moving all its repos and its
          collapsed state to the new name.
        justification: |
          Groups must be maintainable without editing a file.
        tests:
          - MainWindowViewModel_RenameGroup_MovesMembersAndRefusesBadNames

      - id: AgentControl-MainWindowViewModel-GroupRenameRules
        title: >-
          The MainWindowViewModel class shall accept a group rename that changes only the letter
          case of the group's own name, and shall refuse, changing nothing, a rename of an unknown
          group, to an invalid name or to another group's name.
        justification: |
          A rename must never merge two groups or leave a repo in a group that has an unusable
          name.
        tests:
          - MainWindowViewModel_RenameGroup_MovesMembersAndRefusesBadNames

      - id: AgentControl-MainWindowViewModel-GroupRemove
        title: >-
          The MainWindowViewModel class shall remove a group so that its repos become ungrouped and
          its collapsed state is forgotten.
        justification: |
          Removing a group removes only the grouping, never the repos in it.
        tests:
          - MainWindowViewModel_RemoveGroup_LeavesMembersUngrouped

      - id: AgentControl-MainWindowViewModel-GroupSettingsOnly
        title: >-
          The MainWindowViewModel class shall persist grouping, card color and collapsed sections to
          the settings file only, writing nothing into a repository.
        justification: |
          The user's own repositories must not be touched by how the list is organized.
        tests:
          - RepoCardViewModel_GroupAndColor_NeverWriteToTheRepository

      - id: AgentControl-MainWindowViewModel-GroupHeaderRequests
        title: >-
          The MainWindowViewModel class shall forward a section header's rename and remove requests
          to the window, with the group's name, changing nothing by itself.
        justification: |
          The window shows the name prompt or the confirmation; the list must change only after
          the user has answered.
        tests:
          - MainWindowViewModel_HeaderCommands_RaiseGroupRequestsWithTheGroupName

      - id: AgentControl-MainWindowViewModel-ChangeAppliedWhenSaved
        title: >-
          The MainWindowViewModel class shall, for every change the user makes to a repo or a section
          (favorite, group, card color, launch time, collapse, rename or removal of a group, adding
          or removing a repo), apply the change and write it to the settings file when the save
          succeeds.
        justification: |
          A change the user makes must be there the next time the application starts.
        tests:
          - MainWindowViewModel_ChangesThatSave_AreAppliedAndWritten

      - id: AgentControl-MainWindowViewModel-FailedSaveChangesNothing
        title: >-
          The MainWindowViewModel class shall, when a change the user makes cannot be saved, leave
          the settings in memory, the repo cards, the displayed list and the settings file as they
          were.
        justification: |
          A list that shows a change the file does not have would be lost at the next start without
          the user knowing; applying a change only after it was saved keeps what the user sees equal
          to what is kept.
        tests:
          - MainWindowViewModel_FavoriteSaveFails_ChangesNothingAndLaterSaveDoesNotPersistIt
          - MainWindowViewModel_MoveToGroupSaveFails_ChangesNothingAndReports
          - MainWindowViewModel_CardColorSaveFails_ChangesNothingAndReports
          - MainWindowViewModel_LaunchRecordSaveFails_StampNotRecordedAndReports
          - MainWindowViewModel_CollapseSaveFails_SectionStaysExpanded
          - MainWindowViewModel_RenameGroupSaveFails_GroupUnchanged
          - MainWindowViewModel_RemoveGroupSaveFails_GroupUnchanged
          - MainWindowViewModel_AddRepoSaveFails_NothingAdded
          - MainWindowViewModel_RemoveRepoSaveFails_RepoStaysListedAndWorking

      - id: AgentControl-MainWindowViewModel-FailedSaveNotPersistedLater
        title: >-
          The MainWindowViewModel class shall never write a change whose save failed with a later,
          unrelated save.
        justification: |
          A change the user was told was not applied must not reappear in the file because of
          something else they did afterwards.
        tests:
          - MainWindowViewModel_FavoriteSaveFails_ChangesNothingAndLaterSaveDoesNotPersistIt
          - MainWindowViewModel_AddRepoSaveFails_NothingAdded
          - MainWindowViewModel_RemoveRepoSaveFails_RepoStaysListedAndWorking

      - id: AgentControl-MainWindowViewModel-SaveFailureReported
        title: >-
          The MainWindowViewModel class shall tell the user, through a notice to the window with a
          message, when a favorite, group, card color, launch time or collapse request from a card
          or a header button could not be saved.
        justification: |
          The user pressed a button and nothing visible happened; without a message they cannot
          tell that the change was refused or why.
        tests:
          - MainWindowViewModel_FavoriteSaveFails_ChangesNothingAndLaterSaveDoesNotPersistIt
          - MainWindowViewModel_MoveToGroupSaveFails_ChangesNothingAndReports
          - MainWindowViewModel_CardColorSaveFails_ChangesNothingAndReports
          - MainWindowViewModel_LaunchRecordSaveFails_StampNotRecordedAndReports
          - MainWindowViewModel_CollapseSaveFails_SectionStaysExpanded

      - id: AgentControl-MainWindowViewModel-SaveFailureRefusesOperation
        title: >-
          The MainWindowViewModel class shall refuse the collapse of a section, the rename or removal
          of a group and the adding or removing of a repo whose save failed, by reporting the failure
          to the caller instead of returning normally.
        justification: |
          The window that called the operation tells the user; an operation that failed to save must
          not look as if it had succeeded.
        tests:
          - MainWindowViewModel_CollapseSaveFails_SectionStaysExpanded
          - MainWindowViewModel_RenameGroupSaveFails_GroupUnchanged
          - MainWindowViewModel_RemoveGroupSaveFails_GroupUnchanged
          - MainWindowViewModel_AddRepoSaveFails_NothingAdded
          - MainWindowViewModel_RemoveRepoSaveFails_RepoStaysListedAndWorking

      - id: AgentControl-MainWindowViewModel-RemoveRepoRetiresCard
        title: >-
          The MainWindowViewModel class shall, once a repo's removal was saved, retire its card so
          that nothing the card still has running reports anything afterwards.
        justification: |
          A removed repo's pending upgrade check or running operation must not show an error, release
          notes or a prompt for a repo that is no longer in the list.
        tests:
          - MainWindowViewModel_RemoveRepo_RetiresTheCard

      - id: AgentControl-MainWindowViewModel-PeriodicUpgradeRecheck
        title: >-
          The MainWindowViewModel class shall, every five minutes while it is alive once the
          re-check was started, check again the upgrade availability of each card that has a pin,
          is not busy and whose folder is not missing, without ever asking the user to sign in,
          reading each package source once per round however many cards share a package, and
          report a failure through the card's state as the check at launch does.
        justification: |
          The application is left open all day while packages are published; without a periodic
          check the upgrade badges would only show what existed when the window opened. The check
          must never interrupt the user with a dialog, and a slow source must not be read once per
          card.
        tests:
          - MainWindowViewModel_Constructor_RecheckInterval_DefaultsToFiveMinutesAndMustBePositive
          - MainWindowViewModel_PeriodicRecheck_VersionPublishedAfterLaunchCheck_ShowsUpgradeAfterInterval
          - MainWindowViewModel_PeriodicRecheck_CustomInterval_RepeatsEveryInterval
          - MainWindowViewModel_PeriodicRecheck_SeveralCardsSamePackage_ReadsTheSourceOnce
          - MainWindowViewModel_PeriodicRecheck_CardsWithNoPinOrMissingFolder_AreSkipped
          - MainWindowViewModel_PeriodicRecheck_CardIsBusy_IsSkipped
          - MainWindowViewModel_PeriodicRecheck_SourceNeedsSignIn_IsReportedOnTheCard
          - MainWindowViewModel_PeriodicRecheck_UiThreadRunnerSupplied_TickRunsThroughIt

      - id: AgentControl-MainWindowViewModel-PeriodicRecheckLifecycle
        title: >-
          The MainWindowViewModel class shall not start a periodic re-check round while the
          previous round is still running, shall run one timer however often the re-check is
          started, and shall stop the timer and cancel the running round when it is disposed.
        justification: |
          A slow source must not pile up rounds, and a closed window must not keep checking
          package sources in the background.
        tests:
          - MainWindowViewModel_PeriodicRecheck_PreviousRoundStillRunning_SkipsTheTick
          - MainWindowViewModel_StartPeriodicUpgradeRecheck_CalledTwice_RunsOneTimer
          - MainWindowViewModel_Dispose_StopsThePeriodicRecheck
          - MainWindowViewModel_Dispose_RoundRunning_CancelsIt
