---
# Software Unit Requirements for the CredentialPromptViewModel Class
#
# CredentialPromptViewModel backs the sign-in dialog that asks the user for the user name and
# password or token a package server needs. Each requirement states one observable behavior.

sections:
  - title: CredentialPromptViewModel Unit Requirements
    requirements:
      - id: AgentControl-CredentialPromptViewModel-ShowsDestination
        title: >-
          The CredentialPromptViewModel class shall tell the user which server - its scheme, host
          and port - will receive the credential and which configured source the sign-in is for.
        justification: |
          A sign-in dialog is the one place a user types a secret, so it must make plain where
          that secret goes - a phishing-resistant cue - and why it is being asked for.
        tests:
          - CredentialPromptViewModel_Constructor_ShowsOriginSourceAndSessionNote

      - id: AgentControl-CredentialPromptViewModel-InsecureHttpFlag
        title: >-
          The CredentialPromptViewModel class shall flag a server that uses plain http as
          insecure, so the dialog can warn that what is typed is not encrypted, and shall not
          flag a server that uses https.
        justification: |
          A password typed for a plain http server crosses the network unprotected; the user must
          be warned, but a warning shown for every server would be ignored.
        tests:
          - CredentialPromptViewModel_Constructor_ShowsOriginSourceAndSessionNote

      - id: AgentControl-CredentialPromptViewModel-SessionOnlyNote
        title: >-
          The CredentialPromptViewModel class shall provide the statement that the credential is
          used for this session only and is not saved by AgentControl, for as long as the user has
          not chosen to remember the sign-in.
        justification: |
          The user must know that AgentControl itself does not keep the secret beyond the
          session, so they can judge whether to type it.
        tests:
          - CredentialPromptViewModel_Constructor_ShowsOriginSourceAndSessionNote
          - CredentialPromptViewModel_Remember_TickedWhenAvailable_AnswersWithRememberAndChangesTheNote

      - id: AgentControl-CredentialPromptViewModel-PreviousCredentialRejected
        title: >-
          The CredentialPromptViewModel class shall tell the user when the credential they
          entered earlier for this server was rejected, so they know why they are being asked
          again, and shall not show that warning on a first request.
        justification: |
          Being asked for the same sign-in twice with no explanation looks like a fault; saying
          that the last attempt did not work tells the user to check what they typed, while a
          warning on a first request would be false.
        tests:
          - CredentialPromptViewModel_Constructor_PreviousCredentialRejected_ShowsWarningOnlyWhenRejected

      - id: AgentControl-CredentialPromptViewModel-RememberOption
        title: >-
          The CredentialPromptViewModel class shall offer the choice "Remember on this computer
          (saved by your Git credential helper)", unticked by default, when the question says a
          credential helper can keep the sign-in.
        justification: |
          Keeping a sign-in beyond the session is a decision with security consequences, so it
          must be an explicit, off-by-default choice.
        tests:
          - CredentialPromptViewModel_Remember_TickedWhenAvailable_AnswersWithRememberAndChangesTheNote

      - id: AgentControl-CredentialPromptViewModel-RememberUnavailable
        title: >-
          The CredentialPromptViewModel class shall show the remember choice disabled, with an
          explanation of why, when the question says no credential helper can keep the sign-in.
        justification: |
          Hiding the option would leave the user unaware that it exists; showing it enabled would
          be a promise the application cannot honor.
        tests:
          - CredentialPromptViewModel_Remember_NoCredentialHelper_IsDisabledAndNeverRemembers

      - id: AgentControl-CredentialPromptViewModel-RememberNeverWithoutHelper
        title: >-
          The CredentialPromptViewModel class shall never answer that the credential is to be
          remembered when no credential helper can keep the sign-in, even if the user tries to
          tick the choice.
        justification: |
          An answer that asks for something that cannot be done would have to be refused or
          silently ignored later; it must not be possible to give it.
        tests:
          - CredentialPromptViewModel_Remember_NoCredentialHelper_IsDisabledAndNeverRemembers

      - id: AgentControl-CredentialPromptViewModel-RememberAnswer
        title: >-
          The CredentialPromptViewModel class shall answer with the user's remember choice
          together with the credential.
        justification: |
          The remember decision is made in the same dialog as the credential, so it must travel
          with it for the credential to be kept, or not, as the user decided.
        tests:
          - CredentialPromptViewModel_Remember_TickedWhenAvailable_AnswersWithRememberAndChangesTheNote
          - CredentialPromptViewModel_SignIn_EnteredCredential_CompletesOnceWithTrimmedUserName

      - id: AgentControl-CredentialPromptViewModel-RememberNote
        title: >-
          The CredentialPromptViewModel class shall state, once the remember choice is ticked,
          that the sign-in is saved by the user's Git credential helper and not by AgentControl.
        justification: |
          The user must be told who keeps the secret at the moment they decide to keep it.
        tests:
          - CredentialPromptViewModel_Remember_TickedWhenAvailable_AnswersWithRememberAndChangesTheNote

      - id: AgentControl-CredentialPromptViewModel-SignInRequiresBoth
        title: >-
          The CredentialPromptViewModel class shall permit signing in only when both a user name
          and a password have been entered.
        justification: |
          An incomplete credential would only provoke a second rejection from the server.
        tests:
          - CredentialPromptViewModel_CanSignIn_NeedsUserNameAndPassword

      - id: AgentControl-CredentialPromptViewModel-SignIn
        title: >-
          The CredentialPromptViewModel class shall answer, when the user signs in, with the
          credential they entered, the user name trimmed of surrounding spaces.
        justification: |
          A stray space around a pasted user name would fail for no visible reason.
        tests:
          - CredentialPromptViewModel_SignIn_EnteredCredential_CompletesOnceWithTrimmedUserName

      - id: AgentControl-CredentialPromptViewModel-PasswordVerbatim
        title: >-
          The CredentialPromptViewModel class shall answer with the password exactly as typed,
          spaces included.
        justification: |
          A password altered by trimming would fail for no visible reason.
        tests:
          - CredentialPromptViewModel_SignIn_EnteredCredential_CompletesOnceWithTrimmedUserName

      - id: AgentControl-CredentialPromptViewModel-Cancel
        title: >-
          The CredentialPromptViewModel class shall answer with no credential when the user
          cancels.
        justification: |
          Every way out of the dialog must be an answer, so the operation that asked is never
          left waiting.
        tests:
          - CredentialPromptViewModel_Cancel_CompletesWithNoCredential

      - id: AgentControl-CredentialPromptViewModel-AnswerOnce
        title: >-
          The CredentialPromptViewModel class shall answer exactly once, however many times the
          user signs in or cancels.
        justification: |
          An answer given twice could be mistaken for the answer to two separate questions.
        tests:
          - CredentialPromptViewModel_SignIn_EnteredCredential_CompletesOnceWithTrimmedUserName
          - CredentialPromptViewModel_Cancel_CompletesWithNoCredential
