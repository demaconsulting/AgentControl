---
# Software Unit Requirements for the SettingsWindowViewModel Class
#
# SettingsWindowViewModel backs the settings dialog: the list of package sources (add, edit and
# remove), git executable override, agent tool selection, and shell preference.

sections:
  - title: SettingsWindowViewModel Unit Requirements
    requirements:
      - id: AgentControl-SettingsWindowViewModel-Seed
        title: >-
          The SettingsWindowViewModel class shall seed its editable properties from the
          current application settings on construction, and shall reject a null initial
          settings value.
        justification: |
          The settings dialog must open showing the developer's actual current configuration,
          not blank or default values, and must fail fast if constructed without a settings
          value to seed from.
        tests:
          - SettingsWindowViewModel_Constructor_SeedsPropertiesFromInitialSettings
          - SettingsWindowViewModel_Constructor_NullInitial_ThrowsArgumentNullException

      - id: AgentControl-SettingsWindowViewModel-CustomAgentTool
        title: >-
          The SettingsWindowViewModel class shall indicate a custom agent tool is selected
          only when the agent tool value is not one of the well-known built-in tools.
        justification: |
          Drives the UI to reveal a custom-command entry field only when needed, keeping the
          common case (a well-known built-in tool) simple.
        tests:
          - SettingsWindowViewModel_IsCustomAgentToolSelected_WellKnownTool_ReturnsFalse
          - SettingsWindowViewModel_AgentTool_SetToCustom_TogglesIsCustomAgentToolSelected

      - id: AgentControl-SettingsWindowViewModel-Save
        title: >-
          The SettingsWindowViewModel class shall, on save, pass its current property values
          and its list of package sources to its owner and signal that settings were saved,
          except that it shall refuse to save, showing an explanation, a package source
          location that embeds a credential, and except that it shall keep the window open
          showing the reason, without signaling a save, when its owner rejects the settings.
        justification: |
          Persisting settings and notifying the caller must happen together so the main window
          can immediately apply the new configuration (e.g. invalidate cached package
          versions) after a save; a credential typed into a location must be stopped where the
          user can correct it, because AgentControl never stores secrets; a failed save must
          be explained where the user can react rather than escape as an unhandled error.
        tests:
          - SettingsWindowViewModel_SaveCommand_Execute_InvokesOnSaveWithCurrentValuesAndRaisesSaved
          - SettingsWindowViewModel_Save_SourceLocationWithEmbeddedCredential_IsRefusedWithErrorMessage
          - SettingsWindowViewModel_SaveCommand_OnSaveThrowsInvalidOperation_ShowsErrorAndDoesNotRaiseSaved

      - id: AgentControl-SettingsWindowViewModel-ShellPreferencePresets
        title: >-
          The SettingsWindowViewModel class shall expose an OS-appropriate, non-empty list of
          shell/terminal preference presets with a blank auto-detect entry first and no
          duplicate entries, while continuing to accept a freeform custom entry.
        justification: |
          Presenting the recognized shell executables for the developer's current OS lets them
          pick a valid preference without having to know or type an exact executable name,
          while the blank first entry preserves the existing auto-detect default and the
          control remaining editable preserves support for a shell not in the preset list.
        tests:
          - SettingsWindowViewModel_AvailableShellPreferences_IsNonEmptyWithBlankFirstEntry
          - SettingsWindowViewModel_AvailableShellPreferences_NoDuplicateEntries
          - SettingsWindowViewModel_AvailableShellPreferences_CurrentOs_ContainsExpectedPresets

      - id: AgentControl-SettingsWindowViewModel-SourceList
        title: >-
          The SettingsWindowViewModel class shall list every configured package source in order
          with its alias, kind and location - presenting a previously configured single
          package-source folder as the source named Default - and shall show, without blocking
          the caller, whether each source's folder can currently be found, treating a folder
          that cannot be examined as not found and abandoning checks still running when the
          window is disposed, and shall show a server source as an online source (a neutral status) instead of
          contacting it.
        justification: |
          A developer must see what is configured and whether it is usable at a glance; a folder
          check against a network share that does not answer must never freeze the window, and
          a server that may need a sign-in must not be contacted just to draw the list.
        tests:
          - SettingsWindowViewModel_Constructor_ListsConfiguredSourcesInOrder
          - SettingsWindowViewModel_Constructor_NoSources_ReportsHasNoSources
          - SettingsWindowViewModel_Constructor_FolderCheckSlow_ShowsCheckingThenResultWithoutBlocking
          - SettingsWindowViewModel_FolderCheck_MissingOrFailing_ShowsMissing
          - SettingsWindowViewModel_Dispose_CancelsPendingFolderChecks
          - SettingsWindowViewModel_SaveServerSource_ListsItAsOnlineSourceAndPersistsIt

      - id: AgentControl-SettingsWindowViewModel-AddSource
        title: >-
          The SettingsWindowViewModel class shall let the user add a zip-package folder source,
          a NuGet-package folder source or a NuGet-package server source, keeping the package IDs
          of a NuGet source.
        justification: |
          Sources are added over time, and a NuGet source that lost its package IDs on being added
          would offer nothing.
        tests:
          - SettingsWindowViewModel_AddCommands_RaiseEditorRequestedForNewSourceOfEachKind
          - SettingsWindowViewModel_AddZipSource_EditorSaved_AddsAndSelectsSource
          - SettingsWindowViewModel_AddNuGetFolderSource_EditorSaved_KeepsPackageIds
          - SettingsWindowViewModel_AddNuGetServerSourceCommand_RequestsServerEditor

      - id: AgentControl-SettingsWindowViewModel-AddGitSourceMenu
        title: >-
          The SettingsWindowViewModel class shall let the user add a Git repository source, as the
          fourth kind of source of the Add menu, by opening the source editor for a new Git source.
        justification: |
          Teams that keep their agent packages in a Git repository add it the same way as any other
          source, from the one Add menu; the editor decides what a Git source needs.
        tests:
          - SettingsWindowViewModel_AddGitSourceCommand_RequestsGitEditor

      - id: AgentControl-SettingsWindowViewModel-RefuseInvalidGitSource
        title: >-
          The SettingsWindowViewModel class shall refuse to save, showing an explanation, a Git
          source whose tag pattern the application would not accept.
        justification: |
          A settings file edited by hand, or a source that predates a rule, must be stopped where the
          user can correct it rather than fail later when the source is used.
        tests:
          - SettingsWindowViewModel_Save_GitSourceWithBadTagPattern_IsRefusedWithErrorMessage

      - id: AgentControl-SettingsWindowViewModel-RefuseInvalidGitAddress
        title: >-
          The SettingsWindowViewModel class shall refuse to save, showing an explanation that does
          not repeat the address, a Git source whose repository address the application would not
          accept.
        justification: |
          An address that embeds a credential or cannot be reached by git must be stopped where the
          user can correct it, and the explanation must not leak what was typed.
        tests:
          - SettingsWindowViewModel_Save_GitSourceWithBadAddress_IsRefusedWithErrorMessage

      - id: AgentControl-SettingsWindowViewModel-RefuseInvalidGitSubfolder
        title: >-
          The SettingsWindowViewModel class shall refuse to save, showing an explanation, a Git
          source whose folder inside the repository the application would not accept.
        justification: |
          A folder that leaves the repository must be stopped where the user can correct it.
        tests:
          - SettingsWindowViewModel_Save_GitSourceWithBadSubfolder_IsRefusedWithErrorMessage

      - id: AgentControl-SettingsWindowViewModel-RefuseInvalidGitPackageName
        title: >-
          The SettingsWindowViewModel class shall refuse to save, showing an explanation, a Git
          source whose package name the application would not accept.
        justification: |
          Repos pin to the package name, so a name the application would later refuse must be
          stopped where the user can correct it.
        tests:
          - SettingsWindowViewModel_Save_GitSourceWithBadPackageName_IsRefusedWithErrorMessage

      - id: AgentControl-SettingsWindowViewModel-GitSourceRowStatus
        title: >-
          The SettingsWindowViewModel class shall list a Git source on a remote address as an
          online source (a neutral status), without contacting it.
        justification: |
          A remote repository may need the network and a sign-in, so it is contacted only when the
          user asks (the editor's Test connection); saying "not checked" would look like an error.
        tests:
          - SettingsWindowViewModel_SaveGitSource_ListsItAsOnlineSourceAndPersistsIt

      - id: AgentControl-SettingsWindowViewModel-GitSourceLocalFolderStatus
        title: >-
          The SettingsWindowViewModel class shall list a Git source on a local path with the status
          of its folder.
        justification: |
          A local repository is a folder like any other and its presence can be shown without cost.
        tests:
          - SettingsWindowViewModel_GitSourceWithLocalPath_ShowsFolderStatus

      - id: AgentControl-SettingsWindowViewModel-GitSourcePersisted
        title: >-
          The SettingsWindowViewModel class shall keep a saved Git source's address, tag pattern,
          folder and package name in the settings it saves.
        justification: |
          What the user entered in the editor is the source that is configured.
        tests:
          - SettingsWindowViewModel_SaveGitSource_PersistsAddressPatternFolderAndPackageName

      - id: AgentControl-SettingsWindowViewModel-EditSource
        title: >-
          The SettingsWindowViewModel class shall let the user edit the selected source in place,
          keeping its alias, and shall carry settings it does not show through the edit unchanged.
        justification: |
          Sources are corrected over time, but each repo card remembers the source that supplies its
          package by alias, so an edit must never rename it or lose settings that are managed
          elsewhere.
        tests:
          - SettingsWindowViewModel_EditSource_EditorSaved_ReplacesSourceInPlaceKeepingAlias
          - SettingsWindowViewModel_EditServerSource_OpensServerEditorThatTestsThroughTheFactory

      - id: AgentControl-SettingsWindowViewModel-RemoveSource
        title: >-
          The SettingsWindowViewModel class shall let the user remove the selected source, and
          shall describe - before the removal - how many repos get their package from it and that
          they will use another configured source that delivers the identical files, or else show a
          package source problem.
        justification: |
          Removing a source that repos get their package from is allowed (a repo's pin names no
          source) but the developer must be told what will happen to those repos first.
        tests:
          - SettingsWindowViewModel_RemoveSourceCommand_RaisesRemoveRequestedForSelectedSource
          - SettingsWindowViewModel_RemoveSource_WarnsAboutPinnedReposAndRemoves
          - SettingsWindowViewModel_RemoveGitSource_WarnsAboutPinnedRepos

      - id: AgentControl-SettingsWindowViewModel-SaveResultingSources
        title: >-
          The SettingsWindowViewModel class shall, on save, pass the sources that result from the
          user's additions, edits and removals to its owner in their listed order.
        justification: |
          What the developer sees in the list after changing it is what must be persisted.
        tests:
          - SettingsWindowViewModel_Save_AfterAddEditRemove_WritesResultingSourcesInOrder

      - id: AgentControl-SettingsWindowViewModel-AliasUnique
        title: >-
          The SettingsWindowViewModel class shall refuse a new source whose alias equals an
          already configured alias when compared ignoring case.
        justification: |
          Repos pin to a source by alias, so two sources with the same alias would make a pin
          ambiguous.
        tests:
          - SettingsWindowViewModel_AddSource_AliasAlreadyConfiguredIgnoringCase_EditorCannotSave

      - id: AgentControl-SettingsWindowViewModel-Appearance
        title: >-
          The SettingsWindowViewModel class shall offer the theme choices system default, light
          and dark, in that order.
        justification: |
          The user decides whether the application follows the operating system or always uses
          one theme.
        tests:
          - SettingsWindowViewModel_Theme_DefaultsToSystemAndIsSavedWithSettings

      - id: AgentControl-SettingsWindowViewModel-AppearanceStartsFromSaved
        title: >-
          The SettingsWindowViewModel class shall start with the theme that was saved, and with
          the system default when none was saved.
        justification: |
          The window must show the user's current choice, and a settings file from before the
          theme existed means the application follows the operating system.
        tests:
          - SettingsWindowViewModel_Theme_DefaultsToSystemAndIsSavedWithSettings

      - id: AgentControl-SettingsWindowViewModel-AppearanceSaved
        title: >-
          The SettingsWindowViewModel class shall pass the chosen theme to its owner with the
          other settings on save.
        justification: |
          The choice must be saved with the rest of the settings, or it would be lost at the next
          start.
        tests:
          - SettingsWindowViewModel_Theme_DefaultsToSystemAndIsSavedWithSettings
