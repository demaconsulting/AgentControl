---
# Software Unit Requirements for the GlobalProgressViewModel Class
#
# GlobalProgressViewModel backs the main window's global progress strip under the app bar: the
# thin bar, the short status text and the Cancel button shown while a bulk operation (adding
# repositories, reading the cards at start-up, refreshing the cards after a settings save) runs. Which operations report to it
# is the MainWindowViewModel unit's.

sections:
  - title: GlobalProgressViewModel Unit Requirements
    requirements:
      - id: AgentControl-GlobalProgressViewModel-IdleHidden
        title: >-
          The GlobalProgressViewModel class shall report itself as not shown, with no text and no
          Cancel, while no operation runs, including once every operation has ended.
        justification: |
          The strip must take no space and say nothing when no bulk work runs, so the idle window
          looks as it always did.
        tests:
          - GlobalProgressViewModel_Idle_IsInactiveWithNoText
          - GlobalProgressViewModel_AllEnded_ReturnsToIdle

      - id: AgentControl-GlobalProgressViewModel-ShowsOperation
        title: >-
          The GlobalProgressViewModel class shall, when an operation begins, report itself as shown
          with the operation's text and without an amount (indeterminate).
        justification: |
          The amount of work is often unknown at first; the user must still see at once that work
          has started.
        tests:
          - GlobalProgressViewModel_Begin_ShowsIndeterminateText

      - id: AgentControl-GlobalProgressViewModel-ReportsAmount
        title: >-
          The GlobalProgressViewModel class shall show how much of an operation is done out of how
          much (determinate) with the text the operation gives, and go back to indeterminate for a
          step whose amount is unknown.
        justification: |
          A count tells the user how long a large add will take; a step such as saving has no
          count.
        tests:
          - GlobalProgressViewModel_Report_ShowsCountsDeterminate

      - id: AgentControl-GlobalProgressViewModel-CancelOnce
        title: >-
          The GlobalProgressViewModel class shall offer Cancel for an operation that can be
          canceled, run the operation's cancel once when Cancel is chosen, and stop offering Cancel
          afterwards.
        justification: |
          Pressing Cancel twice must not cancel twice, and a Cancel button that does nothing more
          must not stay on screen.
        tests:
          - GlobalProgressViewModel_CancelableOperation_CancelCommandCancelsOnce

      - id: AgentControl-GlobalProgressViewModel-NoCancelWhenNotCancelable
        title: >-
          The GlobalProgressViewModel class shall not offer Cancel for an operation that cannot be
          canceled, or for a step of an operation during which it cannot be canceled.
        justification: |
          A Cancel button that cannot stop anything (a refresh that only reads, a save already
          under way) would mislead the user.
        tests:
          - GlobalProgressViewModel_NotCancelable_CancelCommandDisabled

      - id: AgentControl-GlobalProgressViewModel-OverlappingOperations
        title: >-
          The GlobalProgressViewModel class shall show, when operations overlap, the most recently
          begun running operation that can still be canceled or, when none can, the most recently
          begun running operation, and the operation that should be shown next, in its latest state,
          when the shown one ends or was canceled.
        justification: |
          An add can start while the cards still refresh after a settings save, and the cards can
          start refreshing while an add runs; the strip must show one operation at a time and never
          lose the other, and the add's Cancel must stay offered while the cards refresh.
        tests:
          - GlobalProgressViewModel_OverlappingOperations_ShowsLatestThenPrevious
          - GlobalProgressViewModel_OverlappingOperations_CancelableOperationStaysShownOverNewerOne

      - id: AgentControl-GlobalProgressViewModel-AccessibleName
        title: >-
          The GlobalProgressViewModel class shall give the progress bar the shown operation's text
          as its name for screen readers.
        justification: |
          A progress bar announced without a name tells a screen-reader user nothing about what is
          running.
        tests:
          - GlobalProgressViewModel_Begin_ShowsIndeterminateText
