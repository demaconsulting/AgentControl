---
# Software Unit Requirements for the RepoCardViewModel Class
#
# RepoCardViewModel backs a single repo's card in the main window: it tracks the repo's pin,
# git status, and upgrade availability, and drives launch/pull/upgrade/select-package/favorite/
# remove actions for that repo.

sections:
  - title: RepoCardViewModel Unit Requirements
    requirements:
      - id: AgentControl-RepoCardViewModel-DisplayInfo
        title: >-
          The RepoCardViewModel class shall expose the repo's leaf folder name as its display
          name, and - when a pin file exists - a chip text naming the pinned package and its
          version together with a tooltip and icon that say which configured source it came
          from and of what kind (a zip folder, a NuGet folder or a NuGet server, or not
          configured), the source's alias as text beside the icon so the source is recognizable
          at a glance, and - when no package is pinned - a distinct "no agent package" state.
        justification: |
          A developer identifies a repo card primarily by its folder name; the chip tells them
          at a glance which agent package, which version and from where, instead of an
          unlabeled version number.
        tests:
          - RepoCardViewModel_RepoName_ReturnsLeafFolderName
          - RepoCardViewModel_Refresh_PinFileExists_PopulatesPinnedFields
          - RepoCardViewModel_PackageChip_PinnedToZipSource_ShowsNameVersionAndSourceInTooltip
          - RepoCardViewModel_PackageChip_PinnedToNuGetFolderSource_ShowsNuGetFolderIconAndKind
          - RepoCardViewModel_PinnedToServerSource_ChipShowsAliasAndServerIcon
          - RepoCardViewModel_PackageChip_PinnedSourceNotConfigured_ShowsUnknownSource
          - RepoCardViewModel_NoPackageChip_NeverPinnedRepo_ShowsNoPackageChipOnly
          - RepoCardViewModel_Chips_MissingRepo_ShowNeitherPackageChip

      - id: AgentControl-RepoCardViewModel-UpgradeBadge
        title: >-
          The RepoCardViewModel class shall indicate an upgrade is available only when the
          pinned package's source has a version newer than the repo's pinned version, and shall
          then expose the version an upgrade would move to and a tooltip naming both versions.
        justification: |
          Prevents the upgrade chip from appearing when the repo is already current, or when
          no package source is configured to compare against; naming the target version tells
          the developer what the upgrade is.
        tests:
          - RepoCardViewModel_Refresh_NewerVersionAtSource_SetsUpgradeAvailableTrue
          - RepoCardViewModel_Refresh_AlreadyOnLatestVersion_SetsUpgradeAvailableFalse
          - RepoCardViewModel_Refresh_NoPackageSourceConfigured_SetsUpgradeAvailableFalse
          - RepoCardViewModel_UpgradeChip_NewerVersionAtSource_ShowsTargetVersionAndTooltipWithBothVersions

      - id: AgentControl-RepoCardViewModel-LaunchLabel
        title: >-
          The RepoCardViewModel class shall label its Launch action with the short name of the
          configured agent tool, falling back to a plain "Launch" when the tool has no usable
          short name or the name is too long, and shall update the label when the configured
          tool changes.
        justification: |
          A button that names the tool it will start is clearer than a generic one, but a long
          command name must not widen the card's buttons.
        tests:
          - RepoCardViewModel_LaunchButtonText_ConfiguredTool_NamesToolOrFallsBack
          - RepoCardViewModel_LaunchButtonText_AgentToolChanged_UpdatesAfterRefreshCheap

      - id: AgentControl-RepoCardViewModel-ResponsiveOperations
        title: >-
          The RepoCardViewModel class shall read package sources and apply packages without
          blocking its caller.
        justification: |
          A slow or unreachable source must never freeze the window.
        tests:
          - RepoCardViewModel_RefreshUpgradeStatusAsync_SourceSlow_DoesNotBlockAndShowsChecking
          - RepoCardViewModel_ApplySelectedPackageAsync_SourceSlow_ReturnsToCallerBeforeSourceAnswers

      - id: AgentControl-RepoCardViewModel-OperationBusyState
        title: >-
          The RepoCardViewModel class shall report that an operation is running, with a message
          saying which, and disable the card's other actions while it runs.
        justification: |
          The user must be able to see that the card is working and must not be able to start a
          second, conflicting action on the same repo meanwhile.
        tests:
          - RepoCardViewModel_ApplySelectedPackageAsync_Running_ReportsBusyAndDisablesOtherActions

      - id: AgentControl-RepoCardViewModel-OneOperationAtATime
        title: >-
          The RepoCardViewModel class shall ignore a second request for an operation while one is
          running.
        justification: |
          A double click must not apply a package twice.
        tests:
          - RepoCardViewModel_ApplySelectedPackageAsync_SecondCallWhileRunning_IsIgnored

      - id: AgentControl-RepoCardViewModel-CancelOperation
        title: >-
          The RepoCardViewModel class shall let the user cancel a cancellable operation without
          reporting an error or changing the repo's pin.
        justification: |
          A source that never answers must not trap the user in a wait they cannot leave, and
          giving up must leave the repo exactly as it was.
        tests:
          - RepoCardViewModel_ApplySelectedPackageAsync_CancelledWhileRunning_ReportsNoErrorAndKeepsPinUnchanged
          - RepoCardViewModel_RefreshUpgradeStatusAsync_Cancelled_ThrowsAndKeepsPreviousState

      - id: AgentControl-RepoCardViewModel-SupersededUpgradeCheck
        title: >-
          The RepoCardViewModel class shall let a newer upgrade check supersede an older one that
          is still waiting, discarding the older check's late answer.
        justification: |
          An answer that arrives after the sources changed must not overwrite the newer state.
        tests:
          - RepoCardViewModel_RefreshUpgradeStatusAsync_NewerCheckStarted_OlderResultIsDiscarded

      - id: AgentControl-RepoCardViewModel-PullGating
        title: >-
          The RepoCardViewModel class shall permit pulling only when the repo's working tree
          is clean, and shall treat a git status failure as pull-not-permitted without
          throwing.
        justification: |
          Pulling into a dirty working tree risks merge conflicts AgentControl cannot resolve;
          a git failure (e.g. not a repo, git not found) must degrade gracefully rather than
          crash the UI.
        children:
          - AgentControl-RepoCardViewModel-PullDisabledExplanation
        tests:
          - RepoCardViewModel_Refresh_CleanWorkingTree_SetsCanPullTrue
          - RepoCardViewModel_Refresh_DirtyWorkingTree_SetsCanPullFalse
          - RepoCardViewModel_Refresh_GitStatusFails_SetsCanPullFalseWithoutThrowing

      - id: AgentControl-RepoCardViewModel-PullDisabledExplanation
        title: >-
          The RepoCardViewModel class shall expose why the Pull action is currently disabled
          (a confirmed dirty working tree, a missing repo, a git status check that could not
          be completed, or a git status check that has not yet run) via a tooltip and a
          dedicated "dirty working tree" indicator that is shown only for a confirmed dirty
          working tree, rather than silently hiding the Pull action with no explanation or
          conflating a status-check failure or a not-yet-checked status with a confirmed dirty
          working tree; this status must never go stale after a repo temporarily disappears
          and reappears.
        justification: |
          A Pull button that disappears with no on-screen explanation whenever the repo has
          routine untracked/uncommitted content (such as a freshly-committed
          .agentcontrol.json pin file) leaves the developer unable to tell whether the feature
          is missing, broken, or merely disabled for a reason - the same "stay visible,
          disable, explain" pattern already used for Launch/Upgrade/Select-Package when the
          repo is missing. Telling a user to "commit or discard changes" when git status could
          not actually be read (e.g. the folder is not a git repository), or before the
          working-tree check has even run once (it is lazy/deferred by design), would be
          misleading, so both cases are tracked and explained separately from a confirmed
          dirty working tree. A repo that disappears and reappears (e.g. a removable drive
          being disconnected and reconnected) must not keep reporting its pre-disappearance
          Git status as current, since the working tree could have changed while the card was
          unable to check it.
        tests:
          - RepoCardViewModel_BeforeFirstGitStatusCheck_DoesNotReportDirty
          - RepoCardViewModel_Refresh_CleanWorkingTree_SetsCanPullTrue
          - RepoCardViewModel_Refresh_DirtyWorkingTree_SetsCanPullFalse
          - RepoCardViewModel_Refresh_GitStatusFails_SetsCanPullFalseWithoutThrowing
          - RepoCardViewModel_RefreshCheap_RepoPathDoesNotExist_SetsIsMissingAndSuppressesOtherState
          - RepoCardViewModel_RepoReappearsAfterBeingMissing_InvalidatesStaleGitStatusInsteadOfReportingIt

      - id: AgentControl-RepoCardViewModel-Pull
        title: >-
          The RepoCardViewModel class shall pull the repo's latest commits and report
          success or failure via a status message.
        justification: |
          The developer needs immediate feedback on whether the pull succeeded, and if not,
          why, without needing to inspect a terminal.
        tests:
          - RepoCardViewModel_PullCommand_SuccessfulPull_UpdatesStatusMessage
          - RepoCardViewModel_PullCommand_FailedPull_SetsFailureStatusMessage

      - id: AgentControl-RepoCardViewModel-Launch
        title: >-
          The RepoCardViewModel class shall launch the configured agent tool in the repo's
          working directory, recording the launch timestamp on success, shall launch even when
          the user cancels the wait for the pre-launch sync, and shall raise an
          error when no agent tool command is configured.
        justification: |
          Launch is the primary action of AgentControl; the launch timestamp feeds the
          most-recently-launched sort order, and a missing configuration must be surfaced
          rather than silently doing nothing.
        tests:
          - RepoCardViewModel_LaunchCommand_Succeeds_RecordsLaunchTimestampAndRaisesLaunchRecorded
          - RepoCardViewModel_LaunchCommand_NoCommandConfigured_RaisesErrorOccurred
          - RepoCardViewModel_LaunchCommand_PreLaunchSyncCancelledByUser_StillLaunches

      - id: AgentControl-RepoCardViewModel-EnsureSyncedBeforeLaunch
        title: >-
          The RepoCardViewModel class shall make a best-effort attempt to sync the repo's
          agent files with its pinned package version before launch, re-extracting them only
          when they are missing, but shall never prevent the launch from proceeding: it shall
          skip the sync attempt entirely when the repo has committed agent files or has no
          pinned package, and shall treat a failed re-extraction as a non-blocking warning
          rather than a launch-blocking error.
        justification: |
          Launching the configured agentic CLI tool must never be blocked by agent-package
          sync state - a user may want the tool's help migrating away from committed agent
          files, or may simply find the tool useful with no managed agent files present at
          all. Sync remains a best-effort, informational side action that keeps the agent
          tool's files current when it safely can, without ever standing in the way of the
          launch itself.
        tests:
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_NoPin_ReturnsTrueWithInformationalStatusMessage
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_HasCommittedAgentFiles_SkipsSyncEntirelyAndReturnsTrue
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_PinnedAndFoldersPresent_ReturnsTrueWithoutReExtracting
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_PinnedButFoldersMissing_ReExtractsPinnedVersionOnly
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_PinnedVersionMissingFromSource_ReturnsFalse
          - RepoCardViewModel_LaunchCommand_SyncFailsOrNoPin_StillLaunches

      - id: AgentControl-RepoCardViewModel-Upgrade
        title: >-
          The RepoCardViewModel class shall, when a newer package version is available,
          update the repo's pin and extract the new version's agent files, then signal that
          release notes are ready to display.
        justification: |
          Upgrading must both update the persisted pin and physically sync the new agent
          files, and must alert the developer to review what changed in the new version.
        tests:
          - RepoCardViewModel_UpgradeCommand_NewerVersionAvailable_UpdatesPinAndRaisesReleaseNotesReady
          - RepoCardViewModel_UpgradeCommand_NoPackageSourceConfigured_RaisesErrorOccurred

      - id: AgentControl-RepoCardViewModel-SelectPackage
        title: >-
          The RepoCardViewModel class shall offer package selection only when the repo has no
          existing pin and is not missing, and shall require a configured package source
          before requesting selection.
        justification: |
          Selecting an initial package only makes sense for a repo that is present on disk and
          not already pinned; without a configured source there is nothing to select from.
        tests:
          - RepoCardViewModel_IsPackageSelectionNeeded_ReflectsPinState
          - RepoCardViewModel_SelectPackageCommand_PinAlreadyExists_CannotExecute
          - RepoCardViewModel_SelectPackageCommand_RepoIsMissing_CannotExecute
          - RepoCardViewModel_SelectPackageCommand_NoPackageSourceConfigured_RaisesErrorOccurredOnly
          - RepoCardViewModel_SelectPackageCommand_SourceConfigured_RaisesSelectPackageRequestedWithSourceAlias

      - id: AgentControl-RepoCardViewModel-ApplySelectedPackage
        title: >-
          The RepoCardViewModel class shall, given a chosen package name and version, set the
          repo's pin and extract that version's agent files, and shall reject a version no
          longer available at the source without mutating the existing pin.
        justification: |
          Applies the outcome of the package-selection window while protecting the repo's
          existing pin state from a stale or now-invalid selection. A corrupt/unreadable
          existing pin file must not abort an otherwise-successful apply, since the extraction
          it guards against aborting has already completed by the time the pin is rewritten.
        tests:
          - RepoCardViewModel_ApplySelectedPackage_ValidNameAndVersion_UpdatesPinAndExtractsAndRaisesReleaseNotesReady
          - RepoCardViewModel_ApplySelectedPackage_VersionNoLongerAtSource_RaisesErrorOccurredWithoutMutatingPin
          - RepoCardViewModel_ApplySelectedPackage_CorruptExistingPinFile_StillAppliesAndWritesNewPin

      - id: AgentControl-RepoCardViewModel-AgentsMdTemplateOffer
        title: >-
          The RepoCardViewModel class shall, after a successful extraction during package
          selection, upgrade, or the ensure-synced-before-launch re-extraction, offer the
          package's optional root-level AGENTS.md template to the user only when the repo has
          no AGENTS.md file of its own, the package has a template to offer, and the user has
          not previously declined the offer for this repo.
        justification: |
          A package may ship a starting AGENTS.md template for a repo that lacks one, but
          AgentControl must never overwrite a developer's own AGENTS.md, must never nag a user
          who has already declined, and must only ever prompt when a genuine sync just
          happened - never as a standing per-launch check - so the prompt stays rare,
          predictable, and tied to an action the user already initiated.
        children:
          - AgentControl-RepoCardViewModel-AcceptAgentsMdTemplate
          - AgentControl-RepoCardViewModel-DeclineAgentsMdTemplate
        tests:
          - RepoCardViewModel_ApplySelectedPackage_NoAgentsMdAndPackageHasTemplate_RaisesAgentsMdTemplateOfferRequestedWithContent
          - RepoCardViewModel_ApplySelectedPackage_AgentsMdAlreadyExists_DoesNotRaiseAgentsMdTemplateOfferRequested
          - RepoCardViewModel_ApplySelectedPackage_PackageHasNoAgentsMdTemplate_DoesNotRaiseAgentsMdTemplateOfferRequested
          - RepoCardViewModel_ApplySelectedPackage_PreviouslyDeclined_DoesNotRaiseAgentsMdTemplateOfferRequestedAgain
          - RepoCardViewModel_UpgradeCommand_NoAgentsMdAndPackageHasTemplate_RaisesAgentsMdTemplateOfferRequestedWithContent
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_ReExtractsAndPackageHasTemplate_RaisesAgentsMdTemplateOfferRequested
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_FoldersAlreadyPresent_NeverReadsZipOrRaisesOffer

      - id: AgentControl-RepoCardViewModel-AgentsMdOfferBeforeReleaseNotes
        title: >-
          The RepoCardViewModel class shall raise the AGENTS.md template offer before the release
          notes of the same upgrade, so the view can ask first and show the notes after the answer.
        justification: |
          The question is modal and the release notes are the completion of the upgrade; raising the
          offer first lets the notes open in front once the question is answered, instead of being
          covered by it or lost behind it.
        tests:
          - RepoCardViewModel_ApplySelectedPackage_TemplateOfferAndReleaseNotes_RaisesOfferBeforeReleaseNotes

      - id: AgentControl-RepoCardViewModel-AcceptAgentsMdTemplate
        title: >-
          The RepoCardViewModel class shall write a user-accepted AGENTS.md template verbatim
          to the repo root without overwriting a pre-existing AGENTS.md file, and shall raise
          an error rather than throwing if the file cannot be written.
        justification: |
          The user explicitly asked AgentControl to place the starting template, so it must be
          written exactly as offered, at the repo root, not inside any managed folder; a write
          failure must degrade gracefully like every other non-blocking sync side effect in this
          class. Since another user/process may create AGENTS.md in the gap between the offer
          being raised and the user accepting it, the write must never silently overwrite a
          file that appeared in that window - doing so would violate the "never touch a
          pre-existing AGENTS.md" guarantee.
        tests:
          - RepoCardViewModel_AcceptAgentsMdTemplate_WritesFileToRepoRootWithGivenContent
          - RepoCardViewModel_AcceptAgentsMdTemplate_WriteFails_RaisesErrorOccurred
          - RepoCardViewModel_AcceptAgentsMdTemplate_FileCreatedConcurrently_PreservesExistingContentAndReportsNonDestructiveOutcome

      - id: AgentControl-RepoCardViewModel-DeclineAgentsMdTemplate
        title: >-
          The RepoCardViewModel class shall persist a declined AGENTS.md template offer in the
          repo's pin file without writing an AGENTS.md file, and shall raise an error rather
          than throwing if the pin cannot be saved.
        justification: |
          Declining must be remembered so the user is not re-prompted on every subsequent
          sync, and a pin-write failure must degrade gracefully like every other non-blocking
          sync side effect in this class.
        tests:
          - RepoCardViewModel_DeclineAgentsMdTemplate_PersistsDeclinedFlagInPinFile
          - RepoCardViewModel_DeclineAgentsMdTemplate_SubsequentApplySelectedPackage_DoesNotReprompt
          - RepoCardViewModel_DeclineAgentsMdTemplate_PinWriteFails_RaisesErrorOccurred

      - id: AgentControl-RepoCardViewModel-MissingRepo
        title: >-
          The RepoCardViewModel class shall mark the repo as missing, and suppress other
          status computation, when the repo's folder no longer exists on disk.
        justification: |
          A repo folder can be deleted or moved outside AgentControl's knowledge; the card
          must reflect that rather than show stale or misleading status information.
        tests:
          - RepoCardViewModel_RefreshCheap_RepoPathDoesNotExist_SetsIsMissingAndSuppressesOtherState

      - id: AgentControl-RepoCardViewModel-MissingRepoRecheck
        title: >-
          The RepoCardViewModel class shall keep its refresh command available for a missing
          repo, labeled "Check again" with a tooltip that says it checks whether the folder is
          available again.
        justification: |
          A folder on a drive or share that is not mounted comes back by itself, and re-checking is
          the only way to tell AgentControl, so the refresh must stay available for a missing repo.
        tests:
          - RepoCardViewModel_RefreshCheap_RepoPathDoesNotExist_SetsIsMissingAndSuppressesOtherState
          - RepoCardViewModel_RefreshCommand_MissingFolderReturns_ClearsMissingAndRestoresActions

      - id: AgentControl-RepoCardViewModel-MissingRepoCleared
        title: >-
          The RepoCardViewModel class shall stop reporting the repo as missing, and make its
          actions available again, once a refresh finds the folder.
        justification: |
          A repo whose folder is back must not stay marked as missing until the application is
          restarted.
        tests:
          - RepoCardViewModel_RefreshCommand_MissingFolderReturns_ClearsMissingAndRestoresActions

      - id: AgentControl-RepoCardViewModel-CommittedFilesBadge
        title: >-
          The RepoCardViewModel class shall reuse a cached committed-agent-files-changed
          result when the repo's git HEAD hash is unchanged since the previous check, and
          shall resolve the repo's current branch as part of its lightweight refresh.
        justification: |
          Recomputing the committed-agent-files diff on every refresh (which the main window
          performs frequently) would be wasteful when the repo has not changed since the last
          check.
        tests:
          - RepoCardViewModel_RefreshCheap_UnchangedHeadHash_CommittedFilesBadgeIsCached
          - RepoCardViewModel_RefreshCheap_ResolvesCurrentBranch
          - RepoCardViewModel_RefreshCheap_DoesNotRunWorkingTreeDirtyCheck

      - id: AgentControl-RepoCardViewModel-Favorite
        title: >-
          The RepoCardViewModel class shall let the user mark the repo as a favorite and clear the
          mark again, recording the status on the repo's settings entry and raising its change
          notification exactly once per change.
        justification: |
          Marking a repo as a favorite is how a developer promotes it to the top of the
          sorted recent-repos list; a single click must change the status exactly once, so a repo
          can both be favorited and unfavorited.
        tests:
          - RepoCardViewModel_IsFavorite_Set_UpdatesRecentRepoAndRaisesFavoriteChangedOncePerChange

      - id: AgentControl-RepoCardViewModel-RemoveRequest
        title: >-
          The RepoCardViewModel class shall raise a removal request without mutating any of
          its own state, deferring the actual removal decision to its owner.
        justification: |
          Removal requires user confirmation at the main-window level; the card itself must
          not unilaterally remove itself or change state before that confirmation occurs.
        tests:
          - RepoCardViewModel_RemoveCommand_RaisesRemoveRequestedWithoutMutatingState

      - id: AgentControl-RepoCardViewModel-SourceAwareness
        title: >-
          The RepoCardViewModel class shall resolve its pinned package, check for upgrades and
          repair missing managed folders only at the source named in the repo's pin (a pin
          without a source is a pin to the source named Default), shall record the source in
          the pin when a package is applied while keeping the pin's other fields, shall refuse to
          apply a package to a repo whose pin was written by a newer version of the tool, and shall
          expose an error state - with no upgrade offered and nothing extracted - when the
          pinned source is not configured.
        justification: |
          The pin binds the repo to one source; resolving it anywhere else, or overwriting a
          pin the tool does not understand, could change what is installed without the user
          knowing.
        tests:
          - RepoCardViewModel_ApplySelectedPackage_LegacySinglePath_PinRecordsDefaultSourceAlias
          - RepoCardViewModel_ApplySelectedPackage_SecondSourceSelected_PinRecordsThatSourceAndItsContent
          - RepoCardViewModel_Refresh_PinNamesUnconfiguredSource_ShowsSourceProblemAndOffersNoUpgrade
          - RepoCardViewModel_ApplySelectedPackage_UnconfiguredSourceAlias_RaisesErrorAndChangesNothing
          - RepoCardViewModel_EnsureAgentFilesSynced_PinNamesUnconfiguredSource_ReturnsFalseWithoutExtracting
          - RepoCardViewModel_Refresh_SamePackageNameInTwoSources_ComparesOnlyAgainstPinnedSource
          - RepoCardViewModel_Refresh_LegacyV1PinFile_ResolvesAgainstDefaultSource
          - RepoCardViewModel_Refresh_LegacyV1PinFileAndNoDefaultSource_ShowsSourceProblem
          - RepoCardViewModel_ApplySelectedPackage_PinWithUnknownFieldAndDecline_PreservesBoth
          - RepoCardViewModel_ApplySelectedPackage_NewerSchemaPinFile_RaisesErrorAndChangesNothing
          - RepoCardViewModel_ApplySelectedPackage_NuGetFolderSource_ExtractsPinsAliasAndRaisesReleaseNotes
          - RepoCardViewModel_UpgradeCommand_NuGetFolderSource_UpgradesToHighestVersion

      - id: AgentControl-RepoCardViewModel-BackgroundChecksNeverPrompt
        title: >-
          The RepoCardViewModel class shall, when it checks a server source for an upgrade in the
          background, use only the credentials already entered during the session or saved by the
          user's own credential store and never ask
          the user to sign in, shall instead show a package source problem that says a sign-in is
          needed and how to give it, and shall allow a check the user asks for to ask the user to
          sign in.
        justification: |
          A sign-in dialog that opens by itself while the user is working elsewhere is
          disruptive and hard to trust; the user signs in only for an action they chose, and the
          card tells them which action does it.
        tests:
          - RepoCardViewModel_RefreshUpgradeStatusAsync_AnonymousServer_OffersNewerVersion
          - RepoCardViewModel_RefreshUpgradeStatusAsync_BackgroundCheckNeedsSignIn_DoesNotPromptAndExplains
          - RepoCardViewModel_RefreshUpgradeStatusAsync_UserRequestedCheck_PromptsOnceThenBackgroundChecksReuseCredential

      - id: AgentControl-RepoCardViewModel-SignatureIndicator
        title: >-
          The RepoCardViewModel class shall indicate that the pinned package's source requires
          signed packages - only when the pinned source is a NuGet source that requires them, not
          for a zip source, a source that is not configured or a source without the requirement -
          with a tooltip that says signatures are required and either that any trusted signer is
          accepted or the start and end of the pinned publisher's certificate fingerprint, and
          shall update the indication when the source's requirement changes.
        justification: |
          The user should see at a glance, on the card of the repo the package is installed in,
          that its packages are checked and how strictly, so a source whose requirement was
          switched off or never pinned is noticed.
        tests:
          - RepoCardViewModel_PinnedSourceRequiresSignatures_ShowsShieldWithTooltip
          - RepoCardViewModel_NoSignatureRequirement_ShowsNoShield
          - RepoCardViewModel_SourceRequirementChanges_RaisesChangeNotificationsForTheShield

      - id: AgentControl-RepoCardViewModel-StatusAccent
        title: >-
          The RepoCardViewModel class shall expose the card's overall status as one of up to
          date (an agent package is pinned and no newer version exists), upgrade available, a
          problem (the folder is missing, the package source has a problem or needs a sign-in, or
          the last action failed), no agent package, or unknown (the last upgrade check failed
          because the package source could not be read, so it is not claimed to be up to date).
        justification: |
          The card shows its overall status as a colored bar so a long list can be scanned; the
          status is a fact of the view model, so it is available to assistive technology and never
          depends on the color.
        tests:
          - RepoCardViewModel_Status_ReflectsPackageAndUpgradeState
          - RepoCardViewModel_Status_UpgradeCheckFailed_IsUnknownNotUpToDate
          - RepoCardViewModel_Status_MissingFolderOrSourceProblem_IsProblemWithReason
          - RepoCardViewModel_Status_FailedPull_IsProblemUntilNextOperation
          - RepoCardViewModel_Status_ErrorReported_IsProblem

      - id: AgentControl-RepoCardViewModel-StatusWords
        title: >-
          The RepoCardViewModel class shall give the card's overall status in words and a tooltip
          that gives the reason.
        justification: |
          A status conveyed by color alone is not available to every user; the words are also the
          accessible name of the status bar.
        tests:
          - RepoCardViewModel_Status_ReflectsPackageAndUpgradeState
          - RepoCardViewModel_Status_MissingFolderOrSourceProblem_IsProblemWithReason

      - id: AgentControl-RepoCardViewModel-StatusProblemCleared
        title: >-
          The RepoCardViewModel class shall clear a failed-action problem from the card's status
          when the next operation starts.
        justification: |
          A failure that was reported once must not keep the card marked as a problem after the user
          has tried again.
        tests:
          - RepoCardViewModel_Status_FailedPull_IsProblemUntilNextOperation

      - id: AgentControl-RepoCardViewModel-InvalidSourceConfigurationIsProblem
        title: >-
          The RepoCardViewModel class shall show a pin whose package source cannot be used because
          the configured sources are invalid (for example two sources with the same alias) as a
          problem with a reason, and never as up to date.
        justification: |
          A card that claims to be current because its source could not be read at all would hide a
          configuration problem the user must fix.
        tests:
          - RepoCardViewModel_RefreshUpgradeStatusAsync_InvalidSourceConfiguration_IsAProblemNotUpToDate

      - id: AgentControl-RepoCardViewModel-UpToDateCue
        title: >-
          The RepoCardViewModel class shall tell the card to show its "up to date" cue only while
          an agent package is pinned and the card's overall status is up to date.
        justification: |
          A healthy card would otherwise be recognized only by a green bar and the absence of an
          upgrade chip, so it shows a small check mark in its package chip; the cue must never
          contradict the status (an upgrade, a problem, a check still running, no package).
        tests:
          - RepoCardViewModel_ShowUpToDateCue_OnlyForPinnedAndUpToDate

      - id: AgentControl-RepoCardViewModel-RepoPathKeepsFolderName
        title: >-
          The RepoCardViewModel class shall give the card the repo's path in a form that keeps the
          repo's own folder name intact when the card shortens the path to fit.
        justification: |
          A narrow card must still show the folder name that tells similar repos apart.
        tests:
          - RepoCardViewModel_RepoPathParts_SplitAtLastSeparator

      - id: AgentControl-RepoCardViewModel-UpgradeFromChip
        title: >-
          The RepoCardViewModel class shall let the user start an upgrade from the upgrade chip
          with the same effect and the same guards as the card menu's Upgrade item.
        justification: |
          The chip that announces an upgrade is also the quickest way to start it; it must behave
          exactly like the menu item, with the same confirmations and guards.
        tests:
          - RepoCardViewModel_UpgradeCommand_ChipAndMenuShareOneGuardedCommand
          - RepoCardViewModel_UpgradeCommand_NewerVersionAvailable_UpdatesPinAndRaisesReleaseNotesReady

      - id: AgentControl-RepoCardViewModel-UpgradeChipAvailability
        title: >-
          The RepoCardViewModel class shall make the upgrade available only while an upgrade is
          available and no other operation is running.
        justification: |
          An upgrade that is not available, or that would run beside another operation on the same
          repo, must not be started from the chip or from the menu.
        tests:
          - RepoCardViewModel_UpgradeCommand_ChipAndMenuShareOneGuardedCommand

      - id: AgentControl-RepoCardViewModel-UpgradeChipTooltip
        title: >-
          The RepoCardViewModel class shall give the upgrade chip a tooltip that says it upgrades
          the agent files to the new version.
        justification: |
          A chip that starts an upgrade must say what it will do before it is clicked.
        tests:
          - RepoCardViewModel_UpgradeChip_NewerVersionAtSource_ShowsTargetVersionAndTooltipWithBothVersions

      - id: AgentControl-RepoCardViewModel-AvatarTile
        title: >-
          The RepoCardViewModel class shall expose, for the card's avatar tile, the one or two
          capital letters that start the repo name's first two words.
        justification: |
          A recognizable tile per repo makes a long list quicker to scan.
        tests:
          - RepoCardViewModel_AvatarInitials_RepoName_UsesFirstLettersOfFirstTwoWords

      - id: AgentControl-RepoCardViewModel-AvatarFolderGlyph
        title: >-
          The RepoCardViewModel class shall expose no letters for the avatar tile, so that a folder
          glyph is shown, when the repo name has no letter or digit.
        justification: |
          A name made of symbols has no initials; the tile must still show something recognizable.
        tests:
          - RepoCardViewModel_Avatar_EmptyName_FallsBackToFolderGlyph

      - id: AgentControl-RepoCardViewModel-AvatarColorStable
        title: >-
          The RepoCardViewModel class shall give the avatar tile a palette color that is the same
          for the same repo in every session, whatever the letter case of its path, and that is
          always one of the palette's colors.
        justification: |
          A repo that changed color every time the application started could not be recognized by
          its color.
        tests:
          - RepoCardViewModel_AvatarColorIndex_SamePath_IsStableAndInPalette

      - id: AgentControl-RepoCardViewModel-RepoPicture
        title: >-
          The RepoCardViewModel class shall, without blocking the user interface, show on the
          card the icon.png or logo.png picture that the repo's root folder offers in place of
          the generated tile.
        justification: |
          A repository that ships its own icon or logo is recognizable at a glance; because the
          repository may be untrusted, which pictures are acceptable is decided by the
          RepoImageLocator unit and this unit shows only what that unit returns.
        tests:
          - RepoCardViewModel_RepoImage_IconPresent_LoadsOnceUntilFileChanges

      - id: AgentControl-RepoCardViewModel-RepoPictureFallback
        title: >-
          The RepoCardViewModel class shall show the generated tile when the repo offers no
          picture, when its folder is missing or when its picture has been removed.
        justification: |
          The generated tile is always a correct picture of the card; a missing picture must cost
          nothing else.
        tests:
          - RepoCardViewModel_RepoImage_FileRemoved_FallsBackToInitials
          - RepoCardViewModel_RepoImage_MissingFolder_NeverLooksForAnImage

      - id: AgentControl-RepoCardViewModel-RepoPictureFailureIsolated
        title: >-
          The RepoCardViewModel class shall never let a picture that cannot be read or decoded -
          whatever the failure - interrupt the card, and shall keep the tile as it was.
        justification: |
          The picture is decorative and comes from an untrusted repo; a damaged or hostile file
          costs the card its picture and nothing else.
        tests:
          - RepoCardViewModel_RepoImage_DecodeFailsOrThrows_KeepsTileAndDoesNotRetry
          - RepoCardViewModel_RepoImage_OlderRefreshFailsAfterNewerPublished_KeepsNewerImage

      - id: AgentControl-RepoCardViewModel-RepoPictureNotDecodedAgain
        title: >-
          The RepoCardViewModel class shall not decode an unchanged picture again.
        justification: |
          The card is refreshed often; decoding the same file each time would waste time and memory.
        tests:
          - RepoCardViewModel_RepoImage_IconPresent_LoadsOnceUntilFileChanges

      - id: AgentControl-RepoCardViewModel-RepoPictureReleased
        title: >-
          The RepoCardViewModel class shall release the picture it no longer shows - one replaced
          by a newer picture, cleared, never shown because a newer refresh took over, or dropped
          when the card is retired - so that no picture resource is retained after the card
          stopped showing it.
        justification: |
          A picture occupies native memory; a card that is refreshed for days must not accumulate
          the pictures it has replaced.
        tests:
          - RepoCardViewModel_RepoImage_SupersededClearedOrRetired_BitmapIsDisposed
          - RepoCardViewModel_RepoImage_DecodedByOvertakenRefresh_IsDisposedAndNotPublished

      - id: AgentControl-RepoCardViewModel-MoveToGroup
        title: >-
          The RepoCardViewModel class shall move its repo into a valid group or out of its group,
          record the choice on the repo's settings entry only, and raise a change notification.
        justification: |
          The card is where the user decides which group a repo belongs to; the choice is the
          user's own and belongs in the settings, never in the repository.
        tests:
          - RepoCardViewModel_MoveToGroup_UpdatesGroupAndRaisesChange
          - RepoCardViewModel_MoveToGroup_NewExistingInvalidAndRemove

      - id: AgentControl-RepoCardViewModel-GroupNameRules
        title: >-
          The RepoCardViewModel class shall adopt the spelling of an existing group whose name
          matches ignoring letter case, and shall refuse, changing nothing, a name that is too long
          or one of the built-in section names.
        justification: |
          The rules must be the same wherever the move comes from, and two spellings of one group
          would split it in two.
        tests:
          - RepoCardViewModel_MoveToGroup_UpdatesGroupAndRaisesChange
          - RepoCardViewModel_MoveToGroup_NewExistingInvalidAndRemove

      - id: AgentControl-RepoCardViewModel-GroupList
        title: >-
          The RepoCardViewModel class shall list the existing groups of all the repos.
        justification: |
          The card's menu offers the groups a repo can be moved to.
        tests:
          - RepoCardViewModel_MoveToGroup_UpdatesGroupAndRaisesChange

      - id: AgentControl-RepoCardViewModel-NewGroupPrompt
        title: >-
          The RepoCardViewModel class shall request the prompt for a new group's name without
          changing the repo's group itself.
        justification: |
          The name is asked for by the window; the group must change only after the user has
          answered.
        tests:
          - RepoCardViewModel_NewGroupCommand_RaisesRequest_AndChipShowsForGroupedFavorites

      - id: AgentControl-RepoCardViewModel-GroupChipForFavorites
        title: >-
          The RepoCardViewModel class shall show its group as a chip only while the repo is a
          favorite.
        justification: |
          A favorite is listed under Favorites instead of under its group, so the card must still
          show which group it belongs to.
        tests:
          - RepoCardViewModel_NewGroupCommand_RaisesRequest_AndChipShowsForGroupedFavorites

      - id: AgentControl-RepoCardViewModel-CardColor
        title: >-
          The RepoCardViewModel class shall let the tile's color be chosen from the palette by
          name (ignoring letter case) or reset to the automatic color derived from the repo path.
        justification: |
          The choice must be the user's and reversible.
        tests:
          - CardColorPalette_All_MatchesTheAvatarPalette
          - RepoCardViewModel_CardColor_Default_IsAutomatic
          - RepoCardViewModel_SetCardColor_ChoosesAndClearsColor

      - id: AgentControl-RepoCardViewModel-CardColorRecorded
        title: >-
          The RepoCardViewModel class shall record the chosen card color on the repo's settings
          entry only, and raise a change notification.
        justification: |
          The color is the user's own choice and belongs in the settings, never in the repository.
        tests:
          - RepoCardViewModel_SetCardColor_ChoosesAndClearsColor

      - id: AgentControl-RepoCardViewModel-CardColorUnknownRefused
        title: >-
          The RepoCardViewModel class shall refuse a color name that is not in the palette,
          changing nothing.
        justification: |
          A stale or mistyped name must not replace a valid choice.
        tests:
          - RepoCardViewModel_SetCardColor_UnknownName_IsRefused

      - id: AgentControl-RepoCardViewModel-CardColorStoredFallback
        title: >-
          The RepoCardViewModel class shall read a stored color name that is not in the palette as
          the automatic color.
        justification: |
          The settings file can be edited by hand or written by another version; a value this
          version does not know must not break the card.
        tests:
          - CardColorPalette_Find_ToleratesAnyStoredValue
          - RepoCardViewModel_CardColor_UnknownStoredValue_FallsBackToAutomatic

      - id: AgentControl-RepoCardViewModel-CardColorKeepsStatus
        title: >-
          The RepoCardViewModel class shall leave the card's status unchanged whatever color the
          user chooses.
        justification: |
          The status colors must keep their meaning on every card.
        tests:
          - RepoCardViewModel_SetCardColor_DoesNotChangeStatus

      - id: AgentControl-RepoCardViewModel-ChangeSavedBeforeApplied
        title: >-
          The RepoCardViewModel class shall change its favorite status, its group, its card color
          and its launch time only after its owner has saved the change, and shall remain as it was
          (reporting the refusal of a group move or color choice to its caller) when the owner
          refuses it.
        justification: |
          A card that shows a change the settings file does not have would be wrong after the next
          start; applying a change only once it is saved keeps what the user sees equal to what is
          kept.
        tests:
          - RepoCardViewModel_Changes_GoThroughTheOwnerAndAreNotAppliedWhenItRefuses

      - id: AgentControl-RepoCardViewModel-StaleUpgradeCheckDiscarded
        title: >-
          The RepoCardViewModel class shall never publish the answer of an upgrade check that was
          started before the repo's pin changed or before the repo became missing or unusable.
        justification: |
          An answer about a pin or a repo that is gone describes something the card no longer
          shows; publishing it would offer an upgrade for the wrong version.
        tests:
          - RepoCardViewModel_RefreshCheap_PinChangesDuringUpgradeCheck_StaleResultIsNotPublished
          - RepoCardViewModel_RefreshCheap_RepoBecomesMissingDuringUpgradeCheck_StateIsResetAndResultIgnored

      - id: AgentControl-RepoCardViewModel-UpgradeStateResetOnRefresh
        title: >-
          The RepoCardViewModel class shall, when it re-reads the repo, stop showing "checking" and
          "check failed" for a check that was overtaken, and drop the upgrade it had found when the
          pin changed.
        justification: |
          A card stuck on "checking" or showing a failure of a check nobody waits for any more would
          mislead the user.
        tests:
          - RepoCardViewModel_RefreshCheap_PinChangesDuringUpgradeCheck_StaleResultIsNotPublished
          - RepoCardViewModel_RefreshCheap_RepoBecomesMissingDuringUpgradeCheck_StateIsResetAndResultIgnored

      - id: AgentControl-RepoCardViewModel-RetiredCardReportsNothing
        title: >-
          The RepoCardViewModel class shall, once its repo was removed from the list (the card is
          retired), publish no result of an upgrade check that was still running and report no
          error, release notes or prompt for anything it still has running.
        justification: |
          A removed repo's pending work must not show an error, release notes or a question for a
          repo that is no longer in the list.
        tests:
          - RepoCardViewModel_Retire_UpgradeCheckStillRunning_PublishesNothingAndRaisesNothing
          - RepoCardViewModel_Retire_OperationRunning_IsCancelledAndNothingIsReported

      - id: AgentControl-RepoCardViewModel-RetireCancelsRunningWork
        title: >-
          The RepoCardViewModel class shall cancel the operation it is running when it is retired.
        justification: |
          Work for a removed repo is wasted and may still change the repo's files.
        tests:
          - RepoCardViewModel_Retire_OperationRunning_IsCancelledAndNothingIsReported

      - id: AgentControl-RepoCardViewModel-RetiredCardChecksNothing
        title: >-
          The RepoCardViewModel class shall, once retired, check nothing and read no package source
          when it is asked to refresh.
        justification: |
          A card that was removed must not do work for a repo that is no longer listed.
        tests:
          - RepoCardViewModel_Retire_LaterRefresh_DoesNothing

      # ---- Content identity of the applied package ----
      - id: AgentControl-RepoCardViewModel-RecordContentIdentity
        title: >-
          The RepoCardViewModel class shall record, in the repo's pin, the content identity of the
          package that was applied by selecting a package or by upgrading, replacing any identity
          recorded before.
        justification: |
          The recorded identity is what later syncs of the same version are compared with.
        tests:
          - RepoCardViewModel_ApplySelectedPackage_FirstApply_RecordsZipSha256InPin
          - RepoCardViewModel_UpgradeCommand_NewerVersion_RecordsNewIdentityWithoutWarning

      - id: AgentControl-RepoCardViewModel-RefuseChangedContent
        title: >-
          The RepoCardViewModel class shall, when an upgrade or the restore of missing agent
          files before launch finds that the version the repo is pinned to now has content that
          differs from the recorded identity, apply nothing, leave the pin as it was and tell the
          user in plain language that the package may have been republished, without showing a
          hash.
        justification: |
          Restoring or upgrading to a changed copy of a version would silently change the
          instructions the agent follows; the user must learn about it instead.
        tests:
          - RepoCardViewModel_UpgradeCommand_SameVersionRepublished_RefusesWithoutChangingRepoOrPin
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_SameVersionRepublished_RefusesWithoutExtractingOrWritingPin

      - id: AgentControl-RepoCardViewModel-ConfirmChangedContent
        title: >-
          The RepoCardViewModel class shall, when the user selects the version the repo is pinned
          to and that version's content differs from the recorded identity, change nothing and
          request the user's confirmation, shall apply the package and record its new identity
          once the user has confirmed, and shall refuse the change when there is nobody to ask.
        justification: |
          Selecting the version again is the deliberate way to accept a republished package; the
          decision belongs to the user, and a change that cannot be put to them must not go ahead.
        tests:
          - RepoCardViewModel_ApplySelectedPackage_SameVersionRepublished_RequestsConfirmationAndChangesNothing
          - RepoCardViewModel_ApplySelectedPackage_SameVersionRepublishedAndAccepted_AppliesAndRecordsNewIdentity
          - RepoCardViewModel_ApplySelectedPackage_SameVersionRepublishedWithoutSubscriber_IsRefused

      - id: AgentControl-RepoCardViewModel-AdoptMissingIdentity
        title: >-
          The RepoCardViewModel class shall apply a package without any warning, recording its
          identity, when the pin recorded no identity, and shall never treat a source that reports
          no identity as having changed the content.
        justification: |
          Pins made before identities were recorded must keep working, and a missing identity
          carries no evidence of a change, so warning about it would only teach users to ignore
          the warning.
        tests:
          - RepoCardViewModel_ApplySelectedPackage_PinWithoutIdentity_AdoptsIdentityWithoutWarning
          - RepoCardViewModel_ApplySelectedPackage_SourceReportsNoIdentity_IsNeverTreatedAsChanged

      - id: AgentControl-RepoCardViewModel-LaunchSyncNeverWritesPin
        title: >-
          The RepoCardViewModel class shall, when it restores missing agent files before launch,
          leave the repo's pin file unchanged whether or not the pin recorded an identity.
        justification: |
          The pin file is usually tracked by the repo's version control; rewriting it every time
          the agent tool is launched would leave the working tree changed and block pulling.
        tests:
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_PinWithoutIdentity_SyncsSilentlyAndNeverWritesPin
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_UnchangedContent_SyncsAndNeverWritesPin
