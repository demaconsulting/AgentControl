---
# LauncherUI Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl LauncherUI subsystem
# - LauncherUI spans the recent-repos main window, per-repo cards, the package-selection
#   window, the settings window, the package-source editor and the sign-in dialog
#   (MainWindowViewModel, RepoCardViewModel, SelectPackageWindowViewModel,
#   SettingsWindowViewModel, SourceEditorViewModel, CredentialPromptViewModel), plus four
#   further independently testable units with their own requirements files (RepoImageLocator,
#   RepoGroupHeaderViewModel, GroupNameViewModel, DialogBehavior), plus their
#   Avalonia .axaml Views (including CredentialPromptWindow and the AvaloniaCredentialPrompt
#   that shows it) and shared MVVM support types (RelayCommand, ViewModelBase,
#   the display-name and favorite converters, PathEllipsisText, AppStyles.axaml,
#   ThirdPartyDependencies), which are documented as supporting types of this subsystem
#   rather than given separate unit files (their dedicated test files, where they have one, are
#   named in the design and verification documents)
# - Subsystem requirements describe the aggregate UI behavior a user experiences
# - Evidence at this level: the headless window tests (MainWindow*, SettingsWindow*, Dialogs*,
#   AboutWindow*, ...), the tests of the supporting types listed above (PathEllipsisText,
#   the display-name converters, App and AppStyles), and, where a behavior is observable only
#   in the view-model layer the window is drawn from, the tests of the units that realize it
#   (see the Verification Approach of docs/verification/agent-control/launcher-ui.md). The
#   FlaUI end-to-end tests are the evidence of the system requirements and are linked here
#   only where nothing else can exercise the behavior (the package picker's keyboard use,
#   the About dialog)
# - A subsystem requirement lists only the requirements of its own units as children; the
#   Settings subsystem's requirements are children of the system requirements, not of these

sections:
  - title: LauncherUI Subsystem Requirements
    requirements:
      - id: AgentControl-LauncherUI-RecentReposDisplay
        title: >-
          The LauncherUI subsystem shall display a card for each recent repo, showing its
          name, path, pinned package, and branch.
        justification: |
          A developer needs a compact visual summary of every tracked repo without having to
          open each one individually.
        children:
          - AgentControl-MainWindowViewModel-PopulateRecentRepos
          - AgentControl-RepoCardViewModel-DisplayInfo
        tests:
          - MainWindowViewModel_Constructor_SettingsHaveRecentRepos_PopulatesRepoCards

      - id: AgentControl-LauncherUI-StatusBadges
        title: >-
          The LauncherUI subsystem shall show an upgrade-available badge, a missing-repo
          indicator, and a committed-agent-files-changed badge on each repo card as
          applicable.
        justification: |
          Badges let a developer notice, at a glance, which repos have an available agent
          package upgrade, are no longer present on disk, or have local edits to their
          committed agent files, without needing to click into each repo.
        children:
          - AgentControl-RepoCardViewModel-UpgradeBadge
          - AgentControl-RepoCardViewModel-MissingRepo
          - AgentControl-RepoCardViewModel-CommittedFilesBadge
        tests:
          - RepoCardViewModel_Refresh_NewerVersionAtSource_SetsUpgradeAvailableTrue
          - RepoCardViewModel_RefreshCheap_RepoPathDoesNotExist_SetsIsMissingAndSuppressesOtherState
          - RepoCardViewModel_RefreshCheap_UnchangedHeadHash_CommittedFilesBadgeIsCached

      - id: AgentControl-LauncherUI-CardIdentityAndStatus
        title: >-
          The LauncherUI subsystem shall show each repo card's overall status as a colored accent
          bar on its left edge (green up to date, amber upgrade available, red a problem, grey no
          agent package) that is also available in words.
        justification: |
          A long list of repos is scanned by status; color is backed by words so it is never the
          only carrier of meaning.
        children:
          - AgentControl-RepoCardViewModel-StatusAccent
          - AgentControl-RepoCardViewModel-StatusWords
          - AgentControl-RepoCardViewModel-StatusProblemCleared
          - AgentControl-RepoCardViewModel-InvalidSourceConfigurationIsProblem
        tests:
          # The status is observable in the view-model layer the card is drawn from; the colors
          # of the bars are checked for contrast by the theme requirements below.
          - RepoCardViewModel_Status_ReflectsPackageAndUpgradeState
          - RepoCardViewModel_Status_MissingFolderOrSourceProblem_IsProblemWithReason

      - id: AgentControl-LauncherUI-CardAvatarTile
        title: >-
          The LauncherUI subsystem shall show on each repo card a generated tile with the one or
          two capital letters that start the repo's name (a folder symbol when the name has no
          letter or digit), in a color that is the same for the same repo in every session.
        justification: |
          A tile of its own lets the user recognize a repo at a glance among many, and a color
          that changed from one start to the next would defeat that.
        children:
          - AgentControl-RepoCardViewModel-AvatarTile
          - AgentControl-RepoCardViewModel-AvatarFolderGlyph
          - AgentControl-RepoCardViewModel-AvatarColorStable
        tests:
          - RepoCardViewModel_AvatarInitials_RepoName_UsesFirstLettersOfFirstTwoWords
          - RepoCardViewModel_Avatar_EmptyName_FallsBackToFolderGlyph
          - RepoCardViewModel_AvatarColorIndex_SamePath_IsStableAndInPalette

      - id: AgentControl-LauncherUI-RepoPicture
        title: >-
          The LauncherUI subsystem shall show the repo's own root icon.png or logo.png in place of
          the generated tile when the repo offers a usable one, and the generated tile otherwise,
          without ever letting a picture that cannot be read interrupt the card.
        justification: |
          A picture the repo's owners chose is the best way to recognize a repo; a card must still
          work, with its generated tile, when there is none or it cannot be used.
        children:
          - AgentControl-RepoCardViewModel-RepoPicture
          - AgentControl-RepoCardViewModel-RepoPictureFallback
          - AgentControl-RepoCardViewModel-RepoPictureFailureIsolated
          - AgentControl-RepoCardViewModel-RepoPictureNotDecodedAgain
          - AgentControl-RepoCardViewModel-RepoPictureReleased
          - AgentControl-RepoImageLocator-FindsPicture
          - AgentControl-RepoImageLocator-LogoFallback
          - AgentControl-RepoImageLocator-CaseInsensitiveNames
          - AgentControl-RepoImageLocator-MissingFolder
          - AgentControl-RepoImageLocator-CrowdedRoot
          - AgentControl-RepoImageLocator-DecodeToTile
          - AgentControl-RepoImageLocator-NeverFails
          - AgentControl-RepoImageLocator-ChangeIdentity
        tests:
          - MainWindow_RepoCard_AvatarShowsRepoPictureWhenPresent
          - RepoCardViewModel_RepoImage_FileRemoved_FallsBackToInitials
          - RepoCardViewModel_RepoImage_DecodeFailsOrThrows_KeepsTileAndDoesNotRetry

      - id: AgentControl-LauncherUI-RepoPictureTrusted
        title: >-
          The LauncherUI subsystem shall never show a repo's picture that is not a genuine small
          PNG, is a link or lies outside the repo's root folder.
        justification: |
          The repo is untrusted input: a picture is only used when it is a small, genuine PNG that
          really is a plain file of the repo's root, so that a repo cannot make the application
          read a file elsewhere or spend its memory on a hostile image.
        children:
          - AgentControl-RepoImageLocator-OnlyGenuinePng
          - AgentControl-RepoImageLocator-SizeLimit
          - AgentControl-RepoImageLocator-DimensionLimit
          - AgentControl-RepoImageLocator-NoLinks
          - AgentControl-RepoImageLocator-LinkedRoot
          - AgentControl-RepoImageLocator-StaysInRoot
          - AgentControl-RepoImageLocator-RootOnly
          - AgentControl-RepoImageLocator-NoEmptyFile
          - AgentControl-RepoImageLocator-HeaderChunkLength
          - AgentControl-RepoImageLocator-DecodeDimensionLimit
          - AgentControl-RepoImageLocator-LinkSwap
          - AgentControl-RepoImageLocator-LinkedRootSwap
          - AgentControl-RepoImageLocator-LinkedParentKept
          - AgentControl-RepoImageLocator-ChangedFileRefused
          - AgentControl-RepoImageLocator-OpenFileVerified
          - AgentControl-RepoImageLocator-MacOsOpenFileVerified
        tests:
          # The rules are the RepoImageLocator unit's; the card, which is what shows or refuses the
          # picture, is exercised with the real locator by these tests, and the platform-specific
          # rules (links, junctions, final path of the open file) by the unit tests on each platform.
          - RepoCardViewModel_RepoImage_IconPresent_LoadsOnceUntilFileChanges
          - windows@RepoImageLocator_Find_RootIsJunction_ReturnsNull
          - ubuntu@RepoImageLocator_Find_SymbolicLinkIcon_IsRefused
          - macos@RepoImageLocator_Find_SymbolicLinkIcon_IsRefused

      - id: AgentControl-LauncherUI-AddSourceMenu
        title: >-
          The LauncherUI subsystem shall offer one Add action in the Settings window that opens
          a menu of the package source types that can be added (zip-package folder, NuGet-package
          folder, NuGet-package server and Git repository), each with its type's icon and a
          description.
        justification: |
          One entry point keeps the Settings window short as source types are added, and the
          descriptions tell the user which type to choose.
        children:
          - AgentControl-SettingsWindowViewModel-AddSource
          - AgentControl-SettingsWindowViewModel-AddGitSourceMenu
        tests:
          - SettingsWindow_AddZipSourceClicked_ShowsEditorAndSavingAddsSource
          - SettingsWindow_AddNuGetFolderClickedThenCancelled_AddsNothing
          - SettingsWindow_AddNuGetServerSourceButton_OpensServerEditorWithServerControls
          - SettingsWindow_AddGitSourceButton_IsInTheAddMenuAndOpensGitEditor

      - id: AgentControl-LauncherUI-Appearance
        title: >-
          The LauncherUI subsystem shall let the user choose the system default, light or dark
          theme in an Appearance section of the Settings window, separate from the Tools section,
          starting from the choice that was saved.
        justification: |
          The theme is a personal choice that belongs with the other settings; keeping it in a
          section of its own makes it easy to find, and starting from the saved choice shows the
          user what is in effect.
        children:
          - AgentControl-SettingsWindowViewModel-Appearance
          - AgentControl-SettingsWindowViewModel-AppearanceStartsFromSaved
          - AgentControl-SettingsWindowViewModel-AppearanceSaved
        tests:
          - SettingsWindow_Layout_AppearanceIsItsOwnSectionBeforeTools
          - ThemePreferenceDisplayNameConverter_Convert_KnownTheme_ReturnsFriendlyName
          - ThemePreferenceDisplayNameConverter_Convert_NotATheme_ReturnsEmpty

      - id: AgentControl-LauncherUI-ThemeApplied
        title: >-
          The LauncherUI subsystem shall apply the saved theme choice to the running application,
          and so to every window, without a restart, the system default following the operating
          system, and shall not apply the choice of settings that were refused.
        justification: |
          The choice must be honored immediately; a user who had to restart the application to see
          it would not know whether it had been understood.
        children:
          - AgentControl-MainWindowViewModel-ApplyTheme
          - AgentControl-MainWindowViewModel-RefusedThemeNotApplied
        tests:
          - App_ToThemeVariant_MapsEachPreferenceToItsVariant
          - App_ApplyTheme_SwitchesRunningApplicationTheme

      - id: AgentControl-LauncherUI-ThemeTextLegible
        title: >-
          The LauncherUI subsystem shall keep the text of every window legible in both the light
          and the dark theme: at least AA (4.5:1) contrast against what it is drawn on.
        justification: |
          A window that is readable in one theme only would be unusable for whoever chose the
          other (how the colors are defined for each theme is in the design). What is measured
          is the text of each window against its surface; the contrast of every state of every
          control is not claimed.
        tests:
          - AppStyles_LightAndDarkDictionaries_DefineTheSameKeys
          - AppStyles_TextAndGraphicColors_MeetContrastInBothThemes

      - id: AgentControl-LauncherUI-ThemeGraphicsLegible
        title: >-
          The LauncherUI subsystem shall draw the meaningful graphics of a card (the status bars
          and the favorite star) at least 3:1 against what they are drawn on, in both the light
          and the dark theme.
        justification: |
          A status that cannot be seen against the card in one of the themes cannot be read from
          it.
        tests:
          - AppStyles_TextAndGraphicColors_MeetContrastInBothThemes

      - id: AgentControl-LauncherUI-AppBar
        title: >-
          The LauncherUI subsystem shall show the main window's controls in one compact app bar,
          below the window's normal title bar, holding the application logo (with an accessible
          name and a tooltip), the filter box, then the Add repository, Settings and About
          buttons, in that keyboard focus order.
        justification: |
          A branded header plus a separate toolbar used two bands of vertical space before the
          first repo; one bar keeps the name in the title bar and the About box, gives the repo
          list the room, and keeps the filter, the control used most, first for the keyboard.
        tests:
          # The bar is a view with no unit of its own, so the headless window test is its evidence.
          - MainWindow_AppBar_LogoFilterAndButtonsInOrderAndNothingClipsAtMinimumWidth

      - id: AgentControl-LauncherUI-AppBarNarrow
        title: >-
          The LauncherUI subsystem shall let the filter box of the app bar shrink first at narrow
          widths, so that no button of the bar is clipped.
        justification: |
          At the smallest window width the buttons must stay reachable; the filter box can give
          way without losing anything.
        tests:
          - MainWindow_AppBar_LogoFilterAndButtonsInOrderAndNothingClipsAtMinimumWidth

      - id: AgentControl-LauncherUI-RepoGroups
        title: >-
          The LauncherUI subsystem shall list the repos in sections once at least one repo is in a
          group of the user's own - the favorites first (a favorite is listed only there, with its
          group shown on its card), then the groups alphabetically, then the repos in no group -
          each section introduced by a header showing the section's name and its number of repos.
        justification: |
          Grouping is how a developer with many repos keeps related ones together; the sections
          must be predictable, and a favorite must not be listed twice.
        children:
          - AgentControl-MainWindowViewModel-GroupSections
          - AgentControl-MainWindowViewModel-GroupSectionHeaders
          - AgentControl-MainWindowViewModel-GroupSectionRepoOrder
          - AgentControl-MainWindowViewModel-FavoriteListedOnce
          - AgentControl-MainWindowViewModel-DamagedGroupSettings
          - AgentControl-RepoGroupHeaderViewModel-SectionKind
          - AgentControl-RepoGroupHeaderViewModel-DescribesSection
          - AgentControl-RepoGroupHeaderViewModel-AccessibleNameIsText
          - AgentControl-RepoGroupHeaderViewModel-UpdatesInPlace
          - AgentControl-RepoGroupHeaderViewModel-RequiresName
          - AgentControl-RepoCardViewModel-GroupChipForFavorites
        tests:
          - MainWindow_GroupedRepos_ShowHeadersWithNameCountAndState
          - MainWindow_FavoriteInGroup_ShowsGroupChip

      - id: AgentControl-LauncherUI-RepoGroupsFlatList
        title: >-
          The LauncherUI subsystem shall list the repos without any section header while no repo is
          in a group.
        justification: |
          The list must stay exactly as it was for a user who does not use groups.
        children:
          - AgentControl-MainWindowViewModel-FlatListWithoutGroups
        tests:
          - MainWindow_NoGroups_ShowsNoHeader

      - id: AgentControl-LauncherUI-RepoGroupMove
        title: >-
          The LauncherUI subsystem shall offer, in each card's menu, moving the repo into an
          existing group, into a new group, or out of its group.
        justification: |
          The grouping must be discoverable where the user already acts, the card's menu.
        children:
          - AgentControl-RepoCardViewModel-MoveToGroup
          - AgentControl-RepoCardViewModel-GroupNameRules
          - AgentControl-RepoCardViewModel-GroupList
          - AgentControl-RepoCardViewModel-NewGroupPrompt
        tests:
          - MainWindow_CardMenu_MoveToGroupSubmenu_ListsChoicesAndMovesRepo
          - MainWindow_NewGroupMenuItem_PromptsForNameAndCreatesGroup

      - id: AgentControl-LauncherUI-GroupNamePrompt
        title: >-
          The LauncherUI subsystem shall ask for the name of a new group in a small prompt that
          validates the name as it is typed and that can be canceled without changing anything.
        justification: |
          A group is only a name, so the prompt must keep the user from a name that cannot be
          used, say why, and never change the repo unless the user accepts.
        children:
          - AgentControl-GroupNameViewModel-ValidatesAsTyped
          - AgentControl-GroupNameViewModel-NewGroup
          - AgentControl-GroupNameViewModel-CompletesOnce
          - AgentControl-GroupNameViewModel-RequiresArguments
          - AgentControl-GroupNameViewModel-NeutralUntilTyped
          - AgentControl-GroupNameViewModel-AcceptsUsableName
          - AgentControl-GroupNameViewModel-RefusesBlankName
          - AgentControl-GroupNameViewModel-RefusesTooLongName
          - AgentControl-GroupNameViewModel-RefusesBuiltInNames
          - AgentControl-GroupNameViewModel-NewGroupHint
          - AgentControl-GroupNameViewModel-NewGroupAdoptsSpelling
          - AgentControl-GroupNameViewModel-CancelCompletesOnce
        tests:
          - GroupNameWindow_ValidatesWhileTyping_AndAccepts
          - MainWindow_NewGroupPrompt_Canceled_ChangesNothing

      - id: AgentControl-LauncherUI-RepoGroupManagement
        title: >-
          The LauncherUI subsystem shall offer, in a group's header, renaming and removing the
          group, the repos of a removed group becoming ungrouped.
        justification: |
          Groups change over time; the header is where the user sees the group, so it is where the
          group is managed.
        children:
          - AgentControl-MainWindowViewModel-GroupManagement
          - AgentControl-MainWindowViewModel-GroupRenameRules
          - AgentControl-MainWindowViewModel-GroupRemove
          - AgentControl-MainWindowViewModel-GroupHeaderRequests
          - AgentControl-RepoGroupHeaderViewModel-GroupActions
          - AgentControl-RepoGroupHeaderViewModel-RemoveGroupRequest
          - AgentControl-GroupNameViewModel-Rename
          - AgentControl-GroupNameViewModel-RenameStartsWithCurrentName
          - AgentControl-GroupNameViewModel-RenameAcceptsCaseChange
        tests:
          - MainWindow_HeaderMenu_RenameAndRemoveGroup

      - id: AgentControl-LauncherUI-RepoGroupCollapse
        title: >-
          The LauncherUI subsystem shall let the user collapse and expand a section from its
          header, a collapsed section hiding its cards but keeping its header and count.
        justification: |
          Collapsing the sections not in use keeps a long list manageable without losing sight of
          what is there.
        children:
          - AgentControl-MainWindowViewModel-GroupCollapse
          - AgentControl-RepoGroupHeaderViewModel-Toggle
        tests:
          - MainWindow_HeaderToggle_CollapsesAndExpandsSection

      - id: AgentControl-LauncherUI-RepoGroupCollapseRemembered
        title: >-
          The LauncherUI subsystem shall keep the sections the user collapsed collapsed the next
          time the application starts, and when other settings are changed.
        justification: |
          A choice the user has to repeat at every start is not a choice that was kept.
        children:
          - AgentControl-MainWindowViewModel-GroupCollapseRemembered
          - AgentControl-MainWindowViewModel-GroupCollapseKeptOnApplySettings
        tests:
          - MainWindowViewModel_ToggleGroupCollapsed_HidesCardsAndPersists
          - MainWindowViewModel_ApplySettings_KeepsCollapsedGroups

      - id: AgentControl-LauncherUI-RepoGroupFilter
        title: >-
          The LauncherUI subsystem shall, while a filter is active, show every repo that matches
          it, including those in a collapsed section, and show the count of matches only.
        justification: |
          A filter that could not find a repo because its group is collapsed would make the
          grouping a trap.
        children:
          - AgentControl-MainWindowViewModel-GroupFilter
          - AgentControl-MainWindowViewModel-GroupFilterCounts
          - AgentControl-MainWindowViewModel-GroupFilterOmitsEmpty
          - AgentControl-MainWindowViewModel-GroupFilterToggleDisabled
          - AgentControl-MainWindowViewModel-GroupFilterKeepsCollapsedState
          - AgentControl-RepoGroupHeaderViewModel-ToggleUnavailable
          - AgentControl-RepoGroupHeaderViewModel-ToggleExplained
        tests:
          - MainWindowViewModel_FilterText_ShowsMatchesInCollapsedGroupsAndHidesEmptyOnes
          - MainWindowViewModel_FilterText_NoMatch_ShowsNothing

      - id: AgentControl-LauncherUI-RepoGroupsSettingsOnly
        title: >-
          The LauncherUI subsystem shall keep the user's groups, card colors and collapsed sections
          in the user's own settings only, and write nothing about them into a repository.
        justification: |
          These are personal ways of organizing the list; written into a repository they would be
          committed and shared with other people.
        children:
          - AgentControl-MainWindowViewModel-GroupSettingsOnly
        tests:
          - RepoCardViewModel_GroupAndColor_NeverWriteToTheRepository

      - id: AgentControl-LauncherUI-CardColor
        title: >-
          The LauncherUI subsystem shall offer, in each card's menu, a palette pop-up of colors
          for the card's tile and an Automatic choice, mark the chosen color, and show it on the
          tile (as a ring around a repo's own picture).
        justification: |
          The color is a personal aid to recognition; it must be easy to choose and to undo.
        children:
          - AgentControl-RepoCardViewModel-CardColor
          - AgentControl-RepoCardViewModel-CardColorRecorded
          - AgentControl-RepoCardViewModel-CardColorUnknownRefused
          - AgentControl-RepoCardViewModel-CardColorStoredFallback
        tests:
          - MainWindow_CardColorPalette_ChoosingSwatchColorsTileAndAutomaticClears
          - MainWindow_CardColorPalette_HeadingNamesTheChosenColor

      - id: AgentControl-LauncherUI-CardColorKeepsStatus
        title: >-
          The LauncherUI subsystem shall show the chosen card color without changing the card's
          status accent bar.
        justification: |
          The status colors carry a fixed meaning and must not be mistaken for a personal choice.
        children:
          - AgentControl-RepoCardViewModel-CardColorKeepsStatus
        tests:
          - RepoCardViewModel_SetCardColor_DoesNotChangeStatus

      - id: AgentControl-LauncherUI-CardColorLettersLegible
        title: >-
          The LauncherUI subsystem shall draw the letters of the card tile on every palette color
          in whichever of white and near-black reads better, with at least AA (4.5:1) contrast in
          both themes.
        justification: |
          The repo's initials must stay readable whatever color is chosen and in either theme.
        tests:
          - AppStyles_TileLetters_AreTheBetterOfLightAndDarkTextOnEveryPaletteColor

      - id: AgentControl-LauncherUI-FavoriteStar
        title: >-
          The LauncherUI subsystem shall let the user favorite an unfavorited repo, and unfavorite
          a favorite, with the star on its card (by pointer or keyboard, one change per click or
          key press), and shall give the star an accessible name.
        justification: |
          The star is the only way to promote a repo. A click that toggled twice (the star's own
          toggle and a command bound to it) left the star off and the repo where it was, so the
          control appeared broken; one owner of the state and a test with real pointer and key
          input keep it working in both directions.
        children:
          - AgentControl-RepoCardViewModel-Favorite
        tests:
          - MainWindow_FavoriteStar_MouseClick_FavoritesThenUnfavoritesMovingBetweenSections
          - MainWindow_FavoriteStar_SpaceKey_TogglesOncePerPress

      - id: AgentControl-LauncherUI-FavoriteStarMovesRepo
        title: >-
          The LauncherUI subsystem shall list a favorite under the Favorites section and return it
          to its own section when it is unfavorited.
        justification: |
          The repo must follow the star: a favorite that stayed where it was would not be promoted.
        children:
          - AgentControl-RepoCardViewModel-Favorite
        tests:
          - MainWindow_FavoriteStar_MouseClick_FavoritesThenUnfavoritesMovingBetweenSections

      - id: AgentControl-LauncherUI-FavoriteStarKeepsFocus
        title: >-
          The LauncherUI subsystem shall keep the keyboard focus on a repo's star when the star had
          it and the card moves to or from the Favorites section.
        justification: |
          The move re-creates the card's controls, which would otherwise drop the keyboard focus
          and send a keyboard user back to the top of the list after every press.
        tests:
          - MainWindow_FavoriteStar_SpaceKey_TogglesOncePerPress

      - id: AgentControl-LauncherUI-MissingRepoRecheck
        title: >-
          The LauncherUI subsystem shall keep the card menu's refresh item enabled for a repo whose
          folder is missing, labeled "Check again" with a tooltip that says it checks whether the
          folder is available again, while the actions that need the folder stay disabled.
        justification: |
          A folder on a drive or share that is not mounted comes back without AgentControl's
          knowledge; without an enabled re-check the user had to restart the application or
          remove and add the repo again.
        children:
          - AgentControl-RepoCardViewModel-MissingRepo
          - AgentControl-RepoCardViewModel-MissingRepoRecheck
        tests:
          - MainWindow_MissingRepoMenu_OffersEnabledCheckAgain_PresentRepoOffersRefresh

      - id: AgentControl-LauncherUI-MissingRepoRecheckClears
        title: >-
          The LauncherUI subsystem shall clear the missing state of a repo, and enable its actions
          again, when a check finds its folder back.
        justification: |
          The point of checking again is that the repo is usable once its folder is back.
        children:
          - AgentControl-RepoCardViewModel-MissingRepoCleared
        tests:
          - RepoCardViewModel_RefreshCommand_MissingFolderReturns_ClearsMissingAndRestoresActions

      - id: AgentControl-LauncherUI-UpToDateCue
        title: >-
          The LauncherUI subsystem shall show a small check mark, with the tooltip and accessible
          name "Agent files are up to date", inside the agent package chip of a repo whose pinned
          package is the newest one, and nowhere else.
        justification: |
          A healthy card showed only a green bar, which says nothing in words to a mouse user; the
          cue adds the words inside an existing chip without adding clutter.
        children:
          - AgentControl-RepoCardViewModel-UpToDateCue
        tests:
          - MainWindow_UpToDateCue_ShownOnlyForPinnedAndUpToDateCard

      - id: AgentControl-LauncherUI-LongTextShortened
        title: >-
          The LauncherUI subsystem shall shorten a long repo path (the folder part first, then the
          middle of a very long folder name so that its start and its end stay visible) and a long
          repo name at its end, each with the full value as its tooltip and the path also as its
          accessible name, without the name reaching the Launch button.
        justification: |
          At a narrow width the end of a long path is what tells similar repos apart, so that part
          is kept, and nothing on the card may collide.
        children:
          - AgentControl-RepoCardViewModel-RepoPathKeepsFolderName
        tests:
          - MainWindow_NarrowWidth_NameEllipsisPathKeepsFolderNameAndNothingCollides
          - PathEllipsisText_MiddleEllipsis_KeepsStartAndEnd
          - PathEllipsisText_EndEllipsis_KeepsStart
          - PathEllipsisText_Ellipsis_NeverSplitsASurrogatePair
          - PathEllipsisText_WideEnough_DrawsTheWholePath
          - PathEllipsisText_SlightlyTooNarrow_ShortensTheFolderPartAndKeepsTheFolderName
          - PathEllipsisText_VeryLongFolderName_KeepsItsStartAndItsEnd
          - PathEllipsisText_NoFolderPartOrNoPath_StillFitsOrDrawsNothing

      - id: AgentControl-LauncherUI-UpgradeFromChip
        title: >-
          The LauncherUI subsystem shall let the user start an upgrade by clicking the upgrade chip
          of a card, with the same effect and the same availability as the card menu's Upgrade
          item, the chip's tooltip saying that it upgrades the agent files to the new version.
        justification: |
          The chip that announces an available upgrade is the most direct place to start it; a
          chip that behaved differently from the menu item would surprise the user.
        children:
          - AgentControl-RepoCardViewModel-UpgradeFromChip
          - AgentControl-RepoCardViewModel-UpgradeChipAvailability
          - AgentControl-RepoCardViewModel-UpgradeChipTooltip
        tests:
          - RepoCardViewModel_UpgradeCommand_ChipAndMenuShareOneGuardedCommand
          - RepoCardViewModel_UpgradeChip_NewerVersionAtSource_ShowsTargetVersionAndTooltipWithBothVersions

      - id: AgentControl-LauncherUI-DialogModal
        title: >-
          The LauncherUI subsystem shall show every dialog (Settings, the source editors, the
          sign-in prompt, the package picker, confirmations, message boxes, the group-name prompt
          and About) as a modal dialog over the main window.
        justification: |
          A dialog that does not hold the window behind it lets the user act on that window while
          the dialog's question is still open.
        tests:
          # The dialogs are views with no unit of their own; the windows are opened in headless
          # sessions and their ownership and modal behavior checked.
          - MainWindow_AboutClicked_OpensModalAboutOwnedByMainWindow
          - SettingsWindow_ShownModally_FocusStartsInsideTabCyclesInsideAndReturnsToOwner
          - Dialogs_ConfirmationMessageBoxAbout_InitialFocusTabCycleAndEscape
          - Dialogs_PromptsAndEditors_InitialFocusInFirstFieldAndEscapeCancels

      - id: AgentControl-LauncherUI-DialogKeyboard
        title: >-
          The LauncherUI subsystem shall keep Tab and Shift+Tab inside a dialog, moving between its
          controls in a cycle.
        justification: |
          A keyboard user must be able to operate a dialog without the focus wandering into the
          window behind it. One shared behavior keeps all the dialogs alike.
        children:
          - AgentControl-DialogBehavior-TabStaysInside
          - AgentControl-DialogBehavior-RequiresDialog
        tests:
          - SettingsWindow_ShownModally_FocusStartsInsideTabCyclesInsideAndReturnsToOwner
          - Dialogs_ConfirmationMessageBoxAbout_InitialFocusTabCycleAndEscape
          # The package picker is verified end to end only: its keyboard behavior needs the real
          # picker opened from a repo card.
          - windows@SelectPackageWindow_Opened_FocusStartsInsideTabCyclesAndEscapeCancels

      - id: AgentControl-LauncherUI-DialogInitialFocus
        title: >-
          The LauncherUI subsystem shall put the keyboard focus on the first sensible control of a
          dialog when it opens, with the keyboard focus ring when the keyboard is in use.
        justification: |
          A keyboard user must be able to start typing as the dialog opens, and must be able to
          see where the keyboard is.
        children:
          - AgentControl-DialogBehavior-InitialFocus
        tests:
          - SettingsWindow_ShownModally_FocusStartsInsideTabCyclesInsideAndReturnsToOwner
          - Dialogs_ConfirmationMessageBoxAbout_InitialFocusTabCycleAndEscape
          - Dialogs_PromptsAndEditors_InitialFocusInFirstFieldAndEscapeCancels
          - windows@SelectPackageWindow_Opened_FocusStartsInsideTabCyclesAndEscapeCancels

      - id: AgentControl-LauncherUI-DialogEscapeCancels
        title: >-
          The LauncherUI subsystem shall cancel a dialog that has a way to cancel when Escape is
          pressed.
        justification: |
          Escape is the standard way out of a dialog.
        children:
          - AgentControl-DialogBehavior-EscapeCancels
        tests:
          - Dialogs_ConfirmationMessageBoxAbout_InitialFocusTabCycleAndEscape
          - Dialogs_PromptsAndEditors_InitialFocusInFirstFieldAndEscapeCancels
          - windows@SelectPackageWindow_Opened_FocusStartsInsideTabCyclesAndEscapeCancels

      - id: AgentControl-LauncherUI-DialogFocusReturn
        title: >-
          The LauncherUI subsystem shall return the keyboard focus to the window behind a dialog
          when the dialog closes.
        justification: |
          A keyboard user who closes a dialog must find the focus where they left it, not at the
          top of the window.
        tests:
          - SettingsWindow_ShownModally_FocusStartsInsideTabCyclesInsideAndReturnsToOwner
          - windows@SelectPackageWindow_Opened_FocusStartsInsideTabCyclesAndEscapeCancels

      - id: AgentControl-LauncherUI-ChangeAppliedWhenSaved
        title: >-
          The LauncherUI subsystem shall apply a change the user makes to a repo or a section
          (favorite, group, card color, launch time, collapse, rename or removal of a group, adding
          or removing a repo) only once it has been saved to the user's settings.
        justification: |
          What the window shows must be what the settings hold, or the next start would show
          something else than the user saw.
        children:
          - AgentControl-MainWindowViewModel-ChangeAppliedWhenSaved
          - AgentControl-RepoCardViewModel-ChangeSavedBeforeApplied
        tests:
          - MainWindowViewModel_ChangesThatSave_AreAppliedAndWritten
          - RepoCardViewModel_Changes_GoThroughTheOwnerAndAreNotAppliedWhenItRefuses

      - id: AgentControl-LauncherUI-FailedSaveChangesNothing
        title: >-
          The LauncherUI subsystem shall, when a change the user makes cannot be saved, leave the
          repo cards, the displayed list and the settings file as they were, and never write that
          change with a later, unrelated save.
        justification: |
          A change that is shown but not saved is lost at the next start, and one that is written
          later without the user asking surprises them.
        children:
          - AgentControl-MainWindowViewModel-FailedSaveChangesNothing
          - AgentControl-MainWindowViewModel-FailedSaveNotPersistedLater
          - AgentControl-MainWindowViewModel-SaveFailureRefusesOperation
        tests:
          - MainWindow_SettingsCannotBeSaved_ShowsMessageAndKeepsStateAsItWas
          - MainWindowViewModel_FavoriteSaveFails_ChangesNothingAndLaterSaveDoesNotPersistIt

      - id: AgentControl-LauncherUI-FailedSaveReported
        title: >-
          The LauncherUI subsystem shall tell the user, in a message, when a change they made
          cannot be saved.
        justification: |
          A change that silently does nothing looks like a broken control.
        children:
          - AgentControl-MainWindowViewModel-SaveFailureReported
        tests:
          - MainWindow_SettingsCannotBeSaved_ShowsMessageAndKeepsStateAsItWas

      - id: AgentControl-LauncherUI-RemovedRepoGoesQuiet
        title: >-
          The LauncherUI subsystem shall, once a repo was removed from the list, show no result,
          error, release notes or prompt from work that was still running for it.
        justification: |
          A message about a repo the user has removed would be about something that is no longer
          there.
        children:
          - AgentControl-MainWindowViewModel-RemoveRepoRetiresCard
          - AgentControl-RepoCardViewModel-RetiredCardReportsNothing
          - AgentControl-RepoCardViewModel-RetireCancelsRunningWork
          - AgentControl-RepoCardViewModel-RetiredCardChecksNothing
        tests:
          - MainWindow_RepoRemoved_ReleasesTheCardHandlers
          - MainWindowViewModel_RemoveRepo_RetiresTheCard

      - id: AgentControl-LauncherUI-AddRepo
        title: The LauncherUI subsystem shall let the user add an existing folder as a tracked repo.
        justification: |
          Adding a repo is the only entry point for AgentControl to begin tracking a folder,
          and must reject paths that do not exist or are already tracked to avoid duplicate
          or invalid entries.
        children:
          - AgentControl-MainWindowViewModel-AddRepo
        tests:
          - MainWindowViewModel_AddRepo_ValidNewPath_InsertsCardAndPersistsSettings
          - MainWindowViewModel_AddRepo_PathDoesNotExist_ReturnsFalse
          - MainWindowViewModel_AddRepo_DuplicatePath_ReturnsFalse

      - id: AgentControl-LauncherUI-RemoveRepo
        title: The LauncherUI subsystem shall remove a repo card only after the user confirms the removal request.
        justification: |
          Removing a repo discards AgentControl's tracking of it (though not the repo itself);
          requiring confirmation prevents an accidental click from silently losing that state.
        children:
          - AgentControl-MainWindowViewModel-RemoveRepo
          - AgentControl-RepoCardViewModel-RemoveRequest
        tests:
          - MainWindowViewModel_RemoveRepo_RemovesFromCollectionsAndPersistsSettings
          - MainWindowViewModel_CardRaisesRemoveRequested_DoesNotRemoveCardWithoutConfirmation
          - RepoCardViewModel_RemoveCommand_RaisesRemoveRequestedWithoutMutatingState

      - id: AgentControl-LauncherUI-SearchFilter
        title: >-
          The LauncherUI subsystem shall filter displayed repo cards by a case-insensitive
          match against the repo's name or path.
        justification: |
          Lets a developer quickly narrow a long recent-repos list down to the repo they are
          looking for.
        children:
          - AgentControl-MainWindowViewModel-SearchFilter
        tests:
          - MainWindowViewModel_FilterText_MatchesRepoNameCaseInsensitive_FiltersDisplayedRepoCards
          - MainWindowViewModel_FilterText_MatchesRepoPath_FiltersDisplayedRepoCards

      - id: AgentControl-LauncherUI-SortOrder
        title: >-
          The LauncherUI subsystem shall order displayed repo cards with favorites first,
          then by most-recently-launched.
        justification: |
          Surfaces the repos a developer is most likely to want next without requiring manual
          reordering.
        children:
          - AgentControl-MainWindowViewModel-SortOrder
          - AgentControl-RepoCardViewModel-Favorite
        tests:
          - MainWindowViewModel_DisplayedRepoCards_SortsFavoritesAboveNonFavorites
          - MainWindowViewModel_DisplayedRepoCards_SortsByLastLaunchedUtcDescendingWithNullsLast

      - id: AgentControl-LauncherUI-Launch
        title: >-
          The LauncherUI subsystem shall launch the configured agent tool for a repo,
          attempting a best-effort agent-package sync beforehand without ever letting the
          sync outcome block the launch.
        justification: |
          Launching the configured agentic CLI tool is AgentControl's primary purpose, and
          must never be blocked by agent-package sync state - a user may want the tool's help
          migrating away from committed agent files, or may find it useful even with zero
          managed agent files present. Sync remains a best-effort, informational side action.
        children:
          - AgentControl-RepoCardViewModel-Launch
          - AgentControl-RepoCardViewModel-EnsureSyncedBeforeLaunch
        tests:
          - RepoCardViewModel_LaunchCommand_Succeeds_RecordsLaunchTimestampAndRaisesLaunchRecorded
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_PinnedAndFoldersPresent_ReturnsTrueWithoutReExtracting
          - RepoCardViewModel_LaunchCommand_SyncFailsOrNoPin_StillLaunches

      - id: AgentControl-LauncherUI-Pull
        title: >-
          The LauncherUI subsystem shall let the user pull the latest commits for a repo
          card, enabled only when its working tree is clean.
        justification: |
          Prevents the user from triggering a git pull that could produce merge conflicts
          AgentControl cannot resolve on the developer's behalf.
        children:
          - AgentControl-RepoCardViewModel-PullGating
          - AgentControl-RepoCardViewModel-Pull
        tests:
          - RepoCardViewModel_Refresh_CleanWorkingTree_SetsCanPullTrue
          - RepoCardViewModel_Refresh_DirtyWorkingTree_SetsCanPullFalse
          - RepoCardViewModel_PullCommand_SuccessfulPull_UpdatesStatusMessage

      - id: AgentControl-LauncherUI-SelectPackage
        title: >-
          The LauncherUI subsystem shall let the user choose a configured package source, then
          browse the package name/version pairs it offers and apply one to a repo with no
          existing pin, recording the source in the pin (a repo that already has a pin chooses
          another package or version through Change package, which has its own requirement).
        justification: |
          A repo with no pin has no prior version to upgrade from, so an explicit
          source/package/version selection window is the only way to establish the initial pin;
          the source is part of the choice because the same package name may exist in several
          sources.
        children:
          - AgentControl-RepoCardViewModel-SelectPackage
          - AgentControl-SelectPackageWindowViewModel-ListPackages
          - AgentControl-SelectPackageWindowViewModel-VersionSelection
          - AgentControl-SelectPackageWindowViewModel-ConfirmGating
          - AgentControl-SelectPackageWindowViewModel-Confirm
          - AgentControl-RepoCardViewModel-ApplySelectedPackage
        tests:
          - RepoCardViewModel_SelectPackageCommand_SourceConfigured_RaisesSelectPackageRequestedWithSourceAlias
          - SelectPackageWindowViewModel_SelectPackageName_PopulatesVersionsDescendingAndDefaultsToLatest
          - SelectPackageWindowViewModel_ConfirmCommand_RaisesConfirmedWithFullPackageReference
          - RepoCardViewModel_ApplySelectedPackage_ValidNameAndVersion_UpdatesPinAndExtractsAndRaisesReleaseNotesReady

      - id: AgentControl-LauncherUI-Upgrade
        title: >-
          The LauncherUI subsystem shall let the user upgrade a pinned repo to the newest
          available package version, only when a newer version exists at the package source.
        justification: |
          Upgrading is only meaningful when a newer version is actually available; offering
          the action otherwise would confuse the user or risk a no-op re-extraction.
        children:
          - AgentControl-RepoCardViewModel-Upgrade
        tests:
          - RepoCardViewModel_UpgradeCommand_NewerVersionAvailable_UpdatesPinAndRaisesReleaseNotesReady
          - RepoCardViewModel_UpgradeCommand_NoPackageSourceConfigured_RaisesErrorOccurred

      - id: AgentControl-LauncherUI-AgentsMdTemplateOffer
        title: >-
          The LauncherUI subsystem shall offer, via a modal confirmation dialog, to place a
          package's optional root-level AGENTS.md template at a repo's root whenever a sync
          genuinely occurs (package selection, upgrade, or the best-effort
          sync-before-launch) and the repo has no AGENTS.md of its own, shall never show the
          offer again once the user has declined it for that repo, and shall never overwrite
          a pre-existing AGENTS.md.
        justification: |
          A package may want to seed a repo with a starting AGENTS.md (mirroring the existing
          release-notes.md root-level-entry convention), but the user must make an explicit,
          informed choice - reusing the same modal Yes/No dialog pattern already established
          for destructive/consequential confirmations (e.g. repo removal) - rather than
          AgentControl silently writing or never offering the file.
        children:
          - AgentControl-RepoCardViewModel-AgentsMdTemplateOffer
          - AgentControl-RepoCardViewModel-AcceptAgentsMdTemplate
          - AgentControl-RepoCardViewModel-DeclineAgentsMdTemplate
        tests:
          - RepoCardViewModel_ApplySelectedPackage_NoAgentsMdAndPackageHasTemplate_RaisesAgentsMdTemplateOfferRequestedWithContent
          - RepoCardViewModel_AcceptAgentsMdTemplate_WritesFileToRepoRootWithGivenContent
          - RepoCardViewModel_DeclineAgentsMdTemplate_PersistsDeclinedFlagInPinFile

      - id: AgentControl-LauncherUI-AgentsMdOfferBeforeReleaseNotes
        title: >-
          The LauncherUI subsystem shall show the AGENTS.md template offer before the release notes
          of the same upgrade, opening the release notes (in front) only after the offer is
          answered, and shall show the release notes at once when there is no offer.
        justification: |
          The release notes window opened first would cover the question, which would then wait
          unseen behind it.
        children:
          - AgentControl-RepoCardViewModel-AgentsMdOfferBeforeReleaseNotes
        tests:
          - MainWindow_UpgradeWithAgentsMdOffer_ShowsQuestionFirstThenReleaseNotes
          - MainWindow_UpgradeWithoutAgentsMdOffer_ShowsReleaseNotesAtOnce

      - id: AgentControl-LauncherUI-Settings
        title: >-
          The LauncherUI subsystem shall let the user view and edit the git executable
          override, agent tool selection, and shell preference, and persist changes on save.
        justification: |
          These preferences vary per developer/company and must be editable through the UI
          rather than requiring manual configuration-file edits.
        children:
          - AgentControl-SettingsWindowViewModel-Seed
          - AgentControl-SettingsWindowViewModel-CustomAgentTool
          - AgentControl-SettingsWindowViewModel-Save
          - AgentControl-SettingsWindowViewModel-ShellPreferencePresets
          - AgentControl-MainWindowViewModel-ApplySettings
        tests:
          - SettingsWindowViewModel_Constructor_SeedsPropertiesFromInitialSettings
          - SettingsWindowViewModel_SaveCommand_Execute_InvokesOnSaveWithCurrentValuesAndRaisesSaved
          - MainWindowViewModel_ApplySettings_PreservesRecentReposAndPersistsUpdatedFields

      - id: AgentControl-LauncherUI-PackageSources
        title: >-
          The LauncherUI subsystem shall let the user see the configured package sources with
          their kind and location and whether their folder can be found, listing a server
          source as not checked rather than contacting it merely to show the list.
        justification: |
          The developer must see what is configured and whether it is usable at a glance, and a
          server that may need a sign-in must never be contacted just to draw the list.
        children:
          - AgentControl-SettingsWindowViewModel-SourceList
          - AgentControl-SettingsWindowViewModel-SaveResultingSources
        tests:
          - SettingsWindowViewModel_Constructor_ListsConfiguredSourcesInOrder
          - SettingsWindowViewModel_SaveServerSource_ListsItAsNotCheckedAndPersistsIt

      - id: AgentControl-LauncherUI-AddPackageSource
        title: >-
          The LauncherUI subsystem shall let the user add a zip-package folder source, a
          NuGet-package folder source or a NuGet-package server source through a dialog.
        justification: |
          Several sources are only usable if the developer can add them in the application
          rather than in a settings file.
        children:
          - AgentControl-SettingsWindowViewModel-AddSource
          - AgentControl-SourceEditorViewModel-Save
        tests:
          - SettingsWindowViewModel_AddCommands_RaiseEditorRequestedForNewSourceOfEachKind
          - SettingsWindowViewModel_AddZipSource_EditorSaved_AddsAndSelectsSource
          - SettingsWindowViewModel_AddNuGetFolderSource_EditorSaved_KeepsPackageIds
          - SettingsWindowViewModel_AddNuGetServerSourceCommand_RequestsServerEditor
          - SettingsWindow_AddNuGetServerSourceButton_OpensServerEditorWithServerControls
          - SourceEditorViewModel_SaveCommand_ValidZipSource_RaisesSavedWithDefinition

      - id: AgentControl-LauncherUI-PackageSourceValidation
        title: >-
          The LauncherUI subsystem shall let the user save a package source from its dialog only
          when what was entered is valid, and shall explain what is wrong otherwise.
        justification: |
          A source the application would later refuse to use or save, or whose alias would make a
          repo's pin ambiguous, must not be acceptable in the dialog, and a credential typed into
          a location must be stopped where the user can correct it.
        children:
          - AgentControl-SettingsWindowViewModel-AliasUnique
          - AgentControl-SourceEditorViewModel-Validation
          - AgentControl-SourceEditorViewModel-AliasRules
          - AgentControl-SourceEditorViewModel-FolderLocation
          - AgentControl-SourceEditorViewModel-NoEmbeddedCredential
          - AgentControl-SourceEditorViewModel-CredentialNeverEchoed
          - AgentControl-SourceEditorViewModel-ServerAddressIndexJson
          - AgentControl-SourceEditorViewModel-InsecureHttpAddress
          - AgentControl-SourceEditorViewModel-PackageIdRequired
          - AgentControl-SourceEditorViewModel-PackageIdRequiredServerMessage
          - AgentControl-SourceEditorViewModel-NoErrorsUntilTouched
          - AgentControl-SourceEditorViewModel-SaveBlockedWhenInvalid
        tests:
          - SettingsWindowViewModel_AddSource_AliasAlreadyConfiguredIgnoringCase_EditorCannotSave
          - SourceEditorViewModel_Alias_Invalid_ReportsProblemAndBlocksSave
          - SourceEditorViewModel_Location_Invalid_ReportsProblemAndBlocksSave
          - SourceEditorViewModel_ServerLocation_Invalid_ReportsProblemAndBlocksSave
          - SourceEditorViewModel_NuGetSource_NoPackageIds_CannotSaveUntilOneIsAdded
          - SourceEditorViewModel_SaveCommand_InvalidEditor_DoesNotRaiseSaved

      - id: AgentControl-LauncherUI-PackageSourceLocationTooltip
        title: >-
          The LauncherUI subsystem shall offer the whole folder or feed address that was entered
          as the tooltip of the location box in the editor of a package source.
        justification: |
          A long location does not fit in the box; the user must be able to read all of it to
          check it.
        children:
          - AgentControl-SourceEditorViewModel-LocationTooltip
        tests:
          - SourceEditorViewModel_Location_TooltipShowsWholeValueAndIsNullWhenEmpty

      - id: AgentControl-LauncherUI-PackageSourcePackageIds
        title: >-
          The LauncherUI subsystem shall let the user list, in the editor of a NuGet-package
          folder or server source, the package IDs the source offers by adding and removing them,
          refusing an ID that is malformed or already listed.
        justification: |
          A NuGet folder or server is not scanned for packages, so the listed IDs define what it
          offers; a mistyped ID must be correctable without recreating the source, and a
          malformed or duplicate ID would only cause a failure or a double listing later.
        children:
          - AgentControl-SourceEditorViewModel-PackageIds
          - AgentControl-SourceEditorViewModel-PackageIdRemove
          - AgentControl-SourceEditorViewModel-PackageIdMalformed
          - AgentControl-SourceEditorViewModel-PackageIdDuplicate
        tests:
          - SourceEditorViewModel_SaveCommand_ValidNuGetSource_SavesPackageIds
          - SourceEditorViewModel_RemovePackageId_RemovesSelectedId
          - SourceEditorViewModel_AddPackageId_InvalidOrDuplicate_IsRefused

      - id: AgentControl-LauncherUI-ServerSourceEditor
        title: >-
          The LauncherUI subsystem shall present a NuGet-package server source in its own editor
          dialog that asks for the feed address and shows example addresses.
        justification: |
          A server is reached through an address rather than a folder, and the exact form of a
          feed address differs between products, so the dialog must ask for the one and show
          examples of it.
        children:
          - AgentControl-SourceEditorViewModel-ServerSource
          - AgentControl-SourceEditorViewModel-ServerExamples
        tests:
          - SettingsWindow_AddNuGetServerSourceButton_OpensServerEditorWithServerControls
          - SourceEditorViewModel_Constructor_NewServer_HasServerTitleLabelAndExamples

      - id: AgentControl-LauncherUI-InsecureHttpChoice
        title: >-
          The LauncherUI subsystem shall offer, in the editor of a NuGet-package server source,
          an "Allow insecure HTTP" choice that is off by default and warns when it is ticked.
        justification: |
          Choosing plain http must be a deliberate, informed decision because a sign-in would
          then cross the network unprotected.
        children:
          - AgentControl-SourceEditorViewModel-InsecureHttpChoice
          - AgentControl-SourceEditorViewModel-InsecureHttpWarning
        tests:
          - SourceEditorViewModel_Constructor_NewServer_HasServerTitleLabelAndExamples
          - SourceEditorViewModel_AllowInsecureHttp_Toggled_AcceptsHttpAndShowsWarning

      - id: AgentControl-LauncherUI-ServerSourceSettingsKept
        title: >-
          The LauncherUI subsystem shall keep the address, package IDs and insecure-HTTP choice
          of a NuGet-package server source when it is saved and when it is edited.
        justification: |
          A server source that lost its package IDs or its insecure choice on save or on edit
          would not work as the user configured it.
        children:
          - AgentControl-SourceEditorViewModel-ServerSettingsSaved
          - AgentControl-SourceEditorViewModel-ServerSettingsEdited
        tests:
          - SourceEditorViewModel_SaveCommand_ValidServer_SavesAddressPackageIdsAndInsecureChoice
          - SourceEditorViewModel_EditExistingServer_StaysAServerWithItsSettings

      - id: AgentControl-LauncherUI-EditPackageSource
        title: >-
          The LauncherUI subsystem shall let the user edit a configured package source in place
          without renaming it, carrying the settings the dialog does not show through unchanged.
        justification: |
          Sources are corrected over time, but repos pin to a source by alias, so an edit must
          never rename it or lose settings that are managed elsewhere.
        children:
          - AgentControl-SettingsWindowViewModel-EditSource
          - AgentControl-SourceEditorViewModel-EditKeepsAlias
          - AgentControl-SourceEditorViewModel-EditKeepsHiddenSettings
          - AgentControl-SourceEditorViewModel-SourceNotModified
        tests:
          - SettingsWindowViewModel_EditSource_EditorSaved_ReplacesSourceInPlaceKeepingAlias
          - SettingsWindowViewModel_EditServerSource_OpensServerEditorThatTestsThroughTheFactory
          - SourceEditorViewModel_EditExistingSource_AliasFixedAndOtherSettingsPreserved

      - id: AgentControl-LauncherUI-RemovePackageSource
        title: >-
          The LauncherUI subsystem shall let the user remove a configured package source after
          being told how many repos are pinned to it and that they will show a package source
          problem.
        justification: |
          Removing a source that repos are pinned to is allowed, because the pin is the repos'
          own record, but the developer must be told what will happen to those repos first.
        children:
          - AgentControl-SettingsWindowViewModel-RemoveSource
        tests:
          - SettingsWindowViewModel_RemoveSourceCommand_RaisesRemoveRequestedForSelectedSource
          - SettingsWindowViewModel_RemoveSource_WarnsAboutPinnedReposAndRemoves

      - id: AgentControl-LauncherUI-TestConnection
        title: >-
          The LauncherUI subsystem shall let the user test a NuGet-package server source from its
          editor dialog before saving it, showing progress and a Cancel action while the test
          runs and then a plain-language result that says whether the connection works and, when
          it does not, whether the sign-in failed or was canceled, the package was not found, the
          server timed out or the server could not be reached.
        justification: |
          A server source depends on an address, a package ID and often a sign-in; letting the
          developer find out which of them is wrong while the dialog is still open is far
          friendlier than discovering it later in a window that cannot say what failed, and a
          test against a slow or unreachable server must not freeze the dialog.
        children:
          - AgentControl-SourceEditorViewModel-TestConnectionAvailability
          - AgentControl-SourceEditorViewModel-TestConnection
          - AgentControl-SourceEditorViewModel-TestConnectionProgress
          - AgentControl-SourceEditorViewModel-TestConnectionCancel
          - AgentControl-SourceEditorViewModel-TestConnectionSuccess
          - AgentControl-SourceEditorViewModel-TestConnectionPackageNotFound
          - AgentControl-SourceEditorViewModel-TestConnectionFailureReasons
          - AgentControl-SourceEditorViewModel-TestConnectionOtherFailures
          - AgentControl-SourceEditorViewModel-TestConnectionResultDropped
          - AgentControl-SourceEditorViewModel-TestConnectionStaleResult
          - AgentControl-MainWindowViewModel-ConnectionTestProvider
        tests:
          - SourceEditorWindow_TestConnection_ShowsProgressCancelAndResult
          - SourceEditorWindow_ClosedWhileTesting_CancelsTheTest
          - SourceEditorViewModel_TestConnection_ServerAnswers_ReportsVersionCountAndLatest
          - SourceEditorViewModel_TestConnection_PackageMissing_ReportsPackageNotFound
          - SourceEditorViewModel_TestConnection_ProviderFails_ReportsHeadlineAndMessage
          - SourceEditorViewModel_TestConnection_CancelWhileRunning_StopsWithCanceledResult
          - MainWindowViewModel_CreateConnectionTestProvider_ReturnsNuGetProviderWithCredentials

      - id: AgentControl-LauncherUI-SignIn
        title: >-
          The LauncherUI subsystem shall ask the user to sign in, in a dialog, when a package
          server needs credentials for something the user started, and shall return the
          credential the user typed, or no credential when the user cancels, answering each
          question exactly once.
        justification: |
          A package server's credential has to come from the user, and the dialog is the one
          place it is typed; every way out of it must be an answer so the operation that asked is
          never left waiting.
        children:
          - AgentControl-CredentialPromptViewModel-SignInRequiresBoth
          - AgentControl-CredentialPromptViewModel-SignIn
          - AgentControl-CredentialPromptViewModel-PasswordVerbatim
          - AgentControl-CredentialPromptViewModel-Cancel
          - AgentControl-CredentialPromptViewModel-AnswerOnce
        tests:
          # The dialog itself and the object that shows it are views with no separate unit
          # document, so their behavior is verified by headless window tests at this level.
          - CredentialPromptWindow_SignInClicked_ReturnsTheTypedCredential
          - CredentialPromptWindow_CancelEscapeOrClose_ReturnNoCredential
          - AvaloniaCredentialPrompt_PromptAsync_FromWorkerThread_ShowsDialogAndReturnsCredential
          - AvaloniaCredentialPrompt_PromptAsync_UserCancels_ReturnsNull

      - id: AgentControl-LauncherUI-SignInDestination
        title: >-
          The LauncherUI subsystem shall show in the sign-in dialog which server will receive the
          credential.
        justification: |
          Showing where the credential goes protects against typing it into a look-alike request.
        children:
          - AgentControl-CredentialPromptViewModel-ShowsDestination
        tests:
          - CredentialPromptWindow_Shown_ShowsOriginSessionNoteAndMaskedPassword

      - id: AgentControl-LauncherUI-SignInWarnings
        title: >-
          The LauncherUI subsystem shall warn in the sign-in dialog when the server uses plain
          http and when a credential entered earlier for the server was just rejected.
        justification: |
          A password typed for a plain http server crosses the network unprotected, and being
          asked again without explanation looks like a fault; each warning must appear only when
          it is true.
        children:
          - AgentControl-CredentialPromptViewModel-InsecureHttpFlag
          - AgentControl-CredentialPromptViewModel-PreviousCredentialRejected
        tests:
          - CredentialPromptWindow_InsecureAndRejected_ShowWarningAndRejectedNotice

      - id: AgentControl-LauncherUI-SignInPasswordMasked
        title: >-
          The LauncherUI subsystem shall mask the password in the sign-in dialog as it is typed.
        justification: |
          A password shown on screen could be read over the user's shoulder or captured in a
          screenshot.
        tests:
          - CredentialPromptWindow_Shown_ShowsOriginSessionNoteAndMaskedPassword

      - id: AgentControl-LauncherUI-SignInSessionOnlyNote
        title: >-
          The LauncherUI subsystem shall state in the sign-in dialog that the credential is used
          for this session only and is not saved, unless the user chooses to remember it (see the
          requirement for remembering a sign-in).
        justification: |
          The user must know that AgentControl itself does not keep the secret beyond the
          session, so they can judge whether to type it.
        children:
          - AgentControl-CredentialPromptViewModel-SessionOnlyNote
        tests:
          - CredentialPromptWindow_Shown_ShowsOriginSessionNoteAndMaskedPassword

      - id: AgentControl-LauncherUI-SignInPlacement
        title: >-
          The LauncherUI subsystem shall show the sign-in dialog in front of the window that
          started the action, whichever thread asked, and shall show one such dialog at a time.
        justification: |
          Showing the dialog in front of the right window, one at a time, keeps two concurrent
          operations from leaving the user with a hidden or stacked dialog.
        tests:
          - AvaloniaCredentialPrompt_PromptAsync_FromWorkerThread_ShowsDialogAndReturnsCredential
          - AvaloniaCredentialPrompt_PromptAsync_TwoQuestionsAtOnce_AreShownOneAtATime

      - id: AgentControl-LauncherUI-SignInCancelsWithOperation
        title: >-
          The LauncherUI subsystem shall close the sign-in dialog, as if canceled, when the
          operation that asked for it is canceled.
        justification: |
          A dialog left open for an operation that no longer exists would ask the user for a
          credential nobody needs.
        tests:
          - AvaloniaCredentialPrompt_PromptAsync_TokenCancelled_ClosesDialogAndThrows

      - id: AgentControl-LauncherUI-RememberSignIn
        title: >-
          The LauncherUI subsystem shall let the user choose, in the sign-in dialog, to remember
          the sign-in on this computer in their Git credential helper - an option that is off by
          default, that says the helper and not AgentControl keeps the secret, and that is
          disabled with an explanation, and never acted on, when no credential helper can keep it
          - and shall return that choice with the credential.
        justification: |
          Retyping a token every session is a burden, but keeping a secret is the user's decision
          to make knowingly; the dialog is where they make it, so it must say who keeps the secret
          and must not offer a choice the application cannot honor.
        children:
          - AgentControl-CredentialPromptViewModel-RememberOption
          - AgentControl-CredentialPromptViewModel-RememberUnavailable
          - AgentControl-CredentialPromptViewModel-RememberNeverWithoutHelper
          - AgentControl-CredentialPromptViewModel-RememberAnswer
          - AgentControl-CredentialPromptViewModel-RememberNote
        tests:
          - CredentialPromptWindow_CanRemember_CheckboxEnabledUncheckedAndAnswersRemember
          - CredentialPromptWindow_CannotRemember_CheckboxDisabledWithExplanatoryTooltip
          - CredentialPromptViewModel_Remember_TickedWhenAvailable_AnswersWithRememberAndChangesTheNote

      - id: AgentControl-LauncherUI-ForgetSavedSignIn
        title: >-
          The LauncherUI subsystem shall let the user forget a server's saved sign-in from the
          editor of that server source - after a confirmation that names the server and says what
          is removed, with the result shown in words, and with the action disabled and explained
          where no Git credential helper is configured for the server (nothing can have been saved then) or can be
          reached.
        justification: |
          A sign-in the user chose to keep must be revocable from the place where they see the
          server, with no surprise and with an honest result.
        children:
          - AgentControl-SourceEditorViewModel-ForgetSavedSignIn
          - AgentControl-SourceEditorViewModel-ForgetAcceptableAddressOnly
          - AgentControl-SourceEditorViewModel-ForgetUnavailableExplained
          - AgentControl-SourceEditorViewModel-ForgetChecking
          - AgentControl-SourceEditorViewModel-ForgetConfirmation
          - AgentControl-SourceEditorViewModel-ForgetResultForgotten
          - AgentControl-SourceEditorViewModel-ForgetResultNothingSaved
          - AgentControl-SourceEditorViewModel-ForgetResultNotRemoved
        tests:
          - SourceEditorWindow_ForgetSavedSignIn_ConfirmationDecidesAndResultIsShown
          - SourceEditorWindow_ForgetSavedSignIn_NoCredentialStore_ButtonDisabledWithTooltip
          - SourceEditorWindow_ForgetSavedSignIn_NoCredentialHelper_ButtonDisabledWithTooltip
          - SourceEditorWindow_Sections_ServerEditorHasTitledSectionsAndForgetBelongsToSignIn

      - id: AgentControl-LauncherUI-SignatureOptions
        title: >-
          The LauncherUI subsystem shall let the user, in the editor of a NuGet-package folder or
          server source, require signed packages and pin the publisher's certificate fingerprint -
          explaining the limit of requiring signatures without a pinned publisher and how to find
          the fingerprint, accepting the fingerprint as typed or pasted, and, where the platform
          cannot verify signatures, showing the option disabled with the reason - and shall offer
          no such options for a zip-package source.
        justification: |
          The signature requirement is a per-source security control; the people who set it need
          to understand what it does and does not guarantee and be given the means to pin a
          publisher, and a platform that cannot honor it must say so instead of hiding the option
          or pretending.
        children:
          - AgentControl-SourceEditorViewModel-SignatureOptions
          - AgentControl-SourceEditorViewModel-SignatureExplanation
          - AgentControl-SourceEditorViewModel-SignatureUnsupportedPlatform
          - AgentControl-SourceEditorViewModel-SignatureSettingsKept
          - AgentControl-SourceEditorViewModel-SignatureChoiceSaved
          - AgentControl-SourceEditorViewModel-ZipNeverRequiresSignatures
          - AgentControl-SourceEditorViewModel-SignerFingerprint
          - AgentControl-SourceEditorViewModel-FingerprintOptional
          - AgentControl-SourceEditorViewModel-FingerprintSpellings
          - AgentControl-SourceEditorViewModel-FingerprintHelp
          - AgentControl-SourceEditorViewModel-FingerprintError
          - AgentControl-SourceEditorViewModel-FingerprintNormalized
          - AgentControl-SourceEditorViewModel-FingerprintNotSavedWhenUnused
        tests:
          - SourceEditorWindow_SignatureOptions_TickingEnablesTheFingerprintAndValidatesIt
          - SourceEditorWindow_SignatureOptions_UnsupportedPlatform_CheckboxDisabledWithTooltip
          - SourceEditorWindow_ZipSource_HasNoSignatureSection
          - SourceEditorViewModel_Fingerprint_ValidationFollowsTheRules

      - id: AgentControl-LauncherUI-SignatureIndicator
        title: >-
          The LauncherUI subsystem shall show, in the agent package chip of a repo card whose
          pinned package comes from a NuGet source that requires signed packages, a shield with a
          tooltip that says signatures are required and whether any trusted signer is accepted or
          the publisher is pinned, and no shield otherwise.
        justification: |
          A glance at the repo list should show which repos receive checked packages and how
          strictly, without opening the settings.
        children:
          - AgentControl-RepoCardViewModel-SignatureIndicator
        tests:
          - MainWindow_PackageChip_ShowsShieldOnlyWhenSignaturesAreRequired
          - RepoCardViewModel_PinnedSourceRequiresSignatures_ShowsShieldWithTooltip

      - id: AgentControl-LauncherUI-BackgroundChecksDoNotPrompt
        title: >-
          The LauncherUI subsystem shall not open a sign-in dialog for work the user did not
          start - the background upgrade check at start-up and after settings change - but use the
          credentials already entered during the session or saved by the user's credential store
          and otherwise explain on the card that a
          sign-in is needed and how to give it, while a check the user starts may ask.
        justification: |
          A dialog that appears unprompted while the user is doing something else is disruptive
          and hard to trust as a sign-in request; the user should sign in only for an action they
          chose to take, with the card saying which one.
        children:
          - AgentControl-RepoCardViewModel-BackgroundChecksNeverPrompt
        tests:
          - RepoCardViewModel_RefreshUpgradeStatusAsync_BackgroundCheckNeedsSignIn_DoesNotPromptAndExplains
          - RepoCardViewModel_RefreshUpgradeStatusAsync_UserRequestedCheck_PromptsOnceThenBackgroundChecksReuseCredential

      - id: AgentControl-LauncherUI-RepoCardChips
        title: >-
          The LauncherUI subsystem shall describe each repo card with labeled chips - the
          pinned agent package with its version and source (the source's alias beside an icon
          for its kind), the version an available upgrade would move to, the current branch, and
          status warnings - and shall name the configured agent tool on the card's Launch action.
        justification: |
          Unlabeled version numbers and icons leave a developer guessing what a card is telling
          them; each fact is stated in words with a tooltip that explains it in full.
        children:
          - AgentControl-RepoCardViewModel-DisplayInfo
          - AgentControl-RepoCardViewModel-UpgradeBadge
          - AgentControl-RepoCardViewModel-LaunchLabel
        tests:
          - RepoCardViewModel_PackageChip_PinnedToZipSource_ShowsNameVersionAndSourceInTooltip
          - RepoCardViewModel_PinnedToServerSource_ChipShowsAliasAndServerIcon
          - RepoCardViewModel_UpgradeChip_NewerVersionAtSource_ShowsTargetVersionAndTooltipWithBothVersions
          - RepoCardViewModel_BranchChip_BranchKnown_ShowsBranchWithTooltip
          - RepoCardViewModel_LaunchButtonText_ConfiguredTool_NamesToolOrFallsBack

      - id: AgentControl-LauncherUI-ResponsiveOperations
        title: >-
          The LauncherUI subsystem shall keep the window responsive while package sources are
          read or packages are applied, so that a slow source never freezes it.
        justification: |
          Package sources are often network shares or servers that can be slow or offline; a
          frozen window would be mistaken for a crash.
        children:
          - AgentControl-RepoCardViewModel-ResponsiveOperations
          - AgentControl-MainWindowViewModel-BackgroundUpgradeCheck
          - AgentControl-SelectPackageWindowViewModel-AsyncLoading
        tests:
          - RepoCardViewModel_RefreshUpgradeStatusAsync_SourceSlow_DoesNotBlockAndShowsChecking
          - RepoCardViewModel_ApplySelectedPackageAsync_SourceSlow_ReturnsToCallerBeforeSourceAnswers
          - SelectPackageWindowViewModel_SelectPackageName_VersionsSlow_ShowsProgressWithoutBlocking
          - MainWindowViewModel_Constructor_DoesNotReadSourcesUntilUpgradeRefreshBegins

      - id: AgentControl-LauncherUI-OperationProgress
        title: >-
          The LauncherUI subsystem shall show that a package operation is running and disable
          the repo card's other actions until it ends.
        justification: |
          The user must be able to tell that the application is working and not start a second,
          conflicting action on the same repo meanwhile.
        children:
          - AgentControl-RepoCardViewModel-OperationBusyState
        tests:
          - RepoCardViewModel_ApplySelectedPackageAsync_Running_ReportsBusyAndDisablesOtherActions
          - SelectPackageWindowViewModel_SelectPackageName_VersionsSlow_ShowsProgressWithoutBlocking

      - id: AgentControl-LauncherUI-OneOperationPerRepo
        title: >-
          The LauncherUI subsystem shall run only one package operation per repo at a time,
          ignoring a repeated request while one is running.
        justification: |
          A repeated click must not apply a package twice.
        children:
          - AgentControl-RepoCardViewModel-OneOperationAtATime
        tests:
          - AsyncRelayCommand_ExecuteAsync_WhileRunning_DoesNotRunOperationTwice
          - RepoCardViewModel_ApplySelectedPackageAsync_SecondCallWhileRunning_IsIgnored

      - id: AgentControl-LauncherUI-CancelOperation
        title: >-
          The LauncherUI subsystem shall let the user cancel a running package operation without
          the cancellation being reported as an error and without changing the repo's pin.
        justification: |
          A source that never answers must not trap the user in a wait they cannot leave, and
          giving up must leave the repo exactly as it was.
        children:
          - AgentControl-RepoCardViewModel-CancelOperation
        tests:
          - AsyncRelayCommand_Cancel_Running_SignalsTokenAndIsNotAnError
          - RepoCardViewModel_ApplySelectedPackageAsync_CancelledWhileRunning_ReportsNoErrorAndKeepsPinUnchanged

      - id: AgentControl-LauncherUI-SourceFailureIsolation
        title: >-
          The LauncherUI subsystem shall show a package source that cannot be read as an inline
          problem without affecting other sources or repos.
        justification: |
          With several sources configured, one share or server being offline is expected; it must
          not stop the developer from using a source that works or hide the state of repos
          pinned to other sources.
        children:
          - AgentControl-SelectPackageWindowViewModel-SourceFailureIsolation
        tests:
          - MainWindowViewModel_BeginUpgradeRefresh_OneSourceUnreachable_OtherCardsStillChecked
          - SelectPackageWindowViewModel_LoadAsync_OneSourceUnreachable_OthersStillLoadAndErrorIsInline

      - id: AgentControl-LauncherUI-RetryFailedRead
        title: >-
          The LauncherUI subsystem shall let the user retry just the package-source read that
          failed.
        justification: |
          A transient failure, such as a server that was briefly unreachable or a sign-in that was
          canceled, should be recoverable without closing the dialog or rereading sources that
          already answered.
        children:
          - AgentControl-SelectPackageWindowViewModel-Retry
        tests:
          - SelectPackageWindowViewModel_Retry_SourceFailedThenAnswers_LoadsOnlyThatSource
          - SelectPackageWindowViewModel_Retry_StillFailing_KeepsErrorAndRetryAvailable

      - id: AgentControl-LauncherUI-StaleResultsDiscarded
        title: >-
          The LauncherUI subsystem shall discard the late answer of a package-source read that a
          newer request has superseded, so that it never overwrites the newer state.
        justification: |
          An answer that arrives after the sources or the user's selection have changed must not
          overwrite what the user is now looking at.
        children:
          - AgentControl-RepoCardViewModel-SupersededUpgradeCheck
          - AgentControl-RepoCardViewModel-StaleUpgradeCheckDiscarded
          - AgentControl-RepoCardViewModel-UpgradeStateResetOnRefresh
        tests:
          - RepoCardViewModel_RefreshUpgradeStatusAsync_NewerCheckStarted_OlderResultIsDiscarded
          - SelectPackageWindowViewModel_ChangeSelectedPackageName_SupersedesSlowerEarlierLoad

      - id: AgentControl-LauncherUI-About
        title: >-
          The LauncherUI subsystem shall provide an About command that opens a dialog showing
          the application logo, a short mission tagline, the application version, copyright,
          and a scrollable list of this application's direct third-party dependencies with
          their license information.
        justification: |
          Lets a developer confirm exactly which AgentControl build they are running, briefly
          reminds them what the application is for, and lets them review the open-source
          dependencies bundled with the application.
        tests:
          # The About dialog itself has no dedicated view-model class, so its rendering is
          # verified end-to-end only, via the FlaUI UiTests project; the dependency list's
          # underlying data source has direct unit coverage.
          - windows@AboutButton_Click_OpensAboutWindowShowingVersionAndCopyright
          - MainWindow_AboutClicked_OpensModalAboutOwnedByMainWindow
          - ThirdPartyDependencies_All_MatchesCsprojDirectRuntimeDependencies
          - ThirdPartyDependencies_All_NoDuplicateNames
          - ThirdPartyDependencies_All_EveryEntryHasNonEmptyLicense
          - DependencyInfo_ToString_RepresentativeEntry_ReturnsNameLicenseFormat

      - id: AgentControl-LauncherUI-AboutVersionRow
        title: >-
          The LauncherUI subsystem shall show the application version in the About dialog as a
          labeled Version row, without its build metadata, with the full build version as its
          tooltip.
        justification: |
          A short, labeled version is easy to read out when reporting an issue, and the full build
          version is still there for whoever needs it.
        tests:
          - AboutWindow_VersionRow_IsLabeledAndShortWithFullVersionInTooltip

      - id: AgentControl-LauncherUI-SourceAwareActions
        title: >-
          The LauncherUI subsystem shall perform select-package, upgrade, launch-time sync and
          upgrade-available checks for a repo only at the package source named in the repo's
          pin, shall record that source in the pin when a package is applied, shall show an
          error state instead of offering anything when the pinned source is not configured, and
          shall keep cached source results only for sources that have not changed.
        justification: |
          A repo's pin binds it to one source; quietly using a different source because the
          pinned one is missing or renamed would install content the pin never named, and the
          user needs to see that the source is missing so they can restore it.
        children:
          - AgentControl-RepoCardViewModel-SourceAwareness
          - AgentControl-MainWindowViewModel-InvalidateChangedSources
          - AgentControl-SelectPackageWindowViewModel-SourceScoped
        tests:
          - RepoCardViewModel_Refresh_PinNamesUnconfiguredSource_ShowsSourceProblemAndOffersNoUpgrade
          - RepoCardViewModel_ApplySelectedPackage_SecondSourceSelected_PinRecordsThatSourceAndItsContent

      - id: AgentControl-LauncherUI-ContentChangeProtection
        title: >-
          The LauncherUI subsystem shall record the content identity of a package in the repo's pin
          when the package is selected or upgraded to.
        justification: |
          A package republished under the version a repo is pinned to would silently change the
          instructions an agent follows; recording what was applied is what makes that detectable.
        children:
          - AgentControl-RepoCardViewModel-RecordContentIdentity
        tests:
          - RepoCardViewModel_ApplySelectedPackage_FirstApply_RecordsZipSha256InPin

      - id: AgentControl-LauncherUI-ContentChangeRefusal
        title: >-
          The LauncherUI subsystem shall not replace a repo's agent files with a package of the
          pinned version whose content differs from the recorded identity when upgrading or when
          restoring missing agent files before launch, shall tell the user in plain language,
          shall change nothing and shall never write the pin during a launch.
        justification: |
          A changed copy of the pinned version must never be applied without the user knowing; the
          launch-time restore must also never rewrite the pin, because that would change a file
          under version control every time the agent tool is started.
        children:
          - AgentControl-RepoCardViewModel-RefuseChangedContent
          - AgentControl-RepoCardViewModel-RefuseChangedContentMessage
          - AgentControl-RepoCardViewModel-LaunchSyncNeverWritesPin
        tests:
          - RepoCardViewModel_UpgradeCommand_SameVersionRepublished_RefusesWithoutChangingRepoOrPin
          - RepoCardViewModel_EnsureAgentFilesSyncedBeforeLaunch_SameVersionRepublished_RefusesWithoutExtractingOrWritingPin

      - id: AgentControl-LauncherUI-ContentChangeConfirmation
        title: >-
          The LauncherUI subsystem shall ask the user to confirm before a selected package of the
          pinned version, whose content differs from the recorded identity, replaces the repo's
          agent files, and shall change nothing unless the user confirms.
        justification: |
          Accepting changed content is a decision that belongs to the user; asking first makes it
          deliberate, and choosing the same version again is the one way to make it.
        children:
          - AgentControl-RepoCardViewModel-ConfirmChangedContent
          - AgentControl-RepoCardViewModel-ApplyConfirmedContent
          - AgentControl-RepoCardViewModel-RefuseChangeWithoutAsking
        tests:
          - RepoCardViewModel_ApplySelectedPackage_SameVersionRepublished_RequestsConfirmationAndChangesNothing
          - MainWindow_SelectingRepublishedPinnedVersion_AsksFirstAndAppliesOnlyWhenConfirmed

      - id: AgentControl-LauncherUI-ContentChangeAdoption
        title: >-
          The LauncherUI subsystem shall apply a package silently, recording its identity, when the
          pin recorded none or the source reports none.
        justification: |
          Pins made before identities existed, and sources that cannot name an identity, must keep
          working without warnings that mean nothing.
        children:
          - AgentControl-RepoCardViewModel-AdoptMissingIdentity
          - AgentControl-RepoCardViewModel-IgnoreMissingSourceIdentity
        tests:
          - RepoCardViewModel_ApplySelectedPackage_PinWithoutIdentity_AdoptsIdentityWithoutWarning

      - id: AgentControl-LauncherUI-GitSourceSetup
        title: >-
          The LauncherUI subsystem shall run git for Git package sources with the configured git
          executable and shall keep what it fetches inside the isolated configuration directory
          when one is given.
        justification: |
          A test that writes into the real user profile, or a git other than the one the user
          configured, would be a defect; the card is where those settings are known.
        children:
          - AgentControl-RepoCardViewModel-GitSourceOptions
          - AgentControl-RepoCardViewModel-GitSourceCacheRoot
        tests:
          - RepoCardViewModel_CreateSourceRegistry_GitSource_RunsTheConfiguredOrOverriddenGit

      - id: AgentControl-LauncherUI-GitSourcePrompts
        title: >-
          The LauncherUI subsystem shall let git show its credential UI only for work the user
          started and never for background work such as the upgrade check or the restore before
          launch.
        justification: |
          A sign-in window that opens by itself would be a defect; the card is where the difference
          between user-started and background work is known.
        children:
          - AgentControl-RepoCardViewModel-GitSourcePrompts
        tests:
          - RepoCardViewModel_CreateSourceRegistry_GitSource_PromptsOnlyForUserStartedWork

      - id: AgentControl-LauncherUI-GitTooOld
        title: >-
          The LauncherUI subsystem shall say on the card, when the installed git is older than the
          supported version, that the git is too old (for the background check) and offer no
          upgrade, instead of failing in an unclear way.
        justification: |
          A git that is too old fails with an error that means nothing to the user, so the card
          says what is wrong and what to do.
        children:
          - AgentControl-RepoCardViewModel-GitTooOldProblem
          - AgentControl-RepoCardViewModel-GitTooOldNoUpgrade
        tests:
          - RepoCardViewModel_RefreshUpgradeStatus_GitTooOld_ShowsSourceProblemWithoutSignIn

      - id: AgentControl-LauncherUI-GitSourceEditor
        title: >-
          The LauncherUI subsystem shall offer, for a Git repository source, an editor in which the
          user enters the repository address, the package name, a tag pattern and optionally the
          folder inside the repository, each explained with examples, validated while the user
          types and saved only when the application would accept it.
        justification: |
          A Git source is only useful when its address and tag pattern are right; validating while
          the user types lets them fix a mistake while the dialog is still open instead of
          discovering an empty package list later.
        children:
          - AgentControl-SourceEditorViewModel-GitEditor
          - AgentControl-SourceEditorViewModel-GitEditorDefaults
          - AgentControl-SourceEditorViewModel-GitSubfolderNormalized
          - AgentControl-SourceEditorViewModel-GitSaveNew
          - AgentControl-SourceEditorViewModel-GitSaveExisting
          - AgentControl-SourceEditorViewModel-GitSaveGate
          - AgentControl-SourceEditorViewModel-GitValidation
          - AgentControl-SourceEditorViewModel-GitValidationTagPattern
          - AgentControl-SourceEditorViewModel-GitValidationSubfolder
          - AgentControl-SourceEditorViewModel-GitValidationPackageName
          - AgentControl-SourceEditorViewModel-GitTagPatternHelp
          - AgentControl-SettingsWindowViewModel-RefuseInvalidGitSource
          - AgentControl-SettingsWindowViewModel-RefuseInvalidGitAddress
          - AgentControl-SettingsWindowViewModel-RefuseInvalidGitSubfolder
          - AgentControl-SettingsWindowViewModel-RefuseInvalidGitPackageName
        tests:
          - SourceEditorWindow_GitSource_ShowsGitSectionsAndHidesNuGetOnes
          - SourceEditorWindow_GitSource_BadTagPattern_ShowsErrorAndDisablesSave
          - SourceEditorWindow_GitSource_Save_ClosesWithTheGitDefinition

      - id: AgentControl-LauncherUI-GitSourceConnectionTest
        title: >-
          The LauncherUI subsystem shall let the user test the connection to a Git repository in
          the source editor and see which of the repository's tags match the pattern - and, when
          none matches, which tags the repository has - before saving.
        justification: |
          A tag pattern that matches nothing is an easy mistake (a capital letter, a missing
          prefix); showing the matching tags, and the tags that did not match when none does, lets
          the user fix it while the dialog is still open.
        children:
          - AgentControl-SourceEditorViewModel-GitTestConnection
          - AgentControl-SourceEditorViewModel-GitTestRuns
          - AgentControl-SourceEditorViewModel-GitTestDefaultProvider
          - AgentControl-SourceEditorViewModel-GitTestFailureReasons
          - AgentControl-SourceEditorViewModel-GitTestGitTooOld
          - AgentControl-SourceEditorViewModel-GitTestOtherFailure
          - AgentControl-SourceEditorViewModel-GitTestCancel
          - AgentControl-SourceEditorViewModel-GitTestCancelAndStale
          - AgentControl-SourceEditorViewModel-GitTagPreview
          - AgentControl-SourceEditorViewModel-GitTagPreviewNoMatch
          - AgentControl-SourceEditorViewModel-GitTagPreviewNoTags
          - AgentControl-SourceEditorViewModel-GitTagPreviewCleared
          - AgentControl-MainWindowViewModel-GitConnectionTestProvider
          - AgentControl-MainWindowViewModel-GitConnectionTestInteractive
          - AgentControl-MainWindowViewModel-GitConnectionTestRefusesOldGit
        tests:
          - SourceEditorWindow_GitSource_TestConnection_ShowsTagPreviewList

      - id: AgentControl-LauncherUI-GitSignInGuidance
        title: >-
          The LauncherUI subsystem shall tell the user, in the Git repository source editor, that
          AgentControl uses the user's own Git sign-in (credential manager or SSH keys), never
          stores credentials, may show Git's sign-in for the connection test and Select Package, and
          never prompts for checks it runs in the background.
        justification: |
          A user who has to guess where a sign-in comes from may put a password into the address;
          saying who signs in, and when a prompt can appear, prevents that and makes a prompt the
          user did not expect recognizable.
        children:
          - AgentControl-SourceEditorViewModel-GitSignInNote
        tests:
          - SourceEditorWindow_GitSource_ShowsGitSectionsAndHidesNuGetOnes

      - id: AgentControl-LauncherUI-GitSourcePresentation
        title: >-
          The LauncherUI subsystem shall present a Git repository source with the Git icon and its
          type name wherever sources are shown (the Settings list, Select Package and the repo
          card).
        justification: |
          The same name can exist in several sources, so the user must be able to tell a Git source
          from a folder or a server at a glance.
        children:
          - AgentControl-RepoCardViewModel-GitSourceAwareness
        tests:
          - PackageSourceIcons_GitSource_HasGitIconAndNames
          - SelectPackageWindowViewModel_Constructor_GitSource_ShowsGitIconAndTypeName
          - RepoCardViewModel_PinnedGitSource_ShowsGitIconAndAlias

      - id: AgentControl-LauncherUI-GitSourceRowStatus
        title: >-
          The LauncherUI subsystem shall list a remote Git source in the Settings window as not
          checked, list a Git source on a local path with the status of its folder, and keep a
          saved Git source in the settings.
        justification: |
          A remote repository cannot be checked without a network and a sign-in, so claiming a
          status for it would mislead; a local path can be checked like any folder source.
        children:
          - AgentControl-SettingsWindowViewModel-GitSourceRowStatus
          - AgentControl-SettingsWindowViewModel-GitSourceLocalFolderStatus
          - AgentControl-SettingsWindowViewModel-GitSourcePersisted
        tests:
          - PackageSourceItemViewModel_RemoteGitSource_IsNotCheckedAndNeverAsksTheFolder
          - PackageSourceItemViewModel_LocalGitSource_ChecksTheFolder
          - PackageSourceItemViewModel_OtherKinds_RemoteClassificationUnchanged

      - id: AgentControl-LauncherUI-GitSourceCardTooltip
        title: >-
          The LauncherUI subsystem shall show on the card of a repo pinned to a Git source the tag
          and the shortened commit its files came from.
        justification: |
          Knowing the exact tag and commit a repo's files came from is what makes a later change
          to that tag recognizable.
        children:
          - AgentControl-RepoCardViewModel-GitSourceTooltip
        tests:
          - RepoCardViewModel_PackageChipTooltip_GitPinWithCommit_NamesTagAndShortCommit

      - id: AgentControl-LauncherUI-TagMovedWarning
        title: >-
          The LauncherUI subsystem shall show, on the card of a repo pinned to a Git source, a "Tag
          moved" warning when the tag of the pinned version now points to a different commit than
          the one the repo's files came from, explaining what happened and how to accept it.
        justification: |
          A moved tag changes the instructions an agent follows without a new version, so the user
          must be told.
        children:
          - AgentControl-RepoCardViewModel-TagMovedWarning
          - AgentControl-RepoCardViewModel-TagMovedNeedsEvidence
          - AgentControl-RepoCardViewModel-TagMovedClearedByNewPin
          - AgentControl-RepoCardViewModel-TagMovedFollowsTagPattern
        tests:
          - RepoCardViewModel_RefreshUpgradeStatus_TagMoved_ShowsTagMovedStatusAndTooltip

      - id: AgentControl-LauncherUI-TagMovedAppliesNothing
        title: >-
          The LauncherUI subsystem shall never apply anything because a tag moved.
        justification: |
          Applying a moved tag silently would defeat the point of pinning, so the decision stays
          with the user.
        children:
          - AgentControl-RepoCardViewModel-TagMovedAppliesNothing
        tests:
          - RepoCardViewModel_RefreshUpgradeStatus_TagMoved_AppliesNothing

      - id: AgentControl-LauncherUI-TagMovedFreshListing
        title: >-
          The LauncherUI subsystem shall read the Git source again when the user starts a refresh,
          so that a tag moved during the session is not missed.
        justification: |
          A cached listing would hide a tag moved later in the session.
        children:
          - AgentControl-RepoCardViewModel-TagMovedFreshListing
        tests:
          - RepoCardViewModel_RefreshAsync_GitSourceTagMovedAfterCachedListing_ListsAgainAndShowsTagMoved

      - id: AgentControl-LauncherUI-TagMovedClearedWhenUnknown
        title: >-
          The LauncherUI subsystem shall not keep a "Tag moved" warning up once a later check could
          not confirm it.
        justification: |
          A warning kept after a failed check would claim something nothing established.
        children:
          - AgentControl-RepoCardViewModel-TagMovedClearedWhenUnknown
        tests:
          - RepoCardViewModel_RefreshAsync_FailsAfterTagMoved_ClearsTagMovedAndShowsCheckFailed

      - id: AgentControl-LauncherUI-ChangePackage
        title: >-
          The LauncherUI subsystem shall let the user, for a repo that already has a pin, open the
          package selection from the card menu as Change package, so that the user can choose
          another package or version, or choose the same version again to accept content that
          changed behind it.
        justification: |
          A pinned repo needs a way to move to another package, and the deliberate way to accept a
          republished version or a moved tag is to choose it again.
        children:
          - AgentControl-RepoCardViewModel-ChangePackage
          - AgentControl-RepoCardViewModel-ChangePackageRequest
        tests:
          - MainWindow_ChangePackageOnPinnedRepo_OpensSelectPackageOnThePinnedChoice
          - RepoCardViewModel_SelectPackageCommand_PinAlreadyExists_CanExecuteAsChangePackage

      - id: AgentControl-LauncherUI-ChangePackageStartsOnCurrentChoice
        title: >-
          The LauncherUI subsystem shall start Change package on the source, package and version
          the repo uses, never overriding a choice the user makes while it loads.
        justification: |
          Starting on the current choice makes accepting changed content a single confirmation,
          and a start that overrode the user's own choice would be a trap.
