---
# Software Unit Requirements for the GitCredentialClient Class
#
# GitCredentialClient keeps, finds and removes a package feed's sign-in in the user's own Git
# credential helper by running the user's git executable, so AgentControl never stores a secret
# itself.

sections:
  - title: GitCredentialClient Unit Requirements
    requirements:
      - id: AgentControl-GitCredentialClient-FillApproveReject
        title: >-
          The GitCredentialClient class shall find the sign-in the user's Git credential helper
          holds for a package feed, keep a sign-in on request and remove a sign-in on request -
          describing the feed to the helper by its scheme, host and (when not the default) port -
          and shall report no sign-in when the helper has none or an incomplete one.
        justification: |
          Keeping a feed's sign-in beyond the session needs a place that protects secrets; the
          credential helper the user already has configured for Git is such a place, so asking it
          means the application itself needs no secret storage, and describing the feed the way a
          Git remote is described lets the helper's own matching rules apply.
        tests:
          - GitCredentialClient_Fill_CredentialStored_ReturnsItWithTheDocumentedRequestAndEnvironment
          - GitCredentialClient_Fill_DefaultPort_SendsHostWithoutPort
          - GitCredentialClient_Fill_NothingOrIncomplete_ReturnsNull
          - GitCredentialClient_Approve_Credential_SendsItWithApprove
          - GitCredentialClient_Reject_WithAndWithoutCredential_SendsItWithReject
          - GitCredentialClient_ParseCredential_VariousResponses_ParsesOnlyCompleteOnes
          - GitCredentialClient_RealGitWithIsolatedStore_MissApproveFillRejectLifeCycle
          - GitCredentialClient_RealGit_RejectWithoutCredential_RemovesOnlyThatOrigin

      - id: AgentControl-GitCredentialClient-HelperAvailability
        title: >-
          The GitCredentialClient class shall report whether a Git credential helper applies to a
          package feed's origin, honoring configuration the user scoped to that origin, and shall
          report that none does when no helper is configured, the helper list was reset to
          nothing, git cannot be run or git fails.
        justification: |
          The option to remember a sign-in is only honest when something can really keep it; a
          helper configured for one host only, or reset for another, must be recognized exactly as
          Git itself would, so the user is never offered a choice that silently does nothing.
        tests:
          - GitCredentialClient_IsAvailable_HelperConfigured_ReturnsTrueAndAsksAboutTheOrigin
          - GitCredentialClient_IsAvailable_NoHelperOrGitFails_ReturnsFalse
          - GitCredentialClient_RealGit_NoCredentialHelper_IsUnavailableAndFindsNothing

      - id: AgentControl-GitCredentialClient-NeverInteractive
        title: >-
          The GitCredentialClient class shall never let Git or the credential helper ask the user
          anything or wait for input - no terminal prompt, no password-prompt program, no helper
          dialog and no input left open - shall not let the helper probe the network to identify
          the feed's host, shall not change the user's Git configuration, and shall run from a
          folder that is not a repo the application might be inside, so that a repo's own
          configuration cannot add a credential helper.
        justification: |
          The application's own sign-in dialog is the only user interface for a sign-in; a hidden
          prompt would hang a background operation or confuse the user, a host probe would tell
          the server about the lookup, and a repo's Git configuration is untrusted input that must
          not be able to choose where a credential is sent.
        tests:
          - GitCredentialClient_Fill_CredentialStored_ReturnsItWithTheDocumentedRequestAndEnvironment
          - GitCredentialClient_Fill_DefaultPort_SendsHostWithoutPort
          - GitCredentialClient_Approve_Credential_SendsItWithApprove

      - id: AgentControl-GitCredentialClient-BoundedTime
        title: >-
          The GitCredentialClient class shall give up on a Git invocation that does not finish
          within a time limit - stopping Git and every process it started - and then report no
          sign-in, and shall stop Git and everything it started, and propagate the cancellation,
          when the caller cancels.
        justification: |
          A stuck credential helper must not hold an operation the user is waiting for, nor leave
          processes running; a lookup that fails to answer in time is treated as "nothing saved"
          so the user can still be asked.
        tests:
          - GitCredentialClient_Fill_ProcessHangs_IsKilledAtTheTimeLimitAndReturnsNull
          - GitCredentialClient_Fill_CancelledWhileGitHangs_KillsTheProcessAndThrows

      - id: AgentControl-GitCredentialClient-UnavailableIsNotAnError
        title: >-
          The GitCredentialClient class shall treat a missing git executable, a Git failure and a
          helper that refuses as "nothing saved" or "not saved" results rather than as failures
          that stop the caller, shall use the git executable the user configured as it is when each
          call is made, and shall refuse invalid construction arguments.
        justification: |
          Not having Git or a helper is a normal situation for a user who never asked to remember
          anything; it must not turn a sign-in or a package operation into an error, and a changed
          Git setting must apply at once without restarting the application.
        tests:
          - GitCredentialClient_GitExecutableMissing_ReportsNothingWithoutThrowing
          - GitCredentialClient_ApproveAndReject_GitFails_ReturnFalse
          - GitCredentialClient_ResolverConstructor_ResolvesTheExecutableOnEveryCall
          - GitCredentialClient_Constructors_InvalidArguments_Throw

      - id: AgentControl-GitCredentialClient-SecretsNeverLogged
        title: >-
          The GitCredentialClient class shall never write a credential, or anything Git or the
          helper says, to the application log, shall never put a secret in a command-line
          argument, and shall refuse to hand Git a credential, or an origin, containing a character
          the line-based credential protocol cannot carry (a line feed, a carriage return or NUL),
          so that no malformed request is written.
        justification: |
          The log is a plain file users attach to reports and command lines are visible to other
          processes; the protocol is lines of key=value with no escape mechanism, so a value with
          a line feed could inject further fields into the request Git reads, one with a NUL ends
          it, and a carriage return is commonly trimmed or mishandled by helpers - such a value is
          refused rather than sent or altered. A value containing "=" is valid (Git splits a
          line at the first one; Base64 padding is common in tokens) and is sent unchanged.
        tests:
          - GitCredentialClient_AllOperations_NeverLogRequestOrResponseContent
          - GitCredentialClient_ApproveAndReject_ValueWithLineFeedCarriageReturnOrNul_AreRefusedWithoutRunningGit
          - GitCredentialClient_Approve_PasswordWithEquals_IsSentUnchanged
          - GitCredentialClient_BuildRequestAndParse_EqualsRoundTripsAndLineBreaksAreNull
          - GitCredentialClient_IsSafeValue_OnlyLineFeedCarriageReturnAndNul_AreRejected
          - GitCredentialClient_RealGit_PasswordWithEquals_RoundTripsIdentically
