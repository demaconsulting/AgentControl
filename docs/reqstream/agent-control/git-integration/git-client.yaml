---
# Software Unit Requirements for the GitClient Class
#
# GitClient invokes the configured git executable to query working-tree cleanliness, pull
# commits, read the HEAD commit hash, detect committed agent files, list which managed agent
# folders are tracked and stop tracking them, and resolve the current
# branch (using a fast path that reads .git/HEAD directly before falling back to a subprocess).

sections:
  - title: GitClient Unit Requirements
    requirements:
      - id: AgentControl-GitClient-CheckWorkingTree
        title: >-
          The GitClient class shall report whether a repo's working tree is clean, and shall
          raise a clear error when the git executable cannot be found or the status command
          fails.
        justification: |
          Pull gating and other status computation depend on an accurate, reliably-erroring
          clean/dirty determination rather than a silent false negative.
        tests:
          - GitClient_IsWorkingTreeClean_CleanRepo_ReturnsTrue
          - GitClient_IsWorkingTreeClean_DirtyRepo_ReturnsFalse
          - GitClient_IsWorkingTreeClean_StatusCommandFails_ThrowsInvalidOperationException
          - GitClient_IsWorkingTreeClean_ExecutableNotFound_ThrowsInvalidOperationException

      - id: AgentControl-GitClient-Pull
        title: >-
          The GitClient class shall pull a repo's latest commits and report success or
          failure without throwing on a failed pull.
        justification: |
          A failed pull (e.g. no network, diverged history) is an expected, user-facing
          outcome that must be reported as a result value, not an unhandled exception.
        tests:
          - GitClient_Pull_Succeeds_ReturnsSucceededResult
          - GitClient_Pull_Fails_ReturnsNonSucceededResultWithoutThrowing

      - id: AgentControl-GitClient-DetectCommittedFiles
        title: >-
          The GitClient class shall report whether a repo has any committed agent files, and
          shall raise a clear error when the underlying query fails.
        justification: |
          Distinguishes repos where agent files are tracked in git (a deliberate team
          decision) from ones where they remain purely local/gitignored, driving the
          committed-agent-files badge.
        tests:
          - GitClient_HasCommittedAgentFiles_LsFilesReportsFiles_ReturnsTrue
          - GitClient_HasCommittedAgentFiles_LsFilesReportsNothing_ReturnsFalse
          - GitClient_HasCommittedAgentFiles_LsFilesFails_ThrowsInvalidOperationException

      - id: AgentControl-GitClient-ListTrackedAgentFolders
        title: >-
          The GitClient class shall report which of a repo's managed agent folders have files
          tracked by git, from git's current state at the time of the call, and shall raise a
          clear error when the underlying query fails.
        justification: |
          Converting a repo with committed agent files must name, and act on, exactly the folders
          that are tracked at that moment; an answer remembered from an earlier commit could name
          folders that are no longer tracked or miss ones that are.
        tests:
          - GitClient_GetTrackedAgentFolders_SomeFoldersTracked_ReturnsOnlyThoseInKnownOrder
          - GitClient_GetTrackedAgentFolders_NothingTracked_ReturnsEmptyList
          - GitClient_GetTrackedAgentFolders_ExactPathTracked_CountsItButNotPrefixSibling
          - GitClient_GetTrackedAgentFolders_LsFilesFails_ThrowsInvalidOperationException

      - id: AgentControl-GitClient-UntrackAgentFolders
        title: >-
          The GitClient class shall stop git tracking the managed agent folders it is given,
          leaving every file on disk and every other tracked path as it was, and shall raise a
          clear error carrying git's explanation when git cannot do so.
        justification: |
          A package can only manage folders that git does not track, but the files a team
          committed must not be deleted or changed by taking them out of git; a failure must be
          reported so the caller can stop before replacing anything.
        tests:
          - GitClient_UntrackAgentFolders_TrackedFolders_RemovesThemFromIndexOnlyAndKeepsFilesOnDisk
          - GitClient_UntrackAgentFolders_GitRmFails_ThrowsInvalidOperationException

      - id: AgentControl-GitClient-UntrackOnlyAgentFolders
        title: >-
          The GitClient class shall refuse to stop git tracking anything that is not one of the
          managed agent folders, and shall refuse an empty list, without running git.
        justification: |
          Stopping git tracking is the one change AgentControl makes to what a team has committed;
          it must never reach a path that is not one of the folders AgentControl manages.
        tests:
          - GitClient_UntrackAgentFolders_EmptyOrUnknownFolders_ThrowsArgumentException

      - id: AgentControl-GitClient-CurrentBranch
        title: >-
          The GitClient class shall resolve a repo's current branch name, reading `.git/HEAD`
          directly as a fast path (recognizing a normal branch, a detached HEAD, and a
          worktree indirection) and falling back to invoking git when the fast path cannot
          determine an answer.
        justification: |
          Displaying the current branch on every repo card must be fast even across many
          repos, while still producing a correct answer for the less-common cases a direct
          file read cannot resolve alone.
        tests:
          - GitClient_GetCurrentBranch_FastPathNormalBranch_ReturnsBranchNameWithoutInvokingGit
          - GitClient_GetCurrentBranch_FastPathDetachedHead_ReturnsDetachedMarker
          - GitClient_GetCurrentBranch_FastPathWorktreeIndirection_ReturnsBranchName
          - GitClient_GetCurrentBranch_NoGitDirectory_FallsBackToSubprocess
          - GitClient_GetCurrentBranch_UnrecognizedHeadContent_FallsBackToSubprocess
          - GitClient_GetCurrentBranch_FallbackFails_ThrowsInvalidOperationException

      - id: AgentControl-GitClient-HeadHash
        title: >-
          The GitClient class shall read a repo's current HEAD commit hash, trimmed, and
          raise a clear error when the query fails.
        justification: |
          The HEAD commit hash is the cache key for the committed-agent-files-changed check,
          so it must be resolved reliably and in a normalized (trimmed) form.
        tests:
          - GitClient_GetHeadCommitHash_Succeeds_ReturnsTrimmedHash
          - GitClient_GetHeadCommitHash_Fails_ThrowsInvalidOperationException
          - GitClient_Constructor_EmptyExecutablePath_ThrowsArgumentException
