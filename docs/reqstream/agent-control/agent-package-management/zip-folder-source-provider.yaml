---
# Software Unit Requirements for the ZipFolderSourceProvider Class
#
# ZipFolderSourceProvider serves a folder of {name}-{semver}.zip package files through the
# common package-source contract, with the same discovery behavior as PackageSource.
#
# Each requirement states one observable criterion. ListAndAcquire keeps its original ID for the
# listing of versions; the other behaviors it once combined have their own IDs.

sections:
  - title: ZipFolderSourceProvider Unit Requirements
    requirements:
      - id: AgentControl-ZipFolderSourceProvider-ListAndAcquire
        title: >-
          The ZipFolderSourceProvider class shall list the versions of a named package found in
          its folder of zip packages, labeling each with its source alias and recognizing package
          file names by the same rules as before.
        justification: |
          The zip folder is the original source type; it must keep discovering packages by the
          same file-name rules while taking part in the multi-source model, and every version
          must be traceable to the source that offered it.
        tests:
          - ZipFolderSourceProvider_ListVersions_MixedFolder_ReturnsMatchingPackagesStampedWithAlias
          - ZipFolderSourceProvider_ListVersions_ExtendedVersionFileNames_AreSkipped

      - id: AgentControl-ZipFolderSourceProvider-ListPackageNames
        title: >-
          The ZipFolderSourceProvider class shall list the distinct, sorted package names found in
          its folder of zip packages.
        justification: |
          Users pick a package from what the folder actually holds.
        tests:
          - ZipFolderSourceProvider_ListPackageIds_MixedFolder_ReturnsDistinctSortedNames

      - id: AgentControl-ZipFolderSourceProvider-AcquireContent
        title: >-
          The ZipFolderSourceProvider class shall supply a discovered package's content as a
          package reader over the root of its zip.
        justification: |
          The zip content must be available to the common extraction sequence through the same
          reader contract as every other source type.
        tests:
          - ZipFolderSourceProvider_Acquire_DiscoveredPackage_ReturnsReaderOverZipRoot

      - id: AgentControl-ZipFolderSourceProvider-FolderErrorsNormalized
        title: >-
          The ZipFolderSourceProvider class shall report a source folder that is missing or cannot
          be reached as a missing folder (DirectoryNotFoundException) - when listing and when
          supplying a package, also when the folder disappeared after the listing - and any other
          failure to read the folder or open a package's zip as an InvalidOperationException whose
          message is safe to show.
        justification: |
          Callers turn these failures into messages for the user, so they must be able to rely on
          one documented kind of error for a missing folder and one for everything else, instead
          of whatever the file system or the zip reader happens to raise.
        tests:
          - ZipFolderSourceProvider_List_FolderDoesNotExist_ThrowsDirectoryNotFoundException
          - ZipFolderSourceProvider_Acquire_FolderRemovedAfterListing_ThrowsDirectoryNotFoundException
          - ZipFolderSourceProvider_ListPackageIds_FolderPathIsAFile_IsReportedAsFolderProblem

      - id: AgentControl-ZipFolderSourceProvider-CancellationObserved
        title: >-
          The ZipFolderSourceProvider class shall observe cancellation: throw
          OperationCanceledException before any work starts when cancellation was already
          requested, and return promptly with OperationCanceledException when cancellation is
          requested while a folder scan or zip open is in progress, without leaking a package
          reader that completes afterwards.
        justification: |
          Listing and opening a zip on a slow or offline network share can take a long time, and a
          user who cancels must not be kept waiting; a reader that finishes after the caller has
          gone would otherwise keep the zip file open.
        tests:
          - ZipFolderSourceProvider_ListPackageIds_PreCanceledToken_ThrowsOperationCanceled
          - ZipFolderSourceProvider_RunCancellable_CanceledWhileWorkRuns_ReturnsPromptlyAndDisposesLateResult

      - id: AgentControl-ZipFolderSourceProvider-AcquireOnlyFromOwnSource
        title: >-
          The ZipFolderSourceProvider class shall refuse to supply the content of a package that
          was discovered at a different source.
        justification: |
          Content must only ever come from the source whose alias the pin names; a package object
          that names another source must not be honored.
        tests:
          - ZipFolderSourceProvider_Acquire_PackageFromOtherSource_ThrowsArgumentException

      - id: AgentControl-ZipFolderSourceProvider-ZipMustBeInOwnFolder
        title: >-
          The ZipFolderSourceProvider class shall refuse to supply the content of a package whose
          zip is not directly inside the source's own folder.
        justification: |
          A package object that points outside the folder must not make AgentControl read an
          arbitrary file.
        tests:
          - ZipFolderSourceProvider_Acquire_ZipOutsideSourceFolder_ThrowsArgumentException

      - id: AgentControl-ZipFolderSourceProvider-RefusesLinkedZipOutsideFolder
        title: >-
          The ZipFolderSourceProvider class shall refuse, immediately before opening it, a package
          zip that is a symbolic link or other reparse point whose target is not inside the
          source's configured folder.
        justification: |
          A link placed in the shared folder could otherwise make a source supply a zip from
          anywhere the user can read, defeating the rule that content comes only from the source's
          own folder. A replacement of the file by the same user between the check and the open
          remains possible; it needs the same access as editing the shared folder itself.
        tests:
          - ubuntu@ZipFolderSourceProvider_Acquire_ZipIsSymlinkToFileOutsideFolder_ThrowsArgumentException

      - id: AgentControl-ZipFolderSourceProvider-AllowsLinkedZipInsideFolder
        title: >-
          The ZipFolderSourceProvider class shall supply the content of a package zip that is a
          symbolic link whose target is a file inside the source's configured folder.
        justification: |
          A link between two files of the same shared folder cannot redirect content outside the
          source, so refusing it would only break folders that use links for convenience.
        tests:
          - ubuntu@ZipFolderSourceProvider_Acquire_ZipIsSymlinkToFileInsideFolder_IsAllowed

      - id: AgentControl-ZipFolderSourceProvider-ValidateDefinition
        title: >-
          The ZipFolderSourceProvider class shall reject a source definition that is missing, is
          not a zip source, or has a blank location.
        justification: |
          A provider built for the wrong kind of definition, or without a folder, would scan an
          arbitrary location.
        tests:
          - ZipFolderSourceProvider_Constructor_InvalidDefinition_Throws

      - id: AgentControl-ZipFolderSourceProvider-ReportContentIdentity
        title: >-
          The ZipFolderSourceProvider class shall report, as the content identity of a package it
          supplies, the identity of the agent files in the zip - not of the zip file - so that a
          zip republished under the same version with other files reports a different identity,
          and a zip repacked with the same files reports the same one.
        justification: |
          A zip in a shared folder can be replaced in place without its file name changing; the
          identity of the files actually delivered is what lets a repo's pin notice the change,
          and is what lets the same files from another kind of source be recognized as the same.
        tests:
          - ZipFolderSourceProvider_Acquire_DiscoveredPackage_ReportsFilesIdentityOfZipContent
