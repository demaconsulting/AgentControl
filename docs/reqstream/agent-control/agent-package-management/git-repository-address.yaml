---
# Software Unit Requirements for the GitRepositoryAddress Class
#
# GitRepositoryAddress validates the address of a Git repository that a package source reads
# (https, ssh, or a local path), refuses every form that could run code, be read as an option or
# carry a credential, and derives the one transport git may use and a stable cache key.
#
# Each requirement states one observable outcome and is linked to the tests that show it.

sections:
  - title: GitRepositoryAddress Unit Requirements
    requirements:
      - id: AgentControl-GitRepositoryAddress-AcceptHttps
        title: >-
          The GitRepositoryAddress class shall accept an https repository address that has a host
          and a path and no user information, and shall report the https transport for it.
        justification: |
          https is the usual way to reach a hosted repository; its sign-in comes from the user's
          credential helper, so the address itself never needs a user name.
        tests:
          - GitRepositoryAddress_TryParse_Https_IsAccepted

      - id: AgentControl-GitRepositoryAddress-AcceptSsh
        title: >-
          The GitRepositoryAddress class shall accept an ssh repository address in URL form, with
          an optional user name and port, and shall report the ssh transport for it.
        justification: |
          Many organizations reach their repositories over ssh with keys; the user name in such an
          address is not a secret, so it must not be refused as an embedded credential.
        tests:
          - GitRepositoryAddress_TryParse_SshUrl_IsAccepted

      - id: AgentControl-GitRepositoryAddress-AcceptScpLikeSsh
        title: >-
          The GitRepositoryAddress class shall accept an ssh repository address in user@host:path
          form and shall report the ssh transport for it.
        justification: |
          The scp-like form is how hosting services show their ssh addresses, so users paste it as
          it is.
        tests:
          - GitRepositoryAddress_TryParse_ScpLikeSsh_IsAccepted

      - id: AgentControl-GitRepositoryAddress-AcceptLocalPath
        title: >-
          The GitRepositoryAddress class shall accept an absolute local or network path to a
          repository without checking that it exists, and shall report the file transport for it.
        justification: |
          A repository on a share or a local disk is a legitimate source, and an offline share
          must not make a settings file unusable, so existence is checked only when the source is
          used.
        tests:
          - GitRepositoryAddress_TryParse_AbsoluteLocalPath_IsAcceptedWithoutCheckingExistence

      - id: AgentControl-GitRepositoryAddress-RejectEmbeddedCredentials
        title: >-
          The GitRepositoryAddress class shall refuse an address that embeds a credential - user
          information on an https address, a password in an ssh address, or a query string or
          fragment.
        justification: |
          An address is persisted in the settings file and shown in messages; a secret in it would
          end up in both, so it is refused before it can be saved.
        tests:
          - GitRepositoryAddress_TryParse_EmbeddedCredential_IsRefused
          - GitRepositoryAddress_TryParse_Hostile_NeverEchoesInput

      - id: AgentControl-GitRepositoryAddress-RecognizeEmbeddedCredentials
        title: >-
          The GitRepositoryAddress class shall be able to recognize, from the text alone, an
          address that embeds a credential, also when the address is invalid for another reason,
          and shall not treat a plain ssh user name as one.
        justification: |
          Settings that are read from a file must be checked for secrets without being accepted
          as addresses, and the user name of an ssh address is not a secret.
        tests:
          - GitRepositoryAddress_EmbedsCredential_DetectsSecretsOnlyInUrls

      - id: AgentControl-GitRepositoryAddress-RejectDangerousTransports
        title: >-
          The GitRepositoryAddress class shall refuse an address that uses any transport other
          than https, ssh or a local path - including plain http, git, file, remote-helper
          syntax such as ext:: and fd::, and relative or ambiguous paths.
        justification: |
          Remote-helper addresses run a program chosen by whoever wrote the address, and the
          other transports are unauthenticated or unencrypted; refusing them at the edge keeps
          them out of every git command line.
        tests:
          - GitRepositoryAddress_TryParse_DangerousOrUnsupported_IsRefused

      - id: AgentControl-GitRepositoryAddress-RejectOptionLikeValues
        title: >-
          The GitRepositoryAddress class shall refuse an address, host, user name or path that
          starts with a hyphen.
        justification: |
          A value that begins with a hyphen could be read by git or ssh as an option (for example
          -oProxyCommand) and run a program, so such a value must never reach a command line.
        tests:
          - GitRepositoryAddress_TryParse_OptionLikeValue_IsRefused

      - id: AgentControl-GitRepositoryAddress-RejectControlCharacters
        title: >-
          The GitRepositoryAddress class shall refuse an address that contains a control
          character, a line break, or white space where it is not allowed.
        justification: |
          Such characters can split a value into several command-line arguments or hide the end of
          a line in a log.
        tests:
          - GitRepositoryAddress_TryParse_ControlCharactersOrWhiteSpace_IsRefused

      - id: AgentControl-GitRepositoryAddress-RejectMalformedParts
        title: >-
          The GitRepositoryAddress class shall refuse an address whose host, port or path is not
          in an accepted form, including a URL without a path.
        justification: |
          A malformed part is either a typing mistake that would only fail later with a confusing
          message, or an attempt to smuggle something past the checks.
        tests:
          - GitRepositoryAddress_TryParse_MalformedHostPortOrPath_IsRefused

      - id: AgentControl-GitRepositoryAddress-RejectTooLong
        title: >-
          The GitRepositoryAddress class shall refuse an address that is too long, without
          repeating it.
        justification: |
          An unbounded value could be used to flood a message, a log or a command line.
        tests:
          - GitRepositoryAddress_TryParse_TooLong_IsRefused

      - id: AgentControl-GitRepositoryAddress-CacheKeyFormat
        title: >-
          The GitRepositoryAddress class shall derive from an address a cache key of 16 lower-case
          hexadecimal digits.
        justification: |
          Fetched packages are kept in a folder named by the repository; the name must be short
          enough for long paths and safe as a folder name.
        tests:
          - GitRepositoryAddress_CacheKey_IsSixteenLowerCaseHexDigits

      - id: AgentControl-GitRepositoryAddress-CacheKeyStable
        title: >-
          The GitRepositoryAddress class shall derive the same cache key for addresses that
          differ only in the case of the scheme or host.
        justification: |
          The name must be stable across runs and spellings, or the same repository would be
          fetched into several folders.
        tests:
          - GitRepositoryAddress_CacheKey_SchemeAndHostCaseDoNotChangeIt

      - id: AgentControl-GitRepositoryAddress-CacheKeyDistinguishesRepositories
        title: >-
          The GitRepositoryAddress class shall derive different cache keys for different
          repositories.
        justification: |
          Two repositories must never share a folder, or one could be served the other's packages.
        tests:
          - GitRepositoryAddress_CacheKey_DifferentRepositoriesHaveDifferentKeys

      - id: AgentControl-GitRepositoryAddress-NeverEchoesInput
        title: >-
          The GitRepositoryAddress class shall never repeat the address text in a message it
          produces, so a secret pasted into an address cannot reach an error display or a log.
        justification: |
          The text of a refused address may be exactly the secret that made it unacceptable.
        tests:
          - GitRepositoryAddress_TryParse_Hostile_NeverEchoesInput
          - GitRepositoryAddress_TryParse_DangerousOrUnsupported_IsRefused
          - GitRepositoryAddress_TryParse_TooLong_IsRefused
