---
# Software Unit Requirements for the NuGetSourceProvider Class
#
# NuGetSourceProvider serves NuGet packages held in a local or network folder feed, or on a NuGet
# server, through the common package-source contract, using the NuGet caching library inside
# storage that AgentControl owns.

sections:
  - title: NuGetSourceProvider Unit Requirements
    requirements:
      - id: AgentControl-NuGetSourceProvider-ListVersions
        title: >-
          The NuGetSourceProvider class shall list the configured package IDs of its source and
          the available versions of a named package found in its NuGet package folder,
          including prereleases and four-part versions, labeling each with its source alias,
          returning no versions for a package the folder does not have, reporting a folder that
          does not exist, and honoring cancellation.
        justification: |
          Users pick packages and versions from what the feed actually holds, a feed cannot be
          enumerated cheaply so the offered IDs are the configured ones, and listing must be
          cancellable because real feeds can be slow or unreachable.
        tests:
          - NuGetSourceProvider_ListVersions_FolderFeedWithVersions_ReturnsAllVersionsStampedWithAlias
          - NuGetSourceProvider_ListVersions_PackageNotInFeed_ReturnsEmptyList
          - NuGetSourceProvider_ListVersions_FolderDoesNotExist_ThrowsDirectoryNotFoundException
          - NuGetSourceProvider_ListVersions_AlreadyCanceled_ThrowsOperationCanceledException
          - NuGetSourceProvider_ListPackageIds_ConfiguredIds_ReturnsDistinctSortedTrimmedIds

      - id: AgentControl-NuGetSourceProvider-AcquireToPrivateCache
        title: >-
          The NuGetSourceProvider class shall supply a chosen version's content as a package
          reader over the package's content folder, unpacked into a package cache private to
          the source, so that two sources offering the same package ID and version each supply
          their own content, and shall reject a package that has no content folder.
        justification: |
          A package cache shared with other sources (or with the developer's own NuGet cache)
          could serve one source's package under another source's identity, and a package
          without the agreed content layout must never cause a repo's managed folders to be
          replaced with nothing.
        tests:
          - NuGetSourceProvider_Acquire_ExistingPackage_ReturnsReaderOverContentFolder
          - NuGetSourceProvider_Acquire_ThenExtract_WritesManagedFoldersToRepoOnly
          - NuGetSourceProvider_Acquire_SamePackageInTwoSources_EachSourceGetsItsOwnContent
          - NuGetSourceProvider_Acquire_PackageWithoutContentFolder_ThrowsInvalidOperationException

      - id: AgentControl-NuGetSourceProvider-ExplicitCacheRoot
        title: >-
          The NuGetSourceProvider class shall resolve and cache packages using configuration
          generated by AgentControl for the source - never NuGet configuration found in the
          target repo or the current directory, and with the user's own NuGet configuration
          remaining in effect only for what the generated configuration does not set, such as
          the credentials for the source's own address - keeping each source's packages in
          storage separate from every other source's, and shall refuse a cache location that is
          not an absolute path.
        justification: |
          NuGet normally discovers configuration by walking up from the current folder, which
          could be a repo whose settings redirect packages or sources; a relative cache
          location would resolve against that same folder, and a cache shared between sources
          could serve one source's package under another's identity. The user's own NuGet
          configuration is deliberately left in effect for credentials, so that people who
          already keep a feed's credentials there are not asked for them again.
        tests:
          - NuGetSourceProvider_Acquire_UsesExplicitAgentControlOwnedRootWithGeneratedConfig
          - NuGetSourceProvider_BuildSourceKey_AliasAndLocation_StableDistinctAndFolderSafe
          - NuGetSourceProvider_Constructor_RelativeRootBase_ThrowsArgumentException
          - NuGetSourceProvider_Constructor_NoRootBase_RootIsAbsoluteUnderLocalApplicationData

      - id: AgentControl-NuGetSourceProvider-NoRepoNuGetConfig
        title: >-
          The NuGetSourceProvider class shall neither read nor write the target repo's NuGet
          configuration or create any file in the repo while listing or supplying packages.
        justification: |
          Agent package information must never appear in a repo's nuget.config, and a repo's
          own nuget.config must not be able to influence where AgentControl obtains packages.
        tests:
          - NuGetSourceProvider_ListAndAcquire_NeverTouchesRepoNuGetConfig

      - id: AgentControl-NuGetSourceProvider-NoCredentialServiceRegistration
        title: >-
          The NuGetSourceProvider class shall leave the process-wide NuGet credential behavior
          unchanged while listing and supplying packages.
        justification: |
          NuGet's credential handling is shared by every NuGet operation in the process;
          altering it from a package source could change how unrelated operations authenticate,
          and AgentControl must not store secrets.
        tests:
          - NuGetSourceProvider_ListAndAcquire_LeavesProcessWideCredentialServiceUnchanged
          - NuGetSourceProvider_ProductAssembly_DoesNotReferenceNuGetCredentialService

      - id: AgentControl-NuGetSourceProvider-ValidateLocation
        title: >-
          The NuGetSourceProvider class shall reject, with a clear error naming the source and
          not repeating its location, a source whose location is a folder that is not an absolute
          path, a server address that is not https (unless the source explicitly allows plain
          http), that does not end in index.json or that embeds a credential, and a definition
          that is not a NuGet source, and shall accept a valid https server address.
        justification: |
          A relative folder would resolve against whatever the process's current folder happens
          to be, plain http would send a sign-in across the network unprotected unless the user
          opted in knowingly, a NuGet client treats an address that does not end in index.json as
          a different protocol, and an address with a credential in it would put a secret where
          it is logged and stored.
        tests:
          - NuGetSourceProvider_Constructor_PlainHttpWithoutOptIn_ThrowsInvalidOperationExceptionWithClearMessage
          - NuGetSourceProvider_Constructor_RelativeLocation_ThrowsInvalidOperationException
          - NuGetSourceProvider_Constructor_ZipTypeOrNullDefinition_Throws
          - NuGetSourceProvider_Constructor_PlainHttp_RefusedUnlessInsecureHttpIsAllowed
          - NuGetSourceProvider_Constructor_InvalidServerLocation_ThrowsWithoutRepeatingTheLocation
          - NuGetSourceProvider_Constructor_HttpsServerLocation_IsAcceptedWithCacheRootUnderBase

      - id: AgentControl-NuGetSourceProvider-ServerListAndAcquire
        title: >-
          The NuGetSourceProvider class shall list the available versions of a configured package
          found on a NuGet server, including prereleases, labeling each with its source alias,
          without downloading any package content and returning no versions for a package the
          server does not have, and shall supply a chosen version's content from the package
          downloaded into the source's private cache.
        justification: |
          Users pick a version from what the server holds, a listing that downloaded packages
          would be slow and costly on a large feed, and the downloaded content must come only
          from this source like the content of a folder source.
        tests:
          - NuGetSourceProvider_ListVersions_AnonymousServer_ReturnsVersionsWithoutDownloading
          - NuGetSourceProvider_ListVersions_PackageNotOnServer_ReturnsEmptyList
          - NuGetSourceProvider_Acquire_AnonymousServer_DownloadsPackageAndExposesContent

      - id: AgentControl-NuGetSourceProvider-SignInOrder
        title: >-
          The NuGetSourceProvider class shall, for a server that asks for credentials, use in
          this order what NuGet itself knows for that address (a source in the user's NuGet
          configuration with the same address and its stored credentials, and NuGet credential
          provider plug-ins running without interaction), the credential the user already entered
          during the session, and only then ask the user - at most once per operation, and only
          after the server has refused the earlier choices - and shall remember a credential the
          user entered only after the operation succeeded.
        justification: |
          People who already keep credentials for a feed in their NuGet configuration or a
          credential provider expect them to be used silently, a dialog should be the last
          resort, and a credential that has not yet been shown to work must not be kept.
        tests:
          - NuGetSourceProvider_ListVersions_NuGetConfigHasCredentialsForTheFeed_SignsInWithoutPrompting
          - NuGetSourceProvider_ListVersions_ServerNeedsSignIn_PromptsOnceAndRemembersCredentialForTheSession
          - NuGetSourceProvider_Acquire_AfterSignInInAnEarlierOperation_ReusesSessionCredentialWithoutPrompting
          - NuGetSourceProvider_ListVersions_ServerNeedsSignInAndNoPrompt_ThrowsAuthenticationFailedWithoutAsking

      - id: AgentControl-NuGetSourceProvider-CredentialOnlyForFeedOrigin
        title: >-
          The NuGetSourceProvider class shall supply a credential only for requests to the
          server's own origin and ask the user only for that server's credential, even when the
          server's service index sends the client to resources on another host.
        justification: |
          A feed's index decides where its package resources are, so a credential must never be
          offered to, or asked for on behalf of, a host the user did not enter it for.
        tests:
          - NuGetSourceProvider_ListVersions_ResourcesOnAnotherOrigin_PromptsOnlyForTheFeedOrigin

      - id: AgentControl-NuGetSourceProvider-ServerFailures
        title: >-
          The NuGetSourceProvider class shall report each way a server can fail - it refuses
          access, rejects the credential that was supplied, the user cancels the sign-in, a
          sign-in takes longer than two minutes, the address does not answer as a NuGet feed - as a
          distinct failure with a message that names the source and the server's origin but no
          secret, path or query, shall forget a credential the server rejected, and shall honor
          cancellation by the caller without reporting it as a failure.
        justification: |
          The user must be told what to do - sign in, correct the address, try again - and an
          abandoned sign-in dialog must not hold an operation forever; the messages end up in
          dialogs and logs, so they carry no secret.
        tests:
          - NuGetSourceProvider_ListVersions_WrongCredentials_ThrowsAuthenticationFailedAfterOnePrompt
          - NuGetSourceProvider_ListVersions_UserCancelsSignIn_ThrowsSignInCanceledAfterOnePrompt
          - NuGetSourceProvider_ListVersions_SessionCredentialRejected_ForgetsItAndPromptsAgain
          - NuGetSourceProvider_ListVersions_SignInTakesTooLong_ThrowsTimedOut
          - NuGetSourceProvider_ListVersions_CallerCancelsWhileSigningIn_ThrowsOperationCanceled
          - NuGetSourceProvider_ListVersions_AddressIsNotANuGetFeed_ThrowsUnreachable
          - PackageSourceAccessException_Constructor_CarriesKindMessageAndInnerException

      - id: AgentControl-NuGetSourceProvider-SecretsNotLogged
        title: >-
          The NuGetSourceProvider class shall ensure that no password, token, authorization
          header value or web-address query string reaches the application log, or the exception
          it raises (including its inner exception), during any sign-in flow, whether it succeeds
          or fails.
        justification: |
          The diagnostic log is a plain file users attach to reports; the NuGet client writes the
          addresses it requests and the errors it meets, which can quote a secret, and a raw
          library exception kept as an inner exception would carry that text to wherever the
          exception is later logged or shown.
        tests:
          - NuGetSourceProvider_SignInFlows_NeverLogTheSecret
          - NuGetSourceProvider_ListVersions_WrongCredentials_ThrowsAuthenticationFailedAfterOnePrompt

      - id: AgentControl-NuGetSourceProvider-AcquireOnlyFromOwnSource
        title: >-
          The NuGetSourceProvider class shall refuse to supply the content of a package that was
          discovered at a different source.
        justification: |
          Content must only ever come from the source whose alias the pin names.
        tests:
          - NuGetSourceProvider_Acquire_PackageFromOtherSource_ThrowsArgumentException
