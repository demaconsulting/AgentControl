---
# AgentToolLauncher Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the AgentControl AgentToolLauncher subsystem
# - AgentToolLauncher spans ShellDetector.cs (chooses the terminal/shell to launch through),
#   AgentToolLauncher.cs (builds the process-start info to run the agent tool inside that
#   shell, for a shell that stays open after the tool or ends with it) and
#   AgentToolProcessStarter.cs (starts the process; the IAgentToolProcessStarter interface it
#   implements is a supporting type of this subsystem, so the launch flow can be tested
#   without starting a shell); the ShellKind.cs enum is folded into this subsystem-level
#   description as it has no dedicated test file
# - Subsystem requirements describe the observable behavior of launching an agentic CLI tool
#   in a repo's working directory
#
# NOTE: this subsystem and one of its units share the name "AgentToolLauncher"; per
# software-items.md's naming-collision convention, both retain the plain name at their own
# level (the folder/leaf-file path disambiguates: agent-tool-launcher.yaml (subsystem) vs.
# agent-tool-launcher/agent-tool-launcher.yaml (unit)).

sections:
  - title: AgentToolLauncher Subsystem Requirements
    requirements:
      - id: AgentControl-AgentToolLauncherSubsystem-Launch
        title: >-
          The AgentToolLauncher subsystem shall detect the appropriate shell for the current
          platform and build process-start information that runs the configured agent tool
          command inside that shell in the repo's working directory.
        justification: |
          The agent tool must run inside a real interactive shell (so the developer can keep
          working in that terminal) appropriate to the current platform, rather than being
          launched as a bare, ephemeral process.
        children:
          - AgentControl-ShellDetector-DetectWindows
          - AgentControl-ShellDetector-DetectPosix
          - AgentControl-ShellDetector-ShellPreference
          - AgentControl-AgentToolLauncher-BuildCommand
          - AgentControl-AgentToolLauncher-QuotedPathInvocation
          - AgentControl-AgentToolLauncher-Validation
        tests:
          - windows@LaunchButton_Click_InvokesConfiguredAgentToolInRepoWorkingDirectory

      - id: AgentControl-AgentToolLauncherSubsystem-KeepShellOpen
        title: >-
          The AgentToolLauncher subsystem shall, for PowerShell and the Command shell, run the
          agent tool so that the shell stays open afterwards when asked to (the default) and ends
          together with the tool otherwise, and shall start the resulting process through a
          replaceable starter.
        justification: |
          Whether the window stays open for the user, or closes with the tool, is a personal
          choice, so the arguments handed to the shell depend on it; starting the process
          through a replaceable starter lets the launch flow be verified without opening a shell
          on the developer's desktop.
        children:
          - AgentControl-AgentToolLauncher-BuildCommand
          - AgentControl-AgentToolLauncher-ShellEndsWithTool
          - AgentControl-AgentToolProcessStarter-StartProcess
        tests:
          - AgentToolLauncherSubsystem_KeepShellOpen_PowerShellAndCmd_OnKeepsOpenOffEndsWithTool
          - AgentToolLauncherSubsystem_KeepShellOpen_PosixShell_IsUnaffected
