---
# Software Unit Requirements for the RepoPinStore Class
#
# RepoPinStore loads and saves a repo's `.agentcontrol.json` pin file, recording the pinned
# agent package name, version and source alias for that repo.

sections:
  - title: RepoPinStore Unit Requirements
    requirements:
      - id: AgentControl-RepoPinStore-Load
        title: >-
          The RepoPinStore class shall load a repo's pin file when present, returning none
          when the repo has no pin file, and shall reject a null repo root path.
        justification: |
          Callers throughout the application (badge computation, upgrade detection,
          ensure-synced-before-launch) need a single, consistent way to determine a repo's
          current pin state, including the "not yet pinned" case.
        tests:
          - RepoPinStore_Load_NoPinFile_ReturnsNull
          - RepoPinStore_Load_NullRepoRoot_ThrowsArgumentNullException
          - RepoPinStore_SaveThenLoad_RoundTripsAllFields

      - id: AgentControl-RepoPinStore-Save
        title: >-
          The RepoPinStore class shall save a repo's pin file, overwriting any existing pin
          file's values, and shall reject a null pin value.
        justification: |
          Selecting a package or upgrading must durably record the new pin so it survives
          across application restarts and correctly replaces any prior pin for that repo.
        tests:
          - RepoPinStore_Save_ExistingPinFile_OverwritesWithNewValues
          - RepoPinStore_Save_NullPin_ThrowsArgumentNullException

      - id: AgentControl-RepoPinStore-SourceAlias
        title: >-
          The RepoPinStore class shall write the pin file with a schema version and the alias
          of the pinned package's source, replacing the file atomically, and shall read the
          alias back.
        justification: |
          A pin is only meaningful together with the source it came from, and a failed write
          must never leave a half-written pin file that loses the repo's pin.
        tests:
          - RepoPinStore_SaveThenLoad_SourceAlias_WritesSchemaVersion4AndRoundTripsSource
          - RepoPinStore_Load_CamelCasePropertyNames_AreRead
          - RepoPinStore_Save_CorruptExistingFile_IsReplacedAndLeavesNoTemporaryFile

      - id: AgentControl-RepoPinStore-LegacyV1
        title: >-
          The RepoPinStore class shall read a pin file that has no schema version and no source
          as a pin to the source named Default, keeping its other values.
        justification: |
          Repos pinned before sources existed must keep working without a migration step; they
          were all pinned from the single package folder, which becomes the Default source.
        tests:
          - RepoPinStore_Load_LegacyV1PinFile_MapsToDefaultSource
          - RepoPinStore_Load_LegacyPinFileMissingAgentsMdTemplateDeclinedField_DefaultsToFalse

      - id: AgentControl-RepoPinStore-RejectUnnamedSource
        title: >-
          The RepoPinStore class shall reject a pin file of the current schema version that
          names no source, instead of reading it as a pin to the source named Default.
        justification: |
          Only a pin written before sources existed may fall back to the Default source; a
          current-schema pin that names none is malformed, and resolving it against a source the
          pin never named could supply a same-named package from a different source.
        tests:
          - RepoPinStore_Load_CurrentSchemaPinWithoutSource_IsRejectedInsteadOfMappedToDefault

      - id: AgentControl-RepoPinStore-PreserveUnknownFields
        title: >-
          The RepoPinStore class shall keep, when it rewrites a pin file, any properties of the
          existing file that it does not model, whether or not the caller loaded the pin first.
        justification: |
          A pin file may be shared with other versions of the tool that add fields; rewriting it
          must not silently strip them.
        tests:
          - RepoPinStore_Save_UnknownProperties_ArePreserved

      - id: AgentControl-RepoPinStore-RejectNewerSchema
        title: >-
          The RepoPinStore class shall reject a pin file that declares a newer schema version
          than it supports, with a message telling the user to update, and shall leave such a
          file unchanged instead of overwriting it, also when a property it knows has another
          type in that newer file.
        justification: |
          Fields of a newer schema may mean something different; interpreting them, or
          overwriting the file, could lose or corrupt a pin written by a newer tool version.
        tests:
          - RepoPinStore_Load_NewerSchemaVersion_ThrowsUnsupportedPinSchemaExceptionWithActionableMessage
          - RepoPinStore_Save_ExistingNewerSchemaFile_ThrowsAndLeavesFileUnchanged
          - RepoPinStore_Load_NewerSchemaWithIncompatibleKnownPropertyType_ThrowsUnsupportedPinSchemaException
          - RepoPinStore_Save_NewerSchemaWithIncompatibleKnownPropertyType_ThrowsAndLeavesFileUnchanged
          - RepoPinStore_ProbeSchemaVersion_TextOrOversizedOrDifferentlyCasedVersion_IsReadAsNewer
          - RepoPinStore_ProbeSchemaVersion_NoUsableVersion_ReturnsNullAndInvalidJsonThrows
          - RepoPinStore_CurrentSchemaWithIncompatibleKnownPropertyType_IsCorruptAndReplacedOnSave

      - id: AgentControl-RepoPinStore-SaveContentIdentity
        title: >-
          The RepoPinStore class shall write the content identity and the source revision of a pin
          when it has them, read them back (also when the property names were written by hand in a
          different letter case), and write nothing for a pin that has none.
        justification: |
          The identity and the revision must persist with the pin to be of any use after the
          application restarts, and a pin whose source reported none must not claim one.
        tests:
          - RepoPinStore_SaveThenLoad_ContentIdentityAndSourceRevision_RoundTripAndAreOmittedWhenAbsent
          - RepoPinStore_Load_CamelCaseContentIdentity_IsRead

      - id: AgentControl-RepoPinStore-LoadWithoutIdentity
        title: >-
          The RepoPinStore class shall read a pin file written before identities were recorded
          (schema version 1 or 2) as a pin with no content identity, and shall write it back in the
          current schema version when it is saved.
        justification: |
          Repos pinned by an earlier version of the tool must keep working without a migration
          step, and must not be treated as having a changed identity.
        tests:
          - RepoPinStore_Load_PinWithoutContentIdentity_LoadsWithNullIdentityAndUpgradesToSchema4OnSave
          - RepoPinStore_Load_LegacyV1PinFile_MapsToDefaultSource

      - id: AgentControl-RepoPinStore-MigrateLegacyIdentity
        title: >-
          The RepoPinStore class shall read a pin file of schema version 3 without the content
          identity it records - an identity of a package file or of a Git commit, which cannot be
          compared with an identity of the files - and shall carry a Git commit it records over as
          the pin's source revision.
        justification: |
          An identity computed from something other than the files can neither confirm nor refute
          that the files are the same, so it must never be taken for one and raise a false alarm;
          the commit is still the revision the files came from, which keeps a moved tag detectable
          for a repo that was pinned before this change.
        tests:
          - RepoPinStore_Load_Schema3PinWithContainerIdentity_DropsIdentityAndRewritesAsSchema4
          - RepoPinStore_Load_Schema3PinWithGitCommitIdentity_CarriesItAsSourceRevision

      - id: AgentControl-RepoPinStore-SchemaVersion4
        title: >-
          The RepoPinStore class shall write pin files as schema version 4 and shall refuse, with a
          message naming the versions, to read or overwrite a pin file of any newer schema version.
        justification: |
          A tool version that does not know the identity of the files would carry a stale one
          forward when it re-pins a repo, so the schema version is raised for it to refuse the file
          instead of corrupting the pin.
        tests:
          - RepoPinStore_SaveThenLoad_SourceAlias_WritesSchemaVersion4AndRoundTripsSource
          - RepoPinStore_Load_NewerSchemaVersion_ThrowsUnsupportedPinSchemaExceptionWithActionableMessage
          - RepoPinStore_Save_NewerSchemaWithIncompatibleKnownPropertyType_ThrowsAndLeavesFileUnchanged
