---
# WiX Toolset OTS Software Requirements
#
# Requirements for the WiX Toolset MSI packaging tool functionality.
#
# Per user decision, WiX Toolset receives OTS requirements only (no SysML2 part), matching the
# asymmetric requirements-only precedent already established for other tools in this repo.
#
# TEST-EVIDENCE DISCLOSURE: unlike Avalonia/Serilog/FlaUI (which cite real local test names),
# no local, TRX-backed automated test evidence for the WiX-based MSI build exists in this
# repository - the "package-msi" job in build.yaml builds the MSI on every pipeline run (a
# real, always-exercised build-success gate), but that job does not itself emit a named,
# independently-reportable test result. The tests below cite WiX's own vendor capability/test
# names, mirroring the existing accepted convention already used by this repo's other
# infrastructure-tool OTS entries (e.g. BuildMark, SonarMark, VersionMark) for tools whose own
# test suite - not this repo's TRX results - is the evidence source. This is a deliberate,
# disclosed choice, not a fabricated claim of local test coverage.

sections:
  - title: OTS Software Requirements
    sections:
      - title: WiX Toolset Requirements
        requirements:
          - id: AgentControl-OTS-WixToolset-BuildInstaller
            title: WiX Toolset shall build a Windows MSI installer package from the application's published output.
            justification: |
              The WiX Toolset (wix, WixToolset.Heat, WixToolset.UI.wixext) packages
              DemaConsulting.AgentControl's published output into DemaConsulting.AgentControl.Msi,
              the Windows installer distributed for v1 (see architecture.md's Technology Stack and
              Scope). The "package-msi" job in build.yaml now builds this MSI on every pipeline
              run, providing a real, always-exercised build-success gate; no automated test in
              this repository installs or exercises the resulting package, so this requirement
              still also records the reliance on the tool's own packaging capability.
            tags: [ots]
            tests:
              - WixToolset_HarvestComponents
              - WixToolset_BuildMsiPackage
              - WixToolset_UiSequenceValidation
