<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. Versioned agent packages, the repo's .agentcontrol.json version pin, package
       signature checks, and the Git repository flow into the AgentControl desktop app, which syncs the repo's .github
       agent folders, launches the agentic CLI, shows the package's notes for a newer version, and offers the
       package's AGENTS.md template.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 36px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .tick { fill: none; stroke: #4ade80; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176" style="font-size:76px">Agent</text>
  <text class="word brandText" x="267.3" y="176" style="font-size:76px">Control</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Versioned agent folders</text>
  <text class="tag" x="56" y="314" style="fill: #a5b4fc">synced into each repo.</text>
  <text class="body" x="58" y="368">Reads each repo's .agentcontrol.json</text>
  <text class="body" x="58" y="402">pin, syncs its four .github folders,</text>
  <text class="body" x="58" y="436">then starts your agentic CLI there.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd" x="78" y="503">{ "PackageName":</text>
  <text class="cmd file" x="333" y="503">"Acme.AI"</text>
  <text class="cmd" x="468" y="503">,</text>
  <text class="cmd" x="108" y="539">"Version":</text>
  <text class="cmd file" x="273" y="539">"2.1.0"</text>
  <text class="cmd" x="393" y="539">}</text>
  <text class="note" x="58" y="604">Windows desktop app &#183; MSI installer</text>


  <!-- Input cards -->
  <g>
    <!-- Input one: agent packages, a NuGet package box -->
    <rect class="card" x="580" y="40" width="236" height="160" rx="16"/>
    <rect x="642" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <path d="M22 32 L54 16 L86 32 L54 48 Z" fill="#fde68a"/>
      <path d="M22 32 L54 48 L54 94 L22 78 Z" fill="#f59e0b"/>
      <path d="M54 48 L86 32 L86 78 L54 94 Z" fill="#b45309"/>
      <path d="M38 24 L70 40 L70 56 L62 52 L62 44 L30 28 Z" fill="#fffbeb" fill-opacity="0.85"/>
      <rect x="104" y="18" width="92" height="32" rx="7" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.5"/>
      <text class="mini" x="150" y="42" fill="#fde68a" text-anchor="middle">.nupkg</text>
      <rect class="bar" x="104" y="66" width="92" height="8" rx="4" fill-opacity="0.75"/>
      <rect class="bar" x="104" y="84" width="64" height="8" rx="4" fill-opacity="0.75"/>
    </g>
    <text class="label" x="698" y="190">Agent packages</text>

    <!-- Input two: the repo's version pin, a JSON file with the pinned version -->
    <rect class="card" x="828" y="40" width="236" height="160" rx="16"/>
    <rect x="890" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="836" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(836 48)">
      <path class="page" d="M24 12 L68 12 L84 28 L84 100 L24 100 Z"/>
      <path d="M68 12 L68 28 L84 28 Z" fill="#cbd5e1"/>
      <text class="miniMono" x="52" y="62" fill="#0e7490" text-anchor="middle">{ }</text>
      <rect x="34" y="74" width="40" height="5" rx="2.5" fill="#22d3ee"/>
      <rect class="bar" x="34" y="86" width="30" height="5" rx="2.5"/>
      <rect x="104" y="18" width="92" height="32" rx="7" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="mini" x="150" y="42" fill="#a5f3fc" text-anchor="middle">.json</text>
      <text class="miniMono" x="150" y="88" fill="#e2e8f0" text-anchor="middle">2.1.0</text>
    </g>
    <text class="label" x="946" y="190">Version pin</text>

    <!-- Input three: package signature verification, a shield with a check mark -->
    <rect class="card" x="1076" y="40" width="236" height="160" rx="16"/>
    <rect x="1138" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1084" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(1084 48)">
      <path d="M54 12 L86 24 L86 52 C86 74 72 90 54 100 C36 90 22 74 22 52 L22 24 Z" fill="#f472b6" fill-opacity="0.22" stroke="#f472b6" stroke-width="2.5"/>
      <path d="M39 56 L50 67 L71 43" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="104" y="18" width="92" height="32" rx="7" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="1.5"/>
      <text class="mini" x="150" y="42" fill="#fbcfe8" text-anchor="middle">signed</text>
      <rect class="bar" x="104" y="66" width="92" height="8" rx="4" fill-opacity="0.75"/>
      <rect class="bar" x="104" y="84" width="64" height="8" rx="4" fill-opacity="0.75"/>
    </g>
    <text class="label" x="1194" y="190">Signature check</text>

    <!-- Input four: the Git repository, a branch graph -->
    <rect class="card" x="1324" y="40" width="236" height="160" rx="16"/>
    <rect x="1386" y="40" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1332" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(1332 48)">
      <path d="M40 22 L40 90" stroke="#60a5fa" stroke-width="4" fill="none"/>
      <path d="M40 30 C40 50 74 42 74 62 L74 70" stroke="#93c5fd" stroke-width="4" fill="none"/>
      <circle cx="40" cy="22" r="8" fill="#60a5fa" stroke="#0a1022" stroke-width="2"/>
      <circle cx="40" cy="56" r="8" fill="#60a5fa" stroke="#0a1022" stroke-width="2"/>
      <circle cx="40" cy="90" r="8" fill="#60a5fa" stroke="#0a1022" stroke-width="2"/>
      <circle cx="74" cy="72" r="8" fill="#93c5fd" stroke="#0a1022" stroke-width="2"/>
      <rect x="104" y="18" width="92" height="32" rx="7" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-width="1.5"/>
      <text class="mini" x="150" y="42" fill="#bfdbfe" text-anchor="middle">main</text>
      <rect class="bar" x="104" y="66" width="92" height="8" rx="4" fill-opacity="0.75"/>
      <rect class="bar" x="104" y="84" width="64" height="8" rx="4" fill-opacity="0.75"/>
    </g>
    <text class="label" x="1442" y="190">Git repo</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M698,206 C698,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M946,206 C946,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1194,206 C1194,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1442,206 C1442,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="698" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="946" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1194" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1442" cy="206" r="5" fill="#60a5fa"/>
  </g>
  <!-- The engine -->
  <rect x="814" y="262" width="512" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="814" y="262" width="512" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="838" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M851 284 L865 294 L851 304 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <text class="engine" x="890" y="305">AgentControl</text>
  <line x1="1132" y1="278" x2="1132" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1152" y="303">desktop app</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Output one: the repo's synced .github agent folders -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <path d="M604 409 L614 409 L618 413 L630 413 L630 428 L604 428 Z" fill="#a78bfa"/>
    <text class="miniMono" x="640" y="427" fill="#f8fafc">.github/</text>
    <path d="M617 432 L617 528 M617 450 L632 450 M617 476 L632 476 M617 502 L632 502 M617 528 L632 528" stroke="#64748b" stroke-width="2" fill="none"/>
    <g fill="#5eead4">
      <path d="M636 443 L643 443 L646 446 L656 446 L656 458 L636 458 Z"/>
      <path d="M636 469 L643 469 L646 472 L656 472 L656 484 L636 484 Z"/>
      <path d="M636 495 L643 495 L646 498 L656 498 L656 510 L636 510 Z"/>
      <path d="M636 521 L643 521 L646 524 L656 524 L656 536 L636 536 Z"/>
    </g>
    <text class="miniMono" x="664" y="458" fill="#e2e8f0">agents/</text>
    <text class="miniMono" x="664" y="484" fill="#e2e8f0">standards/</text>
    <text class="miniMono" x="664" y="510" fill="#e2e8f0">templates/</text>
    <text class="miniMono" x="664" y="536" fill="#e2e8f0">skills/</text>
    <path class="tick" d="M826 450 L833 457 L846 443"/>
    <path class="tick" d="M826 476 L833 483 L846 469"/>
    <path class="tick" d="M826 502 L833 509 L846 495"/>
    <path class="tick" d="M826 528 L833 535 L846 521"/>
    <text class="label" x="728" y="585">Synced .github</text>

    <!-- Output two: the launched agentic CLI, a terminal window -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <rect x="913" y="412" width="172" height="124" rx="10" fill="#020617" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="929" cy="428" r="5" fill="#f472b6"/>
    <circle cx="945" cy="428" r="5" fill="#fbbf24"/>
    <circle cx="961" cy="428" r="5" fill="#4ade80"/>
    <line x1="913" y1="442" x2="1085" y2="442" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="miniMono" x="925" y="474" fill="#5eead4">&gt;</text>
    <text class="miniMono" x="945" y="474" fill="#f8fafc">copilot</text>
    <rect x="925" y="494" width="13" height="22" fill="#5eead4"/>
    <text class="label" x="999" y="585">Launched CLI</text>

    <!-- Output three: the release notes of a newer version, written by the package publisher and shown by AgentControl -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <text class="miniMono" x="1146" y="436" fill="#f8fafc">2.2.0</text>
    <rect x="1250" y="414" width="70" height="30" rx="15" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
    <text class="mini" x="1285" y="436" fill="#fde68a" text-anchor="middle">new</text>
    <line x1="1146" y1="456" x2="1318" y2="456" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="1152" cy="478" r="5" fill="#60a5fa"/>
    <rect class="bar" x="1166" y="474" width="130" height="8" rx="4" fill-opacity="0.75"/>
    <circle cx="1152" cy="504" r="5" fill="#f472b6"/>
    <rect class="bar" x="1166" y="500" width="104" height="8" rx="4" fill-opacity="0.75"/>
    <circle cx="1152" cy="530" r="5" fill="#22d3ee"/>
    <rect class="bar" x="1166" y="526" width="118" height="8" rx="4" fill-opacity="0.75"/>
    <text class="label" x="1232" y="585">Package notes</text>

    <!-- Output four: the offered AGENTS.md template -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <circle cx="1457" cy="448" r="24" fill="url(#brand)"/>
    <path d="M1447 434 L1462 434 L1469 441 L1469 462 L1447 462 Z" fill="#ffffff"/>
    <rect x="1385" y="494" width="144" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="520" fill="#e2e8f0" text-anchor="middle">AGENTS.md</text>
    <text class="label" x="1457" y="585">Template offer</text>
  </g>
</svg>
