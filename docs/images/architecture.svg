<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="740" viewBox="0 0 1010 740" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="990" height="720" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="990" height="720" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,30)">
    <!-- Developer -->
    <rect x="320" y="0" width="300" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="470" y="19" font-size="15" font-weight="600" fill="#92400e" text-anchor="middle">Developer</text>
    <text x="470" y="36" font-size="12" fill="#92400e" text-anchor="middle">picks a repo, then clicks Launch</text>

    <!-- AgentControl frame -->
    <rect x="180" y="70" width="580" height="600" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="196" y="94" font-size="14" font-weight="600" fill="#2563eb">AgentControl (Avalonia desktop app)</text>

    <!-- Program -->
    <rect x="196" y="114" width="548" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="470" y="136" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">Program</text>
    <text x="470" y="154" font-size="12" fill="#166534" text-anchor="middle">Entry point: parses Startup arguments, sets up Logging, opens the main window</text>
    <line x1="470" y1="48" x2="470" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="470" y1="164" x2="470" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- LauncherUI -->
    <rect x="196" y="186" width="548" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="470" y="212" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">LauncherUI</text>
    <text x="470" y="232" font-size="12" fill="#166534" text-anchor="middle">Main window, repo cards and dialogs: pick a repo, sync its agent</text>
    <text x="470" y="247" font-size="12" fill="#166534" text-anchor="middle">files to the pinned package version, then launch the agent tool</text>
    <line x1="470" y1="256" x2="470" y2="274" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Subsystems orchestrated by LauncherUI -->
    <rect x="196" y="276" width="548" height="294" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="208" y="296" font-size="13" font-weight="600" fill="#475569">Subsystems orchestrated by LauncherUI</text>

    <!-- Row A -->
    <rect x="208" y="308" width="250" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="333" y="332" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">AgentPackageManagement</text>
    <text x="333" y="352" font-size="12" fill="#5b21b6" text-anchor="middle">Lists package versions and acquires</text>
    <text x="333" y="368" font-size="12" fill="#5b21b6" text-anchor="middle">them from zip, NuGet and Git sources</text>
    <rect x="486" y="308" width="250" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="611" y="332" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">RepoSync</text>
    <text x="611" y="352" font-size="12" fill="#1e40af" text-anchor="middle">Extracts the package's agent folders</text>
    <text x="611" y="368" font-size="12" fill="#1e40af" text-anchor="middle">into the repo; shows release notes</text>

    <!-- Row B -->
    <rect x="208" y="396" width="250" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="333" y="420" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">AgentToolLauncher</text>
    <text x="333" y="440" font-size="12" fill="#1e40af" text-anchor="middle">Detects a shell, then launches</text>
    <text x="333" y="456" font-size="12" fill="#1e40af" text-anchor="middle">the agentic CLI tool in the repo</text>
    <rect x="486" y="396" width="250" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="611" y="420" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">RepoConfig</text>
    <text x="611" y="440" font-size="12" fill="#1e40af" text-anchor="middle">Persists each repo's pin: package,</text>
    <text x="611" y="456" font-size="12" fill="#1e40af" text-anchor="middle">version, source and content identity</text>

    <!-- Row C -->
    <rect x="208" y="484" width="250" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="333" y="508" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">PackageCredentials</text>
    <text x="333" y="528" font-size="12" fill="#5b21b6" text-anchor="middle">Sign-ins kept in memory, offered</text>
    <text x="333" y="544" font-size="12" fill="#5b21b6" text-anchor="middle">only to their own server</text>
    <rect x="486" y="484" width="250" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="611" y="508" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">GitIntegration</text>
    <text x="611" y="528" font-size="12" fill="#5b21b6" text-anchor="middle">Git status, pull and branch queries;</text>
    <text x="611" y="544" font-size="12" fill="#5b21b6" text-anchor="middle">hardened git against remote repos</text>
    <line x1="460" y1="522" x2="484" y2="522" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Supporting subsystems -->
    <rect x="196" y="582" width="548" height="78" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="208" y="600" font-size="13" font-weight="600" fill="#475569">Supporting subsystems used throughout</text>
    <g text-anchor="middle">
      <rect x="204" y="608" width="124" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
      <text x="266" y="627" font-size="13" font-weight="600" fill="#334155">Settings</text>
      <text x="266" y="643" font-size="11" fill="#475569">options, repo groups</text>
      <rect x="340" y="608" width="124" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
      <text x="402" y="627" font-size="13" font-weight="600" fill="#334155">Logging</text>
      <text x="402" y="643" font-size="11" fill="#475569">rolling log file</text>
      <rect x="476" y="608" width="124" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
      <text x="538" y="627" font-size="13" font-weight="600" fill="#334155">Startup</text>
      <text x="538" y="643" font-size="11" fill="#475569">argument parsing</text>
      <rect x="612" y="608" width="124" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
      <text x="674" y="627" font-size="13" font-weight="600" fill="#334155">Utilities</text>
      <text x="674" y="643" font-size="11" fill="#475569">safe path helpers</text>
    </g>

    <!-- Left externals -->
    <rect x="0" y="296" width="150" height="88" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="75" y="318" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Package sources</text>
    <text x="75" y="340" font-size="12" fill="#475569" text-anchor="middle">zip folders, NuGet</text>
    <text x="75" y="356" font-size="12" fill="#475569" text-anchor="middle">folders and servers,</text>
    <text x="75" y="372" font-size="12" fill="#475569" text-anchor="middle">Git repositories</text>
    <line x1="152" y1="346" x2="206" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <rect x="0" y="396" width="150" height="76" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="75" y="420" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Agentic CLI tool</text>
    <text x="75" y="442" font-size="12" fill="#475569" text-anchor="middle">such as GitHub</text>
    <text x="75" y="458" font-size="12" fill="#475569" text-anchor="middle">Copilot CLI</text>
    <line x1="206" y1="434" x2="152" y2="434" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Right externals -->
    <rect x="790" y="300" width="150" height="172" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="865" y="322" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Developer's repo</text>
    <rect x="802" y="332" width="126" height="64" rx="5" fill="#ffffff" stroke="#64748b"/>
    <text x="865" y="352" font-size="12" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">.github/agents,</text>
    <text x="865" y="368" font-size="12" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">standards,</text>
    <text x="865" y="384" font-size="12" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">templates, skills</text>
    <rect x="802" y="408" width="126" height="52" rx="5" fill="#ffffff" stroke="#64748b"/>
    <text x="865" y="430" font-size="11" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">.agentcontrol.json</text>
    <text x="865" y="446" font-size="12" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">pin file</text>
    <line x1="738" y1="346" x2="800" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="738" y1="434" x2="800" y2="434" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

    <rect x="790" y="484" width="150" height="76" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="865" y="508" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">git executable</text>
    <text x="865" y="530" font-size="12" fill="#475569" text-anchor="middle">the user's own,</text>
    <text x="865" y="546" font-size="12" fill="#475569" text-anchor="middle">run as a subprocess</text>
    <line x1="738" y1="522" x2="786" y2="522" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
