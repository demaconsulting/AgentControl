---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"   # Verification documentation files
  - "docs/user_guide/**/*.md"     # User guide documentation
  - "docs/sysml2/**/*.sysml"      # SysML2 architecture model
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!node_modules/**"            # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/AgentControl/reviews/index.json

# Context included for all reviews.
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose
  - id: Purpose
    title: Review of user-facing capabilities and system promises
    context:
      - "!docs/design/introduction.md"
    paths:
      - "README.md"
      - "docs/user_guide/**/*.md"

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that AgentControl Decomposition Addresses the Stated Purpose
    context:
      - README.md
      - "docs/user_guide/**/*.md"
    paths:
      - requirements.yaml
      - docs/design/introduction.md
      - "docs/sysml2/**/*.sysml"

  # AgentControl - Specials
  - id: AgentControl-Architecture
    title: Review of Agent Control system architecture and operational validation
    context:
      - README.md
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/agent-control.yaml"
      - "docs/design/introduction.md"
      - "docs/design/agent-control.md"
      - "docs/verification/introduction.md"
      - "docs/verification/agent-control.md"
      - "test/**/IntegrationTests.cs"

  - id: AgentControl-Design
    title: Review of Agent Control architectural and design consistency
    context:
      - docs/reqstream/agent-control.yaml
    paths:
      - "docs/reqstream/agent-control/platform-requirements.yaml"
      - "docs/design/introduction.md"
      - "docs/design/agent-control/**/*.md"
      - "docs/design/ots.md"
      - "docs/verification/ots.md"

  - id: AgentControl-AllRequirements
    title: Review of Agent Control requirements quality and traceability
    context:
      - docs/design/agent-control.md
      - docs/reqstream/agent-control.yaml
    paths:
      - "docs/reqstream/agent-control/**/*.yaml"

  # AgentControl - Program
  - id: AgentControl-Program
    title: Review of Agent Control Program unit implementation
    context:
      - docs/design/agent-control.md
      - docs/reqstream/agent-control.yaml
    paths:
      - "docs/reqstream/agent-control/program.yaml"
      - "docs/design/agent-control/program.md"
      - "docs/verification/agent-control/program.md"
      - "src/**/Program.cs"
      - "test/**/ProgramTests.cs"

  # AgentControl - Cli
  - id: AgentControl-Cli
    title: Review of Agent Control Cli subsystem architecture and interfaces
    context:
      - docs/design/agent-control.md
      - docs/reqstream/agent-control.yaml
    paths:
      - "docs/reqstream/agent-control/cli.yaml"
      - "docs/design/agent-control/cli.md"
      - "docs/verification/agent-control/cli.md"
      - "test/**/Cli/CliSubsystemTests.cs"

  - id: AgentControl-Cli-Context
    title: Review of Agent Control Context unit implementation
    context:
      - docs/design/agent-control.md
      - docs/reqstream/agent-control.yaml
      - docs/design/agent-control/cli.md
      - docs/reqstream/agent-control/cli.yaml
    paths:
      - "docs/reqstream/agent-control/cli/context.yaml"
      - "docs/design/agent-control/cli/context.md"
      - "docs/verification/agent-control/cli/context.md"
      - "src/**/Cli/Context.cs"
      - "test/**/Cli/ContextTests.cs"

  # AgentControl - SelfTest
  - id: AgentControl-SelfTest
    title: Review of Agent Control SelfTest subsystem architecture and interfaces
    context:
      - docs/design/agent-control.md
      - docs/reqstream/agent-control.yaml
    paths:
      - "docs/reqstream/agent-control/self-test.yaml"
      - "docs/design/agent-control/self-test.md"
      - "docs/verification/agent-control/self-test.md"
      - "test/**/SelfTest/SelfTestSubsystemTests.cs"

  - id: AgentControl-SelfTest-Validation
    title: Review of Agent Control Validation unit implementation
    context:
      - docs/design/agent-control.md
      - docs/reqstream/agent-control.yaml
      - docs/design/agent-control/self-test.md
      - docs/reqstream/agent-control/self-test.yaml
    paths:
      - "docs/reqstream/agent-control/self-test/validation.yaml"
      - "docs/design/agent-control/self-test/validation.md"
      - "docs/verification/agent-control/self-test/validation.md"
      - "src/**/SelfTest/Validation.cs"
      - "test/**/SelfTest/ValidationTests.cs"

  # AgentControl - Utilities
  - id: AgentControl-Utilities
    title: Review of Agent Control Utilities subsystem architecture and interfaces
    context:
      - docs/design/agent-control.md
      - docs/reqstream/agent-control.yaml
    paths:
      - "docs/reqstream/agent-control/utilities.yaml"
      - "docs/design/agent-control/utilities.md"
      - "docs/verification/agent-control/utilities.md"
      - "test/**/Utilities/UtilitiesSubsystemTests.cs"

  - id: AgentControl-Utilities-PathHelpers
    title: Review of Agent Control PathHelpers unit implementation
    context:
      - docs/design/agent-control.md
      - docs/reqstream/agent-control.yaml
      - docs/design/agent-control/utilities.md
      - docs/reqstream/agent-control/utilities.yaml
    paths:
      - "docs/reqstream/agent-control/utilities/path-helpers.yaml"
      - "docs/design/agent-control/utilities/path-helpers.md"
      - "docs/verification/agent-control/utilities/path-helpers.md"
      - "src/**/Utilities/PathHelpers.cs"
      - "test/**/Utilities/PathHelpersTests.cs"

  # OTS Items
  - id: OTS-BuildMark
    title: Review of BuildMark OTS verification evidence
    paths:
      - "docs/reqstream/ots/buildmark.yaml"
      - "docs/design/ots/buildmark.md"
      - "docs/verification/ots/buildmark.md"

  - id: OTS-FileAssert
    title: Review of FileAssert OTS verification evidence
    paths:
      - "docs/reqstream/ots/fileassert.yaml"
      - "docs/design/ots/fileassert.md"
      - "docs/verification/ots/fileassert.md"

  - id: OTS-Pandoc
    title: Review of Pandoc OTS verification evidence
    paths:
      - "docs/reqstream/ots/pandoc.yaml"
      - "docs/design/ots/pandoc.md"
      - "docs/verification/ots/pandoc.md"

  - id: OTS-ReqStream
    title: Review of ReqStream OTS verification evidence
    paths:
      - "docs/reqstream/ots/reqstream.yaml"
      - "docs/design/ots/reqstream.md"
      - "docs/verification/ots/reqstream.md"

  - id: OTS-ReviewMark
    title: Review of ReviewMark OTS verification evidence
    paths:
      - "docs/reqstream/ots/reviewmark.yaml"
      - "docs/design/ots/reviewmark.md"
      - "docs/verification/ots/reviewmark.md"

  - id: OTS-SarifMark
    title: Review of SarifMark OTS verification evidence
    paths:
